<!DOCTYPE html>

<title>Virtual Numbers - Delight Vendor Logs</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f5f9;
  color: #111827;
  font-family: Arial, sans-serif;
}

header {
  height: 122px;
  background: #101828;
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

.back-button {
  position: absolute;
  left: 25px;
  top: 25px;

  width: 58px;
  height: 58px;

  border: none;
  border-radius: 18px;

  background: #23324a;
  color: white;

  font-size: 28px;
  cursor: pointer;
}

.header-wallet {
  position: absolute;
  right: 18px;
  top: 32px;

  background: #1d2b41;
  color: white;

  padding: 14px 20px;

  border-radius: 17px;

  font-weight: bold;

}

main {
  width: 100%;
  max-width: 760px;
  margin: auto;

  padding: 30px 24px 60px;
}

/* ======================================
   BANNER
====================================== */

.banner {
  background: linear-gradient(
    135deg,
    #1f2b40,
    #26364e
  );

  color: white;

  padding: 38px;

  border-radius: 34px;

  margin-bottom: 30px;
}

.banner h2 {
  margin: 0 0 16px;
  font-size: 32px;
}

.banner p {
  margin: 0;

  font-size: 22px;
  line-height: 1.55;

  color: #e4e9f0;
}

/* ======================================
   FLOATING MESSAGE
====================================== */

.message {
  display: none;

  position: fixed;

  top: 18px;
  left: 50%;

  transform: translateX(-50%);

  width: calc(100% - 32px);
  max-width: 700px;

  z-index: 99999;

  padding: 17px 48px 17px 20px;

  border-radius: 16px;

  font-size: 17px;

  line-height: 1.4;

  font-weight: 600;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.18);

  animation:
    messageSlide .2s ease;
}

.message.show {
  display: block;
}

.message.error {
  background: #ffe3e3;
  color: #a12626;
}

.message.success {
  background: #ddf8e6;
  color: #137333;
}

.message.info {
  background: #e5efff;
  color: #1856a8;
}

.message-close {
  position: absolute;

  right: 10px;
  top: 50%;

  transform: translateY(-50%);

  width: 32px;
  height: 32px;

  border: none;

  background: transparent;

  color: inherit;

  font-size: 24px;

  line-height: 1;

  cursor: pointer;

  border-radius: 8px;
}

.message-close:hover {
  background: rgba(0,0,0,.08);
}

@keyframes messageSlide {

  from {
    opacity: 0;
    transform:
      translate(-50%, -12px);
  }

  to {
    opacity: 1;
    transform:
      translate(-50%, 0);
  }

}

/* ======================================
   WALLET
====================================== */

.wallet-card {
  background: white;

  padding: 28px;

  border-radius: 28px;

  margin-bottom: 28px;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.05);
}

.wallet-title {
  font-size: 22px;
  font-weight: bold;
}

.wallet-balance {
  font-size: 42px;
  font-weight: 900;

  margin-top: 18px;
}

/* ======================================
   SECTION
====================================== */

.card {
  background: white;

  padding: 30px;

  border-radius: 30px;

  margin-bottom: 25px;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.05);
}

.card h2 {
  margin-top: 0;

  font-size: 25px;
}

/* ======================================
   SEARCH
====================================== */

.search-box {
  width: 100%;

  padding: 18px;

  border: 1px solid #ddd;

  border-radius: 18px;

  font-size: 18px;

  outline: none;

  margin-bottom: 12px;
}

.search-box:focus {
  border-color: #111827;
}

/* ======================================
   RESULTS
====================================== */

.results {
  display: none;

  max-height: 330px;

  overflow-y: auto;
}

.results.show {
  display: block;
}

.result-item {
  background: white;

  border: 1px solid #e6e6e6;

  border-radius: 16px;

  margin-top: 9px;

}

.result-item:hover {
  background: #f5f6f8;
}

.result-item small {
  display: block;

  margin-top: 5px;

  color: #777;

}

/* ======================================
   SELECTED
====================================== */

.selected-box {

  border-radius: 18px;

  padding: 18px;

  margin-top: 12px;

  font-size: 18px;
}

.selected-box strong {
  font-size: 20px;
}

/* ======================================
   SERVICES
====================================== */

.service-grid {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(220px, 1fr)
    );

  gap: 14px;

  margin-top: 15px;
}

.service-card {
  border: 1px solid #e5e7eb;

  border-radius: 20px;

  padding: 20px;

  background: white;

  cursor: pointer;

}

.service-card:hover {
  transform: translateY(-1px);
}

.service-card.selected {

}

.service-name {
  font-size: 19px;
  font-weight: bold;
}

.service-price {
  margin-top: 9px;

  font-size: 18px;

  font-weight: bold;
}

.service-stock {
  margin-top: 7px;

  color: #707070;

  font-size: 14px;
}

/* ======================================
   OPERATOR
====================================== */

.operator-grid {
  display: grid;

  grid-template-columns:
    repeat(

    );

}

.operator-card {
  border: 1px solid #ddd;

}

.operator-card.selected {

}

.operator-name {

}

.operator-price {

}

/* ======================================
   BUY
====================================== */

.buy-button {

  background: #101828;

  color: white;

  padding: 19px;

  border-radius: 18px;

  font-size: 19px;

  font-weight: bold;

  cursor: pointer;

  margin-top: 20px;
}

.buy-button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

/* ======================================
   ORDER
====================================== */

.order-card {
  display: none;

  background: white;

  padding: 30px;

  border-radius: 28px;

  margin-top: 25px;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.05);
}

.order-card.show {
  display: block;
}

.order-row {
  padding: 13px 0;

  font-size: 17px;
}

.order-row strong {
  float: right;
}

.otp {
  font-size: 34px;

  background: #f3f4f6;

  margin-top: 20px;
}

.action-row {
  display: flex;

}

.action-button {

  border: none;

  border-radius: 15px;

}

.check-button {

/* ======================================
   MOBILE
====================================== */

@media (

  header {
    height: 123px;
  }

  }

  }

  main {
    padding:

  }

  .banner {

  }

  .banner h2 {

  }

  .banner p {

  }

  .wallet-card {
    padding: 28px;
  }

  .wallet-balance {
    font-size: 40px;
  }

  .card {
    padding: 28px;
  }

  .message {
    top: 12px;

    width: calc(100% - 24px);

    padding:
      15px 45px 15px 17px;

    font-size: 16px;
  }

}

</style>

</head>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* =====================================================
   EDGE FUNCTION
===================================================== */

const API_URL =
  `${SUPABASE_URL}/functions/v1/numpool-api`;


/* =====================================================
   STATE
===================================================== */

let countries = [];

let selectedCountry = null;

let services = [];

let selectedService = null;

let selectedOperator = null;

let selectedOrderId = null;

let orderCheckTimer = null;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type = "error"
) {

  const box =
    document.getElementById(
      "message"
    );

  const textBox =
    document.getElementById(
      "messageText"
    );

  textBox.textContent =
    text;

  box.className =
    `message show ${type}`;

  /*
   * Always bring the message
   * to the user's visible screen.
   */

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage() {

  const box =
    document.getElementById(
      "message"
    );

  box.className =
    "message";

  const textBox =
    document.getElementById(
      "messageText"
    );

  textBox.textContent =
    "";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =====================================================
   FORMAT MONEY
===================================================== */

function money(value) {

  return "₦" +
    Number(
      value || 0
    ).toLocaleString(
      "en-NG",
      {
        maximumFractionDigits: 0
      }
    );
}


/* =====================================================
   API REQUEST
===================================================== */

async function apiRequest(
  payload,
  timeout = 20000
) {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();

  if (!session) {

    window.location.href =
      "login.html";

    throw new Error(
      "Please login."
    );
  }

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () =>
        controller.abort(),
      timeout
    );

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${session.access_token}`,

            "apikey":
              SUPABASE_KEY
          },

          body:
            JSON.stringify(
              payload
            ),

          signal:
            controller.signal
        }
      );

    let data = null;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Server returned an invalid response."
      );

    }

    if (
      !response.ok ||
      data?.success === false
    ) {

      const err =
        new Error(
          data?.error ||
          "Request failed."
        );

      err.code =
        data?.code || "";

      throw err;
    }

    return data;

  } catch (err) {

    if (
      err?.name ===
      "AbortError"
    ) {

      throw new Error(
        "Request timed out. Please try again."
      );
    }

    throw err;

  } finally {

    clearTimeout(timer);

  }

}


/* =====================================================
   WALLET
===================================================== */

async function loadWallet() {

  try {

    const {
      data: {
        user
      }
    } =
      await supabaseClient
        .auth
        .getUser();

    if (!user) {

      window.location.href =
        "login.html";

      return;
    }

    const {
      data: wallet,
      error
    } =
      await supabaseClient
        .rpc(
          "ensure_my_wallet"
        );

    if (error) {
      throw error;
    }

    const balance =
      Number(
        wallet?.balance || 0
      );

    document
      .getElementById(
        "walletBalance"
      )
      .textContent =
      money(balance);

    document
      .getElementById(
        "headerWallet"
      )
      .textContent =
      money(balance);

  } catch (err) {

    console.error(
      "Wallet:",
      err
    );

  }

}


/* =====================================================
   LOAD COUNTRIES
===================================================== */

async function loadCountries() {

  const results =
    document.getElementById(
      "countryResults"
    );

  results.innerHTML =
    `<div class="result-item">
       Loading countries...
     </div>`;

  try {

    const data =
      await apiRequest(
        {
          action:
            "countries"
        },
        15000
      );

    countries =
      Array.isArray(
        data.countries
      )
        ? data.countries
        : [];

  } catch (err) {

    console.error(
      "Countries:",
      err
    );

    countries = [
      {
        code: "england",
        name:
          "United Kingdom (UK / England)",
        iso: "gb",
        prefix: "+44"
      },
      {
        code: "usa",
        name: "USA",
        iso: "us",
        prefix: "+1"
      },
      {
        code: "canada",
        name: "Canada",
        iso: "ca",
        prefix: "+1"
      },
      {
        code: "nigeria",
        name: "Nigeria",
        iso: "ng",
        prefix: "+234"
      },
      {
        code: "ghana",
        name: "Ghana",
        iso: "gh",
        prefix: "+233"
      }
    ];

  }

  renderCountries("");

}


/* =====================================================
   COUNTRY SEARCH
===================================================== */

function renderCountries(
  search
) {

  const results =
    document.getElementById(
      "countryResults"
    );

  const term =
    String(
      search || ""
    )
      .trim()
      .toLowerCase();

  const filtered =
    countries.filter(
      country => {

        const name =
          String(
            country.name || ""
          ).toLowerCase();

        const code =
          String(
            country.code || ""
          ).toLowerCase();

        const iso =
          String(
            country.iso || ""
          ).toLowerCase();

        /*
         * UK / United Kingdom /
         * England should all find
         * the UK entry.
         */

        const isUK =
          code === "england" ||
          code === "uk" ||
          iso === "gb" ||
          name.includes(
            "united kingdom"
          ) ||
          name.includes(
            "england"
          );

        if (
          isUK &&
          (
            term === "uk" ||
            term === "england" ||
            term === "united kingdom" ||
            term === "britain" ||
            term === "gb"
          )
        ) {
          return true;
        }

        return (
          !term ||
          name.includes(term) ||
          code.includes(term) ||
          iso === term
        );

      }
    );

  if (!filtered.length) {

    results.innerHTML =
      `<div class="result-item">
        Country not found.
       </div>`;

    results.classList.add(
      "show"
    );

    return;
  }

  results.innerHTML =
    filtered
      .slice(
        0,
        30
      )
      .map(
        country => `
          <div
            class="result-item"
            onclick='selectCountry(${JSON.stringify(
              country
            )})'
          >

            ${escapeHTML(
              country.name
            )}

            <small>
              ${escapeHTML(
                country.prefix || ""
              )}
            </small>

          </div>
        `
      )
      .join("");

  results.classList.add(
    "show"
  );

}


/* =====================================================
   SELECT COUNTRY
===================================================== */

async function selectCountry(
  country
) {

  selectedCountry =
    country;

  selectedService =
    null;

  selectedOperator =
    null;

  document
    .getElementById(
      "countrySearch"
    )
    .value =
    country.name;

  const results =
    document.getElementById(
      "countryResults"
    );

  results.innerHTML = "";

  results.classList.remove(
    "show"
  );

  const selected =
    document.getElementById(
      "selectedCountry"
    );

  selected.style.display =
    "block";

  selected.innerHTML = `
    <strong>
      ${escapeHTML(
        country.name
      )}
    </strong>
  `;

  document
    .getElementById(
      "serviceCard"
    )
    .style.display =
    "block";

  document
    .getElementById(
      "operatorCard"
    )
    .style.display =
    "none";

  document
    .getElementById(
      "serviceGrid"
    )
    .innerHTML =
    `<div class="result-item">
       Loading services...
     </div>`;

  await loadServices();

}


/* =====================================================
   LOAD SERVICES
===================================================== */

async function loadServices() {

  if (!selectedCountry)
    return;

  try {

    const data =
      await apiRequest(
        {
          action:
            "prices",

          country:
            selectedCountry.code
        }
      );

    services =
      Array.isArray(
        data.services
      )
        ? data.services
        : [];

    selectedService =
      null;

    selectedOperator =
      null;

    renderServices("");

    if (!services.length) {

      showMessage(
        "No services are available for this country right now.",
        "info"
      );

    } else {

      hideMessage();

    }

  } catch (err) {

    console.error(
      "Services:",
      err
    );

    document
      .getElementById(
        "serviceGrid"
      )
      .innerHTML =
      `<div class="result-item">
        Service not available right now.
       </div>`;

    showMessage(
      "Service not available right now. Please try again later.",
      "error"
    );

  }

}


/* =====================================================
   SERVICE SEARCH
===================================================== */

function renderServices(
  search
) {

  const grid =
    document.getElementById(
      "serviceGrid"
    );

  const term =
    String(
      search || ""
    )
      .trim()
      .toLowerCase();

  const filtered =
    services.filter(
      service =>
        !term ||
        String(
          service.service_name ||
          ""
        )
          .toLowerCase()
          .includes(term) ||
        String(
          service.service_code ||
          ""
        )
          .toLowerCase()
          .includes(term)
    );

  if (!filtered.length) {

    grid.innerHTML =
      `<div class="result-item">
        Service not found.
       </div>`;

    return;
  }

  grid.innerHTML =
    filtered
      .map(
        service => {

          const available =
            Number(
              service.stock || 0
            ) > 0;

          return `
            <div
              class="service-card ${
                selectedService?.service_code ===
                service.service_code
                  ? "selected"
                  : ""
              }"
              onclick='selectService(${JSON.stringify(
                service
              )})'
            >

              <div class="service-name">
                ${escapeHTML(
                  service.service_name
                )}
              </div>

              <div class="service-price">
                ${
                  available
                    ? money(
                        service.best_price_ngn
                      )
                    : "Unavailable"
                }
              </div>

              <div class="service-stock">
                ${
                  available
                    ? "Available"
                    : "Not available"
                }
              </div>

            </div>
          `;
        }
      )
      .join("");

}


/* =====================================================
   SELECT SERVICE
===================================================== */

function selectService(
  service
) {

  selectedService =
    service;

  selectedOperator =
    null;

  renderServices(
    document
      .getElementById(
        "serviceSearch"
      )
      .value
  );

  const options =
    Array.isArray(
      service.options
    )
      ? service.options
      : [];

  const available =
    options.filter(
      option =>
        Number(
          option.stock || 0
        ) > 0
    );

  const operatorGrid =
    document.getElementById(
      "operatorGrid"
    );

  document
    .getElementById(
      "operatorCard"
    )
    .style.display =
    "block";

  if (!available.length) {

    operatorGrid.innerHTML =
      `<div class="result-item">
        Number not available right now.
       </div>`;

    document
      .getElementById(
        "buyButton"
      )
      .disabled =
      true;

    return;
  }

  operatorGrid.innerHTML =
    available
      .map(
        option => `
          <div
            class="operator-card"
            onclick='selectOperator(${JSON.stringify(
              option
            )}, this)'
          >

            <div class="operator-name">
              ${escapeHTML(
                option.operator
              )}
            </div>

            <div class="operator-price">
              ${money(
                option.customer_price_ngn
              )}
            </div>

          </div>
        `
      )
      .join("");

  const first =
    available[0];

  const firstElement =
    operatorGrid
      .querySelector(
        ".operator-card"
      );

  selectOperator(
    first,
    firstElement
  );

}


/* =====================================================
   SELECT OPERATOR
===================================================== */

function selectOperator(
  option,
  element
) {

  selectedOperator =
    option;

  document
    .querySelectorAll(
      ".operator-card"
    )
    .forEach(
      card =>
        card.classList.remove(
          "selected"
        )
    );

  if (element) {

    element.classList.add(
      "selected"
    );

  }

  document
    .getElementById(
      "buyButton"
    )
    .disabled =
    false;

}


/* =====================================================
   BUY
===================================================== */

async function buyNumber() {

  if (
    !selectedCountry ||
    !selectedService ||
    !selectedOperator
  ) {

    showMessage(
      "Please select a country, service and operator.",
      "error"
    );

    return;
  }

  const button =
    document.getElementById(
      "buyButton"
    );

  button.disabled =
    true;

  button.textContent =
    "Buying number...";

  hideMessage();

  try {

    const data =
      await apiRequest(
        {
          action:
            "buy",

          country:
            selectedCountry.code,

          service:
            selectedService.service_code,

          operator:
            selectedOperator.operator
        },
        30000
      );

    if (
      !data?.order
    ) {

      throw new Error(
        "Purchase failed."
      );

    }

    const order =
      data.order;

    selectedOrderId =
      order.id;

    document
      .getElementById(
        "orderCard"
      )
      .classList.add(
        "show"
      );

    document
      .getElementById(
        "orderService"
      )
      .textContent =
      order.service;

    document
      .getElementById(
        "orderCountry"
      )
      .textContent =
      order.country;

    document
      .getElementById(
        "orderOperator"
      )
      .textContent =
      order.operator;

    document
      .getElementById(
        "orderNumber"
      )
      .textContent =
      order.number ||
      "Waiting...";

    document
      .getElementById(
        "otpBox"
      )
      .textContent =
      "Waiting for SMS...";

    showMessage(
      "Number purchased successfully.",
      "success"
    );

    await loadWallet();

    startOrderChecking();

  } catch (err) {

    console.error(
      "BUY ERROR:",
      err
    );

    /*
     * USER WALLET ERROR
     */

    if (
      err.code ===
      "USER_INSUFFICIENT_FUNDS"
    ) {

      showMessage(
        "Insufficient fund. Please fund wallet.",
        "error"
      );

    }

    /*
     * 5SIM PROVIDER BALANCE
     */

    else if (
      err.code ===
      "PROVIDER_INSUFFICIENT_BALANCE" ||
      err.code ===
      "PROVIDER_ACCOUNT_ERROR"
    ) {

      showMessage(
        "Number Available. Please fund wallet, contact us.",
        "error"
      );

    }

    /*
     * OUT OF STOCK
     */

    else if (
      err.code ===
      "OUT_OF_STOCK"
    ) {

      showMessage(
        "Number not available right now. Please try again later.",
        "error"
      );

    }

    /*
     * OTHER
     */

    else {

      showMessage(
        err.message ||
        "Number purchase failed. Please try again.",
        "error"
      );

    }

  } finally {

    button.disabled =
      false;

    button.textContent =
      "Buy Number";

  }

}


/* =====================================================
   CHECK ORDER
===================================================== */

async function checkOrder() {

  if (!selectedOrderId)
    return;

  try {

    const data =
      await apiRequest(
        {
          action:
            "check",

          order_id:
            selectedOrderId
        }
      );

    const status =
      String(
        data.status || ""
      ).toLowerCase();

    const sms =
      data.sms;

    if (
      sms?.code
    ) {

      document
        .getElementById(
          "otpBox"
        )
        .textContent =
        sms.code;

      stopOrderChecking();

      showMessage(
        "SMS code received.",
        "success"
      );

      return;
    }

    if (
      status ===
        "cancelled" ||
      status ===
        "timeout"
    ) {

      stopOrderChecking();

      document
        .getElementById(
          "otpBox"
        )
        .textContent =
        "Order cancelled";

      if (
        data.refunded
      ) {

        showMessage(
          `Order cancelled. ${money(
            data.refund_amount_ngn
          )} refunded to your wallet.`,
          "success"
        );

        await loadWallet();

      }

      return;
    }

    document
      .getElementById(
        "otpBox"
      )
      .textContent =
      "Waiting for SMS...";

  } catch (err) {

    console.error(
      "CHECK:",
      err
    );

  }

}


/* =====================================================
   AUTO CHECK
===================================================== */

function startOrderChecking() {

  stopOrderChecking();

  orderCheckTimer =
    setInterval(
      checkOrder,
      5000
    );

}


function stopOrderChecking() {

  if (
    orderCheckTimer
  ) {

    clearInterval(
      orderCheckTimer
    );

    orderCheckTimer =
      null;

  }

}


/* =====================================================
   CANCEL ORDER
===================================================== */

async function cancelOrder() {

  if (!selectedOrderId)
    return;

  const okay =
    confirm(
      "Cancel this number?"
    );

  if (!okay)
    return;

  try {

    const data =
      await apiRequest(
        {
          action:
            "cancel",

          order_id:
            selectedOrderId
        }
      );

    stopOrderChecking();

    if (
      data.refunded
    ) {

      showMessage(
        `Number cancelled. ${money(
          data.refund_amount_ngn
        )} refunded to your wallet.`,
        "success"
      );

      await loadWallet();

    }

    document
      .getElementById(
        "otpBox"
      )
      .textContent =
      "Cancelled";

  } catch (err) {

    console.error(
      "CANCEL:",
      err
    );

    showMessage(
      err.message ||
      "Unable to cancel the number.",
      "error"
    );

  }

}


/* =====================================================
   COUNTRY INPUT
===================================================== */

document
  .getElementById(
    "countrySearch"
  )
  .addEventListener(
    "input",

      renderCountries(

      );

    }
  );


/* =====================================================
   SERVICE INPUT
===================================================== */

document
  .getElementById(
    "serviceSearch"
  )
  .addEventListener(
    "input",
    function() {

      renderServices(
        this.value
      );

    }
  );


/* =====================================================
   START
===================================================== */

(async function() {

  await loadWallet();

  await loadCountries();

})();

</script>
