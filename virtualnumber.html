<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );



/* =====================================================
   EDGE FUNCTION
===================================================== */

const FIVESIM_FUNCTION =
  "fivesim";



/* =====================================================
   STATE
===================================================== */

let countries = [];

let products = [];

let selectedCountry = null;

let selectedProduct = null;

let selectedOperator = "any";

let selectedOffer = null;



/* =====================================================
   ELEMENTS
===================================================== */

const countrySelect =
  document.getElementById(
    "country"
  );

const serviceSelect =
  document.getElementById(
    "service"
  );

const operatorSelect =
  document.getElementById(
    "operator"
  );

const buyButton =
  document.getElementById(
    "buyButton"
  );

const walletBalance =
  document.getElementById(
    "walletBalance"
  );

const offers =
  document.getElementById(
    "offers"
  );

const priceBox =
  document.getElementById(
    "priceBox"
  );

const providerPrice =
  document.getElementById(
    "providerPrice"
  );

const sellingPrice =
  document.getElementById(
    "sellingPrice"
  );

const message =
  document.getElementById(
    "message"
  );

const history =
  document.getElementById(
    "history"
  );



/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type = "info"
) {

  message.style.display =
    "block";

  message.className =
    "message " +
    type;

  message.textContent =
    text;

}



function hideMessage() {

  message.style.display =
    "none";

}



/* =====================================================
   LOGIN CHECK
===================================================== */

async function getUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();

  if (
    error ||
    !data?.user
  ) {

    window.location.href =
      "login.html";

    return null;

  }

  return data.user;

}



/* =====================================================
   LOAD WALLET
===================================================== */

async function loadWallet() {

  try {

    const user =
      await getUser();

    if (!user) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "ensure_my_wallet"
      );


    if (error) {

      console.error(
        "Wallet error:",
        error
      );

      walletBalance.textContent =
        "Wallet error";

      return;

    }


    const balance =
      data?.balance ?? 0;


    walletBalance.textContent =
      "₦" +
      Number(
        balance
      ).toLocaleString(
        "en-NG",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

  }

  catch (error) {

    console.error(
      "Wallet loading error:",
      error
    );

    walletBalance.textContent =
      "Unable to load wallet";

  }

}



/* =====================================================
   INVOKE FIVESIM
===================================================== */

async function invokeFiveSim(
  action,
  options = {}
) {

  /*
   * IMPORTANT:
   *
   * We do NOT manually send the 5SIM API key.
   *
   * Supabase JS automatically handles the
   * project's API key and the signed-in
   * user's session when invoking the function.
   */

  const body =
    options.body ?? undefined;


  let functionName =
    FIVESIM_FUNCTION;


  /*
   * Countries/products/price use GET
   * parameters in the current Edge Function.
   */

  if (
    action === "countries"
  ) {

    const {
      data,
      error
    } =
      await supabaseClient.functions.invoke(
        functionName,
        {
          method: "GET"
        }
      );

    if (error) {
      throw error;
    }

    return data;

  }


  /*
   * For products and price, the current
   * Edge Function expects URL parameters.
   *
   * We therefore use the function URL,
   * but still let Supabase provide auth.
   */

  if (
    action === "products" ||
    action === "price" ||
    action === "status"
  ) {

    let url =
      `${SUPABASE_URL}/functions/v1/${functionName}?action=${encodeURIComponent(
        action
      )}`;


    if (
      options.params
    ) {

      Object.entries(
        options.params
      ).forEach(
        ([key, value]) => {

          if (
            value !== undefined &&
            value !== null
          ) {

            url +=
              `&${encodeURIComponent(
                key
              )}=${encodeURIComponent(
                String(value)
              )}`;

          }

        }
      );

    }


    /*
     * Use the current Supabase session.
     *
     * No 5SIM key is ever placed here.
     */

    const {
      data: sessionData
    } =
      await supabaseClient.auth.getSession();


    const session =
      sessionData?.session;


    if (!session) {

      window.location.href =
        "login.html";

      throw new Error(
        "Your login session has expired."
      );

    }


    const response =
      await fetch(
        url,
        {
          method: "GET",

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${session.access_token}`,

            "Accept":
              "application/json"
          }
        }
      );


    const data =
      await response.json()
        .catch(
          () => ({})
        );


    if (!response.ok) {

      throw new Error(
        data?.error ||
        data?.message ||
        `Edge Function returned ${response.status}.`
      );

    }


    return data;

  }


  /*
   * BUY and CANCEL are POST.
   */

  const {
    data,
    error
  } =
    await supabaseClient.functions.invoke(
      functionName,
      {
        body
      }
    );


  if (error) {

    console.error(
      "Function invoke error:",
      error
    );

    throw error;

  }


  return data;

}



/* =====================================================
   LOAD COUNTRIES
===================================================== */

async function loadCountries() {

  countrySelect.innerHTML =
    `
      <option value="">
        Loading countries...
      </option>
    `;

  try {

    const data =
      await invokeFiveSim(
        "countries"
      );


    console.log(
      "FIVESIM COUNTRIES:",
      data
    );


    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.error ||
        "Unable to load countries."
      );

    }


    const raw =
      data.countries;


    countries = [];


    /*
     * 5SIM normally returns an object
     * whose keys are country codes/names.
     */

    if (
      raw &&
      typeof raw === "object" &&
      !Array.isArray(raw)
    ) {

      Object.entries(
        raw
      ).forEach(
        ([key, value]) => {

          const item =
            value || {};


          countries.push({

            key,

            id:
              Number(
                item?.id ?? 0
              ),

            name:
              String(
                item?.text ??
                item?.name ??
                key
              ),

            iso:
              String(
                item?.iso ??
                key
              ),

            prefix:
              String(
                item?.prefix ??
                ""
              )

          });

        }
      );

    }


    /*
     * Some API versions may return
     * an array instead.
     */

    if (
      Array.isArray(raw)
    ) {

      countries =
        raw.map(
          (item) => ({

            key:
              String(
                item?.name ??
                item?.code ??
                item?.iso ??
                ""
              ),

            id:
              Number(
                item?.id ?? 0
              ),

            name:
              String(
                item?.text ??
                item?.name ??
                item?.code ??
                ""
              ),

            iso:
              String(
                item?.iso ??
                item?.code ??
                ""
              ),

            prefix:
              String(
                item?.prefix ??
                ""
              )

          })
        );

    }


    countries =
      countries.filter(
        (item) =>
          item.key ||
          item.name
      );


    countries.sort(
      (a, b) =>
        a.name.localeCompare(
          b.name
        )
    );


    countrySelect.innerHTML =
      `
        <option value="">
          Select a country
        </option>
      `;


    countries.forEach(
      (country) => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          country.key;

        option.textContent =
          country.name +
          (
            country.iso
              ? ` (${country.iso})`
              : ""
          );

        countrySelect.appendChild(
          option
        );

      }
    );


    if (
      countries.length === 0
    ) {

      throw new Error(
        "5SIM returned no countries."
      );

    }

  }

  catch (error) {

    console.error(
      "COUNTRIES ERROR:",
      error
    );

    countrySelect.innerHTML =
      `
        <option value="">
          Unable to load countries
        </option>
      `;


    showMessage(
      "Unable to load countries.\n\n" +
      (
        error?.message ||
        String(error)
      ),
      "error"
    );

  }

}



/* =====================================================
   COUNTRY CHANGED
===================================================== */

async function countryChanged() {

  hideMessage();

  const key =
    countrySelect.value;


  selectedCountry =
    countries.find(
      (country) =>
        country.key === key
    ) || null;


  selectedProduct =
    null;

  selectedOperator =
    "any";

  selectedOffer =
    null;


  serviceSelect.innerHTML =
    `
      <option value="">
        Loading services...
      </option>
    `;

  serviceSelect.disabled =
    true;


  operatorSelect.innerHTML =
    `
      <option value="any">
        Any operator
      </option>
    `;

  operatorSelect.disabled =
    true;


  buyButton.disabled =
    true;


  priceBox.style.display =
    "none";


  if (
    !selectedCountry
  ) {

    offers.innerHTML =
      `
        <div class="loading">
          Select a country to load available numbers.
        </div>
      `;

    return;

  }


  await loadProducts(
    selectedCountry.key
  );

}



/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(
  country
) {

  offers.innerHTML =
    `
      <div class="loading">
        Loading available numbers...
      </div>
    `;


  try {

    const data =
      await invokeFiveSim(
        "products",
        {
          params: {
            country
          }
        }
      );


    console.log(
      "FIVESIM PRODUCTS:",
      data
    );


    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.error ||
        "Unable to load services."
      );

    }


    products =
      Array.isArray(
        data.products
      )
        ? data.products
        : [];


    renderServices();

    renderOffers();

  }

  catch (error) {

    console.error(
      "PRODUCT ERROR:",
      error
    );


    products = [];


    serviceSelect.innerHTML =
      `
        <option value="">
          Unable to load services
        </option>
      `;


    serviceSelect.disabled =
      true;


    operatorSelect.disabled =
      true;


    offers.innerHTML =
      `
        <div class="message error" style="display:block;">
          ❌ Unable to load available numbers.
          <br><br>
          ${escapeHTML(
            error?.message ||
            String(error)
          )}
        </div>
      `;

  }

}



/* =====================================================
   RENDER SERVICES
===================================================== */

function renderServices() {

  serviceSelect.innerHTML =
    `
      <option value="">
        Select a service
      </option>
    `;


  const names =
    [
      ...new Set(
        products.map(
          (item) =>
            String(
              item.product ??
              ""
            )
        )
      )
    ]
      .filter(
        Boolean
      )
      .sort(
        (a, b) =>
          a.localeCompare(b)
      );


  names.forEach(
    (name) => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        name;

      option.textContent =
        name;

      serviceSelect.appendChild(
        option
      );

    }
  );


  serviceSelect.disabled =
    names.length === 0;

}



/* =====================================================
   SERVICE CHANGED
===================================================== */

function serviceChanged() {

  hideMessage();

  selectedProduct =
    serviceSelect.value ||
    null;


  selectedOperator =
    "any";


  selectedOffer =
    null;


  operatorSelect.innerHTML =
    `
      <option value="any">
        Any operator
      </option>
    `;


  priceBox.style.display =
    "none";


  buyButton.disabled =
    true;


  if (
    !selectedProduct
  ) {

    operatorSelect.disabled =
      true;

    renderOffers();

    return;

  }


  const matching =
    products.filter(
      (item) =>
        String(
          item.product
        ) ===
        selectedProduct
    );


  const operators =
    [
      ...new Set(
        matching.map(
          (item) =>
            String(
              item.operator ??
              "any"
            )
        )
      )
    ]
      .filter(
        Boolean
      )
      .sort();


  operators.forEach(
    (operator) => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        operator;

      option.textContent =
        operator;

      operatorSelect.appendChild(
        option
      );

    }
  );


  operatorSelect.disabled =
    operators.length === 0;


  renderOffers();

}



/* =====================================================
   OPERATOR CHANGED
===================================================== */

function operatorChanged() {

  selectedOperator =
    operatorSelect.value ||
    "any";


  selectedOffer =
    null;


  updateSelectedOffer();

  renderOffers();

}



/* =====================================================
   FIND OFFER
===================================================== */

function findOffer() {

  if (
    !selectedProduct
  ) {
    return null;
  }


  const matching =
    products.filter(
      (item) =>
        String(
          item.product
        ) ===
        selectedProduct
    );


  if (
    selectedOperator &&
    selectedOperator !==
      "any"
  ) {

    const exact =
      matching.find(
        (item) =>
          String(
            item.operator
          ) ===
          selectedOperator
      );

    if (exact) {
      return exact;
    }

  }


  return (
    matching[0] ||
    null
  );

}



/* =====================================================
   UPDATE SELECTED OFFER
===================================================== */

function updateSelectedOffer() {

  selectedOffer =
    findOffer();


  if (
    !selectedOffer
  ) {

    priceBox.style.display =
      "none";

    buyButton.disabled =
      true;

    return;

  }


  providerPrice.textContent =
    "₦" +
    Number(
      selectedOffer.api_price_ngn ??
      0
    ).toLocaleString(
      "en-NG"
    );


  sellingPrice.textContent =
    "₦" +
    Number(
      selectedOffer.selling_price_ngn ??
      0
    ).toLocaleString(
      "en-NG"
    );


  priceBox.style.display =
    "block";


  buyButton.disabled =
    false;

}



/* =====================================================
   RENDER OFFERS
===================================================== */

function renderOffers() {

  if (
    !selectedProduct
  ) {

    offers.innerHTML =
      `
        <div class="loading">
          Select a service to see available numbers.
        </div>
      `;

    return;

  }


  const matching =
    products.filter(
      (item) =>
        String(
          item.product
        ) ===
        selectedProduct
    );


  if (
    !matching.length
  ) {

    offers.innerHTML =
      `
        <div class="loading">
          No numbers available for this service.
        </div>
      `;

    return;

  }


  let display =
    matching;


  if (
    selectedOperator &&
    selectedOperator !==
      "any"
  ) {

    display =
      matching.filter(
        (item) =>
          String(
            item.operator
          ) ===
          selectedOperator
      );

  }


  if (
    !display.length
  ) {

    offers.innerHTML =
      `
        <div class="loading">
          No numbers available for this operator.
        </div>
      `;

    return;

  }


  /*
   * Avoid showing hundreds of duplicate offers.
   */

  display =
    display.slice(
      0,
      30
    );


  offers.innerHTML =
    "";


  display.forEach(
    (offer) => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "offer";


      div.innerHTML =
        `
          <div class="offer-title">
            ${escapeHTML(
              offer.product
            )}
          </div>

          <div class="small">
            Operator:
            ${escapeHTML(
              offer.operator
            )}
          </div>

          <div class="offer-price">
            ₦${Number(
              offer.selling_price_ngn ??
              0
            ).toLocaleString(
              "en-NG"
            )}
          </div>

          <div class="small">
            Provider:
            ₦${Number(
              offer.api_price_ngn ??
              0
            ).toLocaleString(
              "en-NG"
            )}
          </div>

          <br>

          <button
            class="btn black-btn"
            type="button"
          >
            Select
          </button>
        `;


      const button =
        div.querySelector(
          "button"
        );


      button.onclick =
        () => {

          selectedOperator =
            String(
              offer.operator
            );


          operatorSelect.value =
            selectedOperator;


          selectedOffer =
            offer;


          updateSelectedOffer();


          document
            .querySelectorAll(
              ".offer"
            )
            .forEach(
              (item) => {
                item.style.borderColor =
                  "#e5e5e5";
              }
            );


          div.style.borderColor =
            "#111";

        };


      offers.appendChild(
        div
      );

    }
  );


  updateSelectedOffer();

}



/* =====================================================
   BUY NUMBER
===================================================== */

async function buyNumber() {

  hideMessage();


  if (
    !selectedCountry
  ) {

    showMessage(
      "Please select a country.",
      "error"
    );

    return;

  }


  if (
    !selectedProduct
  ) {

    showMessage(
      "Please select a service.",
      "error"
    );

    return;

  }


  const offer =
    selectedOffer ||
    findOffer();


  if (!offer) {

    showMessage(
      "No number is currently available for this selection.",
      "error"
    );

    return;

  }


  const price =
    Number(
      offer.selling_price_ngn ??
      0
    );


  /*
   * Check wallet before buying.
   */

  const {
    data: wallet,
    error: walletError
  } =
    await supabaseClient.rpc(
      "ensure_my_wallet"
    );


  if (
    walletError
  ) {

    showMessage(
      "Unable to check your wallet balance.",
      "error"
    );

    return;

  }


  const balance =
    Number(
      wallet?.balance ??
      0
    );


  if (
    balance < price
  ) {

    showMessage(
      `Insufficient wallet balance.\n\nYour balance: ₦${balance.toLocaleString(
        "en-NG"
      )}\nNumber price: ₦${price.toLocaleString(
        "en-NG"
      )}\n\nPlease fund your wallet first.`,
      "error"
    );

    return;

  }


  const confirmed =
    window.confirm(
      `Buy ${selectedProduct} number?\n\nPrice: ₦${price.toLocaleString(
        "en-NG"
      )}\nOperator: ${selectedOperator || "any"}`
    );


  if (!confirmed) {
    return;
  }


  buyButton.disabled =
    true;

  buyButton.textContent =
    "Getting Number...";


  showMessage(
    "Contacting 5SIM and reserving your number...",
    "info"
  );


  try {

    const result =
      await invokeFiveSim(
        "buy",
        {
          body: {

            country:
              selectedCountry.key,

            country_id:
              Number(
                selectedCountry.id ||
                0
              ),

            operator:
              selectedOperator ||
              "any",

            product:
              selectedProduct

          }
        }
      );


    console.log(
      "BUY RESULT:",
      result
    );


    if (
      !result ||
      result.success !==
        true
    ) {

      throw new Error(
        result?.error ||
        "Unable to purchase virtual number."
      );

    }


    const order =
      result.order;


    showMessage(
      "Virtual number purchased successfully.",
      "success"
    );


    displayCurrentNumber(
      order
    );


    await loadWallet();

    await loadHistory();


  }

  catch (error) {

    console.error(
      "BUY ERROR:",
      error
    );


    let text =
      error?.message ||
      String(error);


    /*
     * Supabase function errors can contain
     * a useful response body.
     */

    if (
      error?.context
    ) {

      try {

        const body =
          await error.context.json();

        text =
          body?.error ||
          body?.message ||
          text;

      }

      catch {}

    }


    showMessage(
      text,
      "error"
    );

  }

  finally {

    buyButton.disabled =
      false;

    buyButton.textContent =
      "Get Number";

  }

}

/* =====================================================
   CHECK OTP
===================================================== */

async function checkOtp(
  fiveSimOrderId
) {

  const otpDisplay =
    document.getElementById(
      "otpDisplay"
    );


  if (!otpDisplay) {
    return;
  }


  otpDisplay.innerHTML =
    "Checking for SMS...";


  try {

    /*
     * The current Edge Function reads
     * action=status and id from the URL.
     */

    const data =
      await invokeFiveSim(
        "status",
        {
          params: {
            id:
              fiveSimOrderId
          }
        }
      );


    console.log(
      "STATUS RESULT:",
      data
    );


    if (
      !data ||
      data.success !==
        true
    ) {

      throw new Error(
        data?.error ||
        "Unable to check number status."
      );

    }


    if (
      data.otp_code
    ) {

      otpDisplay.innerHTML =
        `
          <div class="otp">
            OTP: ${escapeHTML(
              data.otp_code
            )}
          </div>

          <div class="small">
            ${escapeHTML(
              data.full_sms ||
              "SMS received."
            )}
          </div>
        `;

      await loadHistory();

      return;

    }


    otpDisplay.innerHTML =
      `
        <div>
          No OTP yet.
        </div>

        <div class="small">
          ${escapeHTML(
            data.status ||
            "Waiting for SMS..."
          )}
        </div>
      `;


    await loadHistory();

  }

  catch (error) {

    console.error(
      "OTP ERROR:",
      error
    );


    otpDisplay.innerHTML =
      `
        <div style="color:#c62828;">
          ❌ ${escapeHTML(
            error?.message ||
            String(error)
          )}
        </div>
      `;

  }

}



/* =====================================================
   CANCEL NUMBER
===================================================== */

async function cancelNumber(
  fiveSimOrderId
) {

  const confirmed =
    window.confirm(
      "Cancel this number and request a wallet refund?"
    );


  if (!confirmed) {
    return;
  }


  showMessage(
    "Cancelling number...",
    "info"
  );


  try {

    const result =
      await invokeFiveSim(
        "cancel",
        {
          body: {
            id:
              fiveSimOrderId
          }
        }
      );


    console.log(
      "CANCEL RESULT:",
      result
    );


    if (
      !result ||
      result.success !==
        true
    ) {

      throw new Error(
        result?.error ||
        "Unable to cancel number."
      );

    }


    showMessage(
      `Number cancelled successfully.\n\nRefund: ₦${Number(
        result.amount ??
        0
      ).toLocaleString(
        "en-NG"
      )}`,
      "success"
    );


    document.getElementById(
      "currentNumberCard"
    ).style.display =
      "none";


    await loadWallet();

    await loadHistory();

  }

  catch (error) {

    console.error(
      "CANCEL ERROR:",
      error
    );


    showMessage(
      error?.message ||
      String(error),
      "error"
    );

  }

}



/* =====================================================
   LOAD HISTORY
===================================================== */

async function loadHistory() {

  try {

    const user =
      await getUser();


    if (!user) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from(
          "virtual_number_orders"
        )
        .select(
          "id,status,customer_price_ngn,number,country_name,service_name,numpool_order_id,otp_code,full_sms,created_at,refunded_at"
        )
        .eq(
          "user_id",
          user.id
        )
        .order(
          "created_at",
          {
            ascending:
              false
          }
        )
        .limit(20);


    if (error) {

      console.error(
        "History error:",
        error
      );


      history.innerHTML =
        `
          <div class="message error" style="display:block;">
            Unable to load history.
            <br><br>
            ${escapeHTML(
              error.message
            )}
          </div>
        `;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      history.innerHTML =
        `
          <div class="loading">
            No virtual number purchases yet.
          </div>
        `;

      return;

    }


    history.innerHTML =
      "";


    data.forEach(
      (order) => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "history-item";


        const date =
          order.created_at
            ? new Date(
                order.created_at
              ).toLocaleString(
                "en-NG"
              )
            : "";


        const status =
          String(
            order.status ||
            "unknown"
          );


        const canCancel =
          status ===
          "waiting" &&
          !order.refunded_at;


        item.innerHTML =
          `
            <div>
              <strong>
                ${escapeHTML(
                  order.service_name ||
                  "Virtual Number"
                )}
              </strong>
            </div>

            <div
              class="small"
              style="margin-top:5px;"
            >
              ${escapeHTML(
                order.country_name ||
                ""
              )}
            </div>

            <div
              style="margin-top:8px;"
            >
              Number:
              <strong>
                ${escapeHTML(
                  order.number ||
                  "Hidden"
                )}
              </strong>
            </div>

            <div
              style="margin-top:8px;"
            >
              Price:
              <strong>
                ₦${Number(
                  order.customer_price_ngn ||
                  0
                ).toLocaleString(
                  "en-NG"
                )}
              </strong>
            </div>

            <div
              style="margin-top:8px;"
            >
              Status:
              <span class="status">
                ${escapeHTML(
                  status
                )}
              </span>
            </div>

            ${
              order.otp_code
                ? `
                  <div
                    style="
                      margin-top:10px;
                      font-size:22px;
                      font-weight:bold;
                    "
                  >
                    OTP:
                    ${escapeHTML(
                      order.otp_code
                    )}
                  </div>
                `
                : ""
            }

            ${
              order.full_sms
                ? `
                  <div
                    class="small"
                    style="margin-top:8px;"
                  >
                    SMS:
                    ${escapeHTML(
                      order.full_sms
                    )}
                  </div>
                `
                : ""
            }

            <div
              class="small"
              style="margin-top:8px;"
            >
              ${escapeHTML(
                date
              )}
            </div>

            <div
              style="
                margin-top:12px;
                display:flex;
                gap:8px;
                flex-wrap:wrap;
              "
            >

              ${
                order.numpool_order_id
                  ? `
                    <button
                      class="btn green-btn"
                      type="button"
                      onclick="checkOtp('${escapeHTML(
                        order.numpool_order_id
                      )}')"
                    >
                      Check OTP
                    </button>
                  `
                  : ""
              }

              ${
                canCancel
                  ? `
                    <button
                      class="btn red-btn"
                      type="button"
                      onclick="cancelNumber('${escapeHTML(
                        order.numpool_order_id
                      )}')"
                    >
                      Cancel & Refund
                    </button>
                  `
                  : ""
              }

            </div>
          `;


        history.appendChild(
          item
        );

      }
    );

  }

  catch (error) {

    console.error(
      "History loading error:",
      error
    );


    history.innerHTML =
      `
        <div class="message error" style="display:block;">
          Unable to load virtual number history.
        </div>
      `;

  }

}

   INITIALIZE
===================================================== */

async function initialize() {

  const user =
    await getUser();


  if (!user) {
    return;
  }


  await loadWallet();

  await loadCountries();

  await loadHistory();

}



initialize();
