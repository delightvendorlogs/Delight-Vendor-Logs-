<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Virtual Numbers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6fa;
    color:#111;
}

header{
    background:#111;
    color:white;
    padding:18px;
}

header h2{
    margin:0;
}

.container{
    max-width:650px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.hidden{
    display:none !important;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input,
select,
button{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #ddd;
    font-size:15px;
}

input,
select{
    background:white;
}

button{
    border:0;
    background:#111;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

button.secondary{
    background:#666;
}

button.cancel{
    background:#c62828;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.country,
.product{
    border:1px solid #ddd;
    border-radius:10px;
    padding:14px;
    margin-top:9px;
    cursor:pointer;
}

.country:hover,
.product:hover{
    background:#f2f2f2;
}

.country strong,
.product strong{
    display:block;
    margin-bottom:5px;
}

.product .operator{
    font-size:13px;
    color:#666;
}

.product .productPrice{
    font-size:20px;
    font-weight:bold;
    margin-top:8px;
}

.price{
    font-size:28px;
    font-weight:bold;
    margin:15px 0;
}

.number{
    font-size:24px;
    font-weight:bold;
    letter-spacing:1px;
    word-break:break-word;
}

.code{
    font-size:36px;
    font-weight:bold;
    text-align:center;
    padding:20px 5px;
    letter-spacing:4px;
}

.status{
    padding:12px;
    border-radius:9px;
    background:#f0f0f0;
    margin-top:10px;
}

.error{
    color:#c62828;
    font-weight:bold;
}

.success{
    color:#16803c;
    font-weight:bold;
}

.muted{
    color:#666;
    font-size:14px;
}

.sms{
    margin-top:12px;
    padding:12px;
    background:#fafafa;
    border-radius:9px;
    white-space:pre-wrap;
    word-break:break-word;
}

.spinner{
    text-align:center;
    padding:20px;
}

</style>

</head>

<body>

<header>

<h2>All Country Numbers</h2>

</header>


<div class="container">


<!-- =====================================================
     MESSAGE
===================================================== -->

<div
    id="message"
    class="card hidden"
></div>


<!-- =====================================================
     STEP 1 - COUNTRY
===================================================== -->

<div
    class="card"
    id="stepCountry"
>

<h3>Choose Country</h3>

<input
    id="countrySearch"
    placeholder="Search country..."
    oninput="filterCountries()"
>

<div id="countries">

<div class="spinner">
    Loading countries...
</div>

</div>

<button
    class="secondary"
    onclick="goDashboard()"
>
    Back to Dashboard
</button>

</div>


<!-- =====================================================
     STEP 2 - SERVICE
===================================================== -->

<div
    class="card hidden"
    id="stepProduct"
>

<h3>Select Service</h3>

<div
    id="chosenCountry"
    class="muted"
></div>

<input
    id="productSearch"
    placeholder="Search service..."
    oninput="filterProducts()"
>

<div id="products">

<div class="spinner">
    Loading services...
</div>

</div>

<button
    class="secondary"
    onclick="backToCountries()"
>
    Back
</button>

</div>


<!-- =====================================================
     STEP 3 - OPERATOR / NUMBER
===================================================== -->

<div
    class="card hidden"
    id="stepBuy"
>

<h3>Confirm Number</h3>

<div id="buyCountry"></div>

<div id="buyService"></div>

<div id="buyOperator"></div>

<div
    class="price"
    id="buyPrice"
>
    ₦0
</div>

<div
    class="muted"
    id="buyStock"
>
</div>

<button
    id="buyButton"
    onclick="buyNumber()"
>
    Buy Number
</button>

<button
    class="secondary"
    onclick="backToProducts()"
>
    Back
</button>

</div>


<!-- =====================================================
     STEP 4 - NUMBER / OTP
===================================================== -->

<div
    class="card hidden"
    id="stepNumber"
>

<h3>Your Number</h3>

<div
    class="number"
    id="number"
>
    Loading...
</div>

<div
    class="status"
    id="waitingStatus"
>
    Waiting for verification code...
</div>


<div
    class="status hidden"
    id="receivedStatus"
>

<div class="success">
    ✅ Code received
</div>

<div
    class="code"
    id="code"
>
</div>

<div
    class="sms"
    id="sms"
>
</div>

</div>


<button
    id="cancelButton"
    class="cancel"
    onclick="cancelNumber()"
>
    Cancel & Refund
</button>


<button
    class="secondary"
    onclick="goDashboard()"
>
    Back to Dashboard
</button>

</div>


</div>


<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


// =====================================================
// EDGE FUNCTION
// =====================================================

const EDGE_FUNCTION =
    "numpool-api";


// The Edge Function name can remain this.
// It is only the Supabase function name.
// The actual provider inside it is 5SIM.


// =====================================================
// STATE
// =====================================================

let countries = [];

let products = [];

let selectedCountry = null;

let selectedProduct = null;

let currentOrder = null;

let pollTimer = null;

let polling = false;


// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    text,
    type = ""
){

    const box =
        document.getElementById(
            "message"
        );

    box.className =
        "card";

    if(type){
        box.classList.add(type);
    }

    box.textContent =
        text;

    box.classList.remove(
        "hidden"
    );

}


function hideMessage(){

    document.getElementById(
        "message"
    ).classList.add(
        "hidden"
    );

}


// =====================================================
// DASHBOARD
// =====================================================

function goDashboard(){

    if(pollTimer){
        clearInterval(
            pollTimer
        );
    }

    location.href =
        "dashboard.html";

}


// =====================================================
// API
// =====================================================

async function callAPI(
    path,
    options = {}
){

    const {
        data:{
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();


    if(!session){

        throw new Error(
            "Please login first."
        );

    }


    const response =
        await fetch(
            SUPABASE_URL +
            "/functions/v1/" +
            EDGE_FUNCTION +
            path,
            {

                ...options,

                headers:{

                    ...(options.headers || {}),

                    Authorization:
                        "Bearer " +
                        session.access_token,

                    apikey:
                        SUPABASE_ANON_KEY,

                    "Content-Type":
                        "application/json"

                }

            }
        );


    const data =
        await response.json();


    if(
        !response.ok ||
        data.success === false
    ){

        throw new Error(
            typeof data.error ===
            "string"
                ? data.error
                : JSON.stringify(
                    data.error ||
                    "Request failed."
                )
        );

    }


    return data;

}


// =====================================================
// COUNTRIES
// =====================================================

async function loadCountries(){

    try{

        const data =
            await callAPI(
                "?action=countries"
            );


        const raw =
            Array.isArray(
                data.countries
            )
                ? data.countries
                : [];


        countries =
            raw
                .map(country => {

                    /*
                     5SIM country response is
                     normally an object keyed by
                     country code.

                     We normalize it here.
                    */

                    if(
                        typeof country ===
                        "string"
                    ){

                        return {
                            id:
                                country,

                            name:
                                country,

                            code:
                                country,

                            flag:
                                ""
                        };

                    }


                    return {
                        id:
                            country?.id ??
                            country?.iso ??
                            country?.code ??
                            country?.name,

                        name:
                            country?.name ??
                            country?.country ??
                            country?.iso ??
                            country?.code ??
                            "Unknown",

                        code:
                            country?.iso ??
                            country?.code ??
                            country?.name,

                        flag:
                            country?.flag ??
                            ""
                    };

                })
                .filter(
                    country =>
                        country.id
                );


        renderCountries(
            countries
        );


    }catch(error){

        showMessage(
            "❌ " +
            error.message,
            "error"
        );

    }

}


// =====================================================
// RENDER COUNTRIES
// =====================================================

function renderCountries(
    list
){

    const box =
        document.getElementById(
            "countries"
        );

    box.innerHTML = "";


    if(!list.length){

        box.innerHTML =
            "<p>No countries available right now.</p>";

        return;

    }


    list.forEach(
        country => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "country";


            div.innerHTML = `

                <strong>
                    ${escapeHtml(
                        country.flag
                    )}

                    ${escapeHtml(
                        country.name
                    )}
                </strong>

                <span class="muted">
                    ${escapeHtml(
                        country.code
                    )}
                </span>

            `;


            div.onclick =
                () =>
                    selectCountry(
                        country
                    );


            box.appendChild(
                div
            );

        }
    );

}


// =====================================================
// FILTER COUNTRIES
// =====================================================

function filterCountries(){

    const search =
        document.getElementById(
            "countrySearch"
        )
        .value
        .toLowerCase()
        .trim();


    renderCountries(
        countries.filter(
            country =>
                String(
                    country.name
                )
                .toLowerCase()
                .includes(
                    search
                )
        )
    );

}


// =====================================================
// SELECT COUNTRY
// =====================================================

async function selectCountry(
    country
){

    selectedCountry =
        country;


    document.getElementById(
        "stepCountry"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "stepProduct"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "chosenCountry"
    ).textContent =
        (
            country.flag || ""
        ) +
        " " +
        country.name;


    document.getElementById(
        "products"
    ).innerHTML =
        `
        <div class="spinner">
            Loading services...
        </div>
        `;


    try{

        const data =
            await callAPI(
                "?action=products&country=" +
                encodeURIComponent(
                    country.code
                )
            );


        products =
            Array.isArray(
                data.products
            )
                ? data.products
                : [];


        renderProducts(
            products
        );


    }catch(error){

        showMessage(
            "❌ " +
            error.message,
            "error"
        );

    }

}


// =====================================================
// RENDER PRODUCTS
// =====================================================

function renderProducts(
    list
){

    const box =
        document.getElementById(
            "products"
        );

    box.innerHTML = "";


    if(!list.length){

        box.innerHTML =
            "<p>No services available for this country right now.</p>";

        return;

    }


    /*
      Same service may have multiple
      operators.

      We show every live operator option
      because the price can differ.
    */

    list.forEach(
        product => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "product";


            div.innerHTML = `

                <strong>
                    ${escapeHtml(
                        product.product
                    )}
                </strong>

                <div class="operator">
                    Operator:
                    ${escapeHtml(
                        product.operator
                    )}
                </div>

                <div class="productPrice">
                    ₦${Number(
                        product.selling_price_ngn
                    ).toLocaleString()}
                </div>

                <div class="muted">
                    Provider price:
                    $${Number(
                        product.api_price_usd
                    ).toFixed(4)}
                </div>

            `;


            div.onclick =
                () =>
                    selectProduct(
                        product
                    );


            box.appendChild(
                div
            );

        }
    );

}


// =====================================================
// FILTER PRODUCTS
// =====================================================

function filterProducts(){

    const search =
        document.getElementById(
            "productSearch"
        )
        .value
        .toLowerCase()
        .trim();


    renderProducts(
        products.filter(
            product =>
                String(
                    product.product
                )
                .toLowerCase()
                .includes(
                    search
                )
        )
    );

}


// =====================================================
// SELECT PRODUCT
// =====================================================

function selectProduct(
    product
){

    selectedProduct =
        product;


    document.getElementById(
        "stepProduct"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "stepBuy"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "buyCountry"
    ).textContent =
        (
            selectedCountry.flag ||
            ""
        ) +
        " " +
        selectedCountry.name;


    document.getElementById(
        "buyService"
    ).textContent =
        "Service: " +
        product.product;


    document.getElementById(
        "buyOperator"
    ).textContent =
        "Operator: " +
        product.operator;


    document.getElementById(
        "buyPrice"
    ).textContent =
        "₦" +
        Number(
            product.selling_price_ngn
        ).toLocaleString();


    document.getElementById(
        "buyStock"
    ).textContent =
        "Live price from 5SIM";

}


// =====================================================
// BUY NUMBER
// =====================================================

async function buyNumber(){

    if(
        !selectedCountry ||
        !selectedProduct
    ){

        return;

    }


    const price =
        Number(
            selectedProduct
                .selling_price_ngn
        );


    const confirmed =
        confirm(
            "Buy " +
            selectedCountry.name +
            " " +
            selectedProduct.product +
            " number for ₦" +
            price.toLocaleString() +
            "?"
        );


    if(!confirmed){
        return;
    }


    const button =
        document.getElementById(
            "buyButton"
        );


    button.disabled =
        true;

    button.textContent =
        "Buying...";


    try{

        hideMessage();


        const data =
            await callAPI(
                "?action=buy",
                {

                    method:
                        "POST",

                    body:
                        JSON.stringify({

                            country:
                                selectedCountry.code,

                            country_id:
                                Number(
                                    selectedCountry.id
                                ) || 0,

                            product:
                                selectedProduct.product,

                            operator:
                                selectedProduct.operator

                        })

                }
            );


        currentOrder =
            data.order;


        document.getElementById(
            "stepBuy"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "stepNumber"
        ).classList.remove(
            "hidden"
        );


        document.getElementById(
            "number"
        ).textContent =
            currentOrder.number;


        document.getElementById(
            "waitingStatus"
        ).classList.remove(
            "hidden"
        );


        document.getElementById(
            "receivedStatus"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "cancelButton"
        ).classList.remove(
            "hidden"
        );


        showMessage(
            "✅ Number purchased. Waiting for verification code...",
            "success"
        );


        startPolling();


    }catch(error){

        showMessage(
            "❌ " +
            error.message,
            "error"
        );

    }finally{

        button.disabled =
            false;

        button.textContent =
            "Buy Number";

    }

}


// =====================================================
// POLLING
// =====================================================

function startPolling(){

    stopPolling();


    polling =
        true;


    pollTimer =
        setInterval(
            checkSMS,
            4000
        );


    checkSMS();

}


function stopPolling(){

    polling =
        false;


    if(pollTimer){

        clearInterval(
            pollTimer
        );

        pollTimer =
            null;

    }

}


// =====================================================
// CHECK SMS
// =====================================================

async function checkSMS(){

    if(
        !currentOrder ||
        !currentOrder.five_sim_order_id ||
        !polling
    ){

        return;

    }


    try{

        const data =
            await callAPI(
                "?action=status&id=" +
                encodeURIComponent(
                    currentOrder
                        .five_sim_order_id
                )
            );


        /*
          OTP received
        */

        if(
            data.otp_code
        ){

            stopPolling();


            document.getElementById(
                "waitingStatus"
            ).classList.add(
                "hidden"
            );


            document.getElementById(
                "receivedStatus"
            ).classList.remove(
                "hidden"
            );


            document.getElementById(
                "code"
            ).textContent =
                data.otp_code;


            document.getElementById(
                "sms"
            ).textContent =
                data.full_sms ||
                "Verification SMS received.";


            /*
              IMPORTANT:
              Once code arrives,
              cancellation is no longer allowed.
            */

            document.getElementById(
                "cancelButton"
            ).classList.add(
                "hidden"
            );


            showMessage(
                "✅ Verification code received.",
                "success"
            );


            return;

        }


        /*
          Provider says cancelled.
        */

        if(
            data.status ===
                "cancel" ||
            data.status ===
                "cancelled"
        ){

            stopPolling();


            document.getElementById(
                "cancelButton"
            ).classList.add(
                "hidden"
            );


            showMessage(
                "Number has been cancelled.",
                "success"
            );

        }

    }catch(error){

        /*
          Don't punish the user for
          one temporary polling failure.
        */

        console.error(
            "SMS polling error:",
            error
        );

    }

}


// =====================================================
// CANCEL + REFUND
// =====================================================

async function cancelNumber(){

    if(
        !currentOrder ||
        !currentOrder.five_sim_order_id
    ){

        return;

    }


    const confirmed =
        confirm(
            "Cancel this number and refund ₦" +
            Number(
                currentOrder.customer_price_ngn
            ).toLocaleString() +
            " to your wallet?"
        );


    if(!confirmed){
        return;
    }


    const button =
        document.getElementById(
            "cancelButton"
        );


    button.disabled =
        true;

    button.textContent =
        "Cancelling...";


    try{

        stopPolling();


        const data =
            await callAPI(
                "?action=cancel",
                {

                    method:
                        "POST",

                    body:
                        JSON.stringify({

                            id:
                                currentOrder
                                    .five_sim_order_id

                        })

                }
            );


        button.classList.add(
            "hidden"
        );


        showMessage(
            "✅ Number cancelled. ₦" +
            Number(
                data.amount || 0
            ).toLocaleString() +
            " has been refunded to your wallet.",
            "success"
        );


    }catch(error){

        /*
          Very important:
          If 5SIM doesn't confirm cancellation,
          the Edge Function does NOT refund.

          So we tell the user exactly what happened.
        */

        showMessage(
            "❌ " +
            error.message,
            "error"
        );


        button.disabled =
            false;

        button.textContent =
            "Cancel & Refund";


        /*
          Restart polling because the number
          may still be active.
        */

        startPolling();

    }

}


// =====================================================
// NAVIGATION
// =====================================================

function backToCountries(){

    document.getElementById(
        "stepProduct"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "stepCountry"
    ).classList.remove(
        "hidden"
    );


    hideMessage();

}


function backToProducts(){

    document.getElementById(
        "stepBuy"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "stepProduct"
    ).classList.remove(
        "hidden"
    );


    hideMessage();

}


// =====================================================
// HTML ESCAPE
// =====================================================

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// =====================================================
// START
// =====================================================

loadCountries();

</script>

</body>

</html>
