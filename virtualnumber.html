<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>All Country Numbers</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .back {
      border: 0;
      background: #111827;
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      color: #6b7280;
      margin-top: 5px;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.05);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    select,
    button {
      width: 100%;
      min-height: 46px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      padding: 0 12px;
      font-size: 15px;
    }

    select {
      background: white;
    }

    button {
      border: 0;
      background: #111827;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .primary {
      background: #2563eb;
    }

    .danger {
      background: #dc2626;
    }

    .success {
      background: #16a34a;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }

    .price-grid {
      display: grid;
      gap: 10px;
    }

    .price-card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }

    .price-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .service-name {
      font-weight: 800;
      font-size: 17px;
    }

    .operator {
      color: #6b7280;
      font-size: 13px;
      margin-top: 4px;
    }

    .price {
      font-size: 20px;
      font-weight: 900;
      margin-top: 10px;
    }

    .stock {
      font-size: 13px;
      margin-top: 4px;
      color: #16a34a;
    }

    .out {
      color: #dc2626;
    }

    .order-box {
      background: #eef6ff;
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 15px;
    }

    .number {
      font-size: 24px;
      font-weight: 900;
      word-break: break-all;
      margin: 8px 0;
    }

    .otp {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
      margin: 8px 0;
    }

    .sms {
      background: white;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    .wallet {
      font-weight: 800;
      margin-bottom: 10px;
    }

    .small {
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <button
      class="back"
      type="button"
      onclick="history.back()"
    >
      ←
    </button>

    <div>
      <h1>All Country Numbers</h1>
      <div class="subtitle">
        Choose a country, service and available number.
      </div>
    </div>
  </div>

  <div id="messageArea"></div>

  <div class="card">
    <div class="wallet">
      Wallet: <span id="walletBalance">Loading...</span>
    </div>

    <div class="small">
      Prices are calculated using the current provider price
      and live USD/NGN exchange rate.
    </div>
  </div>

  <!-- COUNTRY -->

  <div class="card">
    <label for="country">
      1. Choose Country
    </label>

    <select id="country">
      <option value="">
        Loading countries...
      </option>
    </select>
  </div>

  <!-- SERVICE -->

  <div
    id="serviceCard"
    class="card hidden"
  >
    <label for="service">
      2. Choose Service
    </label>

    <select id="service">
      <option value="">
        Select service
      </option>
    </select>
  </div>

  <!-- PRICES -->

  <div
    id="pricesCard"
    class="card hidden"
  >
    <label>
      3. Available Numbers
    </label>

    <div
      id="prices"
      class="price-grid"
    ></div>
  </div>

  <!-- CURRENT ORDER -->

  <div
    id="orderCard"
    class="card hidden"
  >
    <label>
      Current Number
    </label>

    <div class="order-box">

      <div class="small">
        Service
      </div>

      <div id="orderService">
        -
      </div>

      <div class="small" style="margin-top:8px;">
        Country
      </div>

      <div id="orderCountry">
        -
      </div>

      <div class="small" style="margin-top:8px;">
        Number
      </div>

      <div
        id="orderNumber"
        class="number"
      >
        -
      </div>

      <div class="small">
        Status
      </div>

      <div id="orderStatus">
        Waiting for SMS
      </div>

      <div
        id="otpArea"
        class="hidden"
        style="margin-top:15px;"
      >
        <div class="small">
          OTP Code
        </div>

        <div
          id="otp"
          class="otp"
        >
          -
        </div>

        <div class="small">
          SMS
        </div>

        <div
          id="sms"
          class="sms"
        >
          -
        </div>
      </div>

      <div style="margin-top:15px; display:grid; gap:10px;">

        <button
          id="checkBtn"
          class="primary"
          type="button"
        >
          Check SMS
        </button>

        <button
          id="finishBtn"
          class="success"
          type="button"
        >
          Finish Order
        </button>

        <button
          id="cancelBtn"
          class="danger"
          type="button"
        >
          Cancel & Refund
        </button>

      </div>

    </div>
  </div>

</div>

<script>
  /*
   ============================================================
   SUPABASE CONFIG
   ============================================================

   This page first checks whether your existing project already
   created a Supabase client globally.

   If not, put your EXISTING project URL + anon key here.

   NEVER put:
   - FIVESIM_API_KEY
   - SUPABASE_SERVICE_ROLE_KEY

   in this HTML.
  */

  let supabaseClient = null;

  if (
    typeof window.supabaseClient !== "undefined"
  ) {
    supabaseClient =
      window.supabaseClient;
  }

  /*
    If your dashboard already has:

      window.supabaseClient = ...

    this page uses it automatically.
  */

  const EDGE_FUNCTION =
    "numpool-api";

  let currentPrices = [];
  let currentOrderId = null;
  let pollingTimer = null;

  const countrySelect =
    document.getElementById(
      "country",
    );

  const serviceSelect =
    document.getElementById(
      "service",
    );

  const serviceCard =
    document.getElementById(
      "serviceCard",
    );

  const pricesCard =
    document.getElementById(
      "pricesCard",
    );

  const pricesContainer =
    document.getElementById(
      "prices",
    );

  const orderCard =
    document.getElementById(
      "orderCard",
    );

  const messageArea =
    document.getElementById(
      "messageArea",
    );

  const walletBalance =
    document.getElementById(
      "walletBalance",
    );

  function showMessage(
    message,
    type = "error",
  ) {
    messageArea.innerHTML =
      `<div class="message ${type}">
        ${escapeHtml(message)}
      </div>`;

    setTimeout(() => {
      messageArea.innerHTML = "";
    }, 6000);
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function naira(value) {
    return "₦" +
      Number(value || 0)
        .toLocaleString(
          "en-NG",
        );
  }

  async function requireClient() {
    if (!supabaseClient) {
      throw new Error(
        "Supabase client is not initialized on this page.",
      );
    }

    const {
      data: {
        session,
      },
    } =
      await supabaseClient.auth.getSession();

    if (!session) {
      throw new Error(
        "Please sign in first.",
      );
    }

    return session;
  }

  async function callApi(
    body,
  ) {
    const session =
      await requireClient();

    const {
      data,
      error,
    } =
      await supabaseClient.functions.invoke(
        EDGE_FUNCTION,
        {
          body,
        },
      );

    if (error) {
      throw new Error(
        error.message ||
          "Request failed",
      );
    }

    if (
      !data ||
      data.success === false
    ) {
      throw new Error(
        data?.error ||
          "Request failed",
      );
    }

    return data;
  }

  /* ==========================================================
     LOAD COUNTRIES
     ========================================================== */

  async function loadCountries() {
    try {
      const data =
        await callApi({
          action:
            "countries",
        });

      const raw =
        data.countries;

      countrySelect.innerHTML =
        `<option value="">
          Choose country
        </option>`;

      let countries = [];

      /*
        Handle array responses.
      */

      if (
        Array.isArray(raw)
      ) {
        countries = raw;
      }

      /*
        Handle object responses.
      */

      else if (
        raw &&
        typeof raw ===
          "object"
      ) {
        countries =
          Object.entries(
            raw,
          ).map(
            ([
              key,
              value,
            ]) => ({
              id:
                value?.id ||
                value?.country_id ||
                key,

              name:
                value?.name ||
                value?.title ||
                key,
            }),
          );
      }

      countries.sort(
        (a, b) =>
          String(
            a.name ||
              a.country ||
              a,
          ).localeCompare(
            String(
              b.name ||
                b.country ||
                b,
            ),
          ),
      );

      for (
        const item of countries
      ) {
        const value =
          typeof item ===
          "string"
            ? item
            : (
                item.name ||
                item.country ||
                item.code ||
                ""
              );

        if (!value)
          continue;

        const option =
          document.createElement(
            "option",
          );

        option.value =
          String(
            value,
          ).toLowerCase();

        option.textContent =
          String(
            value,
          );

        countrySelect.appendChild(
          option,
        );
      }

    } catch (
      err
    ) {
      showMessage(
        err.message ||
          "Unable to load countries.",
      );

      countrySelect.innerHTML =
        `<option value="">
          Unable to load countries
        </option>`;
    }
  }

  /* ==========================================================
     LOAD SERVICES FOR COUNTRY
     ========================================================== */

  async function loadServices() {
    const country =
      countrySelect.value;

    serviceSelect.innerHTML =
      `<option value="">
        Loading services...
      </option>`;

    pricesCard.classList.add(
      "hidden",
    );

    if (!country) {
      serviceCard.classList.add(
        "hidden",
      );

      return;
    }

    try {
      const data =
        await callApi({
          action:
            "prices",

          country,
        });

      currentPrices =
        Array.isArray(
          data.prices,
        )
          ? data.prices
          : [];

      const serviceMap =
        new Map();

      for (
        const item of currentPrices
      ) {
        const code =
          item.service_code;

        if (!code)
          continue;

        if (
          !serviceMap.has(
            code,
          )
        ) {
          serviceMap.set(
            code,
            item.service_name ||
              code,
          );
        }
      }

      serviceSelect.innerHTML =
        `<option value="">
          Choose service
        </option>`;

      Array.from(
        serviceMap.entries(),
      )
        .sort(
          (a, b) =>
            a[1].localeCompare(
              b[1],
            ),
        )
        .forEach(
          ([
            code,
            name,
          ]) => {
            const option =
              document.createElement(
                "option",
              );

            option.value =
              code;

            option.textContent =
              name;

            serviceSelect.appendChild(
              option,
            );
          },
        );

      serviceCard.classList.remove(
        "hidden",
      );

    } catch (
      err
    ) {
      serviceCard.classList.add(
        "hidden",
      );

      showMessage(
        err.message ||
          "Unable to load services.",
      );
    }
  }

  /* ==========================================================
     DISPLAY PRICES
     ========================================================== */

  function displayPrices() {
    const service =
      serviceSelect.value;

    pricesContainer.innerHTML =
      "";

    if (!service) {
      pricesCard.classList.add(
        "hidden",
      );

      return;
    }

    const servicePrices =
      currentPrices
        .filter(
          (item) =>
            item.service_code ===
            service,
        )
        .sort(
          (a, b) =>
            Number(
              a.customer_price_ngn,
            ) -
            Number(
              b.customer_price_ngn,
            ),
        );

    if (
      !servicePrices.length
    ) {
      pricesContainer.innerHTML =
        `<div class="small">
          No numbers currently available for this service.
        </div>`;

      pricesCard.classList.remove(
        "hidden",
      );

      return;
    }

    for (
      const item of servicePrices
    ) {
      const available =
        Number(
          item.stock || 0,
        ) > 0;

      const card =
        document.createElement(
          "div",
        );

      card.className =
        "price-card";

      card.innerHTML = `
        <div class="price-top">
          <div>
            <div class="service-name">
              ${escapeHtml(
                item.service_name,
              )}
            </div>

            <div class="operator">
              Operator:
              ${escapeHtml(
                item.operator,
              )}
            </div>
          </div>

          <div class="price">
            ${naira(
              item.customer_price_ngn,
            )}
          </div>
        </div>

        <div class="stock ${
          available
            ? ""
            : "out"
        }">
          ${
            available
              ? `${Number(
                  item.stock,
                ).toLocaleString()} in stock`
              : "Out of stock"
          }
        </div>

        <div class="small">
          Provider:
          $${Number(
            item.provider_cost_usd,
          ).toFixed(2)}
        </div>

        <button
          type="button"
          class="primary buy-button"
          style="margin-top:12px;"
          ${
            available
              ? ""
              : "disabled"
          }
        >
          ${
            available
              ? "Buy Number"
              : "Out of Stock"
          }
        </button>
      `;

      if (available) {
        card
          .querySelector(
            ".buy-button",
          )
          .addEventListener(
            "click",
            () =>
              buyNumber(
                item,
              ),
          );
      }

      pricesContainer.appendChild(
        card,
      );
    }

    pricesCard.classList.remove(
      "hidden",
    );
  }

  /* ==========================================================
     BUY
     ========================================================== */

  async function buyNumber(
    item,
  ) {
    if (
      !confirm(
        `Buy ${item.service_name} number for ${naira(
          item.customer_price_ngn,
        )}?`,
      )
    ) {
      return;
    }

    try {
      document
        .querySelectorAll(
          ".buy-button",
        )
        .forEach(
          (button) => {
            button.disabled =
              true;
          },
        );

      /*
        IMPORTANT:
        We send country/service/operator only.

        We do NOT send price.

        The Edge Function fetches the CURRENT
        5SIM price itself and calculates the
        real customer price.
      */

      const data =
        await callApi({
          action:
            "buy",

          country:
            countrySelect.value,

          service:
            item.service_code,

          operator:
            item.operator,
        });

      currentOrderId =
        data.order.id;

      displayOrder(
        data.order,
      );

      showMessage(
        `Number purchased successfully for ${naira(
          data.order.customer_price_ngn,
        )}.`,
        "success",
      );

      await loadWallet();

      startPolling();

    } catch (
      err
    ) {
      showMessage(
        err.message ||
          "Purchase failed.",
      );

      document
        .querySelectorAll(
          ".buy-button",
        )
        .forEach(
          (button) => {
            button.disabled =
              false;
          },
        );
    }
  }

  /* ==========================================================
     DISPLAY ORDER
     ========================================================== */

  function displayOrder(
    order,
  ) {
    orderCard.classList.remove(
      "hidden",
    );

    document.getElementById(
      "orderService",
    ).textContent =
      order.service ||
      "-";

    document.getElementById(
      "orderCountry",
    ).textContent =
      order.country ||
      "-";

    document.getElementById(
      "orderNumber",
    ).textContent =
      order.number ||
      "Number pending...";

    document.getElementById(
      "orderStatus",
    ).textContent =
      order.status ||
      "waiting";

    document.getElementById(
      "otpArea",
    ).classList.add(
      "hidden",
    );

    window.scrollTo({
      top:
        document.body
          .scrollHeight,

      behavior:
        "smooth",
    });
  }

  /* ==========================================================
     CHECK SMS
     ========================================================== */

  async function checkOrder(
    silent = false,
  ) {
    if (
      !currentOrderId
    ) {
      return;
    }

    try {
      const data =
        await callApi({
          action:
            "check",

          order_id:
            currentOrderId,
        });

      document.getElementById(
        "orderStatus",
      ).textContent =
        data.status ||
        data.provider_status ||
        "waiting";

      if (
        data.number
      ) {
        document.getElementById(
          "orderNumber",
        ).textContent =
          data.number;
      }

      if (
        data.sms
      ) {
        document.getElementById(
          "otpArea",
        ).classList.remove(
          "hidden",
        );

        document.getElementById(
          "otp",
        ).textContent =
          data.sms.code ||
          "-";

        document.getElementById(
          "sms",
        ).textContent =
          data.sms.text ||
          "-";
      }

      if (
        !silent
      ) {
        showMessage(
          data.sms
            ? "SMS received."
            : "No SMS yet. Try again.",
          data.sms
            ? "success"
            : "error",
        );
      }

      if (
        [
          "finished",
          "cancelled",
          "timeout",
          "banned",
        ].includes(
          String(
            data.status,
          ).toLowerCase(),
        )
      ) {
        stopPolling();
      }

    } catch (
      err
    ) {
      if (!silent) {
        showMessage(
          err.message ||
            "Unable to check SMS.",
        );
      }
    }
  }

  /* ==========================================================
     POLLING
     ========================================================== */

  function startPolling() {
    stopPolling();

    pollingTimer =
      setInterval(
        () => {
          checkOrder(
            true,
          );
        },
        5000,
      );
  }

  function stopPolling() {
    if (
      pollingTimer
    ) {
      clearInterval(
        pollingTimer,
      );

      pollingTimer =
        null;
    }
  }

  /* ==========================================================
     CANCEL
     ========================================================== */

  async function cancelOrder() {
    if (
      !currentOrderId
    ) {
      return;
    }

    if (
      !confirm(
        "Cancel this number and refund the exact amount you paid to your wallet?",
      )
    ) {
      return;
    }

    try {
      document.getElementById(
        "cancelBtn",
      ).disabled = true;

      const data =
        await callApi({
          action:
            "cancel",

          order_id:
            currentOrderId,
        });

      stopPolling();

      showMessage(
        data.message ||
          `₦${Number(
            data.refund_amount_ngn ||
              0,
          ).toLocaleString()} refunded.`,
        "success",
      );

      await loadWallet();

      document.getElementById(
        "orderStatus",
      ).textContent =
        "cancelled / refunded";

      document.getElementById(
        "cancelBtn",
      ).disabled = true;

    } catch (
      err
    ) {
      document.getElementById(
        "cancelBtn",
      ).disabled = false;

      showMessage(
        err.message ||
          "Cancellation failed.",
      );
    }
  }

  /* ==========================================================
     FINISH
     ========================================================== */

  async function finishOrder() {
    if (
      !currentOrderId
    ) {
      return;
    }

    try {
      document.getElementById(
        "finishBtn",
      ).disabled = true;

      const data =
        await callApi({
          action:
            "finish",

          order_id:
            currentOrderId,
        });

      stopPolling();

      document.getElementById(
        "orderStatus",
      ).textContent =
        "finished";

      showMessage(
        data.message ||
          "Order finished successfully.",
        "success",
      );

    } catch (
      err
    ) {
      document.getElementById(
        "finishBtn",
      ).disabled = false;

      showMessage(
        err.message ||
          "Unable to finish order.",
      );
    }
  }

  /* ==========================================================
     WALLET
     ========================================================== */

  async function loadWallet() {
    try {
      const session =
        await requireClient();

      const {
        data,
        error,
      } =
        await supabaseClient
          .from("wallet")
          .select(
            'balance',
          )
          .eq(
            "user-id",
            session.user.id,
          )
          .maybeSingle();

      if (
        error
      ) {
        throw error;
      }

      walletBalance.textContent =
        naira(
          data?.balance ||
            0,
        );

    } catch (
      err
    ) {
      walletBalance.textContent =
        "Unavailable";
    }
  }

  /* ==========================================================
     EVENTS
     ========================================================== */

  countrySelect.addEventListener(
    "change",
    loadServices,
  );

  serviceSelect.addEventListener(
    "change",
    displayPrices,
  );

  document.getElementById(
    "checkBtn",
  ).addEventListener(
    "click",
    () =>
      checkOrder(
        false,
      ),
  );

  document.getElementById(
    "cancelBtn",
  ).addEventListener(
    "click",
    cancelOrder,
  );

  document.getElementById(
    "finishBtn",
  ).addEventListener(
    "click",
    finishOrder,
  );

  /* ==========================================================
     START
     ========================================================== */

  (async function () {
    try {
      await requireClient();

      await loadWallet();

      await loadCountries();

    } catch (
      err
    ) {
      showMessage(
        err.message ||
          "Please log in first.",
      );
    }
  })();
</script>

</body>
