<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Notifications — Delight Vendor Logs</title><link rel="icon" type="image/png" href="assets/dv-logo.png"><link rel="apple-touch-icon" href="assets/dv-logo.png"><link rel="stylesheet" href="site-theme.css">
<style>body{margin:0;background:#090909;color:#f5f0df;font-family:Arial,sans-serif}.top{display:flex;align-items:center;gap:12px;padding:16px;max-width:850px;margin:auto}.brand{display:flex;align-items:center;gap:10px;flex:1}.brand img{width:42px;height:42px;object-fit:contain}.brand strong{font-size:17px}.back{border:1px solid #493b1c;background:#121212;color:#d4af37;border-radius:10px;padding:10px 13px;text-decoration:none}.wrap{max-width:850px;margin:auto;padding:8px 16px 40px}.panel{border:1px solid #493b1c;background:#121212;color:#f5f0df;border-radius:14px;padding:18px;margin-bottom:12px}.eyebrow{color:#d4af37;font-size:12px;font-weight:800;letter-spacing:.12em}.empty{padding:18px;border-radius:12px;background:#0c0c0c;color:#b8ad8d;line-height:1.6}.notice{border:1px solid #302818;border-radius:12px;padding:15px;margin-top:12px;background:#0d0d0d}.notice h2{font-size:17px;margin:0 0 8px}.notice-message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;color:#eee7d3}.notice-message a{color:#69adff;text-decoration:underline;font-weight:700}.date{font-size:12px;color:#a99d7e;margin-top:10px}.unread{border-left:3px solid #d4af37}</style></head><body>
<header class="top"><a class="back" href="dashboard.html">← Back</a><div class="brand"><img src="assets/dv-logo.png" alt="DV logo"><strong>Delight Vendor Logs</strong></div></header>
<main class="wrap"><section class="panel"><p class="eyebrow">YOUR ACCOUNT</p><h1>Notifications</h1><p class="date">Important updates and announcements from Delight Vendor Logs.</p><div id="list"><div class="empty">Loading your notifications…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=window.supabase.createClient("https://hkfhehbhmucymusaytoe.supabase.co","sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_");
function renderMessage(el,text){const re = /https?:\/\/[^\s<>"']+/gi;let last=0,m;while((m=re.exec(text))){el.append(document.createTextNode(text.slice(last,m.index)));const url=m[0].replace(/[),.!?;:]+$/,""),tail=m[0].slice(url.length);try{const p=new URL(url);if(p.protocol==="http:"||p.protocol==="https:"){const a=document.createElement("a");a.href=p.href;a.textContent="Click here";a.target="_blank";a.rel="noopener noreferrer";el.append(a);el.append(document.createTextNode(tail));}else el.append(document.createTextNode(m[0]));}catch{el.append(document.createTextNode(m[0]));}last=m.index+m[0].length;}el.append(document.createTextNode(text.slice(last)));}
async function load(){const root=document.getElementById("list");const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user){root.textContent="Please sign in to view your notifications.";return;}const {data,error}=await client.from("notification_recipients").select("id,notification_id,read_at,created_at,notifications(title,message,created_at,image_url)").eq("user_id",user.id).order("created_at",{ascending:false});if(error){root.textContent="Could not load notifications: "+error.message;return;}root.replaceChildren();if(!data?.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="You’re all caught up for now. New announcements will appear here.";root.append(empty);return;}for(const row of data){const n=row.notifications;if(!n)continue;const card=document.createElement("article");card.className="notice"+(row.read_at?"":" unread");const h=document.createElement("h2");h.textContent=n.title||"Notification";const body=document.createElement("div");body.className="notice-message";renderMessage(body,n.message||"");card.append(h,body);if(n.image_url){const img=document.createElement("img");img.src=n.image_url;img.alt="";img.loading="lazy";img.style.cssText="display:block;max-width:100%;max-height:320px;object-fit:contain;margin-top:12px;border-radius:8px";card.append(img);}const date=document.createElement("div");date.className="date";date.textContent=new Date(n.created_at||row.created_at).toLocaleString("en-NG");card.append(date);root.append(card);if(!row.read_at){await client.from("notification_recipients").update({read_at:new Date().toISOString()}).eq("id",row.id).eq("user_id",user.id);}}}
load();
</script><script src="branding.js"></script><script src="assets/site-announcement.js" defer></script>
</body></html>
