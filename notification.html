</style></head><body><header class="top"><a class="back" href="dashboard.html">← Back</a><div class="brand"><img src="assets/dv-logo.png" alt="DV logo"><strong>Delight Vendor Logs</strong></div></header><main class="wrap"><section class="panel"><p class="eyebrow">YOUR ACCOUNT</p><div class="title-row"><h1>Notifications <span id="unreadCount" style="color:#d4af37;font-size:16px"></span></h1></div><p class="muted">Updates sent to you by Delight Vendor Logs. Tap any notification to read the full message and view its image, if attached.</p><div id="notice" class="notice" role="status" aria-live="polite"></div><div class="actions"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="unread">Unread</button><button class="filter" data-filter="read">Read</button><button class="btn" id="markAll" type="button">Mark all as read</button></div><div id="notificationList" class="list"><div class="empty">Loading your notifications…</div></div></section></main>

(async()=>{
const $=id=>document.getElementById(id),sb=window.supabase.createClient("https://hkfhehbhmucymusaytoe.supabase.co","sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_");let all=[],filter="all",current=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderLinkedMessage(el,text){el.replaceChildren();const re=/https?:\/\/[^\s<>"']+/gi;let last=0,m;while((m=re.exec(String(text||"")))){el.append(document.createTextNode(text.slice(last,m.index)));const raw=m[0],url=raw.replace(/[),.!?;:]+$/,""),tail=raw.slice(url.length);try{const parsed=new URL(url);if(parsed.protocol==="http:"||parsed.protocol==="https:"){const a=document.createElement("a");a.href=parsed.href;a.textContent="Click here";a.target="_blank";a.rel="noopener noreferrer";a.style.cssText="color:#69adff;text-decoration:underline;font-weight:700";el.append(a);el.append(document.createTextNode(tail));}else el.append(document.createTextNode(raw));}catch{el.append(document.createTextNode(raw));}last=m.index+raw.length;}el.append(document.createTextNode(String(text||"").slice(last)));}
function note(msg,type="info"){const e=$("notice");e.textContent=msg;e.className="notice show "+type}
async function api(body){const {data,error}=await sb.functions.invoke("delight-notifications",{body});if(error)throw new Error(error.message||"Request failed");if(data?.error)throw new Error(data.error);return data}
const auth=await sb.auth.getSession();if(!auth.data.session){location.replace("login.html");return}
function updateCount(){const n=all.filter(x=>!x.read_at).length;$("unreadCount").textContent=n?"("+n+" unread)":"";const badge=window.parent?.document?.querySelector?.(".notification-badge");if(badge)badge.textContent=n>99?"99+":String(n)}
function render(){const items=all.filter(n=>filter==="all"||(filter==="unread"?!n.read_at:!!n.read_at));$("notificationList").innerHTML=items.map(n=>'<button class="item '+(n.read_at?"read":"unread")+'" data-id="'+esc(n.recipient_id)+'"><span class="dot"></span><span class="item-main"><h3>'+esc(n.title||"Notification")+'</h3><p>'+esc((n.message||"").slice(0,150))+(String(n.message||"").length>150?"…":"")+'</p><span class="meta">'+esc(new Date(n.created_at||n.sent_at||Date.now()).toLocaleString())+' · '+(n.read_at?"Read":"Unread")+'</span></span>'+(n.image_url?'<img class="thumb" src="'+esc(n.image_url)+'" alt="Attached image">':'')+'</button>').join("")||'<div class="empty">'+(filter==="unread"?"You have no unread notifications.":filter==="read"?"You have no read notifications yet.":"You’re all caught up. Notifications sent to you will appear here.")+'</div>';document.querySelectorAll("[data-id]").forEach(el=>el.addEventListener("click",()=>openDetail(el.dataset.id)))}
async function load(){ $("notificationList").innerHTML='<div class="empty">Loading notifications…</div>';try{const d=await api({action:"list"});all=d.notifications||[];updateCount();render();const id=new URLSearchParams(location.search).get("id");if(id){const n=all.find(x=>x.id===id||x.notification_id===id);if(n)openDetail(n.recipient_id);else note("That notification could not be found in your account.","error")}}catch(e){$("notificationList").innerHTML='<div class="empty">'+esc(e.message)+'</div>';note("Could not load notifications: "+e.message,"error")}}
async function openDetail(recipientId){const n=all.find(x=>x.recipient_id===recipientId);if(!n)return;current=n;$("detailTitle").textContent=n.title||"Notification";$("detailDate").textContent=new Date(n.created_at||Date.now()).toLocaleString();renderLinkedMessage($("detailMessage"),n.message||"");const img=$("detailImage");if(n.image_url){img.src=n.image_url;img.style.display="block"}else{img.removeAttribute("src");img.style.display="none"}$("detailModal").classList.add("open");if(!n.read_at){try{await api({action:"mark-read",recipientIds:[n.recipient_id]});n.read_at=new Date().toISOString();updateCount();render()}catch(e){note("Opened, but could not update read status: "+e.message,"error")}}}
function closeDetail(){ $("detailModal").classList.remove("open");const u=new URL(location.href);u.searchParams.delete("id");history.replaceState({},"",u.pathname+u.search)}
$("closeDetail").onclick=closeDetail;$("detailDone").onclick=closeDetail;$("detailModal").addEventListener("click",e=>{if(e.target===$("detailModal"))closeDetail()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()}));
$("markAll").onclick=async()=>{if(!all.some(n=>!n.read_at)){note("All notifications are already read.","info");return}const b=$("markAll");b.disabled=true;try{await api({action:"mark-read",all:true});all.forEach(n=>{if(!n.read_at)n.read_at=new Date().toISOString()});updateCount();render();note("All notifications marked as read.","ok")}catch(e){note(e.message,"error")}finally{b.disabled=false}};
await load();setInterval(load,60000);
})();
