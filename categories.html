<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>All Categories — Delight Vendor Logs</title><link rel="icon" type="image/png" href="assets/dv-logo.png"><link rel="apple-touch-icon" href="assets/dv-logo.png"><link rel="stylesheet" href="site-theme.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#211a08 0,transparent 42%),#080808;color:#f5f0df}.topbar{display:flex;align-items:center;gap:14px;max-width:1050px;margin:auto;padding:18px 22px;border-bottom:1px solid #30250e}.back{display:inline-flex;padding:10px 13px;border:1px solid #493b1c;border-radius:12px;color:#d4af37;text-decoration:none;white-space:nowrap}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:38px;height:38px;object-fit:contain}main{max-width:1050px;margin:0 auto;padding:28px 22px 50px}.eyebrow{color:#d4af37;font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(25px,4vw,38px);margin:8px 0}.intro{color:#b8ad8d;line-height:1.6;margin:0 0 22px}.category-list{display:flex;flex-direction:column;gap:10px}.category-row{display:grid;grid-template-columns:46px 1fr 22px;gap:14px;align-items:center;padding:15px;border:1px solid #352a12;border-radius:15px;background:linear-gradient(110deg,#15130d,#101010);color:#f5f0df;text-decoration:none;transition:border-color .15s,transform .15s}.category-row:hover{border-color:#d4af37;transform:translateY(-1px)}.category-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#2a220e;font-size:22px}.category-name{font-weight:750}.category-desc{display:block;color:#b8ad8d;font-size:13px;margin-top:4px;line-height:1.45}.arrow{color:#d4af37;font-size:22px}.state{padding:22px;border:1px solid #493b1c;border-radius:14px;color:#b8ad8d;background:#111}@media(min-width:760px){.category-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}@media(max-width:480px){.topbar{padding:14px;gap:10px}.brand{font-size:13px}.brand img{width:32px;height:32px}main{padding:22px 14px 35px}.category-row{padding:12px;gap:10px}.category-icon{width:40px;height:40px}}
</style></head><body><header class="topbar"><a class="back" href="dashboard.html">← Dashboard</a><div class="brand"><img src="assets/dv-logo.png" alt="DV logo"><span>Delight Vendor Logs</span></div></header><main><div class="eyebrow">Explore services</div><h1>All Categories</h1><p class="intro">Choose a category to continue. Your existing category and product flow remains on the dashboard.</p><div id="categoryList" class="category-list"><div class="state">Loading categories…</div></div></main>
<script>
const client=window.supabase.createClient("https://hkfhehbhmucymusaytoe.supabase.co","sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_");
const icons={"All Social Logs":"📱","Working Pictures":"🖼️","Working Picture":"🖼️","Formats":"📄","Working Picture Format":"📄","Working Links":"🔗","Voice Cloner/Fake Video Call":"🎙️","Voice Cloner / Fake Video Call":"🎙️","All Countries Number":"📞","All Country Numbers":"📞","Streaming & More":"📺","ESIMS":"📡","VPN":"🔐","Gmail":"✉️"};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){const box=document.getElementById("categoryList");const {data,error}=await client.from("service_categories").select("id,name,slug,icon,display_order,is_active").eq("is_active",true).order("display_order",{ascending:true});if(error){console.error(error);box.innerHTML='<div class="state">Could not load categories. Please return to the dashboard and try again.</div>';return}const rows=[{name:"Service",icon:"🧰",desc:"Browse all available services",href:"services.html"},...(data||[]).map(c=>({name:c.name,icon:c.icon||icons[c.name]||"📁",desc:"Open "+c.name+" products",href:"dashboard.html?category="+encodeURIComponent(c.name)}))];box.innerHTML=rows.map(c=>'<a class="category-row" href="'+c.href+'"><span class="category-icon">'+esc(c.icon)+'</span><span><span class="category-name">'+esc(c.name)+'</span><small class="category-desc">'+esc(c.desc)+'</small></span><span class="arrow">›</span></a>').join("")}
document.addEventListener('click',function(e){const a=e.target.closest('a.category-row');if(!a)return;sessionStorage.setItem('dvOpenedFromCategories','1');});
load();
</script><script src="branding.js"></script></body></html>
