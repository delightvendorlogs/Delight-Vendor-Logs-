<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#f5f0df;font-family:Arial,Helvetica,sans-serif}
.topbar{display:flex;align-items:center;gap:14px;max-width:1050px;margin:auto;padding:18px 22px;border-bottom:1px solid #30250e}
.back{display:inline-flex;align-items:center;padding:10px 13px;border:1px solid #493b1c;border-radius:12px;color:#d4af37;text-decoration:none;white-space:nowrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:38px;height:38px;object-fit:contain}
main{max-width:1050px;margin:0 auto;padding:27px 22px 50px}.eyebrow{color:#d4af37;font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
h1{font-size:clamp(25px,4vw,36px);margin:8px 0}.intro{color:#b8ad8d;line-height:1.6;margin:0 0 22px}
.category-list{display:flex;flex-direction:column;gap:12px}
.category-row{position:relative;display:flex;align-items:center;gap:18px;width:100%;min-height:112px;padding:20px 24px;border:1px solid #393326;border-left:5px solid #c5a04b;border-radius:24px;background:#17181b;color:#f4efe3;text-decoration:none;transition:border-color .15s,background .15s;overflow:hidden}
.category-row:nth-child(even){border-left-color:#8e82ad}
.category-row:hover{border-color:#8a713b;background:#1b1c20}
.category-icon{width:76px;height:76px;flex:0 0 76px;display:grid;place-items:center;border-radius:19px;background:#2a2416;border:1px solid #514329;color:#e5c36d}
.category-icon svg{display:block;width:38px;height:38px}
.category-row:nth-child(even) .category-icon{background:#24212c;border-color:#494155;color:#c9bce5}
.category-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:9px}
.category-name{font-size:clamp(18px,2.3vw,22px);line-height:1.3;font-weight:800;color:#f4efe3}
.category-desc{font-size:clamp(14px,1.7vw,17px);line-height:1.5;color:#b4ad9f}
.arrow{width:54px;height:54px;flex:0 0 54px;display:grid;place-items:center;border:1px solid #514329;border-radius:50%;color:#e1bf69;font-size:29px}
.category-row:nth-child(even) .arrow{border-color:#494155;color:#c9bce5}
.state{padding:22px;border:1px solid #493b1c;border-radius:14px;color:#b8ad8d;background:#111}
@media(min-width:760px){.category-list{display:flex;flex-direction:column}}
@media(max-width:480px){.topbar{padding:14px;gap:10px}.brand{font-size:13px}.brand img{width:32px;height:32px}main{padding:22px 14px 35px}.category-row{min-height:88px;padding:15px 16px;gap:12px;border-radius:17px;border-left-width:4px}.category-icon{width:54px;height:54px;flex-basis:54px;border-radius:14px}.category-icon svg{width:28px;height:28px}.category-copy{gap:6px}.category-name{font-size:16px}.category-desc{font-size:13px}.arrow{width:40px;height:40px;flex-basis:40px;font-size:23px}}
</style>
<style id="dv-categories-navigation">
main{padding-bottom:125px!important}
.dv-bottom-nav{position:fixed;z-index:300;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:760px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(15,16,19,.97);border-top:1px solid #57451f;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.dv-bottom-nav-item{min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:11px;color:#aaa394;text-decoration:none;font-size:10px;font-weight:700;line-height:1.1}
.dv-bottom-nav-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dv-bottom-nav-item.is-active{color:#e5bd52;background:#e5bd5212}
@media(min-width:761px){.dv-bottom-nav{bottom:14px;width:min(100% - 32px,560px);border:1px solid #57451f;border-radius:18px}}
</style>

<body>
<header class="topbar"><a class="brand" href="dashboard.html"><img src="assets/dv-logo.png" alt="DV logo"><span>Delight Vendor Logs</span></a><button class="search-button" type="button" aria-label="Search categories" onclick="document.getElementById('categorySearch').focus();document.getElementById('categorySearch').scrollIntoView({behavior:'smooth',block:'center'})"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button></header><div class="back-row"><a class="back" href="dashboard.html" aria-label="Back to Dashboard">← Back to Dashboard</a></div>
<main><div class="eyebrow">Explore services</div><h1>All Categories</h1><p class="intro">Choose a category to view its available services.</p><input id="categorySearch" type="search" placeholder="Find a category..." aria-label="Find a category"><div id="categoryList" class="category-list"><div class="state">Loading categories…</div></div></main>
<script>
const client=window.supabase.createClient("https://hkfhehbhmucymusaytoe.supabase.co","sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_");
const iconPaths={
"All Social Logs":'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>',
"Working Pictures":'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/>',
"Formats":'<path d="M7 3h7l5 5v13H7zM14 3v6h5M9 13h6M9 17h6"/>',
"Working Links":'<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',
"Voice Cloner/Fake Video Call":'<rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 10 5-3v10l-5-3z"/>',
"Voice Cloner / Fake Video Call":'<rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 10 5-3v10l-5-3z"/>',
"All Countries Number":'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 6h6M9 18h6"/>',
"All Country Numbers":'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 6h6M9 18h6"/>',
"Streaming & More":'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="m10 8 5 2.5-5 2.5zM8 21h8M12 17v4"/>',
"ESIMS":'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 17h6"/>',
"VPN":'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
"Gmail":'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>',
"Email / Gmail":'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>'
};
function svgIcon(name){const fallback='<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>';return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(iconPaths[name]||fallback)+'</svg>'}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function routeFor(name){
 const key=String(name||"").toLowerCase().replace(/[^a-z0-9]/g,"");
 if(key==="gmail"||key==="email")return "gmail.html";
 if(key==="allsociallogs"||key==="sociallogs")return "sociallogs.html";
 if(key==="allcountriesnumber"||key==="allcountrynumber"||key==="allcountrynumbers"||key==="countriesnumber")return "virtualnumber.html";
 return "dashboard.html?category="+encodeURIComponent(name);
}
async function load(){
 const box=document.getElementById("categoryList");
 const {data,error}=await client.from("service_categories").select("id,name,slug,display_order,is_active").eq("is_active",true).order("display_order",{ascending:true});
 if(error){console.error(error);box.innerHTML='<div class="state">Could not load categories. Please return to the dashboard and try again.</div>';return}
 const rows=(data||[]).filter(c=>c&&c.name).map(c=>({name:c.name,description:"Explore "+c.name+" services and available options.",href:routeFor(c.name)}));
 const have=new Set(rows.map(c=>c.name.toLowerCase().replace(/[^a-z0-9]/g,"")));
 const extra=[{name:"All Country Numbers",description:"Choose a country and get a number for verification",href:"virtualnumber.html"},{name:"All Social Logs",description:"Explore social logs, testing apps, streaming and more",href:"sociallogs.html"}];
 extra.forEach(c=>{const key=c.name.toLowerCase().replace(/[^a-z0-9]/g,"");if(!have.has(key)){rows.push(c);have.add(key)}});
 if(!rows.length){box.innerHTML='<div class="state">No active categories are available right now.</div>';return}
 box.innerHTML=rows.map(c=>'<a class="category-row" href="'+esc(c.href)+'"><span class="category-icon">'+svgIcon(c.name)+'</span><span class="category-copy"><strong class="category-name">'+esc(c.name)+'</strong><small class="category-desc">'+esc(c.description)+'</small></span><span class="arrow" aria-hidden="true">→</span></a>').join("");
}
document.addEventListener("click",e=>{if(e.target.closest("a.category-row"))sessionStorage.setItem("dvOpenedFromCategories","1")});
load();
document.getElementById("categorySearch").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll("#categoryList .category-row").forEach(row=>{row.hidden=!row.textContent.toLowerCase().includes(q);});});
</script>
