<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>All Services - Delight Vendor Logs</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<header>

  <h1>Delight Vendor Logs</h1>

  <button
    type="button"
    onclick="window.location.href='dashboard.html'"
  >
    ←
  </button>

</header>


<main>

  <h2>All Services</h2>

  <div id="services">

    <p>Loading services...</p>

  </div>

</main>


<script>


/* ========================================
   SUPABASE CONNECTION
======================================== */


const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* ========================================
   LOAD ALL SERVICES
======================================== */


async function loadServices() {


  const servicesContainer =
    document.getElementById(
      "services"
    );


  servicesContainer.innerHTML =
    "<p>Loading services...</p>";


  console.log(
    "Loading services from Product table..."
  );


  const {

    data,

    error

  } =

    await supabaseClient

      .from("Product")

      .select("*")

      .order("id", {
        ascending: false
      });



  /* ======================================
     DEBUG
  ====================================== */


  console.log(
    "SERVICES DATA:",
    data
  );


  console.log(
    "SERVICES ERROR:",
    error
  );



  /* ======================================
     DATABASE ERROR
  ====================================== */


  if (error) {


    console.error(
      "Services error:",
      error
    );


    servicesContainer.innerHTML = `

      <div style="
        background:white;
        padding:20px;
        margin:15px 0;
        border-radius:16px;
        text-align:center;
        box-shadow:0 3px 12px rgba(0,0,0,0.08);
      ">

        <h3>
          Unable to load services
        </h3>

        <p>
          ${escapeHTML(
            error.message ||
            "Unknown database error"
          )}
        </p>

      </div>

    `;


    return;

  }



  /* ======================================
     NO SERVICES
  ====================================== */


  if (
    !data ||
    data.length === 0
  ) {


    servicesContainer.innerHTML = `

      <div style="
        background:white;
        padding:20px;
        margin:15px 0;
        border-radius:16px;
        text-align:center;
        box-shadow:0 3px 12px rgba(0,0,0,0.08);
      ">

        <h3>
          No services available yet.
        </h3>

        <p>
          Add a service from the admin dashboard.
        </p>

      </div>

    `;


    return;

  }



  /* ======================================
     CLEAR LOADING
  ====================================== */


  servicesContainer.innerHTML =
    "";



  /* ======================================
     CREATE SERVICE CARDS
  ====================================== */


  data.forEach(
    function(product) {


      const serviceBox =
        document.createElement(
          "div"
        );



      /* ==================================
         CARD STYLE
      ================================== */


      serviceBox.style.background =
        "white";


      serviceBox.style.padding =
        "18px";


      serviceBox.style.margin =
        "16px 0";


      serviceBox.style.borderRadius =
        "16px";


      serviceBox.style.textAlign =
        "left";


      serviceBox.style.boxShadow =
        "0 3px 12px rgba(0,0,0,0.08)";



      /* ==================================
         PRODUCT IMAGE
      ================================== */


      let imageHTML =
        "";


      if (
        product.image_url &&
        String(
          product.image_url
        ).trim() !== ""
      ) {


        imageHTML = `

          <img

            src="${escapeHTML(
              product.image_url
            )}"

            alt="${escapeHTML(
              product.name ||
              "Service"
            )}"

            style="
              width:100%;
              max-height:220px;
              object-fit:cover;
              border-radius:12px;
              margin-bottom:15px;
              display:block;
            "

            onerror="
              this.onerror=null;
              this.style.display='none';
            "

          >

        `;

      }



      /* ==================================
         PRODUCT INFORMATION
      ================================== */


      const productName =
        product.name ||
        "Unnamed Service";


      const productDescription =
        product.description ||
        "No description available.";


      const productPrice =
        Number(
          product.price || 0
        ).toLocaleString(
          "en-NG",
          {
            minimumFractionDigits:0,
            maximumFractionDigits:2
          }
        );


      const productStatus =
        product.status ||
        "Unavailable";



      /* ==================================
         IMPORTANT PRODUCT ID
      ================================== */


      /*
        DO NOT USE Number(product.id)

        We keep the ID exactly as Supabase
        gives it to us.
      */


      const productId =
        String(
          product.id
        );



      console.log(
        "Service:",
        productName,
        "ID:",
        productId
      );



      /* ==================================
         SERVICE CARD
      ================================== */


      serviceBox.innerHTML = `

        ${imageHTML}


        <h3>

          ${escapeHTML(
            productName
          )}

        </h3>


        <p>

          <strong>
            Price:
          </strong>

          ₦${productPrice}

        </p>


        <p>

          ${escapeHTML(
            productDescription
          )}

        </p>


        <p>

          <strong>
            Status:
          </strong>

          ${escapeHTML(
            productStatus
          )}

        </p>


        <button

          type="button"

          onclick="viewProduct(
            '${escapeJS(productId)}'
          )"

        >

          View Service

        </button>

      `;


      servicesContainer.appendChild(
        serviceBox
      );


    }
  );


}



/* ========================================
   VIEW SERVICE
======================================== */


function viewProduct(
  productId
) {


  console.log(
    "Opening service with ID:",
    productId
  );


  /* CHECK ID */

  if (
    !productId ||
    productId === "undefined" ||
    productId === "null"
  ) {


    alert(
      "Product ID is missing."
    );


    return;

  }



  /* ======================================
     OPEN PRODUCTS.HTML
  ====================================== */


  const url =
    "products.html?id=" +
    encodeURIComponent(
      productId
    );


  console.log(
    "Opening:",
    url
  );


  window.location.href =
    url;

}



/* ========================================
   ESCAPE HTML
======================================== */


function escapeHTML(
  value
) {


  return String(
    value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* ========================================
   ESCAPE JAVASCRIPT STRING
======================================== */


function escapeJS(
  value
) {


  return String(
    value
  )

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /"/g,
      '\\"'
    )

    .replace(
      /\r/g,
      "\\r"
    )

    .replace(
      /\n/g,
      "\\n"
    );

}



/* ========================================
   START
======================================== */


loadServices();


</script>


</body>

  </html>
