<head><script>document.documentElement.style.visibility="hidden";</script><script src="auth-guard.js"></script><style>.dve-banner-dots,#dvBannerDots{display:none!important}</style><style id="service-media-style">.service-media-preview{width:100%;background:#080808;border-radius:12px;overflow:hidden;margin-bottom:10px}.service-media-preview img,.service-video-preview{display:block;width:100%;max-height:240px;aspect-ratio:16/9;object-fit:contain;background:#080808}.view-full-media{display:block;width:100%;margin:0 0 12px;padding:9px;border:1px solid #b68c32;border-radius:9px;background:#17130b;color:#e9bd53;font-weight:800;cursor:pointer}</style></head><!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >



  <title>All Services - Delight Vendor Logs</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="icon" type="image/png" href="assets/dv-logo.png"><link rel="apple-touch-icon" href="assets/dv-logo.png"><link rel="stylesheet" href="site-theme.css"></head>


<body>


<header>

  <h1><img src="assets/dv-logo.png" alt="DV logo" style="width:38px;height:38px;object-fit:contain;vertical-align:middle;margin-right:10px">Delight Vendor Logs</h1>

  <button
    type="button"
    onclick="goBackFromServices()"
  >
    ←
  </button>

</header>


<main>

  <h2>All Services</h2>

  <div id="services">

    <p>Loading services...</p>

  </div>

</main>


<script>


/* ========================================
   SUPABASE CONNECTION
======================================== */


const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* ========================================
   LOAD ALL SERVICES
======================================== */


async function loadServices() {


  const servicesContainer =
    document.getElementById(
      "services"
    );


  servicesContainer.innerHTML =
    "<p>Loading services...</p>";


  console.log(
    "Loading services from Product table..."
  );


  const {

    data,

    error

  } =

    await supabaseClient

      .from("Product")

      .select("id,name,price,description,image_url,video_url,status")

      .order("id", {
        ascending: false
      });



  /* ======================================
     DEBUG
  ====================================== */


  console.log(
    "SERVICES DATA:",
    data
  );


  console.log(
    "SERVICES ERROR:",
    error
  );



  /* ======================================
     DATABASE ERROR
  ====================================== */


  if (error) {


    console.error(
      "Services error:",
      error
    );


    servicesContainer.innerHTML = `

      <div style="
        background:white;
        padding:20px;
        margin:15px 0;
        border-radius:16px;
        text-align:center;
        box-shadow:0 3px 12px rgba(0,0,0,0.08);
      ">

        <h3>
          Unable to load services
        </h3>

        <p>
          ${escapeHTML(
            error.message ||
            "Unknown database error"
          )}
        </p>

      </div>

    `;


    return;

  }



  /* ======================================
     NO SERVICES
  ====================================== */


  if (
    !data ||
    data.length === 0
  ) {


    servicesContainer.innerHTML = `

      <div style="
        background:white;
        padding:20px;
        margin:15px 0;
        border-radius:16px;
        text-align:center;
        box-shadow:0 3px 12px rgba(0,0,0,0.08);
      ">

        <h3>
          No services available yet.
        </h3>

        <p>
          Add a service from the admin dashboard.
        </p>

      </div>

    `;


    return;

  }



  /* ======================================
     CLEAR LOADING
  ====================================== */


  servicesContainer.innerHTML =
    "";



  /* ======================================
     CREATE SERVICE CARDS
  ====================================== */


  data.forEach(
    function(product) {


      const serviceBox =
        document.createElement(
          "div"
        );



      /* ==================================
         CARD STYLE
      ================================== */


      serviceBox.style.background =
        "white";


      serviceBox.style.padding =
        "18px";


      serviceBox.style.margin =
        "16px 0";


      serviceBox.style.borderRadius =
        "16px";


      serviceBox.style.textAlign =
        "left";


      serviceBox.style.boxShadow =
        "0 3px 12px rgba(0,0,0,0.08)";



      /* ==================================
         PRODUCT IMAGE
      ================================== */


      let mediaHTML = "";
      const mediaUrl = product.video_url || product.image_url;
      const mediaKind = product.video_url ? "video" : "image";
      if(mediaUrl && String(mediaUrl).trim()){
        const tag = mediaKind === "video"
          ? '<video class="service-video-preview" src="' + escapeHTML(mediaUrl) + '" muted autoplay loop playsinline preload="metadata"></video>'
          : '<img src="' + escapeHTML(mediaUrl) + '" alt="' + escapeHTML(product.name || "Service") + '" loading="lazy">';
        mediaHTML = '<div class="service-media-preview">' + tag + '</div><button type="button" class="view-full-media" data-url="' + escapeHTML(mediaUrl) + '" data-kind="' + mediaKind + '" data-title="' + escapeHTML(product.name || "Service") + '" onclick="viewServiceMedia(this)">View Full</button>';
      }

      /* ==================================
         PRODUCT INFORMATION
      ================================== */


      const productName =
        product.name ||
        "Unnamed Service";


      const productDescription =
        product.description ||
        "No description available.";


      const productPrice =
        Number(
          product.price || 0
        ).toLocaleString(
          "en-NG",
          {
            minimumFractionDigits:0,
            maximumFractionDigits:2
          }
        );


      const productStatus =
        product.status ||
        "Unavailable";



      /* ==================================
         IMPORTANT PRODUCT ID
      ================================== */


      /*
        DO NOT USE Number(product.id)

        We keep the ID exactly as Supabase
        gives it to us.
      */


      const productId =
        String(
          product.id
        );



      console.log(
        "Service:",
        productName,
        "ID:",
        productId
      );



      /* ==================================
         SERVICE CARD
      ================================== */


      serviceBox.innerHTML = `

        ${mediaHTML}


        <h3>

          ${escapeHTML(
            productName
          )}

        </h3>


        <p>

          <strong>
            Price:
          </strong>

          ₦${productPrice}

        </p>


        <p>

          ${escapeHTML(
            productDescription
          )}

        </p>


        <p>

          <strong>
            Status:
          </strong>

          ${escapeHTML(
            productStatus
          )}

        </p>


        <button

          type="button"

          onclick="viewProduct(
            '${escapeJS(productId)}'
          )"

        >

          View Service

        </button>

      `;


      servicesContainer.appendChild(
        serviceBox
      );


    }
  );


}



/* ========================================
   VIEW SERVICE
======================================== */


function viewServiceMedia(button){
  const url=button?.dataset?.url;if(!url)return;
  let viewer=document.getElementById("serviceMediaViewer");
  if(!viewer){
    viewer=document.createElement("div");viewer.id="serviceMediaViewer";
    viewer.style.cssText="position:fixed;inset:0;z-index:9999;background:#000e;display:none;align-items:center;justify-content:center;padding:14px;";
    viewer.innerHTML='<section style="width:min(100%,980px);max-height:94vh;overflow:auto;background:#111;border:1px solid #8b6c2d;border-radius:16px;padding:12px;color:#fff"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><strong></strong><button type="button">Close ✕</button></div><div></div></section>';
    document.body.appendChild(viewer);
    viewer.addEventListener("click",e=>{if(e.target===viewer||e.target.tagName==="BUTTON")closeServiceMedia()});
  }
  viewer.querySelector("strong").textContent=button.dataset.title||"Service media";
  const body=viewer.querySelector("section>div:last-child");body.innerHTML="";
  const video=button.dataset.kind==="video",el=document.createElement(video?"video":"img");el.src=url;
  el.style.cssText="display:block;max-width:100%;max-height:80vh;width:auto;height:auto;margin:auto;object-fit:contain;background:#000";
  if(video){el.controls=true;el.autoplay=true;el.playsInline=true;el.style.width="100%"}else el.alt="Service media";
  body.appendChild(el);viewer.style.display="flex";
}
function closeServiceMedia(){const v=document.getElementById("serviceMediaViewer");if(v){v.style.display="none";v.querySelector("section>div:last-child").innerHTML=""}}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeServiceMedia()});

function viewProduct(
  productId
) {


  console.log(
    "Opening service with ID:",
    productId
  );


  /* CHECK ID */

  if (
    !productId ||
    productId === "undefined" ||
    productId === "null"
  ) {


    alert(
      "Product ID is missing."
    );


    return;

  }



  /* ======================================
     OPEN PRODUCTS.HTML
  ====================================== */


  const url =
    "products.html?id=" +
    encodeURIComponent(
      productId
    );


  console.log(
    "Opening:",
    url
  );


  window.location.href =
    url;

}



/* ========================================
   ESCAPE HTML
======================================== */


function escapeHTML(
  value
) {


  return String(
    value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* ========================================
   ESCAPE JAVASCRIPT STRING
======================================== */


function escapeJS(
  value
) {


  return String(
    value
  )

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /"/g,
      '\\"'
    )

    .replace(
      /\r/g,
      "\\r"
    )

    .replace(
      /\n/g,
      "\\n"
    );

}



function goBackFromServices(){
  if(sessionStorage.getItem("dvOpenedFromCategories")==="1"){
    sessionStorage.removeItem("dvOpenedFromCategories");
    location.href="categories.html";
  }else{
    location.href="dashboard.html";
  }
}

/* ========================================
   START
======================================== */


loadServices();


</script>


<script src="branding.js"></script>
<script src="assets/site-announcement.js" defer></script>
</body>

  </html>
