<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markup Manager — Delight Vendor Logs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    .header {
      background: #111;
      color: #fff;
      padding: 18px 20px;
      font-size: 20px;
      font-weight: 800;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 16px 40px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.07);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9dd;
      border-radius: 9px;
      font-size: 15px;
      background: #fff;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-btn {
      background: #111;
      color: #fff;
      width: 100%;
      font-size: 16px;
    }

    .save-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .cancel-btn {
      background: #ddd;
      color: #111;
      margin-top: 10px;
      width: 100%;
      display: none;
    }

    .status {
      margin-top: 12px;
      padding: 11px;
      border-radius: 8px;
      display: none;
      font-weight: 600;
    }

    .success {
      background: #e7f8ed;
      color: #147a38;
    }

    .error {
      background: #ffe9e9;
      color: #b42318;
    }

    .rule {
      border: 1px solid #e1e4e8;
      border-radius: 11px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .rule-title {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .rule-meta {
      color: #666;
      font-size: 14px;
    }

    .rule-percent {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .edit-btn {
      background: #eee;
    }

    .delete-btn {
      background: #ffe2e2;
      color: #b00000;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .loading {
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .rule {
        flex-direction: column;
        align-items: stretch;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    ⚡ Delight Vendor Logs — Markup Manager
  </div>

  <div class="container">

    <!-- ADD / EDIT -->
    <div class="card">
      <h2 id="formTitle">Add Markup Rule</h2>

      <div class="grid">

        <div class="field">
          <label>Country</label>

          <select id="countrySelect">
            <option value="">Loading countries...</option>
          </select>
        </div>

        <div class="field">
          <label>Service</label>

          <select id="serviceSelect">
            <option value="">Select country first</option>
          </select>
        </div>

      </div>

      <div class="field">
        <label>Markup Percentage</label>

        <input
          id="markupInput"
          type="number"
          min="0"
          step="0.01"
          placeholder="Example: 100"
        />
      </div>

      <button
        class="save-btn"
        id="saveBtn"
        onclick="saveRule()"
      >
        Save Markup
      </button>

      <button
        class="cancel-btn"
        id="cancelBtn"
        onclick="cancelEdit()"
      >
        Cancel Edit
      </button>

      <div id="status" class="status"></div>
    </div>


    <!-- EXISTING RULES -->
    <div class="card">
      <h2>Current Markup Rules</h2>

      <div id="rulesList">
        <div class="loading">
          Loading rules...
        </div>
      </div>
    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const FUNCTION_URL =
  `${SUPABASE_URL}/functions/v1/numpool-api`;

const { createClient } =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


let countries = [];
let services = [];
let rules = [];
let editingId = null;


/* =========================
   AUTH
========================= */

async function checkAdmin() {

  try {

    const {
      data: { session },
      error: sessionError
    } = await supabase.auth.getSession();

    if (sessionError || !session) {

      showAccessDenied(
        "Please login first."
      );

      return false;
    }

    /*
      We still keep the frontend admin check
      for quick protection.

      The backend also performs its own admin
      authorization, so the browser cannot bypass it.
    */

    const {
      data,
      error
    } = await supabase
      .from("admin_users")
      .select("user_id")
      .eq("user_id", session.user.id)
      .maybeSingle();

    if (error || !data) {

      showAccessDenied(
        "You are not authorized to use this page."
      );

      return false;
    }

    return true;

  } catch (error) {

    console.error(error);

    showAccessDenied(
      "Unable to verify administrator access."
    );

    return false;
  }
}


/* =========================
   ACCESS DENIED
========================= */

function showAccessDenied(message) {

  document.body.innerHTML = `
    <div style="
      padding:40px;
      text-align:center;
      font-family:Arial;
    ">
      <h2>Access Denied</h2>
      <p>${escapeHtml(message)}</p>
    </div>
  `;
}


/* =========================
   API
========================= */

async function api(action, payload = {}) {

  const {
    data: { session }
  } = await supabase.auth.getSession();

  if (!session) {
    throw new Error("Your session has expired. Please login again.");
  }

  const response = await fetch(
    FUNCTION_URL,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Authorization":
          `Bearer ${session.access_token}`
      },

      body: JSON.stringify({
        action,
        version: "1.0.0",
        ...payload
      })
    }
  );

  let data = {};

  try {
    data = await response.json();
  } catch {
    throw new Error(
      `Server returned an invalid response (${response.status}).`
    );
  }

  if (!response.ok || data?.success === false) {

    throw new Error(
      data?.error ||
      data?.message ||
      `API request failed (${response.status}).`
    );
  }

  return data;
}


/* =========================
   STATUS MESSAGE
========================= */

function showStatus(
  message,
  type = "success"
) {

  const box =
    document.getElementById("status");

  box.textContent = message;

  box.className =
    `status ${type}`;

  box.style.display =
    "block";

  setTimeout(() => {

    box.style.display =
      "none";

  }, 4000);
}


/* =========================
   LOAD COUNTRIES
========================= */

async function loadCountries() {

  const select =
    document.getElementById(
      "countrySelect"
    );

  select.innerHTML = `
    <option value="">
      Loading countries...
    </option>
  `;

  try {

    const data =
      await api("countries");

    countries =
      Array.isArray(data.countries)
        ? data.countries
        : [];

    select.innerHTML = `
      <option value="">
        Select country
      </option>

      <option value="overall">
        Overall
      </option>
    `;

    countries.forEach(country => {

      if (
        country.id === undefined ||
        country.id === null
      ) {
        return;
      }

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(country.id);

      option.textContent =
        country.name ||
        `Country ${country.id}`;

      select.appendChild(option);
    });

    if (!countries.length) {

      select.innerHTML = `
        <option value="">
          No countries available
        </option>

        <option value="overall">
          Overall
        </option>
      `;
    }

  } catch (error) {

    console.error(
      "loadCountries:",
      error
    );

    select.innerHTML = `
      <option value="">
        Unable to load countries
      </option>
    `;

    showStatus(
      error.message ||
      "Could not load countries.",
      "error"
    );
  }
}


/* =========================
   LOAD SERVICES
========================= */

async function loadServices(
  countryId
) {

  const select =
    document.getElementById(
      "serviceSelect"
    );

  services = [];

  if (!countryId) {

    select.innerHTML = `
      <option value="">
        Select country first
      </option>
    `;

    return;
  }

  select.innerHTML = `
    <option value="">
      Loading services...
    </option>
  `;

  try {

    let requestCountryId;

    /*
      The backend services endpoint needs
      a real country.

      For Overall we use the first available
      country only to obtain the service catalogue.
    */

    if (countryId === "overall") {

      const firstCountry =
        countries.find(
          country =>
            country.id !== undefined &&
            country.id !== null
        );

      if (!firstCountry) {

        select.innerHTML = `
          <option value="">
            No services available
          </option>
        `;

        return;
      }

      requestCountryId =
        Number(firstCountry.id);

    } else {

      requestCountryId =
        Number(countryId);
    }


    const data =
      await api(
        "services",
        {
          country_id:
            requestCountryId
        }
      );


    services =
      Array.isArray(data.services)
        ? data.services
        : [];


    select.innerHTML = `
      <option value="">
        Select service
      </option>

      <option value="overall">
        Overall
      </option>
    `;


    services.forEach(service => {

      const code =
        service.service_code ||
        service.code;

      if (!code) {
        return;
      }

      const option =
        document.createElement(
          "option"
        );

      option.value =
        code;

      option.textContent =
        service.service_name ||
        service.name ||
        code;

      select.appendChild(option);
    });


    if (!services.length) {

      select.innerHTML = `
        <option value="">
          No services available
        </option>

        <option value="overall">
          Overall
        </option>
      `;
    }

  } catch (error) {

    console.error(
      "loadServices:",
      error
    );

    select.innerHTML = `
      <option value="">
        Unable to load services
      </option>
    `;

    showStatus(
      error.message ||
      "Could not load services.",
      "error"
    );
  }
}


/* =========================
   COUNTRY CHANGE
========================= */

document
  .getElementById("countrySelect")
  .addEventListener(
    "change",
    event => {

      loadServices(
        event.target.value
      );

    }
  );


/* =========================
   LOAD MARKUP RULES
========================= */

async function loadRules() {

  const container =
    document.getElementById(
      "rulesList"
    );

  container.innerHTML = `
    <div class="loading">
      Loading rules...
    </div>
  `;

  try {

    /*
      IMPORTANT:

      Rules now come through numpool-api.
      The browser no longer reads the
      markup table directly.
    */

    const data =
      await api("markup_rules");


    rules =
      Array.isArray(data.rules)
        ? data.rules
        : [];


    if (!rules.length) {

      container.innerHTML = `
        <div class="empty">
          No custom markup rules yet.<br>
          The system is currently using
          the default markup.
        </div>
      `;

      return;
    }


    container.innerHTML = "";


    rules.forEach(rule => {

      const countryName =
        getCountryName(
          rule.country_id
        );

      const serviceName =
        getServiceName(
          rule.service_code
        );


      const countryLabel =
        rule.country_id === null
          ? "Overall"
          : countryName;


      const serviceLabel =
        rule.service_code === null
          ? "Overall"
          : serviceName;


      const div =
        document.createElement(
          "div"
        );

      div.className =
        "rule";


      div.innerHTML = `
        <div>
          <div class="rule-title">
            ${escapeHtml(countryLabel)}
            +
            ${escapeHtml(serviceLabel)}
          </div>

          <div class="rule-meta">
            ${
              rule.country_id === null
                ? "All countries"
                : "Specific country"
            }
            ·
            ${
              rule.service_code === null
                ? "All services"
                : "Specific service"
            }
          </div>
        </div>

        <div style="text-align:right">

          <div class="rule-percent">
            ${Number(rule.markup_percent)}%
          </div>

          <div class="actions">

            <button
              class="edit-btn"
              onclick="editRule(${Number(rule.id)})"
            >
              Edit
            </button>

            <button
              class="delete-btn"
              onclick="deleteRule(${Number(rule.id)})"
            >
              Delete
            </button>

          </div>

        </div>
      `;


      container.appendChild(div);
    });


  } catch (error) {

    console.error(
      "loadRules:",
      error
    );

    rules = [];

    container.innerHTML = `
      <div class="empty">
        Unable to load markup rules.<br>
        <small>
          ${escapeHtml(
            error.message ||
            "API request failed."
          )}
        </small>
      </div>
    `;

    showStatus(
      error.message ||
      "Could not load markup rules.",
      "error"
    );
  }
}


/* =========================
   COUNTRY NAME
========================= */

function getCountryName(id) {

  if (
    id === null ||
    id === undefined
  ) {
    return "Overall";
  }

  const country =
    countries.find(
      c =>
        Number(c.id) ===
        Number(id)
    );

  return (
    country?.name ||
    `Country ${id}`
  );
}


/* =========================
   SERVICE NAME
========================= */

function getServiceName(code) {

  if (!code) {
    return "Overall";
  }

  const service =
    services.find(
      s =>
        (s.service_code ||
          s.code) === code
    );

  return (
    service?.service_name ||
    service?.name ||
    code
  );
}


/* =========================
   SAVE RULE
========================= */

async function saveRule() {

  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  const countryValue =
    document.getElementById(
      "countrySelect"
    ).value;


  const serviceValue =
    document.getElementById(
      "serviceSelect"
    ).value;


  const markupValue =
    document.getElementById(
      "markupInput"
    ).value.trim();


  if (!countryValue) {

    showStatus(
      "Please select a country.",
      "error"
    );

    return;
  }


  if (!serviceValue) {

    showStatus(
      "Please select a service.",
      "error"
    );

    return;
  }


  if (
    markupValue === "" ||
    !Number.isFinite(
      Number(markupValue)
    ) ||
    Number(markupValue) < 0
  ) {

    showStatus(
      "Enter a valid markup percentage.",
      "error"
    );

    return;
  }


  const markup =
    Number(markupValue);


  const countryId =
    countryValue === "overall"
      ? null
      : Number(countryValue);


  const serviceCode =
    serviceValue === "overall"
      ? null
      : serviceValue;


  /*
    Only these two rule types are allowed:

    Overall + Overall

    OR

    Specific Country + Specific Service

    No country-only or service-only rules.
  */

  if (
    (countryId === null &&
      serviceCode !== null) ||
    (countryId !== null &&
      serviceCode === null)
  ) {

    showStatus(
      "Select either Overall + Overall, or a specific country + specific service.",
      "error"
    );

    return;
  }


  saveBtn.disabled =
    true;

  saveBtn.textContent =
    editingId !== null
      ? "Updating..."
      : "Saving...";


  try {

    const data =
      await api(
        "save_markup_rule",
        {
          id:
            editingId !== null
              ? editingId
              : null,

          country_id:
            countryId,

          service_code:
            serviceCode,

          markup_percent:
            markup
        }
      );


    showStatus(
      data.message ||
      (
        editingId !== null
          ? "Markup rule updated."
          : "Markup rule saved."
      ),
      "success"
    );


    resetForm();

    await loadRules();


  } catch (error) {

    console.error(
      "saveRule:",
      error
    );

    showStatus(
      error.message ||
      "Could not save markup.",
      "error"
    );


  } finally {

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      editingId !== null
        ? "Update Markup"
        : "Save Markup";
  }
}


/* =========================
   EDIT RULE
========================= */

async function editRule(id) {

  const rule =
    rules.find(
      r =>
        Number(r.id) ===
        Number(id)
    );

  if (!rule) {
    return;
  }


  editingId =
    rule.id;


  const countrySelect =
    document.getElementById(
      "countrySelect"
    );


  const serviceSelect =
    document.getElementById(
      "serviceSelect"
    );


  countrySelect.value =
    rule.country_id === null
      ? "overall"
      : String(
          rule.country_id
        );


  await loadServices(
    countrySelect.value
  );


  serviceSelect.value =
    rule.service_code === null
      ? "overall"
      : rule.service_code;


  document.getElementById(
    "markupInput"
  ).value =
    rule.markup_percent;


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Markup Rule";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "Update Markup";


  document.getElementById(
    "cancelBtn"
  ).style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

  resetForm();
}


/* =========================
   RESET FORM
========================= */

function resetForm() {

  editingId =
    null;


  document.getElementById(
    "countrySelect"
  ).value =
    "";


  document.getElementById(
    "serviceSelect"
  ).innerHTML =
    `
      <option value="">
        Select country first
      </option>
    `;


  document.getElementById(
    "markupInput"
  ).value =
    "";


  document.getElementById(
    "formTitle"
  ).textContent =
    "Add Markup Rule";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "Save Markup";


  document.getElementById(
    "cancelBtn"
  ).style.display =
    "none";
}


/* =========================
   DELETE RULE
========================= */

async function deleteRule(id) {

  const rule =
    rules.find(
      r =>
        Number(r.id) ===
        Number(id)
    );

  if (!rule) {
    return;
  }


  const countryName =
    getCountryName(
      rule.country_id
    );


  const serviceName =
    getServiceName(
      rule.service_code
    );


  const confirmed =
    confirm(
      `Delete markup rule:\n\n` +
      `${countryName} + ${serviceName}\n` +
      `${rule.markup_percent}%`
    );


  if (!confirmed) {
    return;
  }


  try {

    await api(
      "delete_markup_rule",
      {
        id:
          Number(id)
      }
    );


    showStatus(
      "Markup rule deleted.",
      "success"
    );


    if (
      editingId !== null &&
      Number(editingId) ===
      Number(id)
    ) {
      resetForm();
    }


    await loadRules();


  } catch (error) {

    console.error(
      "deleteRule:",
      error
    );

    showStatus(
      error.message ||
      "Could not delete rule.",
      "error"
    );
  }
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================
   START
========================= */

(async function init() {

  const isAdmin =
    await checkAdmin();


  if (!isAdmin) {
    return;
  }


  /*
    Load both independently.

    So if one endpoint fails,
    the other can still work.
  */

  await Promise.allSettled([
    loadCountries(),
    loadRules()
  ]);

})();

</script>

</body>
</html>
