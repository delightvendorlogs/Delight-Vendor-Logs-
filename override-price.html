/* =========================================================
   ACCESS DENIED
========================================================= */

function showAccessDenied(message) {

  document.body.innerHTML = `
    <div class="access-box">

      <h2>
        Access Denied
      </h2>

      <p>
        ${escapeHtml(message)}
      </p>

    </div>
  `;
}


/* =========================================================
   AUTH CHECK
========================================================= */

async function checkAdmin() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(
        "Supabase session error:",
        error
      );

      showAccessDenied(
        "Unable to verify login session: " +
        error.message
      );

      return false;
    }


    const session =
      data?.session;


    if (!session) {

      showAccessDenied(
        "Please login first."
      );

      return false;
    }


    return true;


  } catch (error) {

    console.error(
      "checkAdmin:",
      error
    );

    showAccessDenied(
      "Unable to verify login session: " +
      (
        error?.message ||
        "Unknown error"
      )
    );

    return false;
  }
}


/* =========================================================
   API
========================================================= */

async function api(
  action,
  payload = {}
) {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if (error) {

    throw new Error(
      error.message ||
      "Unable to get login session."
    );
  }


  const session =
    data?.session;


  if (!session) {

    throw new Error(
      "Your login session has expired. Please login again."
    );
  }


  const response =
    await fetch(
      FUNCTION_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          "Authorization":
            `Bearer ${session.access_token}`
        },

        body:
          JSON.stringify({
            action,
            version: "1.0.0",
            ...payload
          })
      }
    );


  let result;


  try {

    result =
      await response.json();

  } catch {

    throw new Error(
      `Server returned an invalid response (${response.status}).`
    );
  }


  if (!response.ok) {

    throw new Error(
      result?.error ||
      result?.message ||
      `API request failed (${response.status}).`
    );
  }


  if (
    result &&
    result.success === false
  ) {

    throw new Error(
      result.error ||
      result.message ||
      "API request failed."
    );
  }


  return result;
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type = "success"
) {

  const box =
    document.getElementById(
      "status"

  box.textContent =

  box.className =
    `status ${type}`;


  box.style.display =
    "block";


  setTimeout(
    () => {

      box.style.display =
        "none";

    },
    4000
  );
}


/* =========================================================
   SEARCH DROPDOWN HELPERS
========================================================= */

function normalizeSearch(
  value
) {

  return String(
    value ?? ""
  )
    .toLowerCase()
    .trim();
}


/*
  Country aliases.

  UK / GB / Great Britain
  all help find United Kingdom.

  US / USA / America
  all help find United States.
*/

function getCountrySearchText(
  country
) {

  const name =
    String(
      country?.name || ""
    );

  const normalized =
    normalizeSearch(
      name
    );


  const aliases = [];


  if (
    normalized ===
      "united kingdom" ||
    normalized.includes(
      "united kingdom"
    )
  ) {

    aliases.push(
      "uk",
      "gb",
      "great britain"
    );
  }


  if (
    normalized ===
      "united states" ||
    normalized.includes(
      "united states"
    )
  ) {

    aliases.push(
      "us",
      "usa",
      "america"
    );
  }


  return [
    name,
    ...aliases,
    country?.id
  ]
    .join(" ")
    .toLowerCase();
}


/* =========================================================
   BUILD COUNTRY DROPDOWN
========================================================= */

function buildCountryDropdown() {

  countryDropdownItems = [];


  /*
    Overall option
  */

  countryDropdownItems.push({
    value: "overall",
    label: "Overall",
    searchText: "overall all countries"
  });


  countries.forEach(
    country => {

      if (
        country.id === undefined ||
        country.id === null
      ) {
        return;
      }


      const label =
        country.name ||
        `Country ${country.id}`;


      countryDropdownItems.push({
        value:
          String(country.id),

        label,

        searchText:
          getCountrySearchText(
            country
          )
      });

    }
  );


  renderCountryOptions(
    ""
  );
}


/* =========================================================
   RENDER COUNTRY OPTIONS
========================================================= */

function renderCountryOptions(
  searchTerm = ""
) {

  const container =
    document.getElementById(
      "countryOptions"
    );


  const search =
    normalizeSearch(
      searchTerm
    );


  const filtered =
    countryDropdownItems.filter(
      item =>
        !search ||
        item.searchText.includes(
          search
        )
    );


  container.innerHTML =
    "";


  if (!filtered.length) {

    container.innerHTML = `
      <div class="search-option disabled">
        No country found
      </div>
    `;

    return;
  }


  filtered.forEach(
    item => {

      const option =
        document.createElement(
          "div"
        );


      option.className =
        "search-option";


      const currentValue =
        document.getElementById(
          "countrySelect"
        ).value;


      if (
        currentValue ===
        item.value
      ) {

        option.classList.add(
          "selected"
        );
      }


      option.textContent =
        item.label;


      option.addEventListener(
        "click",
        () => {

          selectCountry(
            item.value
          );

        }
      );


      container.appendChild(
        option
      );

    }
  );
}


/* =========================================================
   SELECT COUNTRY
========================================================= */

function selectCountry(
  value
) {

  const select =
    document.getElementById(
      "countrySelect"
    );


  select.value =
    value;


  const item =
    countryDropdownItems.find(
      x =>
        x.value ===
        value
    );


  document.getElementById(
    "countrySearchButton"
  ).textContent =
    item?.label ||
    "Select country";


  document.getElementById(
    "countrySearchInput"
  ).value =
    "";


  closeDropdown(
    "countrySearchSelect"
  );


  renderCountryOptions(
    ""
  );


  /*
    Keep the original change
    event behaviour.
  */

  select.dispatchEvent(
    new Event(
      "change",
      {
        bubbles: true
      }
    )
  );
}


/* =========================================================
   BUILD SERVICE DROPDOWN
========================================================= */

function buildServiceDropdown() {

  serviceDropdownItems = [];


  serviceDropdownItems.push({

    label: "Overall",
    searchText: "overall all services"
  });


  services.forEach(

/* =========================================================
   OPEN / CLOSE DROPDOWN
========================================================= */

function openDropdown(
  id
) {

  const dropdown =
    document.getElementById(
      id
    );


  /*
    Close the other dropdown first.
  */

  document
    .querySelectorAll(
      ".search-select.open"
    )
    .forEach(
      element => {

        if (
          element.id !==
          id
        ) {

          element.classList.remove(
            "open"
          );
        }

      }
    );


  dropdown.classList.add(
    "open"
  );


  const input =
    dropdown.querySelector(
      ".search-select-search"
    );


  if (input) {

    setTimeout(
      () => {

        input.focus();

      },
      50
    );
  }
}


function closeDropdown(
  id
) {

  const dropdown =
    document.getElementById(
      id
    );


  if (dropdown) {

    dropdown.classList.remove(
      "open"
    );
  }
}

   DROPDOWN EVENT LISTENERS
========================================================= */

      const dropdown =

        closeDropdown(

      } else {

        openDropdown(
          "countrySearchSelect"
        );
      }

    }
  );


document
  .getElementById(
    "serviceSearchButton"
  )

document

  .getElementById(

        event.target.value

    }

/*
  Close dropdown when clicking
  anywhere outside it.
*/

document.addEventListener(
  "click",
  event => {

    if (
      !event.target.closest(
        ".search-select"
      )
    ) {

      document
        .querySelectorAll(
          ".search-select.open"
        )
        .forEach(
          dropdown => {

            dropdown.classList.remove(
              "open"
            );

          }
        );
    }

  }
);


/* =========================================================
   LOAD COUNTRIES
========================================================= */

async function loadCountries() {

  const select =
    document.getElementById(
      "countrySelect"
    );


  select.innerHTML = `
    <option value="">
      Loading countries...
    </option>
  `;


  document.getElementById(
    "countrySearchButton"
  ).textContent =
    "Loading countries...";


  try {

    const data =
      await api(
        "countries"
      );


    countries =
      Array.isArray(
        data?.countries
      )
        ? data.countries
        : [];


    select.innerHTML = `
      <option value="">
        Select country
      </option>

      <option value="overall">
        Overall
      </option>
    `;


    countries.forEach(
      country => {

        if (
          country.id === undefined ||
          country.id === null
        ) {
          return;
        }


        const option =
          document.createElement(
            "option"
          );


        option.value =
          String(
            country.id
          );


        option.textContent =
          country.name ||
          `Country ${country.id}`;


        select.appendChild(
          option
        );
      }
    );


    if (!countries.length) {

      select.innerHTML = `
        <option value="">
          No countries available
        </option>

        <option value="overall">
          Overall
        </option>
      `;
    }


    buildCountryDropdown();


    syncCountryDropdown();


  } catch (error) {

    console.error(
      "loadCountries:",
      error
    );


    select.innerHTML = `
      <option value="">
        Unable to load countries
      </option>
    `;


    document.getElementById(
      "countrySearchButton"
    ).textContent =
      "Unable to load countries";


    document.getElementById(
      "countryOptions"
    ).innerHTML = `
      <div class="search-option disabled">
        Unable to load countries
      </div>
    `;


    showStatus(
      error.message ||
      "Could not load countries.",
      "error"
    );
  }
}


/* =========================================================
   LOAD SERVICES
========================================================= */

async function loadServices(
  countryId
) {

  const select =
    document.getElementById(
      "serviceSelect"
    );


  services = [];


  serviceDropdownItems = [];


  document.getElementById(
    "serviceOptions"
  ).innerHTML =
    "";


  if (!countryId) {

    select.innerHTML = `
      <option value="">
        Select country first
      </option>
    `;


    document.getElementById(
      "serviceSearchButton"
    ).textContent =
      "Select country first";


    return;
  }


  select.innerHTML = `
    <option value="">
      Loading services...
    </option>
  `;


  document.getElementById(
    "serviceSearchButton"
  ).textContent =
    "Loading services...";


  try {

    let requestCountryId;


    /*
      For Overall we use the first
      available country to obtain
      the service catalogue.
    */

    if (
      countryId === "overall"
    ) {

      const firstCountry =
        countries.find(
          country =>
            country.id !== undefined &&
            country.id !== null
        );


      if (!firstCountry) {

        select.innerHTML = `
          <option value="">
            No services available
          </option>

          <option value="overall">
            Overall
          </option>
        `;


        buildServiceDropdown();


        document.getElementById(
          "serviceSearchButton"
        ).textContent =
          "Overall";


        return;
      }


      requestCountryId =
        Number(
          firstCountry.id
        );


    } else {

      requestCountryId =
        Number(
          countryId
        );
    }


    const data =
      await api(
        "services",
        {
          country_id:
            requestCountryId
        }
      );


    services =
      Array.isArray(
        data?.services
      )
        ? data.services
        : [];


    select.innerHTML = `
      <option value="">
        Select service
      </option>

      <option value="overall">
        Overall
      </option>
    `;


    services.forEach(
      service => {

        const code =
          service.service_code ||
          service.code;


        if (!code) {
          return;
        }


        const option =
          document.createElement(
            "option"
          );


        option.value =
          code;


        option.textContent =
          service.service_name ||
          service.name ||
          code;


        select.appendChild(
          option
        );
      }
    );


    if (!services.length) {

      select.innerHTML = `
        <option value="">
          No services available
        </option>

        <option value="overall">
          Overall
        </option>
      `;
    }


    buildServiceDropdown();


    syncServiceDropdown();


  } catch (error) {

    console.error(
      "loadServices:",
      error
    );


    select.innerHTML = `
      <option value="">
        Unable to load services
      </option>
    `;


    document.getElementById(
      "serviceSearchButton"
    ).textContent =
      "Unable to load services";


    document.getElementById(
      "serviceOptions"
    ).innerHTML = `
      <div class="search-option disabled">
        Unable to load services
      </div>
    `;


    showStatus(
      error.message ||
      "Could not load services.",
      "error"
    );
  }
}


/* =========================================================
   COUNTRY CHANGE
========================================================= */

document
  .getElementById(
    "countrySelect"
  )
  .addEventListener(
    "change",
    event => {

      loadServices(
        event.target.value
      );

    }
  );


/* =========================================================
   LOAD MARKUP RULES
========================================================= */

async function loadRules() {

  const container =
    document.getElementById(
      "rulesList"
    );


  container.innerHTML = `
    <div class="loading">
      Loading rules...
    </div>
  `;


  try {

    const data =
      await api(
        "markup_rules"
      );


    rules =
      Array.isArray(
        data?.rules
      )
        ? data.rules
        : [];


    if (!rules.length) {

      container.innerHTML = `
        <div class="empty">

          No custom markup rules yet.

          <br>

          The system is currently using
          the default markup.

        </div>
      `;

      return;
    }


    container.innerHTML =
      "";


    rules.forEach(
      rule => {

        const countryName =
          getCountryName(
            rule.country_id
          );


        const serviceName =
          getServiceName(
            rule.service_code
          );


        const countryLabel =
          rule.country_id === null
            ? "Overall"
            : countryName;


        const serviceLabel =
          rule.service_code === null
            ? "Overall"
            : serviceName;


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "rule";


        div.innerHTML = `

          <div>

            <div class="rule-title">

              ${escapeHtml(
                countryLabel
              )}

              +

              ${escapeHtml(
                serviceLabel
              )}

            </div>


            <div class="rule-meta">

              ${
                rule.country_id === null
                  ? "All countries"
                  : "Specific country"
              }

              ·

              ${
                rule.service_code === null
                  ? "All services"
                  : "Specific service"
              }

            </div>

          </div>


          <div style="text-align:right">

            <div class="rule-percent">

              ${Number(
                rule.markup_percent
              )}%

            </div>


            <div class="actions">

              <button
                class="edit-btn"
                onclick="editRule(
                  ${Number(rule.id)}
                )"
              >
                Edit
              </button>


              <button
                class="delete-btn"
                onclick="deleteRule(
                  ${Number(rule.id)}
                )"
              >
                Delete
              </button>

            </div>

          </div>

        `;


        container.appendChild(
          div
        );
      }
    );


  } catch (error) {

    console.error(
      "loadRules:",
      error
    );


    rules = [];


    container.innerHTML = `

      <div class="empty">

        Unable to load markup rules.

        <br>

        <small>
          ${escapeHtml(
            error.message ||
            "API request failed."
          )}
        </small>

      </div>

    `;


    showStatus(
      error.message ||
      "Could not load markup rules.",
      "error"
    );
  }
}


/* =========================================================
   COUNTRY NAME
========================================================= */

function getCountryName(
  id
) {

  if (
    id === null ||
    id === undefined
  ) {
    return "Overall";
  }


  const country =
    countries.find(
      c =>
        Number(c.id) ===
        Number(id)
    );


  return (
    country?.name ||
    `Country ${id}`
  );
}


/* =========================================================
   SERVICE NAME
========================================================= */

function getServiceName(
  code
) {

  if (!code) {
    return "Overall";
  }


  const service =
    services.find(
      s =>
        (
          s.service_code ||
          s.code
        ) === code
    );


  return (
    service?.service_name ||
    service?.name ||
    code
  );
}


/* =========================================================
   SAVE RULE
========================================================= */

async function saveRule() {

  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  const countryValue =
    document.getElementById(
      "countrySelect"
    ).value;


  const serviceValue =
    document.getElementById(
      "serviceSelect"
    ).value;


  const markupValue =
    document.getElementById(
      "markupInput"
    ).value.trim();


  if (!countryValue) {

    showStatus(
      "Please select a country.",
      "error"
    );

    return;
  }


  if (!serviceValue) {

    showStatus(
      "Please select a service.",
      "error"
    );

    return;
  }


  if (
    markupValue === "" ||
    !Number.isFinite(
      Number(markupValue)
    ) ||
    Number(markupValue) < 0
  ) {

    showStatus(
      "Enter a valid markup percentage.",
      "error"
    );

    return;
  }


  const markup =
    Number(
      markupValue
    );


  const countryId =
    countryValue === "overall"
      ? null
      : Number(
          countryValue
        );


  const serviceCode =
    serviceValue === "overall"
      ? null
      : serviceValue;


  /*
    Allowed combinations:

    Overall + Overall

    OR

    Specific Country +
    Specific Service
  */

  if (
    (
      countryId === null &&
      serviceCode !== null
    ) ||
    (
      countryId !== null &&
      serviceCode === null
    )
  ) {

    showStatus(
      "Select either Overall + Overall, or a specific country + specific service.",
      "error"
    );

    return;
  }


  saveBtn.disabled =
    true;


  saveBtn.textContent =
    editingId !== null
      ? "Updating..."
      : "Saving...";


  try {

    const data =
      await api(
        "save_markup_rule",
        {
          id:
            editingId !== null
              ? Number(editingId)
              : null,

          country_id:
            countryId,

          service_code:
            serviceCode,

          markup_percent:
            markup
        }
      );


    showStatus(
      data?.message ||
      (
        editingId !== null
          ? "Markup rule updated."
          : "Markup rule saved."
      ),
      "success"
    );


    resetForm();


    await loadRules();


  } catch (error) {

    console.error(
      "saveRule:",
      error
    );


    showStatus(
      error.message ||
      "Could not save markup.",
      "error"
    );


  } finally {

    saveBtn.disabled =
      false;


    saveBtn.textContent =
      "Save Markup";
  }
}


/* =========================================================
   EDIT RULE
========================================================= */

async function editRule(
  id
) {

  const rule =
    rules.find(
      r =>
        Number(r.id) ===
        Number(id)
    );


  if (!rule) {
    return;
  }


  editingId =
    Number(rule.id);


  const countrySelect =
    document.getElementById(
      "countrySelect"
    );


  const serviceSelect =
    document.getElementById(
      "serviceSelect"
    );


  countrySelect.value =
    rule.country_id === null
      ? "overall"
      : String(
          rule.country_id
        );


  syncCountryDropdown();


  await loadServices(
    countrySelect.value
  );


  serviceSelect.value =
    rule.service_code === null
      ? "overall"
      : rule.service_code;


  syncServiceDropdown();


  document.getElementById(
    "markupInput"
  ).value =
    rule.markup_percent;


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Markup Rule";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "Update Markup";


  document.getElementById(
    "cancelBtn"
  ).style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================================
   CANCEL EDIT
========================================================= */

function cancelEdit() {

  resetForm();
}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm() {

  editingId =
    null;


  document.getElementById(
    "countrySelect"
  ).value =
    "";


  document.getElementById(
    "countrySearchButton"
  ).textContent =
    "Select country";


  document.getElementById(
    "countrySearchInput"
  ).value =
    "";


  renderCountryOptions(
    ""
  );


  document.getElementById(
    "serviceSelect"
  ).innerHTML = `

    <option value="">
      Select country first
    </option>

  `;


  serviceDropdownItems = [];


  document.getElementById(
    "serviceSearchButton"
  ).textContent =
    "Select country first";


  document.getElementById(
    "serviceSearchInput"
  ).value =
    "";


  document.getElementById(
    "serviceOptions"
  ).innerHTML =
    "";


  document.getElementById(
    "markupInput"
  ).value =
    "";


  document.getElementById(
    "formTitle"
  ).textContent =
    "Add Markup Rule";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "Save Markup";


  document.getElementById(
    "cancelBtn"
  ).style.display =
    "none";


  closeDropdown(
    "countrySearchSelect"
  );


  closeDropdown(
    "serviceSearchSelect"
  );
}


/* =========================================================
   DELETE RULE
========================================================= */

async function deleteRule(
  id
) {

  const rule =
    rules.find(
      r =>
        Number(r.id) ===
        Number(id)
    );


  if (!rule) {
    return;
  }


  const countryName =
    getCountryName(
      rule.country_id
    );


  const serviceName =
    getServiceName(
      rule.service_code
    );


  const confirmed =
    confirm(
      `Delete markup rule:\n\n` +
      `${countryName} + ${serviceName}\n` +
      `${rule.markup_percent}%`
    );


  if (!confirmed) {
    return;
  }


  try {

    await api(
      "delete_markup_rule",
      {
        id:
          Number(id)
      }
    );


    showStatus(
      "Markup rule deleted.",
      "success"
    );


    if (
      editingId !== null &&
      Number(editingId) ===
      Number(id)
    ) {

      resetForm();
    }


    await loadRules();


  } catch (error) {

    console.error(
      "deleteRule:",
      error
    );


    showStatus(
      error.message ||
      "Could not delete rule.",
      "error"
    );
  }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================================================
   START
========================================================= */

(async function init() {

  const isLoggedIn =
    await checkAdmin();


  if (!isLoggedIn) {
    return;
  }


  await Promise.allSettled([
    loadCountries(),
    loadRules()
  ]);

})();
