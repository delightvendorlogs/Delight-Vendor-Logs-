<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Markup Manager — Delight Vendor Logs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    .header {
      background: #111;
      color: #fff;
      padding: 18px 20px;
      font-size: 20px;
      font-weight: 800;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 16px 40px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.07);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    /* =====================================================
       PROVIDER TABS
    ===================================================== */

    .provider-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #eee;
      padding: 6px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .provider-tab {
      border: 0;
      border-radius: 9px;
      padding: 13px 10px;
      background: transparent;
      color: #555;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .provider-tab.active {
      background: #111;
      color: #fff;
    }

    .provider-label {
      display: inline-block;
      margin-bottom: 15px;
      padding: 7px 11px;
      border-radius: 7px;
      background: #f0f0f0;
      font-size: 13px;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9dd;
      border-radius: 9px;
      font-size: 15px;
      background: #fff;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .save-btn {
      background: #111;
      color: #fff;
      width: 100%;
      font-size: 16px;
    }

    .cancel-btn {
      background: #ddd;
      color: #111;
      margin-top: 10px;
      width: 100%;
      display: none;
    }

    .status {
      margin-top: 12px;
      padding: 11px;
      border-radius: 8px;
      display: none;
      font-weight: 600;
    }

    .success {
      background: #e7f8ed;
      color: #147a38;
    }

    .error {
      background: #ffe9e9;
      color: #b42318;
    }

    .rule {
      border: 1px solid #e1e4e8;
      border-radius: 11px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .rule-title {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .rule-meta {
      color: #666;
      font-size: 14px;
    }

    .rule-percent {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .edit-btn {
      background: #eee;
    }

    .delete-btn {
      background: #ffe2e2;
      color: #b00000;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .loading {
      color: #777;
      font-size: 14px;
      padding: 10px 0;
    }

    .access-box {
      padding: 40px;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .access-box h2 {
      margin-bottom: 10px;
    }

    .access-box p {
      color: #666;
    }

    /* =====================================================
       SEARCHABLE DROPDOWN
    ===================================================== */

    .search-select {
      position: relative;
      width: 100%;
    }

    .search-select-button {
      width: 100%;
      min-height: 47px;
      padding: 13px 42px 13px 13px;
      border: 1px solid #d5d9dd;
      border-radius: 9px;
      background: #fff;
      color: #111;
      text-align: left;
      font-size: 15px;
      font-weight: 400;
      position: relative;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-select-button::after {
      content: "▼";
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: #666;
      pointer-events: none;
    }

    .search-select.open .search-select-button {
      border-color: #111;
    }

    .search-select-menu {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 5px);
      background: #fff;
      border: 1px solid #d5d9dd;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,.12);
      z-index: 1000;
      overflow: hidden;
    }

    .search-select.open .search-select-menu {
      display: block;
    }

    .search-select-search {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #e1e4e8;
      border-radius: 0;
      padding: 13px;
      outline: none;
      font-size: 15px;
    }

    .search-select-options {
      max-height: 250px;
      overflow-y: auto;
    }

    .search-option {
      padding: 12px 13px;
      cursor: pointer;
      font-size: 15px;
    }

    .search-option:hover {
      background: #f1f3f5;
    }

    .search-option.selected {
      background: #eee;
      font-weight: 700;
    }

    .search-option.disabled {
      color: #777;
      cursor: default;
    }

    .search-option.disabled:hover {
      background: #fff;
    }

    .search-hidden-select {
      display: none !important;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .rule {
        flex-direction: column;
        align-items: stretch;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<div class="header">
  ⚡ Delight Vendor Logs — Markup Manager
</div>

<div class="container">

  <!-- =====================================================
       PROVIDER SWITCH
  ====================================================== -->

  <div class="card">

    <div class="provider-tabs">

      <button
        id="smsbowerTab"
        class="provider-tab active"
        type="button"
        onclick="switchProvider('smsbower')"
      >
        SMSBower
      </button>

      <button
        id="fivesimTab"
        class="provider-tab"
        type="button"
        onclick="switchProvider('fivesim')"
      >
        5SIM
      </button>

    </div>

    <div class="provider-label" id="providerLabel">
      SMSBower Markup
    </div>

    <!-- ===================================================
         ADD / EDIT
    ==================================================== -->

    <h2 id="formTitle">
      Add Markup Rule
    </h2>

    <div class="grid">

      <!-- COUNTRY -->

      <div class="field">

        <label>
          Country
        </label>

        <select
          id="countrySelect"
          class="search-hidden-select"
        >
          <option value="">
            Loading countries...
          </option>
        </select>

        <div
          class="search-select"
          id="countrySearchSelect"
        >

          <button
            type="button"
            class="search-select-button"
            id="countrySearchButton"
          >
            Loading countries...
          </button>

          <div class="search-select-menu">

            <input
              type="text"
              class="search-select-search"
              id="countrySearchInput"
              placeholder="Search country..."
              autocomplete="off"
            />

            <div
              class="search-select-options"
              id="countryOptions"
            ></div>

          </div>

        </div>

      </div>


      <!-- SERVICE -->

      <div class="field">

        <label>
          Service
        </label>

        <select
          id="serviceSelect"
          class="search-hidden-select"
        >
          <option value="">
            Select country first
          </option>
        </select>

        <div
          class="search-select"
          id="serviceSearchSelect"
        >

          <button
            type="button"
            class="search-select-button"
            id="serviceSearchButton"
          >
            Select country first
          </button>

          <div class="search-select-menu">

            <input
              type="text"
              class="search-select-search"
              id="serviceSearchInput"
              placeholder="Search service..."
              autocomplete="off"
            />

            <div
              class="search-select-options"
              id="serviceOptions"
            ></div>

          </div>

        </div>

      </div>

    </div>


    <div class="field">

      <label>
        Markup Percentage
      </label>

      <input
        id="markupInput"
        type="number"
        min="0"
        step="0.01"
        placeholder="Example: 100"
      />

    </div>


    <button
      class="save-btn"
      id="saveBtn"
      onclick="saveRule()"
    >
      Save Markup
    </button>


    <button
      class="cancel-btn"
      id="cancelBtn"
      onclick="cancelEdit()"
    >
      Cancel Edit
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>


  <!-- =====================================================
       EXISTING RULES
  ====================================================== -->

  <div class="card">

    <h2 id="rulesTitle">
      SMSBower Markup Rules
    </h2>

    <div id="rulesList">

      <div class="loading">
        Loading rules...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

/*
  Existing SMSBower / NumPool function.
*/
const SMSBOWER_FUNCTION_URL =
  `${SUPABASE_URL}/functions/v1/numpool-api`;

/*
  Separate 5SIM function.
*/
const FIVESIM_FUNCTION_URL =
  `${SUPABASE_URL}/functions/v1/fivesim-api`;

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   CURRENT PROVIDER
========================================================= */

let currentProvider = "smsbower";


/* =========================================================
   DATA
========================================================= */

let countries = [];
let services = [];
let rules = [];

let editingId = null;

let countryDropdownItems = [];
let serviceDropdownItems = [];


/* =========================================================
   PROVIDER SWITCH
========================================================= */

async function switchProvider(provider) {

  if (
    provider !== "smsbower" &&
    provider !== "fivesim"
  ) {
    return;
  }

  /*
    Cancel any edit when changing provider.
    This prevents an SMSBower rule from accidentally
    being edited while 5SIM is selected.
  */
  resetForm();

  currentProvider = provider;

  document
    .getElementById("smsbowerTab")
    .classList.toggle(
      "active",
      provider === "smsbower"
    );

  document
    .getElementById("fivesimTab")
    .classList.toggle(
      "active",
      provider === "fivesim"
    );

  document
    .getElementById("providerLabel")
    .textContent =
      provider === "smsbower"
        ? "SMSBower Markup"
        : "5SIM Markup";

  document
    .getElementById("rulesTitle")
    .textContent =
      provider === "smsbower"
        ? "SMSBower Markup Rules"
        : "5SIM Markup Rules";

  /*
    Clear provider-specific data before loading
    the new provider.
  */

  countries = [];
  services = [];
  rules = [];

  countryDropdownItems = [];
  serviceDropdownItems = [];

  document
    .getElementById("rulesList")
    .innerHTML = `
      <div class="loading">
        Loading ${provider === "smsbower" ? "SMSBower" : "5SIM"} rules...
      </div>
    `;

  await loadCountries();

  await loadRules();
}


/* =========================================================
   ACCESS DENIED
========================================================= */

function showAccessDenied(message) {

  document.body.innerHTML = `
    <div class="access-box">

      <h2>
        Access Denied
      </h2>

      <p>
        ${escapeHtml(message)}
      </p>

    </div>
  `;
}


/* =========================================================
   AUTH CHECK
========================================================= */

async function checkAdmin() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if (error) {

      console.error(
        "Supabase session error:",
        error
      );

      showAccessDenied(
        "Unable to verify login session: " +
        error.message
      );

      return false;
    }

    const session =
      data?.session;

    if (!session) {

      showAccessDenied(
        "Please login first."
      );

      return false;
    }

    return true;

  } catch (error) {

    console.error(
      "checkAdmin:",
      error
    );

    showAccessDenied(
      "Unable to verify login session: " +
      (
        error?.message ||
        "Unknown error"
      )
    );

    return false;
  }
}


/* =========================================================
   PROVIDER API
========================================================= */

async function api(
  action,
  payload = {}
) {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();

  if (error) {

    throw new Error(
      error.message ||
      "Unable to get login session."
    );
  }

  const session =
    data?.session;

  if (!session) {

    throw new Error(
      "Your login session has expired. Please login again."
    );
  }

  const functionUrl =
    currentProvider === "smsbower"
      ? SMSBOWER_FUNCTION_URL
      : FIVESIM_FUNCTION_URL;

  /*
    SMSBower keeps its existing action names.
  */

  let finalAction = action;

  if (
    currentProvider === "fivesim"
  ) {

    /*
      Convert our common UI actions to the
      fivesim-api actions.
    */

    if (action === "markup_rules") {
      finalAction = "markup";
    }

    if (action === "save_markup_rule") {
      finalAction = "markup";
    }

    if (action === "delete_markup_rule") {
      finalAction = "markup";
    }
  }

  const body = {
    action: finalAction,
    version: "1.0.0",
    ...payload
  };

  /*
    5SIM markup endpoint expects its own
    operation field.
  */

  if (
    currentProvider === "fivesim" &&
    action === "markup_rules"
  ) {
    body.operation = "list";
  }

  if (
    currentProvider === "fivesim" &&
    action === "save_markup_rule"
  ) {
    body.operation = "upsert";
  }

  if (
    currentProvider === "fivesim" &&
    action === "delete_markup_rule"
  ) {
    body.operation = "delete";
  }

  const response =
    await fetch(
      functionUrl,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          "Authorization":
            `Bearer ${session.access_token}`
        },

        body:
          JSON.stringify(body)
      }
    );

  let result;

  try {

    result =
      await response.json();

  } catch {

    throw new Error(
      `Server returned an invalid response (${response.status}).`
    );
  }

  if (!response.ok) {

    throw new Error(
      result?.error ||
      result?.message ||
      `API request failed (${response.status}).`
    );
  }

  if (
    result &&
    result.success === false
  ) {

    throw new Error(
      result.error ||
      result.message ||
      "API request failed."
    );
  }

  return result;
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type = "success"
) {

  const box =
    document.getElementById(
      "status"
    );

  box.textContent =
    message;

  box.className =
    `status ${type}`;

  box.style.display =
    "block";

  setTimeout(
    () => {

      box.style.display =
        "none";

    },
    4000
  );
}


/* =========================================================
   SEARCH HELPERS
========================================================= */

function normalizeSearch(value) {

  return String(
    value ?? ""
  )
    .toLowerCase()
    .trim();
}


/* =========================================================
   COUNTRY NAME / KEY
========================================================= */

function getCountryObject(idOrKey) {

  return countries.find(
    country => {

      const id =
        country?.id ??
        country?.country_id;

      const key =
        country?.key ??
        country?.country_key ??
        country?.code ??
        country?.country;

      return (
        String(id ?? "") ===
          String(idOrKey ?? "") ||

        String(key ?? "").toLowerCase() ===
          String(idOrKey ?? "").toLowerCase()
      );

    }
  );
}


function getCountryName(idOrKey) {

  if (
    idOrKey === null ||
    idOrKey === undefined ||
    idOrKey === "" ||
    idOrKey === "overall"
  ) {
    return "Overall";
  }

  const country =
    getCountryObject(idOrKey);

  return (
    country?.name ||
    country?.country_name ||
    `Country ${idOrKey}`
  );
}


function getFiveSimCountryKey(country) {

  return (
    country?.key ??
    country?.country_key ??
    country?.code ??
    country?.country ??
    country?.id
  );
}


/* =========================================================
   SERVICE NAME
========================================================= */

function getServiceName(code) {

  if (
    code === null ||
    code === undefined ||
    code === "" ||
    code === "overall"
  ) {
    return "Overall";
  }

  const service =
    services.find(
      s =>
        String(
          s.service_code ??
          s.code ??
          s.name ??
          ""
        ).toLowerCase() ===
        String(code).toLowerCase()
    );

  return (
    service?.service_name ||
    service?.name ||
    service?.title ||
    code
  );
}


/* =========================================================
   COUNTRY SEARCH TEXT
========================================================= */

function getCountrySearchText(country) {

  const name =
    String(
      country?.name ||
      country?.country_name ||
      ""
    );

  const normalized =
    normalizeSearch(name);

  const aliases = [];

  if (
    normalized.includes(
      "united kingdom"
    )
  ) {

    aliases.push(
      "uk",
      "gb",
      "great britain"
    );
  }

  if (
    normalized.includes(
      "united states"
    )
  ) {

    aliases.push(
      "us",
      "usa",
      "america"
    );
  }

  return [
    name,
    ...aliases,
    country?.id,
    country?.key,
    country?.country_key,
    country?.code
  ]
    .join(" ")
    .toLowerCase();
}


/* =========================================================
   BUILD COUNTRY DROPDOWN
========================================================= */

function buildCountryDropdown() {

  countryDropdownItems = [];

  countryDropdownItems.push({
    value: "overall",
    label: "Overall",
    searchText:
      "overall all countries"
  });

  countries.forEach(
    country => {

      const value =
        currentProvider === "fivesim"
          ? String(
              getFiveSimCountryKey(
                country
              )
            )
          : String(
              country?.id ??
              country?.country_id ??
              ""
            );

      if (!value) {
        return;
      }

      const label =
        country?.name ||
        country?.country_name ||
        `Country ${value}`;

      countryDropdownItems.push({

        value,

        label,

        searchText:
          getCountrySearchText(
            country
          )

      });

    }
  );

  renderCountryOptions("");
}


/* =========================================================
   COUNTRY OPTIONS
========================================================= */

function renderCountryOptions(
  searchTerm = ""
) {

  const container =
    document.getElementById(
      "countryOptions"
    );

  const search =
    normalizeSearch(
      searchTerm
    );

  const filtered =
    countryDropdownItems.filter(
      item =>
        !search ||
        item.searchText.includes(
          search
        )
    );

  container.innerHTML =
    "";

  if (!filtered.length) {

    container.innerHTML = `
      <div class="search-option disabled">
        No country found
      </div>
    `;

    return;
  }

  filtered.forEach(
    item => {

      const option =
        document.createElement(
          "div"
        );

      option.className =
        "search-option";

      const currentValue =
        document.getElementById(
          "countrySelect"
        ).value;

      if (
        currentValue ===
        item.value
      ) {

        option.classList.add(
          "selected"
        );
      }

      option.textContent =
        item.label;

      option.addEventListener(
        "click",
        () => {

          selectCountry(
            item.value
          );

        }
      );

      container.appendChild(
        option
      );

    }
  );
}


/* =========================================================
   SELECT COUNTRY
========================================================= */

function selectCountry(value) {

  const select =
    document.getElementById(
      "countrySelect"
    );

  select.value =
    value;

  const item =
    countryDropdownItems.find(
      x =>
        x.value ===
        value
    );

  document.getElementById(
    "countrySearchButton"
  ).textContent =
    item?.label ||
    "Select country";

  document.getElementById(
    "countrySearchInput"
  ).value =
    "";

  closeDropdown(
    "countrySearchSelect"
  );

  renderCountryOptions("");

  select.dispatchEvent(
    new Event(
      "change",
      {
        bubbles: true
      }
    )
  );
}


/* =========================================================
   BUILD SERVICE DROPDOWN
========================================================= */

function buildServiceDropdown() {

  serviceDropdownItems = [];

  serviceDropdownItems.push({
    value: "overall",
    label: "Overall",
    searchText:
      "overall all services"
  });

  services.forEach(
    service => {

      const code =
        service?.service_code ??
        service?.code ??
        service?.name;

      if (!code) {
        return;
      }

      const label =
        service?.service_name ||
        service?.name ||
        service?.title ||
        code;

      serviceDropdownItems.push({

        value:
          String(code),

        label,

        searchText:
          [
            label,
            code
          ]
            .join(" ")
            .toLowerCase()

      });

    }
  );

  renderServiceOptions("");
}


/* =========================================================
   SERVICE OPTIONS
========================================================= */

function renderServiceOptions(
  searchTerm = ""
) {

  const container =
    document.getElementById(
      "serviceOptions"
    );

  const search =
    normalizeSearch(
      searchTerm
    );

  const filtered =
    serviceDropdownItems.filter(
      item =>
        !search ||
        item.searchText.includes(
          search
        )
    );

  container.innerHTML =
    "";

  if (!filtered.length) {

    container.innerHTML = `
      <div class="search-option disabled">
        No service found
      </div>
    `;

    return;
  }

  filtered.forEach(
    item => {

      const option =
        document.createElement(
          "div"
        );

      option.className =
        "search-option";

      const currentValue =
        document.getElementById(
          "serviceSelect"
        ).value;

      if (
        currentValue ===
        item.value
      ) {

        option.classList.add(
          "selected"
        );
      }

      option.textContent =
        item.label;

      option.addEventListener(
        "click",
        () => {

          selectService(
            item.value
          );

        }
      );

      container.appendChild(
        option
      );

    }
  );
}


/* =========================================================

========================================================= */

function selectService(value) {

  const select =
    document.getElementById(
      "serviceSelect"

  select.value =
    value;

  const item =
    serviceDropdownItems.find(
      x =>

    "serviceSearchInput"

/* =========================================================
   DROPDOWNS
========================================================= */

function openDropdown(id) {

  const dropdown =
    document.getElementById(
      id
    );

  document
    .querySelectorAll(
      ".search-select.open"
    )
    .forEach(
      element => {

        if (
          element.id !==
          id
        ) {

          element.classList.remove(
            "open"
          );
        }

      }
    );

  dropdown.classList.add(
    "open"
  );

  const input =
    dropdown.querySelector(
      ".search-select-search"
    );

  if (input) {

    setTimeout(
      () => {
        input.focus();
      },
      50
    );
  }
}


function closeDropdown(id) {

  const dropdown =
    document.getElementById(
      id
    );

  if (dropdown) {

    dropdown.classList.remove(
      "open"
    );
  }
}

/* =========================================================
   LOAD COUNTRIES
========================================================= */

async function loadCountries() {

  const select =
    document.getElementById(
      "countrySelect"
    );

  select.innerHTML = `
    <option value="">
      Loading countries...
    </option>
  `;

  document.getElementById(
    "countrySearchButton"
  ).textContent =
    "Loading countries...";

  try {

    const data =
      await api(
        "countries"
      );

    countries =
      Array.isArray(
        data?.countries
      )
        ? data.countries
        : [];

    select.innerHTML = `
      <option value="">
        Select country
      </option>

      <option value="overall">
        Overall
      </option>
    `;

    countries.forEach(
      country => {

        const value =
          currentProvider === "fivesim"
            ? getFiveSimCountryKey(
                country
              )
            : (
                country?.id ??
                country?.country_id
              );

        if (
          value === undefined ||
          value === null ||
          value === ""
        ) {
          return;
        }

        const option =
          document.createElement(
            "option"
          );

        option.value =
          String(value);

        option.textContent =
          country?.name ||
          country?.country_name ||
          `Country ${value}`;

        select.appendChild(
          option
        );

      }
    );

    buildCountryDropdown();

    syncCountryDropdown();

  } catch (error) {

    console.error(
      "loadCountries:",
      error
    );

    select.innerHTML = `
      <option value="">
        Unable to load countries
      </option>
    `;

    document.getElementById(
      "countrySearchButton"
    ).textContent =
      "Unable to load countries";

    document.getElementById(
      "countryOptions"
    ).innerHTML = `
      <div class="search-option disabled">
        Unable to load countries
      </div>
    `;

    showStatus(
      error.message ||
      "Could not load countries.",
      "error"
    );
  }
}


/* =========================================================
   LOAD SERVICES
========================================================= */

async function loadServices(
  countryId
) {

  const select =
    document.getElementById(
      "serviceSelect"
    );

  services = [];

  serviceDropdownItems = [];

  document.getElementById(
    "serviceOptions"
  ).innerHTML =
    "";

  if (!countryId) {

    select.innerHTML = `
      <option value="">
        Select country first
      </option>
    `;

    document.getElementById(
      "serviceSearchButton"
    ).textContent =
      "Select country first";

    return;
  }

  select.innerHTML = `
    <option value="">
      Loading services...
    </option>
  `;

  document.getElementById(
    "serviceSearchButton"
  ).textContent =
    "Loading services...";

  try {

    let requestCountryId =
      countryId;

    if (
      countryId ===
      "overall"
    ) {

      const firstCountry =
        countries.find(
          country => {

            const value =
              currentProvider === "fivesim"
                ? getFiveSimCountryKey(
                    country
                  )
                : (
                    country?.id ??
                    country?.country_id
                  );

            return (
              value !== undefined &&
              value !== null &&
              value !== ""
            );
          }
        );

      if (!firstCountry) {

        select.innerHTML = `
          <option value="">
            No services available
          </option>

          <option value="overall">
            Overall
          </option>
        `;

        buildServiceDropdown();

        document.getElementById(
          "serviceSearchButton"
        ).textContent =
          "Overall";

        return;
      }

      requestCountryId =
        currentProvider === "fivesim"
          ? getFiveSimCountryKey(
              firstCountry
            )
          : (
              firstCountry?.id ??
              firstCountry?.country_id
            );
    }

    /*
      The existing SMSBower function expects
      country_id.

      The 5SIM function also accepts country_id
      in the services action.
    */

    const data =
      await api(
        "services",
        {
          country_id:
            requestCountryId
        }
      );

    services =
      Array.isArray(
        data?.services
      )
        ? data.services
        : [];

    select.innerHTML = `
      <option value="">
        Select service
      </option>

      <option value="overall">
        Overall
      </option>
    `;

    services.forEach(
      service => {

        const code =
          service?.service_code ??
          service?.code ??
          service?.name;

        if (!code) {
          return;
        }

        const option =
          document.createElement(
            "option"
          );

        option.value =
          String(code);

        option.textContent =
          service?.service_name ||
          service?.name ||
          service?.title ||
          code;

        select.appendChild(
          option
        );

      }
    );

    buildServiceDropdown();

    syncServiceDropdown();

  } catch (error) {

    console.error(
      "loadServices:",
      error
    );

    select.innerHTML = `
      <option value="">
        Unable to load services
      </option>
    `;

    document.getElementById(
      "serviceSearchButton"
    ).textContent =
      "Unable to load services";

    document.getElementById(
      "serviceOptions"
    ).innerHTML = `
      <div class="search-option disabled">
        Unable to load services
      </div>
    `;

    showStatus(
      error.message ||
      "Could not load services.",
      "error"
    );
  }
}

document

/* =========================================================
   LOAD MARKUP RULES
========================================================= */

async function loadRules() {

  const container =
    document.getElementById(
      "rulesList"
    );

  container.innerHTML = `
    <div class="loading">
      Loading ${currentProvider === "smsbower" ? "SMSBower" : "5SIM"} rules...
    </div>
  `;

  try {

    const data =
      await api(
        "markup_rules"
      );

    rules =
      Array.isArray(
        data?.rules
      )
        ? data.rules
        : [];

    if (!rules.length) {

      container.innerHTML = `
        <div class="empty">

          No custom ${currentProvider === "smsbower" ? "SMSBower" : "5SIM"} markup rules yet.

          <br>

          The system is currently using
          the default markup.

        </div>
      `;

      return;
    }

    /*
      Sort so the most specific rules appear
      before the Overall rule.
    */

    rules.sort(
      (a, b) => {

        const aSpecific =
          getSpecificity(a);

        const bSpecific =
          getSpecificity(b);

        return bSpecific - aSpecific;
      }
    );

    container.innerHTML =
      "";

    rules.forEach(
      rule => {

        const isFiveSim =
          currentProvider ===
          "fivesim";

        const countryValue =
          isFiveSim
            ? (
                rule.country_key ??
                rule.country_id
              )
            : rule.country_id;

        const serviceValue =
          rule.service_code;

        const countryLabel =
          isOverallValue(
            countryValue
          )
            ? "Overall"
            : getCountryName(
                countryValue
              );

        const serviceLabel =
          isOverallValue(
            serviceValue
          )
            ? "Overall"
            : getServiceName(
                serviceValue
              );

        const countryMeta =
          isOverallValue(
            countryValue
          )
            ? "All countries"
            : "Specific country";

        const serviceMeta =
          isOverallValue(
            serviceValue
          )
            ? "All services"
            : "Specific service";

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "rule";

        div.innerHTML = `

          <div>

            <div class="rule-title">

              ${escapeHtml(
                countryLabel
              )}

              +

              ${escapeHtml(
                serviceLabel
              )}

            </div>

            <div class="rule-meta">

              ${countryMeta}

              ·

              ${serviceMeta}

            </div>

          </div>


          <div style="text-align:right">

            <div class="rule-percent">

              ${Number(
                rule.markup_percent
              )}%

            </div>

            <div class="actions">

              <button
                class="edit-btn"
                onclick="editRule(
                  ${Number(rule.id)}
                )"
              >
                Edit
              </button>

              <button
                class="delete-btn"
                onclick="deleteRule(
                  ${Number(rule.id)}
                )"
              >
                Delete
              </button>

            </div>

          </div>

        `;

        container.appendChild(
          div
        );

      }
    );

  } catch (error) {

    console.error(
      "loadRules:",
      error
    );

    rules = [];

    container.innerHTML = `

      <div class="empty">

        Unable to load
        ${currentProvider === "smsbower" ? "SMSBower" : "5SIM"}
        markup rules.

        <br>

        <small>

          ${escapeHtml(
            error.message ||
            "API request failed."
          )}

        </small>

      </div>

    `;

    showStatus(
      error.message ||
      "Could not load markup rules.",
      "error"
    );
  }
}


/* =========================================================
   SPECIFICITY
========================================================= */

function isOverallValue(value) {

  return (
    value === null ||
    value === undefined ||
    value === "" ||
    value === "overall" ||
    value === "*" ||
    String(value).toLowerCase() ===
      "all"
  );
}


function getSpecificity(rule) {

  const country =
    currentProvider === "fivesim"
      ? (
          rule.country_key ??
          rule.country_id
        )
      : rule.country_id;

  const service =
    rule.service_code;

  let score = 0;

  if (
    !isOverallValue(country)
  ) {
    score += 2;
  }

  if (
    !isOverallValue(service)
  ) {
    score += 2;
  }

  return score;
}


/* =========================================================
   SAVE RULE
========================================================= */

async function saveRule() {

  const saveBtn =
    document.getElementById(
      "saveBtn"
    );

  const countryValue =
    document.getElementById(
      "countrySelect"
    ).value;

  const serviceValue =
    document.getElementById(
      "serviceSelect"
    ).value;

  const markupValue =
    document.getElementById(
      "markupInput"
    ).value.trim();

  if (!countryValue) {

    showStatus(
      "Please select a country.",
      "error"
    );

    return;
  }

  if (!serviceValue) {

    showStatus(
      "Please select a service.",
      "error"
    );

    return;
  }

  if (
    markupValue === "" ||
    !Number.isFinite(
      Number(markupValue)
    ) ||
    Number(markupValue) < 0
  ) {

    showStatus(
      "Enter a valid markup percentage.",
      "error"
    );

    return;
  }

  const markup =
    Number(
      markupValue
    );

  saveBtn.disabled =
    true;

  saveBtn.textContent =
    editingId !== null
      ? "Updating..."
      : "Saving...";

  try {

    if (
      currentProvider ===
      "smsbower"
    ) {

      /*
        IMPORTANT:

        SMSBower keeps its existing
        country_id / service_code system.

        NULL means Overall.
      */

      const countryId =
        countryValue === "overall"
          ? null
          : Number(
              countryValue
            );

      const serviceCode =
        serviceValue === "overall"
          ? null
          : serviceValue;

      const data =
        await api(
          "save_markup_rule",
          {
            id:
              editingId !== null
                ? Number(editingId)
                : null,

            country_id:
              countryId,

            service_code:
              serviceCode,

            markup_percent:
              markup
          }
        );

      showStatus(
        data?.message ||
        (
          editingId !== null
            ? "SMSBower markup rule updated."
            : "SMSBower markup rule saved."
        ),
        "success"
      );

    } else {

      /*
        ==================================================
        5SIM IS COMPLETELY SEPARATE
        ==================================================
      */

      const countryKey =
        countryValue === "overall"
          ? "*"
          : String(
              countryValue
            );

      const serviceCode =
        serviceValue === "overall"
          ? "*"
          : String(
              serviceValue
            );

      const data =
        await api(
          "save_markup_rule",
          {
            id:
              editingId !== null
                ? Number(editingId)
                : null,

            country_key:
              countryKey,

            service_code:
              serviceCode,

            markup_percent:
              markup
          }
        );

      showStatus(
        data?.message ||
        (
          editingId !== null
            ? "5SIM markup rule updated."
            : "5SIM markup rule saved."
        ),
        "success"
      );
    }

    resetForm();

    await loadRules();

  } catch (error) {

    console.error(
      "saveRule:",
      error
    );

    showStatus(
      error.message ||
      "Could not save markup.",
      "error"
    );

  } finally {

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      "Save Markup";
  }
}


/* =========================================================
   EDIT RULE
========================================================= */

async function editRule(id) {

  const rule =
    rules.find(
      r =>
        Number(r.id) ===
        Number(id)
    );

  if (!rule) {
    return;
  }

  editingId =
    Number(
      rule.id
    );

  const countrySelect =
    document.getElementById(
      "countrySelect"
    );

  const serviceSelect =
    document.getElementById(
      "serviceSelect"
    );

  const countryValue =
    currentProvider === "fivesim"
      ? (
          rule.country_key ??
          rule.country_id
        )
      : rule.country_id;

  const serviceValue =
    rule.service_code;

  countrySelect.value =
    isOverallValue(
      countryValue
    )
      ? "overall"
      : String(
          countryValue
        );

  syncCountryDropdown();

  await loadServices(
    countrySelect.value
  );

  serviceSelect.value =
    isOverallValue(
      serviceValue
    )
      ? "overall"
      : String(
          serviceValue
        );

  syncServiceDropdown();

  document.getElementById(
    "markupInput"
  ).value =
    rule.markup_percent;

  document.getElementById(
    "formTitle"
  ).textContent =
    `Edit ${currentProvider === "smsbower" ? "SMSBower" : "5SIM"} Markup Rule`;

  document.getElementById(
    "saveBtn"
  ).textContent =
    "Update Markup";

  document.getElementById(
    "cancelBtn"
  ).style.display =
    "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================================
   DELETE RULE
========================================================= */

async function deleteRule(id) {

  const rule =
    rules.find(
      r =>
        Number(r.id) ===
        Number(id)
    );

  if (!rule) {
    return;
  }

  const countryValue =
    currentProvider === "fivesim"
      ? (
          rule.country_key ??
          rule.country_id
        )
      : rule.country_id;

  const countryName =
    isOverallValue(
      countryValue
    )
      ? "Overall"
      : getCountryName(
          countryValue
        );

  const serviceName =
    isOverallValue(
      rule.service_code
    )
      ? "Overall"
      : getServiceName(
          rule.service_code
        );

  const confirmed =
    confirm(
      `Delete ${currentProvider === "smsbower" ? "SMSBower" : "5SIM"} markup rule:\n\n` +
      `${countryName} + ${serviceName}\n` +
      `${rule.markup_percent}%`
    );

  if (!confirmed) {
    return;
  }

  try {

    await api(
      "delete_markup_rule",
      {
        id:
          Number(id)
      }
    );

    showStatus(
      `${currentProvider === "smsbower" ? "SMSBower" : "5SIM"} markup rule deleted.`,
      "success"
    );

    if (
      editingId !== null &&
      Number(editingId) ===
        Number(id)
    ) {

      resetForm();
    }

    await loadRules();

  } catch (error) {

    console.error(
      "deleteRule:",
      error
    );

    showStatus(
      error.message ||
      "Could not delete rule.",
      "error"
    );
  }
}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}
