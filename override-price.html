<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markup Manager — Delight Vendor Logs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#111;
  min-height:100vh;
}

header{
  background:#000;
  color:#fff;
  padding:20px;
  text-align:center;
  font-size:22px;
  font-weight:800;
}

.container{
  width:min(900px,94%);
  margin:24px auto;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.card h2{
  font-size:18px;
  margin-bottom:16px;
}

.provider-tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.provider-tab{
  flex:1;
  border:0;
  border-radius:12px;
  padding:14px 10px;
  background:#e9ecef;
  color:#111;
  font-weight:800;
  cursor:pointer;
}

.provider-tab.active{
  background:#000;
  color:#fff;
}

.provider-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:14px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field{
  margin-bottom:14px;
}

.field.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

input,select{
  width:100%;
  border:1px solid #d8dde3;
  border-radius:10px;
  padding:12px;
  font-size:14px;
  outline:none;
  background:#fff;
}

input:focus,select:focus{
  border-color:#000;
}

button{
  font-family:inherit;
}

.main-btn{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  background:#000;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.secondary-btn{
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px 14px;
  background:#fff;
  font-weight:700;
  cursor:pointer;
}

.danger-btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:#d90429;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.cancel-btn{
  display:none;
  width:100%;
  margin-top:9px;
  border:1px solid #ddd;
  border-radius:11px;
  padding:12px;
  background:#fff;
  font-weight:800;
  cursor:pointer;
}

.status{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  background:#f1f3f5;
  font-size:13px;
  line-height:1.5;
  display:none;
}

.status.show{
  display:block;
}

.rules{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.rule{
  border:1px solid #e2e5e8;
  border-radius:12px;
  padding:14px;
  background:#fafafa;
}

.rule-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.rule-info{
  font-size:13px;
  line-height:1.6;
}

.rule-info strong{
  font-size:14px;
}

.rule-actions{
  display:flex;
  gap:7px;
  flex-shrink:0;
}

.badge{
  display:inline-block;
  background:#000;
  color:#fff;
  border-radius:7px;
  padding:3px 7px;
  font-size:11px;
  font-weight:800;
}

.empty{
  text-align:center;
  color:#777;
  font-size:14px;
  padding:18px 0;
}

.search-box{
  margin-bottom:8px;
}

.dropdown{
  position:relative;
}

.dropdown-list{
  position:absolute;
  left:0;
  right:0;
  top:100%;
  z-index:20;
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:4px;
  max-height:220px;
  overflow:auto;
  display:none;
  box-shadow:0 6px 20px rgba(0,0,0,.1);
}

.dropdown-list.show{
  display:block;
}

.dropdown-item{
  padding:11px 12px;
  cursor:pointer;
  font-size:13px;
}

.dropdown-item:hover{
  background:#f1f3f5;
}

.watermark-box{
  border:1px solid #e2e5e8;
  border-radius:13px;
  padding:16px;
  background:#fafafa;
}

.watermark-box textarea{
  width:100%;
  min-height:100px;
  resize:vertical;
  border:1px solid #d8dde3;
  border-radius:10px;
  padding:12px;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

.watermark-box textarea:focus{
  border-color:#000;
}

.watermark-actions{
  display:flex;
  gap:9px;
  margin-top:10px;
}

.watermark-actions button{
  flex:1;
}

.hidden{
  display:none!important;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .provider-tabs{
    flex-direction:column;
  }

  .rule-top{
    flex-direction:column;
  }

  .rule-actions{
    width:100%;
  }

  .rule-actions button{
    flex:1;
  }

  .watermark-actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>⚡ Delight Vendor Logs — Markup Manager</header>

<div class="container">

  <div class="card">

    <div class="provider-tabs">
      <button class="provider-tab active" id="smsbowerTab" onclick="switchProvider('smsbower')">
        All Country Number 1
      </button>

      <button class="provider-tab" id="fivesimTab" onclick="switchProvider('fivesim')">
        All Country Number 2
      </button>
    </div>

    <div class="provider-title" id="providerTitle">
      SMSBower Markup & Watermark
    </div>

    <div class="watermark-box">
      <label for="watermarkText">Permanent Watermark</label>

      <textarea
        id="watermarkText"
        placeholder="Enter the watermark customers should see on the Virtual Numbers page..."
      ></textarea>

      <div class="watermark-actions">
        <button class="main-btn" onclick="saveWatermark()">
          Save Watermark
        </button>

        <button class="secondary-btn" onclick="deleteWatermark()">
          Delete Watermark
        </button>
      </div>
    </div>

  </div>

  <div class="card">
    <h2 id="markupHeading">Add / Edit SMSBower Markup Rule</h2>

    <div class="grid">

      <div class="field">
        <label>Country</label>

        <div class="dropdown">
          <input
            id="countrySearch"
            class="search-box"
            type="text"
            placeholder="Search country..."
            autocomplete="off"
          >

          <div id="countryDropdown" class="dropdown-list"></div>
        </div>
      </div>

      <div class="field">
        <label>Service</label>

        <div class="dropdown">
          <input
            id="serviceSearch"
            class="search-box"
            type="text"
            placeholder="Search service..."
            autocomplete="off"
          >

          <div id="serviceDropdown" class="dropdown-list"></div>
        </div>
      </div>

      <div class="field full">
        <label>Markup Percentage</label>

        <input
          id="markupPercent"
          type="number"
          min="0"
          step="0.01"
          placeholder="Example: 100"
        >
      </div>

      <div class="field full">
        <button class="main-btn" onclick="saveMarkup()">
          Save Markup
        </button>

        <button
          class="cancel-btn"
          id="cancelEditBtn"
          onclick="cancelEdit()"
        >
          Cancel Edit
        </button>
      </div>

    </div>

    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h2>Current Markup Rules</h2>

    <div id="rules" class="rules">
      <div class="empty">Loading...</div>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const SMSBOWER_FUNCTION_URL =
  `${SUPABASE_URL}/functions/v1/numpool-api`;

const FIVESIM_FUNCTION_URL =
  `${SUPABASE_URL}/functions/v1/fivesim-api`;

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

let provider = "smsbower";

let countries = [];
let services = [];
let rules = [];

let editingId = null;

let countryDropdownItems = [];
let serviceDropdownItems = [];


function providerName(){
  return provider === "fivesim"
    ? "5SIM"
    : "SMSBower";
}


function functionUrl(){
  return provider === "fivesim"
    ? FIVESIM_FUNCTION_URL
    : SMSBOWER_FUNCTION_URL;
}


function showStatus(message, success=true){
  const box = document.getElementById("status");

  box.textContent = message;
  box.classList.add("show");

  box.style.background = success
    ? "#eaf7ee"
    : "#fdecec";

  box.style.color = success
    ? "#176b35"
    : "#a61b1b";
}


async function getSession(){
  const {data,error} =
    await supabaseClient.auth.getSession();

  if(error) throw error;

  return data?.session || null;
}


async function checkAdmin(){
  const session = await getSession();

  if(!session){
    window.location.href = "login.html";
    return null;
  }

  const {data,error} =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id",session.user.id)
      .maybeSingle();

  if(error || !data){
    document.body.innerHTML = `
      <div style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        font-family:Arial;
        text-align:center;
        padding:30px;
      ">
        <div>
          <h2>Access Denied</h2>
          <p style="margin-top:10px;color:#666">
            Admin access is required.
          </p>
        </div>
      </div>
    `;

    return null;
  }

  return session;
}


async function api(action,payload={},url=functionUrl()){
  const session = await getSession();

  if(!session){
    throw new Error("Not authenticated");
  }

  const response =
    await fetch(url,{
      method:"POST",

      headers:{
        "Content-Type":"application/json",
        "apikey":String(SUPABASE_ANON_KEY),
        "Authorization":
          "Bearer " + String(session.access_token)
      },

      body:JSON.stringify({
        action,
        version:"1.0.0",
        ...payload
      })
    });

  let data = null;

  try{
    data = await response.json();
  }catch{
    throw new Error(
      `Server returned HTTP ${response.status}`
    );
  }

  if(!response.ok || data?.success === false){
    throw new Error(
      data?.error ||
      data?.message ||
      `HTTP ${response.status}`
    );
  }

  return data;
}


function normalizeText(value){
  return String(value || "")
    .trim()
    .toLowerCase();
}


function countryName(country){
  return String(
    country?.name ||
    country?.country_name ||
    country?.eng ||
    country?.provider_name ||
    country?.country ||
    country?.key ||
    country?.country_key ||
    ""
  );
}


function countryKey(country){
  return String(
    country?.country_key ||
    country?.key ||
    country?.slug ||
    country?.code ||
    country?.country ||
    country?.name ||
    ""
  ).trim().toLowerCase();
}


function serviceName(service){
  return String(
    service?.name ||
    service?.service_name ||
    service?.title ||
    service?.service ||
    service?.code ||
    ""
  );
}


function serviceCode(service){
  return String(
    service?.code ||
    service?.service_code ||
    service?.key ||
    service?.slug ||
    service?.service ||
    service?.name ||
    ""
  ).trim();
}


function countryId(country){
  return (
    country?.id ??
    country?.country_id ??
    country?.countryId ??
    null
  );
}


function switchProvider(nextProvider){

  provider = nextProvider;

  document.getElementById("smsbowerTab")
    .classList.toggle(
      "active",
      provider === "smsbower"
    );

  document.getElementById("fivesimTab")
    .classList.toggle(
      "active",
      provider === "fivesim"
    );

  document.getElementById("providerTitle").textContent =
    provider === "fivesim"
      ? "5SIM Markup & Watermark"
      : "SMSBower Markup & Watermark";

  document.getElementById("markupHeading").textContent =
    provider === "fivesim"
      ? "Add / Edit 5SIM Markup Rule"
      : "Add / Edit SMSBower Markup Rule";

  cancelEdit();

  loadProviderData();
  loadWatermark();
}


async function loadProviderData(){

  try{

    if(provider === "fivesim"){

      const result =
        await api(
          "countries",
          {},
          FIVESIM_FUNCTION_URL
        );

      countries =
        Array.isArray(result?.countries)
          ? result.countries
          : Array.isArray(result?.data)
            ? result.data
            : [];

      const serviceResult =
        await api(
          "services",
          {},
          FIVESIM_FUNCTION_URL
        );

      services =
        Array.isArray(serviceResult?.services)
          ? serviceResult.services
          : Array.isArray(serviceResult?.data)
            ? serviceResult.data
            : [];

    }else{

      const countryResult =
        await api(
          "countries",
          {},
          SMSBOWER_FUNCTION_URL
        );

      countries =
        Array.isArray(countryResult?.countries)
          ? countryResult.countries
          : Array.isArray(countryResult?.data)
            ? countryResult.data
            : [];

      const serviceResult =
        await api(
          "services",
          {},
          SMSBOWER_FUNCTION_URL
        );

      services =
        Array.isArray(serviceResult?.services)
          ? serviceResult.services
          : Array.isArray(serviceResult?.data)
            ? serviceResult.data
            : [];
    }

    setupDropdowns();
    await loadRules();

  }catch(error){

    showStatus(
      error?.message || "Unable to load provider data.",
      false
    );

    countries = [];
    services = [];

    setupDropdowns();
    await loadRules();
  }
}


function setupDropdowns(){

  countryDropdownItems = countries.slice();
  serviceDropdownItems = services.slice();

  renderCountryDropdown(countryDropdownItems);
  renderServiceDropdown(serviceDropdownItems);

  document.getElementById("countrySearch").value = "";
  document.getElementById("serviceSearch").value = "";

  document.getElementById("countrySearch").oninput = function(){
    const q = normalizeText(this.value);

    countryDropdownItems =
      countries.filter(country => {

        const name =
          normalizeText(countryName(country));

        const key =
          normalizeText(countryKey(country));

        const haystack =
          `${name} ${key}`;

        if(
          q === "uk" ||
          q === "gb" ||
          q === "england" ||
          q === "great britain" ||
          q === "united kingdom"
        ){
          return (
            name === "united kingdom" ||
            name.includes("united kingdom") ||
            key === "uk" ||
            key === "gb" ||
            haystack.includes("united kingdom") ||
            haystack.includes("great britain") ||
            haystack.includes("england")
          );
        }

        if(
          q === "us" ||
          q === "usa" ||
          q === "united states" ||
          q === "america"
        ){
          return (
            name === "united states" ||
            name.includes("united states") ||
            key === "us" ||
            key === "usa" ||
            haystack.includes("united states") ||
            haystack.includes("usa")
          );
        }

        return (
          name.includes(q) ||
          key.includes(q) ||
          haystack.includes(q)
        );
      });

    renderCountryDropdown(countryDropdownItems);
    openDropdown("countryDropdown");
  };


  document.getElementById("serviceSearch").oninput = function(){

    const q =
      normalizeText(this.value);

    serviceDropdownItems =
      services.filter(service => {

        const name =
          normalizeText(serviceName(service));

        const code =
          normalizeText(serviceCode(service));

        return (
          name.includes(q) ||
          code.includes(q)
        );
      });

    renderServiceDropdown(serviceDropdownItems);
    openDropdown("serviceDropdown");
  };


  document.getElementById("countrySearch").onfocus = function(){
    renderCountryDropdown(countryDropdownItems);
    openDropdown("countryDropdown");
  };


  document.getElementById("serviceSearch").onfocus = function(){
    renderServiceDropdown(serviceDropdownItems);
    openDropdown("serviceDropdown");
  };


  document.addEventListener(
    "click",
    dropdownOutsideHandler
  );
}


function dropdownOutsideHandler(event){

  if(
    !event.target.closest(".dropdown")
  ){
    closeDropdown("countryDropdown");
    closeDropdown("serviceDropdown");
  }
}


function openDropdown(id){
  document
    .getElementById(id)
    .classList.add("show");
}


function closeDropdown(id){
  document
    .getElementById(id)
    .classList.remove("show");
}


function renderCountryDropdown(items){

  const box =
    document.getElementById("countryDropdown");

  box.innerHTML = "";

  if(!items.length){

    const empty =
      document.createElement("div");

    empty.className = "dropdown-item";
    empty.textContent = "No country found";

    box.appendChild(empty);

    return;
  }

  items.forEach(country => {

    const item =
      document.createElement("div");

    item.className = "dropdown-item";

    item.textContent =
      countryName(country);

    item.onclick = function(){

      document.getElementById(
        "countrySearch"
      ).value =
        countryName(country);

      document.getElementById(
        "countrySearch"
      ).dataset.countryId =
        countryId(country) ?? "";

      document.getElementById(
        "countrySearch"
      ).dataset.countryKey =
        countryKey(country);

      closeDropdown("countryDropdown");
    };

    box.appendChild(item);
  });
}


function renderServiceDropdown(items){

  const box =
    document.getElementById("serviceDropdown");

  box.innerHTML = "";

  if(!items.length){

    const empty =
      document.createElement("div");

    empty.className = "dropdown-item";
    empty.textContent = "No service found";

    box.appendChild(empty);

    return;
  }

  items.forEach(service => {

    const item =
      document.createElement("div");

    item.className = "dropdown-item";

    item.textContent =
      serviceName(service);

    item.onclick = function(){

      document.getElementById(
        "serviceSearch"
      ).value =
        serviceName(service);

      document.getElementById(
        "serviceSearch"
      ).dataset.serviceCode =
        serviceCode(service);

      closeDropdown("serviceDropdown");
    };

    box.appendChild(item);
  });
}


async function loadRules(){

  const box =
    document.getElementById("rules");

  box.innerHTML =
    `<div class="empty">Loading...</div>`;

  try{

    const result =
      await api(
        "markup",
        {mode:"list"},
        functionUrl()
      );

    rules =
      Array.isArray(result?.rules)
        ? result.rules
        : Array.isArray(result?.data)
          ? result.data
          : [];

    renderRules();

  }catch(error){

    box.innerHTML =
      `<div class="empty">
        Unable to load markup rules.
      </div>`;

    showStatus(
      error?.message ||
      "Unable to load markup rules.",
      false
    );
  }
}


function ruleCountryLabel(rule){

  if(
    normalizeText(rule?.country_key) === "overall" ||
    normalizeText(rule?.country_key) === "all" ||
    normalizeText(rule?.country_key) === "*"
  ){
    return "Overall Countries";
  }

  if(
    provider === "fivesim"
  ){
    return (
      rule?.country_name ||
      rule?.country_key ||
      "Unknown Country"
    );
  }

  const id =
    rule?.country_id ??
    rule?.country;

  const found =
    countries.find(c =>
      String(countryId(c)) === String(id)
    );

  return found
    ? countryName(found)
    : (
      rule?.country_name ||
      rule?.country_id ||
      "Unknown Country"
    );
}


function ruleServiceLabel(rule){

  const code =
    rule?.service_code ??
    rule?.service;

  if(
    normalizeText(code) === "overall" ||
    normalizeText(code) === "all" ||
    normalizeText(code) === "*"
  ){
    return "Overall Services";
  }

  const found =
    services.find(s =>
      normalizeText(serviceCode(s)) ===
      normalizeText(code)
    );

  return found
    ? serviceName(found)
    : (
      rule?.service_name ||
      code ||
      "Unknown Service"
    );
}


function renderRules(){

  const box =
    document.getElementById("rules");

  if(!rules.length){

    box.innerHTML =
      `<div class="empty">
        No ${providerName()} markup rules yet.
      </div>`;

    return;
  }

  box.innerHTML = "";

  rules.forEach(rule => {

    const wrapper =
      document.createElement("div");

    wrapper.className = "rule";

    const top =
      document.createElement("div");

    top.className = "rule-top";

    const info =
      document.createElement("div");

    info.className = "rule-info";

    const strong =
      document.createElement("strong");

    strong.textContent =
      `${ruleCountryLabel(rule)} × ${ruleServiceLabel(rule)}`;

    const line =
      document.createElement("div");

    line.textContent =
      `Markup: ${Number(
        rule.markup_percent ?? 0
      )}%`;

    const server =
      document.createElement("span");

    server.className = "badge";
    server.textContent =
      providerName();

    info.appendChild(strong);
    info.appendChild(document.createElement("br"));
    info.appendChild(line);
    info.appendChild(document.createElement("br"));
    info.appendChild(server);

    const actions =
      document.createElement("div");

    actions.className = "rule-actions";

    const edit =
      document.createElement("button");

    edit.className = "secondary-btn";
    edit.textContent = "Edit";

    edit.onclick = function(){
      editRule(rule);
    };

    const del =
      document.createElement("button");

    del.className = "danger-btn";
    del.textContent = "Delete";

    del.onclick = function(){
      deleteRule(rule);
    };

    actions.appendChild(edit);
    actions.appendChild(del);

    top.appendChild(info);
    top.appendChild(actions);

    wrapper.appendChild(top);

    box.appendChild(wrapper);
  });
}


function editRule(rule){

  editingId =
    rule?.id ??
    rule?.rule_id ??
    null;

  document.getElementById(
    "markupPercent"
  ).value =
    rule?.markup_percent ?? "";

  if(provider === "fivesim"){

    document.getElementById(
      "countrySearch"
    ).value =
      rule?.country_name ||
      rule?.country_key ||
      "";

    document.getElementById(
      "countrySearch"
    ).dataset.countryKey =
      rule?.country_key || "";

  }else{

    const foundCountry =
      countries.find(c =>
        String(countryId(c)) ===
        String(rule?.country_id)
      );

    document.getElementById(
      "countrySearch"
    ).value =
      foundCountry
        ? countryName(foundCountry)
        : (
          rule?.country_name ||
          rule?.country_id ||
          ""
        );

    document.getElementById(
      "countrySearch"
    ).dataset.countryId =
      rule?.country_id ?? "";
  }

  const foundService =
    services.find(s =>
      normalizeText(
        serviceCode(s)
      ) ===
      normalizeText(
        rule?.service_code
      )
    );

  document.getElementById(
    "serviceSearch"
  ).value =
    foundService
      ? serviceName(foundService)
      : (
        rule?.service_name ||
        rule?.service_code ||
        ""
      );

  document.getElementById(
    "serviceSearch"
  ).dataset.serviceCode =
    rule?.service_code || "";

  document.getElementById(
    "cancelEditBtn"
  ).style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


function cancelEdit(){

  editingId = null;

  document.getElementById(
    "countrySearch"
  ).value = "";

  document.getElementById(
    "serviceSearch"
  ).value = "";

  document.getElementById(
    "markupPercent"
  ).value = "";

  delete document.getElementById(
    "countrySearch"
  ).dataset.countryId;

  delete document.getElementById(
    "countrySearch"
  ).dataset.countryKey;

  delete document.getElementById(
    "serviceSearch"
  ).dataset.serviceCode;

  document.getElementById(
    "cancelEditBtn"
  ).style.display = "none";
}


async function saveMarkup(){

  try{

    const markupValue =
      document.getElementById(
        "markupPercent"
      ).value;

    if(markupValue === ""){
      throw new Error(
        "Enter a markup percentage."
      );
    }

    const markup =
      Number(markupValue);

    if(!Number.isFinite(markup) || markup < 0){
      throw new Error(
        "Enter a valid markup percentage."
      );
    }

    const serviceInput =
      document.getElementById(
        "serviceSearch"
      );

    const serviceCodeValue =
      String(
        serviceInput.dataset.serviceCode ||
        ""
      ).trim();

    if(!serviceCodeValue){
      throw new Error(
        "Select a service."
      );
    }

    if(provider === "fivesim"){

      const countryInput =
        document.getElementById(
          "countrySearch"
        );

      const countryValue =
        String(
          countryInput.dataset.countryKey ||
          countryInput.value ||
          ""
        ).trim().toLowerCase();

      if(!countryValue){
        throw new Error(
          "Select a country."
        );
      }

      await api(
        "markup",
        {
          mode:"save",

          id:
            editingId !== null
              ? Number(editingId)
              : null,

          country_key:
            countryValue,

          service_code:
            serviceCodeValue,

          markup_percent:
            markup
        },
        FIVESIM_FUNCTION_URL
      );

    }else{

      const countryInput =
        document.getElementById(
          "countrySearch"
        );

      const countryValue =
        String(
          countryInput.dataset.countryId ||
          ""
        ).trim();

      if(!countryValue){
        throw new Error(
          "Select a country."
        );
      }

      await api(
        "save_markup_rule",
        {
          id:
            editingId !== null
              ? Number(editingId)
              : null,

          country_id:
            Number(countryValue),

          service_code:
            serviceCodeValue,

          markup_percent:
            markup
        },
        SMSBOWER_FUNCTION_URL
      );
    }

    showStatus(
      `${providerName()} markup saved successfully.`,
      true
    );

    cancelEdit();
    await loadRules();

  }catch(error){

    showStatus(
      error?.message ||
      "Unable to save markup.",
      false
    );
  }
}


async function deleteRule(rule){

  if(!confirm(
    `Delete this ${providerName()} markup rule?`
  )){
    return;
  }

  try{

    if(provider === "fivesim"){

      await api(
        "markup",
        {
          mode:"delete",
          id:Number(
            rule?.id ??
            rule?.rule_id
          )
        },
        FIVESIM_FUNCTION_URL
      );

    }else{

      await api(
        "delete_markup_rule",
        {
          id:Number(
            rule?.id ??
            rule?.rule_id
          )
        },
        SMSBOWER_FUNCTION_URL
      );
    }

    showStatus(
      `${providerName()} markup rule deleted.`,
      true
    );

    await loadRules();

  }catch(error){

    showStatus(
      error?.message ||
      "Unable to delete markup rule.",
      false
    );
  }
}


async function loadWatermark(){

  const textarea =
    document.getElementById(
      "watermarkText"
    );

  textarea.value = "";

  try{

    const {data,error} =
      await supabaseClient
        .from("virtual_number_watermarks")
        .select(
          "id,server,watermark_text,updated_at"
        )
        .eq("server",provider)
        .maybeSingle();

    if(error){
      throw error;
    }

    textarea.value =
      data?.watermark_text ?? "";

  }catch(error){

    showStatus(
      error?.message ||
      "Unable to load watermark.",
      false
    );
  }
}


async function saveWatermark(){

  try{

    const textarea =
      document.getElementById(
        "watermarkText"
      );

    const text =
      textarea.value;

    const {error} =
      await supabaseClient
        .from("virtual_number_watermarks")
        .upsert(
          {
            server:provider,
            watermark_text:text,
            updated_at:
              new Date().toISOString()
          },
          {
            onConflict:"server"
          }
        );

    if(error){
      throw error;
    }

    showStatus(
      `${providerName()} watermark saved successfully.`,
      true
    );

  }catch(error){

    showStatus(
      error?.message ||
      "Unable to save watermark.",
      false
    );
  }
}


async function deleteWatermark(){

  if(!confirm(
    `Delete the ${providerName()} watermark?`
  )){
    return;
  }

  try{

    const {error} =
      await supabaseClient
        .from("virtual_number_watermarks")
        .update({
          watermark_text:"",
          updated_at:
            new Date().toISOString()
        })
        .eq("server",provider);

    if(error){
      throw error;
    }

    document.getElementById(
      "watermarkText"
    ).value = "";

    showStatus(
      `${providerName()} watermark deleted.`,
      true
    );

  }catch(error){

    showStatus(
      error?.message ||
      "Unable to delete watermark.",
      false
    );
  }
}


(async function init(){

  const session =
    await checkAdmin();

  if(!session) return;

  await loadProviderData();
  await loadWatermark();

})();
</script>
