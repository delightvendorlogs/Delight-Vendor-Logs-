<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>My Purchases - Delight Vendor Logs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f5f5;
    color:#111;
    font-family:Arial,sans-serif;
}

header{
    background:#111;
    color:#fff;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:25px;
}

main{
    max-width:600px;
    margin:auto;
    padding:25px 20px 40px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 2px 10px #00000014;
    margin-bottom:18px;
}

/* =========================
   TOTAL SPENT
========================= */

.total-card{
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 2px 10px #00000014;
    margin-bottom:18px;
    text-align:center;
}

.total-title{
    font-size:17px;
    color:#555;
    font-weight:bold;
}

.total-amount{
    font-size:30px;
    font-weight:bold;
    margin-top:8px;
}

/* =========================
   PURCHASE
========================= */

.purchase{
    border:1px solid #eee;
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
    background:#fff;
}

.top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
}

.name{
    font-weight:bold;
    font-size:17px;
    word-break:break-word;
}

.amount{
    font-weight:bold;
    white-space:nowrap;
}

.content{
    margin-top:12px;
    background:#f5f5f5;
    padding:12px;
    border-radius:8px;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.6;
}

.content a{
    color:#06c;
    text-decoration:underline;
    word-break:break-all;
}

.status{
    margin-top:8px;
    font-weight:bold;
    color:green;
}

.date{
    margin-top:8px;
    color:#888;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

.error{
    text-align:center;
    color:red;
    padding:20px;
}

.back{
    background:#333;
    color:#fff;
    padding:16px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
}

.copy-btn{
    margin-top:10px;
    background:#111;
    color:#fff;
    border:0;
    padding:9px 12px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.copy-btn:active{
    transform:scale(.98);
}
</style>
</head>

<body>

<header>
    <h1>My Purchases</h1>
</header>

<main>

<!-- =========================
     TOTAL SPENT
========================= -->

<div class="total-card">

    <div class="total-title">
        💰 Total Spent
    </div>

    <div
        id="totalSpent"
        class="total-amount"
    >
        ₦0.00
    </div>

</div>


<!-- =========================
     PURCHASES
========================= -->

<div class="card">

    <div id="purchases">

        <div class="empty">
            Loading purchases...
        </div>

    </div>

</div>


<!-- =========================
     BACK
========================= -->

<div
    class="back"
    onclick="location.href='dashboard.html'"
>
    🏠 Back to Dashboard
</div>

</main>


<script>

const SUPABASE_URL =
"https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   FORMAT MONEY
========================= */

function formatMoney(value){

    return Number(value || 0)
        .toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =========================
   TURN URLS INTO
   CLICKABLE LINKS
========================= */

function formatContent(value){

    const text =
        String(value ?? "");

    const escaped =
        esc(text);

    /*
       Detect http:// and https:// links.

       The exact URL remains visible.

       Example:

       https://wa.me/+2347015908401

       can be clicked and opened.
    */

    return escaped.replace(
        /(https?:\/\/[^\s<]+)/gi,
        function(url){

            return `
                <a
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >${url}</a>
            `;

        }
    );

}


/* =========================
   COPY CONTENT
========================= */

async function copyContent(
    button,
    content
){

    try{

        await navigator.clipboard.writeText(
            content
        );

        const oldText =
            button.textContent;

        button.textContent =
            "✅ Copied";

        setTimeout(()=>{

            button.textContent =
                oldText;

        },1500);

    }catch(error){

        console.error(
            "Copy failed:",
            error
        );

        alert(
            "❌ Could not copy. Please select the text manually."
        );

    }

}


/* =========================
   LOAD PURCHASES
========================= */

async function loadPurchases(){

    const box =
        document.getElementById(
            "purchases"
        );

    const totalBox =
        document.getElementById(
            "totalSpent"
        );

    try{

        /*
           Get logged-in user.
        */

        const {
            data:{user},
            error:authError
        } =
        await supabaseClient.auth.getUser();


        if(authError){

            console.error(
                "Authentication error:",
                authError
            );

            location.href =
                "login.html";

            return;

        }


        if(!user){

            location.href =
                "login.html";

            return;

        }


        /*
           Get this user's purchases only.
        */

        const {
            data,
            error
        } =
        await supabaseClient

            .from("purchases")

            .select(
                "id,product_id,product_name,amount,content,status,created_at"
            )

            .eq(
                "user_id",
                user.id
            )

            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            console.error(
                "Purchase loading error:",
                error
            );

            totalBox.textContent =
                "₦0.00";

            box.innerHTML = `
                <div class="error">

                    ❌ Unable to load purchases.

                    <br><br>

                    ${esc(error.message)}

                </div>
            `;

            return;

        }


        /*
           =========================
           CALCULATE TOTAL SPENT
           =========================

           Only completed purchases
           are included.
        */

        let totalSpent = 0;


        if(data && data.length){

            data.forEach(purchase=>{

                const status =
                    String(
                        purchase.status || ""
                    ).toLowerCase().trim();


                if(status === "completed"){

                    totalSpent +=
                        Number(
                            purchase.amount || 0
                        );

                }

            });

        }


        /*
           Display total spent.
        */

        totalBox.textContent =
            "₦" +
            formatMoney(
                totalSpent
            );


        /*
           Nothing purchased yet.
        */

        if(
            !data ||
            data.length === 0
        ){

            box.innerHTML = `
                <div class="empty">

                    You haven’t purchased anything yet.

                </div>
            `;

            return;

        }


        /*
           Clear loading message.
        */

        box.innerHTML = "";


        /*
           Display every purchase.
        */

        data.forEach(p=>{

            const date =
                p.created_at

                ? new Date(
                    p.created_at
                  ).toLocaleString(
                    "en-NG",
                    {
                        dateStyle:"medium",
                        timeStyle:"short"
                    }
                  )

                : "";


            const content =
                String(
                    p.content ?? ""
                );


            /*
               Convert URLs into
               clickable links.
            */

            const safeContent =
                formatContent(
                    content
                );


            /*
               Copy button.
            */

            const copyButton =
                content.trim()

                ? `
                    <button
                        class="copy-btn"
                        onclick='copyContent(
                            this,
                            ${JSON.stringify(content)}
                        )'
                    >
                        📋 Copy
                    </button>
                `

                : "";


            /*
               Create purchase box.
            */

            const purchase =
                document.createElement(
                    "div"
                );

            purchase.className =
                "purchase";


            purchase.innerHTML = `

                <div class="top">

                    <div class="name">

                        ${esc(
                            p.product_name ||
                            "Unnamed Product"
                        )}

                    </div>


                    <div class="amount">

                        ₦${
                            formatMoney(
                                p.amount
                            )
                        }

                    </div>

                </div>


                <div class="status">

                    ${esc(
                        p.status ||
                        "completed"
                    )}

                </div>


                ${
                    content.trim()

                    ? `

                        <div class="content">

                            ${safeContent}

                        </div>

                        ${copyButton}

                    `

                    : ""
                }


                <div class="date">

                    ${esc(date)}

                </div>

            `;


            box.appendChild(
                purchase
            );

        });

    }catch(error){

        console.error(
            "Unexpected purchase error:",
            error
        );


        totalBox.textContent =
            "₦0.00";


        box.innerHTML = `

            <div class="error">

                ❌ Something went wrong.

                <br><br>

                ${esc(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================
   START
========================= */

loadPurchases();

</script>

</body>
    </html>
