<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
"https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =====================================================
// AUTOMATIC PROVIDER REFUND MARKERS
// These orders are hidden from My Purchases.
// Genuine customer cancellations remain visible.
// =====================================================

const AUTOMATIC_REFUND_MARKERS = [
    "provider_insufficient_funds_refunded",
    "virtualsms_insufficient_funds_refunded"
];


function isAutomaticProviderRefund(order){

    const providerState =
        String(order.provider_state || "")
            .trim()
            .toLowerCase();

    return AUTOMATIC_REFUND_MARKERS.some(
        marker => providerState.includes(marker)
    );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


// =====================================================
// FORMAT MONEY
// =====================================================

function formatMoney(value){

    return Number(value || 0)
        .toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


// =====================================================
// FORMAT DATE
// =====================================================

function formatDate(value){

    if(!value){
        return "";
    }

    try{

        return new Date(value).toLocaleString(
            "en-NG",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }catch{

        return "";

    }

}


// =====================================================
// CLICKABLE URL CONTENT
// =====================================================

function formatContent(value){

    const text =
        String(value ?? "");

    const escaped =
        esc(text);

    return escaped.replace(
        /(https?:\/\/[^\s<]+)/gi,
        function(url){

            return `
                <a
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >${url}</a>
            `;

        }
    );

}


// =====================================================
// COPY CONTENT
// =====================================================

async function copyContent(
    button,
    content
){

    try{

        await navigator.clipboard.writeText(
            String(content ?? "")
        );

        const oldText =
            button.textContent;

        button.textContent =
            "✅ Copied";

        setTimeout(()=>{

            button.textContent =
                oldText;

        },1500);

    }catch(error){

        console.error(
            "Copy failed:",
            error
        );

        alert(
            "❌ Could not copy. Please select the text manually."
        );

    }

}


// =====================================================
// VIRTUAL STATUS BADGE
// =====================================================

function cleanVirtualCustomerText(value){
    return String(value ?? "").replace(/\b(?:varsha\s*sms|varsha|text\s*verified|textverified|text\s*provider|virtual\s*sms|virtualsms|bashua\s*sms|bashua|grizzly\s*sms|grizzlysms|grizzly|smsbower|5sim)\b/gi, "").replace(/\s{2,}/g, " ").trim();
}
function extractVirtualOtp(value){
    const text = cleanVirtualCustomerText(value).replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n))).replace(/&#39;|&apos;/gi, "'");
    const patterns = [/(?:verification|security|sms|login|whatsapp)?\s*(?:code|otp|pin)\s*(?:is|:|=|-)?\s*["']?(\d{3,4}(?:[\s-]\d{3,4})?)/i, /(?:code|otp|pin)[^\d]{0,28}(\d{3,4}(?:[\s-]\d{3,4})?)/i];
    for(const pattern of patterns){const match=text.match(pattern);const digits=String(match?.[1]||"").replace(/\D/g,"");if(/^\d{4,8}$/.test(digits))return digits;}
    return "";
}
function cleanVirtualSms(value){
    const raw=String(value||"").trim(); if(!raw)return "";
    try{const parsed=JSON.parse(raw);const hasLink=Array.isArray(parsed)?parsed.some(x=>x&&typeof x==="object"&&(x.href||x.url)):parsed&&typeof parsed==="object"&&(parsed.href||parsed.url);if(hasLink)return "";
        if(Array.isArray(parsed))return parsed.map(x=>cleanVirtualSms(x?.content||x?.text||x?.body||x?.message||"")).filter(Boolean).join("\n");
        if(parsed&&typeof parsed==="object")return cleanVirtualSms(parsed.content||parsed.text||parsed.body||parsed.message||"");
    }catch{}
    return String(raw).replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/&#39;|&apos;/gi,"'");
}
function virtualStatusBadge(status){

    const value =
        String(status || "")
        .toLowerCase()
        .trim();


    if(value === "waiting"){

        return `
            <span class="badge badge-waiting">
                ⏳ Waiting for OTP
            </span>
        `;

    }


    if(value === "received"){

        return `
            <span class="badge badge-received">
                ✅ Verification Successful
            </span>
        `;

    }


    if(value === "cancelled"){

        return `
            <span class="badge badge-cancelled">
                ❌ Cancelled / Refunded
            </span>
        `;

    }


    return `
        <span class="badge badge-unknown">
            ${esc(status || "Unknown")}
        </span>
    `;

}


// =====================================================
// CREATE VIRTUAL NUMBER CARD
// =====================================================

function createVirtualNumberCard(order){

    const providerState = String(order.provider_state || "").toLowerCase().replace(/[\s_-]/g, "");
    const rawStatus = String(order.status || "").toLowerCase().trim();
    const status = ["verificationcompleted","received","completed","complete","success","successful","verified","smsreceived","finished"].includes(providerState) ? "received" : rawStatus;


    const number =
        String(order.number || "");


    const sms = cleanVirtualSms(order.full_sms || "");
    const otp = String(order.otp_code || extractVirtualOtp(sms));


    const purchaseDate =
        formatDate(
            order.purchased_at ||
            order.created_at
        );


    let otpSection = "";


    if(otp){

        otpSection = `

            <div class="otp-box">

                <div class="virtual-label">
                    OTP Code
                </div>

                <strong>
                    ${esc(otp)}
                </strong>

                <br>

                <button
                    class="copy-btn copy-small"
                    onclick='copyContent(
                        this,
                        ${JSON.stringify(otp)}
                    )'
                >
                    📋 Copy OTP
                </button>

            </div>

        `;

    }else if(status === "waiting" || (status === "received" && !otp)){

        otpSection = `

            <div class="otp-box">

                <div class="virtual-label">
                    OTP Code
                </div>

                <strong>
                    ${status === "received" ? "Retrieving verification code…" : "Waiting…"}
                </strong>

            </div>

        `;

    }


    let smsSection = "";


    if(sms){

        smsSection = `

            <div class="sms-box">

                <div class="virtual-label">
                    Full SMS
                </div>

                ${esc(sms)}

            </div>

        `;

    }


    let numberSection = "";


    if(number){

        numberSection = `

            <div class="number-box">

                <div class="virtual-label">
                    Phone Number
                </div>

                <strong>
                    ${esc(number)}
                </strong>

                <br>

                <button
                    class="copy-btn copy-small"
                    onclick='copyContent(
                        this,
                        ${JSON.stringify(number)}
                    )'
                >
                    📋 Copy Number
                </button>

            </div>

        `;

    }


    let refundSection = "";


    if(status === "cancelled"){

        refundSection = `

            <div class="virtual-row">

                <span class="virtual-label">
                    Refund
                </span>

                <br>

                <strong>
                    ${
                        order.refunded_at
                        ? "✅ Wallet refunded"
                        : "Refund processing"
                    }
                </strong>

            </div>

        `;

    }


    const card =
        document.createElement("div");


    card.className =
        "virtual-number-card";


    card.innerHTML = `

        <div class="virtual-title">

            📱
            ${esc(
                cleanVirtualCustomerText(order.service_name || "Virtual Number") || "Virtual Number"
            )}

            -
            ${esc(
                order.country_name ||
                ""
            )}

        </div>


        <div class="virtual-row">

            ${virtualStatusBadge(
                order.status
            )}

        </div>


        ${numberSection}


        ${otpSection}


        ${smsSection}


        <div class="virtual-row">

            <span class="virtual-label">
                Price
            </span>

            <br>

            <strong>
                ₦${formatMoney(
                    order.customer_price_ngn
                )}
            </strong>

        </div>


        <div class="virtual-row">

            <span class="virtual-label">
                Purchased
            </span>

            <br>

            ${esc(purchaseDate)}

        </div>


        ${refundSection}

    `;


    return card;

}


// =====================================================
// CREATE NORMAL PURCHASE CARD
// =====================================================

function createNormalPurchaseCard(purchase){

    const status =
        String(purchase.status || "")
        .toLowerCase()
        .trim();


    const content =
        String(
            purchase.content ?? ""
        );


    const safeContent =
        formatContent(content);


    const copyButton =
        content.trim()

        ? `

            <button
                class="copy-btn"
                onclick='copyContent(
                    this,
                    ${JSON.stringify(content)}
                )'
            >
                📋 Copy
            </button>

        `

        : "";


    const date =
        formatDate(
            purchase.created_at
        );


    const purchaseBox =
        document.createElement("div");


    purchaseBox.className =
        "purchase";


    purchaseBox.innerHTML = `

        <div class="top">

            <div class="name">

                ${esc(
                    purchase.product_name ||
                    "Unnamed Product"
                )}

            </div>


            <div class="amount">

                ₦${formatMoney(
                    purchase.amount
                )}

            </div>

        </div>


        <div class="status">

            ${
                status === "completed"

                ? `
                    <span class="badge badge-received">
                        ✅ Completed
                    </span>
                `

                : status === "cancelled"

                ? `
                    <span class="badge badge-cancelled">
                        ❌ Cancelled
                    </span>
                `

                : `
                    <span class="badge badge-waiting">
                        ${esc(
                            purchase.status ||
                            "Pending"
                        )}
                    </span>
                `
            }

        </div>


        ${
            content.trim()

            ? `

                <div class="content">
                    ${safeContent}
                </div>

                ${copyButton}

            `

            : ""
        }


        <div class="date">

            ${esc(date)}

        </div>

    `;


    return purchaseBox;

}


// =====================================================
// LOAD ALL PURCHASES
// =====================================================

async function loadPurchases(){

    const totalBox =
        document.getElementById(
            "totalSpent"
        );


    const container =
        document.getElementById(
            "allPurchases"
        );


    try{

        // =================================================
        // CHECK LOGIN
        // =================================================

        const {
            data:{
                user
            },
            error:authError
        } =
        await supabaseClient.auth.getUser();


        if(authError || !user){

            location.href =
                "login.html";

            return;

        }


        // =================================================
        // LOAD VIRTUAL NUMBER PURCHASES
        // provider_state is required to identify
        // automatic provider refunds.
        // =================================================

        const {
            data:virtualData,
            error:virtualError
        } =
        await supabaseClient

            .from(
                "virtual_number_orders"
            )

            .select(
                [
                    "id",
                    "user_id",
                    "numpool_order_id",
                    "service_code",
                    "service_name",
                    "country_id",
                    "country_name",
                    "number",
                    "provider_cost_usd",
                    "exchange_rate",
                    "provider_cost_ngn",
                    "customer_price_ngn",
                    "status",
                    "provider_state",
                    "otp_code",
                    "full_sms",
                    "purchased_at",
                    "code_received_at",
                    "cancelled_at",
                    "refunded_at",
                    "created_at",
                    "updated_at"
                ].join(",")
            )

            .eq(
                "user_id",
                user.id
            )

            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(virtualError){

            console.error(
                "Virtual purchases error:",
                virtualError
            );

        }


        // =================================================
        // LOAD NORMAL PURCHASES
        // =================================================

        const {
            data:normalData,
            error:normalError
        } =
        await supabaseClient

            .from(
                "purchases"
            )

            .select(
                "id,product_id,product_name,amount,content,status,created_at"
            )

            .eq(
                "user_id",
                user.id
            )

            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(normalError){

            console.error(
                "Purchase loading error:",
                normalError
            );

        }


        // =================================================
        // CHECK BOTH RESULTS
        // =================================================

        if(
            virtualError &&
            normalError
        ){

            container.innerHTML = `

                <div class="error">

                    ❌ Unable to load purchases.

                    <br><br>

                    ${esc(
                        virtualError.message ||
                        normalError.message
                    )}

                </div>

            `;

            totalBox.textContent =
                "₦0.00";

            return;

        }


        // =================================================
        // FILTER AUTOMATIC PROVIDER REFUNDS
        // before combining or rendering the cards.
        // Genuine customer cancellations are not filtered.
        // =================================================

        const visibleVirtualData =
            (virtualData || []).filter(
                order => !isAutomaticProviderRefund(order)
            );


        // =================================================
        // COMBINE BOTH PURCHASE TYPES
        // =================================================

        const combined = [];


        visibleVirtualData.forEach(
            order => {

                combined.push({

                    type:"virtual",

                    date:
                        order.created_at ||
                        order.purchased_at,

                    data:order

                });

            }
        );


        (normalData || []).forEach(
            purchase => {

                combined.push({

                    type:"normal",

                    date:
                        purchase.created_at,

                    data:purchase

                });

            }
        );


        // =================================================
        // SORT EVERYTHING TOGETHER
        // NEWEST PURCHASE ALWAYS FIRST
        // =================================================

        combined.sort(
            function(a,b){

                return (
                    new Date(b.date || 0).getTime()
                    -
                    new Date(a.date || 0).getTime()
                );

            }
        );


        function purchaseBucket(item){
            const raw=String(item.data.status||"").toLowerCase().trim();
            if(item.type==="virtual"){
                if(["received","completed","complete","success","successful"].includes(raw))return "completed";
                if(["cancelled","canceled","refunded","expired"].includes(raw))return "cancelled";
                return "pending";
            }
            if(["completed","complete","success","successful","approved"].includes(raw))return "completed";
            if(["cancelled","canceled","refunded","rejected","failed","declined"].includes(raw))return "cancelled";
            return "pending";
        }
        function renderPurchaseStats(items){
            const el=document.getElementById("purchaseStats");
            if(!el)return;
            const counts={completed:0,pending:0,cancelled:0};
            (items||[]).forEach(item=>counts[purchaseBucket(item)]++);
            el.innerHTML=[
                {key:"completed",label:"Completed orders",count:counts.completed},
                {key:"pending",label:"Pending orders",count:counts.pending},
                {key:"cancelled",label:"Cancelled orders",count:counts.cancelled}
            ].map(s=>'<button type="button" class="purchase-stat" data-filter="'+s.key+'"><span>'+s.label+'</span><strong>'+s.count+'</strong></button>').join("");
            const apply=filter=>{
                el.querySelectorAll(".purchase-stat").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter));
                document.querySelectorAll("#allPurchases [data-purchase-status]").forEach(card=>card.style.display=filter==="all"||card.dataset.purchaseStatus===filter?"":"none");
            };
            const all=document.createElement("button");all.type="button";all.className="purchase-stat active";all.dataset.filter="all";all.innerHTML="<span>All orders</span><strong>"+(items||[]).length+"</strong>";el.prepend(all);
            el.querySelectorAll(".purchase-stat").forEach(b=>b.addEventListener("click",()=>apply(b.dataset.filter)));
        }

        // =================================================
        // EMPTY
        // =================================================

        renderPurchaseStats(combined);

        if(combined.length === 0){

            container.innerHTML = `

                <div class="empty">

                    You haven't purchased
                    anything yet.

                </div>

            `;

            totalBox.textContent =
                "₦0.00";

            return;

        }


        // =================================================
        // TOTAL SPENT
        // =================================================

        let totalSpent = 0;


        // =================================================
        // RENDER IN ONE SHARED LIST
        // =================================================

        container.innerHTML = "";


        combined.forEach(
            item => {

                if(
                    item.type === "virtual"
                ){

                    const order =
                        item.data;


                    const status =
                        String(
                            order.status || ""
                        )
                        .toLowerCase()
                        .trim();


                    /*
                       Only completed virtual
                       numbers count as spending.

                       Cancelled/refunded numbers
                       do NOT count.
                    */

                    if(
                        status === "received"
                    ){

                        totalSpent +=
                            Number(
                                order.customer_price_ngn || 0
                            );

                    }


                    const virtualCard=createVirtualNumberCard(order);
                    virtualCard.dataset.purchaseStatus=purchaseBucket(item);
                    container.appendChild(virtualCard);

                }else{

                    const purchase =
                        item.data;


                    const status =
                        String(
                            purchase.status || ""
                        )
                        .toLowerCase()
                        .trim();


                    /*
                       Only completed normal
                       purchases count as spending.
                    */

                    if(
                        status === "completed"
                    ){

                        totalSpent +=
                            Number(
                                purchase.amount || 0
                            );

                    }


                    const normalCard=createNormalPurchaseCard(purchase);
                    normalCard.dataset.purchaseStatus=purchaseBucket(item);
                    container.appendChild(normalCard);

                }

            }
        );


        totalBox.textContent =
            "₦" +
            formatMoney(
                totalSpent
            );


    }catch(error){

        console.error(
            "Unexpected purchase page error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ Something went wrong
                while loading purchases.

                <br><br>

                ${esc(
                    error.message
                )}

            </div>

        `;


        totalBox.textContent =
            "₦0.00";

    }

}


// =====================================================
// START
// =====================================================

loadPurchases();

</script>

<script src="branding.js"></script>
<script src="assets/site-announcement.js" defer></script>
</body>
</html>
