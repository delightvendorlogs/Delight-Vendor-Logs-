<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Purchases - Delight Vendor Logs</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

</head>

<body>

<header>

  <h1>
    My Purchases
  </h1>

</header>

<main>

  <h2>
    Purchase History
  </h2>

  <div id="purchases">

    <p>
      Loading purchases...
    </p>

  </div>

  <br>

  <button
    type="button"
    onclick="window.location.href='dashboard.html'"
  >

    🏠 Back to Dashboard

  </button>

</main>

<script>

/* ========================================
   SUPABASE
======================================== */

const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ========================================
   LOAD PURCHASES
======================================== */

async function loadPurchases() {

  const container =
    document.getElementById(
      "purchases"
    );

  container.innerHTML =
    "<p>Loading purchases...</p>";


  /* ======================================
     CHECK LOGIN
  ====================================== */

  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if (
    userError ||
    !user
  ) {

    window.location.href =
      "login.html";

    return;

  }


  /* ======================================
     LOAD USER ORDERS
  ====================================== */

  const {
    data: orders,
    error
  } =
    await supabaseClient
      .from("orders")
      .select(
        "id, user_id, product_id, amount, status, delivery_data, cancel_allowed, created_at, updated_at"
      )
      .eq(
        "user_id",
        user.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  /* ======================================
     DATABASE ERROR
  ====================================== */

  if (error) {

    console.error(
      "Purchases error:",
      error
    );

    container.innerHTML = `

      <div
        style="
          background:white;
          padding:20px;
          border-radius:12px;
          text-align:center;
        "
      >

        <h3>
          Unable to load purchases
        </h3>

        <p>
          ${escapeHTML(
            error.message ||
            "Unknown error"
          )}
        </p>

      </div>

    `;

    return;

  }


  /* ======================================
     NO PURCHASES
  ====================================== */

  if (
    !orders ||
    orders.length === 0
  ) {

    container.innerHTML = `

      <div
        style="
          background:white;
          padding:20px;
          border-radius:12px;
          text-align:center;
        "
      >

        <h3>
          No Purchases Yet
        </h3>

        <p>
          You haven't purchased anything yet.
        </p>

      </div>

    `;

    return;

  }


  /* ======================================
     CLEAR LOADING
  ====================================== */

  container.innerHTML =
    "";


  /* ======================================
     DISPLAY ORDERS
  ====================================== */

  orders.forEach(
    function(order) {

      const box =
        document.createElement(
          "div"
        );


      box.style.background =
        "white";

      box.style.padding =
        "18px";

      box.style.margin =
        "12px 0";

      box.style.borderRadius =
        "12px";

      box.style.textAlign =
        "left";

      box.style.boxShadow =
        "0 2px 8px rgba(0,0,0,0.08)";


      /* ==================================
         AMOUNT
      ================================== */

      const amount =
        Number(
          order.amount || 0
        ).toLocaleString(
          "en-NG",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );


      /* ==================================
         DATE
      ================================== */

      const date =
        order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString(
              "en-NG"
            )
          : "Date unavailable";


      /* ==================================
         STATUS
      ================================== */

      const status =
        String(
          order.status ||
          "pending"
        ).toLowerCase();


      let statusText =
        "⏳ Pending";


      if (
        status === "delivered"
      ) {

        statusText =
          "✅ Delivered";

      }


      if (
        status === "completed"
      ) {

        statusText =
          "✅ Completed";

      }


      if (
        status === "cancelled"
      ) {

        statusText =
          "❌ Cancelled";

      }


      if (
        status === "processing"
      ) {

        statusText =
          "🔄 Processing";

      }


      /* ==================================
         DELIVERY
      ================================== */

      let deliveryHTML =
        "";


      if (
        order.delivery_data &&
        String(
          order.delivery_data
        ).trim() !== ""
      ) {

        deliveryHTML = `

          <div
            style="
              margin-top:15px;
              padding:14px;
              background:#f4f4f4;
              border-radius:10px;
            "
          >

            <strong>
              Delivery Information
            </strong>

            <p
              style="
                white-space:pre-wrap;
                word-break:break-word;
              "
            >

              ${escapeHTML(
                order.delivery_data
              )}

            </p>

          </div>

        `;

      }


      /* ==================================
         CANCEL STATUS
      ================================== */

      let cancelHTML =
        "";


      if (
        order.cancel_allowed === true
      ) {

        cancelHTML = `

          <p>

            🔄 Cancellation:

            <strong>
              Allowed
            </strong>

          </p>

        `;

      } else {

        cancelHTML = `

          <p>

            🔒 Cancellation:

            <strong>
              Not allowed
            </strong>

          </p>

        `;

      }


      /* ==================================
         ORDER CARD
      ================================== */

      box.innerHTML = `

        <h3>

          Purchase #${escapeHTML(
            order.id
          )}

        </h3>


        <p>

          Product ID:

          <strong>

            ${escapeHTML(
              order.product_id
            )}

          </strong>

        </p>


        <p>

          Amount:

          <strong>

            ₦${amount}

          </strong>

        </p>


        <p>

          Status:

          <strong>

            ${statusText}

          </strong>

        </p>


        ${cancelHTML}


        <p>

          Purchased:

          <small>

            ${escapeHTML(
              date
            )}

          </small>

        </p>


        ${deliveryHTML}

      `;


      container.appendChild(
        box
      );

    }
  );

}


/* ========================================
   ESCAPE HTML
======================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ========================================
   START
======================================== */

loadPurchases();

</script>

</body>

</html>
