<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>
<link rel="icon" type="image/png"
href="https://raw.githubusercontent.com/delightvendorlogs/Delight-Vendor-Logs-/main/assets/dv-logo.png">

<link rel="apple-touch-icon"
href="https://raw.githubusercontent.com/delightvendorlogs/Delight-Vendor-Logs-/main/assets/dv-logo.png">
<title>My Purchases - Delight Vendor Logs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   HEADER
========================= */

header{
    background:
        radial-gradient(
            circle at 85% 0%,
            rgba(212,175,55,.12),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #151108,
            #050505
        );
    color:#fff;
    padding:22px 20px;
    text-align:center;
    border-bottom:1px solid #29230f;
}

header h1{
    margin:0;
    font-size:25px;
    font-weight:800;
    letter-spacing:.2px;
}

main{
    max-width:600px;
    margin:auto;
    padding:25px 20px 40px;
}

/* =========================
   SECTION TITLE
========================= */

.section-title{
    margin:8px 0 15px;
    font-size:21px;
    color:#fff;
    font-weight:800;
}

/* =========================
   CARD
========================= */

.card{
    background:#0d0d0d;
    padding:20px;
    border-radius:18px;
    border:1px solid #252525;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
    margin-bottom:18px;
}

/* =========================
   TOTAL CARD
========================= */

.total-card{
    background:
        radial-gradient(
            circle at 90% 10%,
            rgba(212,175,55,.10),
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #171208,
            #090909
        );
    padding:22px 20px;
    border-radius:20px;
    border:1px solid #332a12;
    box-shadow:0 12px 35px rgba(0,0,0,.3);
    margin-bottom:22px;
    text-align:center;
}

.total-title{
    font-size:15px;
    color:#9a9a9a;
    font-weight:bold;
}

.total-amount{
    font-size:30px;
    color:#d4af37;
    font-weight:800;
    margin-top:8px;
}

/* =========================
   NORMAL PURCHASE
========================= */

.purchase{
    border:1px solid #292929;
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    background:#111;
}

.top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
}

.name{
    color:#fff;
    font-weight:bold;
    font-size:17px;
    word-break:break-word;
}

.amount{
    color:#d4af37;
    font-weight:bold;
    white-space:nowrap;
}

.content{
    margin-top:12px;
    background:#181818;
    padding:12px;
    border-radius:8px;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.6;
    color:#ddd;
}

.content a{
    color:#d4af37;
    text-decoration:underline;
    word-break:break-all;
}

.status{
    margin-top:8px;
    font-weight:bold;
}

.date{
    margin-top:8px;
    color:#777;
    font-size:13px;
}

/* =========================
   VIRTUAL NUMBER
========================= */

.virtual-number-card{
    border:1px solid #292929;
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    background:#111;
}

.virtual-title{
    color:#fff;
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
    word-break:break-word;
}

.virtual-row{
    margin:8px 0;
    line-height:1.5;
}

.virtual-label{
    color:#777;
    font-size:14px;
}

.virtual-value{
    color:#fff;
    font-weight:bold;
    word-break:break-word;
}

.number-box,
.otp-box,
.sms-box{
    margin-top:10px;
    background:#181818;
    padding:12px;
    border-radius:8px;
    word-break:break-word;
    border:1px solid #252525;
}

.number-box strong,
.otp-box strong{
    color:#d4af37;
    font-size:18px;
}

.sms-box{
    white-space:pre-wrap;
    line-height:1.5;
    color:#ddd;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-waiting{
    background:#2b230d;
    color:#e5c65d;
    border:1px solid #4a3b14;
}

.badge-received{
    background:#112016;
    color:#8ed5a2;
    border:1px solid #24462d;
}

.badge-cancelled{
    background:#261313;
    color:#e88989;
    border:1px solid #492222;
}

.badge-unknown{
    background:#1c1c1c;
    color:#aaa;
    border:1px solid #303030;
}

/* =========================
   COPY BUTTON
========================= */

.copy-btn{
    margin-top:10px;
    background:#d4af37;
    color:#080808;
    border:0;
    padding:9px 12px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.copy-btn:active{
    transform:scale(.98);
}

.copy-small{
    margin-top:0;
}

/* =========================
   BACK BUTTON
========================= */

.back{
    background:linear-gradient(
        135deg,
        #d4af37,
        #f0cf68
    );
    color:#080808;
    padding:16px;
    border-radius:12px;
    text-align:center;
    font-weight:800;
    cursor:pointer;
    margin-top:20px;
    box-shadow:0 8px 25px rgba(212,175,55,.08);
}

/* =========================
   EMPTY / ERROR / LOADING
========================= */

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

.error{
    text-align:center;
    color:#e88989;
    padding:20px;
}

.loading{
    text-align:center;
    color:#777;
    padding:20px;
}

</style>

</head>

<body>


<header>

    <h1>
        My Purchases
    </h1>

</header>


<main>


<div class="total-card">

    <div class="total-title">
        💰 Total Spent
    </div>

    <div
        id="totalSpent"
        class="total-amount"
    >
        ₦0.00
    </div>

</div>


<h2 class="section-title">
    🛍️ My Purchases
</h2>


<div class="card">

    <div id="allPurchases">

        <div class="loading">
            Loading purchases...
        </div>

    </div>

</div>


<div
    class="back"
    onclick="location.href='dashboard.html'"
>
    🏠 Back to Dashboard
</div>


</main>


<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
"https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =====================================================
// ESCAPE HTML
// =====================================================

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


// =====================================================
// FORMAT MONEY
// =====================================================

function formatMoney(value){

    return Number(value || 0)
        .toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


// =====================================================
// FORMAT DATE
// =====================================================

function formatDate(value){

    if(!value){
        return "";
    }

    try{

        return new Date(value).toLocaleString(
            "en-NG",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }catch{

        return "";

    }

}


// =====================================================
// CLICKABLE URL CONTENT
// =====================================================

function formatContent(value){

    const text =
        String(value ?? "");

    const escaped =
        esc(text);

    return escaped.replace(
        /(https?:\/\/[^\s<]+)/gi,
        function(url){

            return `
                <a
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >${url}</a>
            `;

        }
    );

}


// =====================================================
// COPY CONTENT
// =====================================================

async function copyContent(
    button,
    content
){

    try{

        await navigator.clipboard.writeText(
            String(content ?? "")
        );

        const oldText =
            button.textContent;

        button.textContent =
            "✅ Copied";

        setTimeout(()=>{

            button.textContent =
                oldText;

        },1500);

    }catch(error){

        console.error(
            "Copy failed:",
            error
        );

        alert(
            "❌ Could not copy. Please select the text manually."
        );

    }

}


// =====================================================
// VIRTUAL STATUS BADGE
// =====================================================

function virtualStatusBadge(status){

    const value =
        String(status || "")
        .toLowerCase()
        .trim();


    if(value === "waiting"){

        return `
            <span class="badge badge-waiting">
                ⏳ Waiting for OTP
            </span>
        `;

    }


    if(value === "received"){

        return `
            <span class="badge badge-received">
                ✅ Completed
            </span>
        `;

    }


    if(value === "cancelled"){

        return `
            <span class="badge badge-cancelled">
                ❌ Cancelled / Refunded
            </span>
        `;

    }


    return `
        <span class="badge badge-unknown">
            ${esc(status || "Unknown")}
        </span>
    `;

}


// =====================================================
// CREATE VIRTUAL NUMBER CARD
// =====================================================

function createVirtualNumberCard(order){

    const status =
        String(order.status || "")
        .toLowerCase()
        .trim();


    const number =
        String(order.number || "");


    const otp =
        String(order.otp_code || "");


    const sms =
        String(order.full_sms || "");


    const purchaseDate =
        formatDate(
            order.purchased_at ||
            order.created_at
        );


    let otpSection = "";


    if(otp){

        otpSection = `

            <div class="otp-box">

                <div class="virtual-label">
                    OTP Code
                </div>

                <strong>
                    ${esc(otp)}
                </strong>

                <br>

                <button
                    class="copy-btn copy-small"
                    onclick='copyContent(
                        this,
                        ${JSON.stringify(otp)}
                    )'
                >
                    📋 Copy OTP
                </button>

            </div>

        `;

    }else if(status === "waiting"){

        otpSection = `

            <div class="otp-box">

                <div class="virtual-label">
                    OTP Code
                </div>

                <strong>
                    Waiting...
                </strong>

            </div>

        `;

    }


    let smsSection = "";


    if(sms){

        smsSection = `

            <div class="sms-box">

                <div class="virtual-label">
                    Full SMS
                </div>

                ${esc(sms)}

            </div>

        `;

    }


    let numberSection = "";


    if(number){

        numberSection = `

            <div class="number-box">

                <div class="virtual-label">
                    Phone Number
                </div>

                <strong>
                    ${esc(number)}
                </strong>

                <br>

                <button
                    class="copy-btn copy-small"
                    onclick='copyContent(
                        this,
                        ${JSON.stringify(number)}
                    )'
                >
                    📋 Copy Number
                </button>

            </div>

        `;

    }


    let refundSection = "";


    if(status === "cancelled"){

        refundSection = `

            <div class="virtual-row">

                <span class="virtual-label">
                    Refund
                </span>

                <br>

                <strong>
                    ${
                        order.refunded_at
                        ? "✅ Wallet refunded"
                        : "Refund processing"
                    }
                </strong>

            </div>

        `;

    }


    const card =
        document.createElement("div");


    card.className =
        "virtual-number-card";


    card.innerHTML = `

        <div class="virtual-title">

            📱
            ${esc(
                order.service_name ||
                "Virtual Number"
            )}

            -
            ${esc(
                order.country_name ||
                ""
            )}

        </div>


        <div class="virtual-row">

            ${virtualStatusBadge(
                order.status
            )}

        </div>


        ${numberSection}


        ${otpSection}


        ${smsSection}


        <div class="virtual-row">

            <span class="virtual-label">
                Price
            </span>

            <br>

            <strong>
                ₦${formatMoney(
                    order.customer_price_ngn
                )}
            </strong>

        </div>


        <div class="virtual-row">

            <span class="virtual-label">
                Purchased
            </span>

            <br>

            ${esc(purchaseDate)}

        </div>


        ${refundSection}

    `;


    return card;

}


// =====================================================
// CREATE NORMAL PURCHASE CARD
// =====================================================

function createNormalPurchaseCard(purchase){

    const status =
        String(purchase.status || "")
        .toLowerCase()
        .trim();


    const content =
        String(
            purchase.content ?? ""
        );


    const safeContent =
        formatContent(content);


    const copyButton =
        content.trim()

        ? `

            <button
                class="copy-btn"
                onclick='copyContent(
                    this,
                    ${JSON.stringify(content)}
                )'
            >
                📋 Copy
            </button>

        `

        : "";


    const date =
        formatDate(
            purchase.created_at
        );


    const purchaseBox =
        document.createElement("div");


    purchaseBox.className =
        "purchase";


    purchaseBox.innerHTML = `

        <div class="top">

            <div class="name">

                ${esc(
                    purchase.product_name ||
                    "Unnamed Product"
                )}

            </div>


            <div class="amount">

                ₦${formatMoney(
                    purchase.amount
                )}

            </div>

        </div>


        <div class="status">

            ${
                status === "completed"

                ? `
                    <span class="badge badge-received">
                        ✅ Completed
                    </span>
                `

                : status === "cancelled"

                ? `
                    <span class="badge badge-cancelled">
                        ❌ Cancelled
                    </span>
                `

                : `
                    <span class="badge badge-waiting">
                        ${esc(
                            purchase.status ||
                            "Pending"
                        )}
                    </span>
                `
            }

        </div>


        ${
            content.trim()

            ? `

                <div class="content">
                    ${safeContent}
                </div>

                ${copyButton}

            `

            : ""
        }


        <div class="date">

            ${esc(date)}

        </div>

    `;


    return purchaseBox;

}


// =====================================================
// LOAD ALL PURCHASES
// =====================================================

async function loadPurchases(){

    const totalBox =
        document.getElementById(
            "totalSpent"
        );


    const container =
        document.getElementById(
            "allPurchases"
        );


    try{

        // =================================================
        // CHECK LOGIN
        // =================================================

        const {
            data:{
                user
            },
            error:authError
        } =
        await supabaseClient.auth.getUser();


        if(authError || !user){

            location.href =
                "login.html";

            return;

        }


        // =================================================
        // LOAD VIRTUAL NUMBER PURCHASES
        // =================================================

        const {
            data:virtualData,
            error:virtualError
        } =
        await supabaseClient

            .from(
                "virtual_number_orders"
            )

            .select(
                [
                    "id",
                    "user_id",
                    "numpool_order_id",
                    "service_code",
                    "service_name",
                    "country_id",
                    "country_name",
                    "number",
                    "provider_cost_usd",
                    "exchange_rate",
                    "provider_cost_ngn",
                    "customer_price_ngn",
                    "status",
                    "otp_code",
                    "full_sms",
                    "purchased_at",
                    "code_received_at",
                    "cancelled_at",
                    "refunded_at",
                    "created_at",
                    "updated_at"
                ].join(",")
            )

            .eq(
                "user_id",
                user.id
            )

            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(virtualError){

            console.error(
                "Virtual purchases error:",
                virtualError
            );

        }


        // =================================================
        // LOAD NORMAL PURCHASES
        // =================================================

        const {
            data:normalData,
            error:normalError
        } =
        await supabaseClient

            .from(
                "purchases"
            )

            .select(
                "id,product_id,product_name,amount,content,status,created_at"
            )

            .eq(
                "user_id",
                user.id
            )

            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(normalError){

            console.error(
                "Purchase loading error:",
                normalError
            );

        }


        // =================================================
        // CHECK BOTH RESULTS
        // =================================================

        if(
            virtualError &&
            normalError
        ){

            container.innerHTML = `

                <div class="error">

                    ❌ Unable to load purchases.

                    <br><br>

                    ${esc(
                        virtualError.message ||
                        normalError.message
                    )}

                </div>

            `;

            totalBox.textContent =
                "₦0.00";

            return;

        }


        // =================================================
        // COMBINE BOTH PURCHASE TYPES
        // =================================================

        const combined = [];


        (virtualData || []).forEach(
            order => {

                combined.push({

                    type:"virtual",

                    date:
                        order.created_at ||
                        order.purchased_at,

                    data:order

                });

            }
        );


        (normalData || []).forEach(
            purchase => {

                combined.push({

                    type:"normal",

                    date:
                        purchase.created_at,

                    data:purchase

                });

            }
        );


        // =================================================
        // SORT EVERYTHING TOGETHER
        // NEWEST PURCHASE ALWAYS FIRST
        // =================================================

        combined.sort(
            function(a,b){

                return (
                    new Date(b.date || 0).getTime()
                    -
                    new Date(a.date || 0).getTime()
                );

            }
        );


        // =================================================
        // EMPTY
        // =================================================

        if(combined.length === 0){

            container.innerHTML = `

                <div class="empty">

                    You haven't purchased
                    anything yet.

                </div>

            `;

            totalBox.textContent =
                "₦0.00";

            return;

        }


        // =================================================
        // TOTAL SPENT
        // =================================================

        let totalSpent = 0;


        // =================================================
        // RENDER IN ONE SHARED LIST
        // =================================================

        container.innerHTML = "";


        combined.forEach(
            item => {

                if(
                    item.type === "virtual"
                ){

                    const order =
                        item.data;


                    const status =
                        String(
                            order.status || ""
                        )
                        .toLowerCase()
                        .trim();


                    /*
                       Only completed virtual
                       numbers count as spending.

                       Cancelled/refunded numbers
                       do NOT count.
                    */

                    if(
                        status === "received"
                    ){

                        totalSpent +=
                            Number(
                                order.customer_price_ngn || 0
                            );

                    }


                    container.appendChild(
                        createVirtualNumberCard(
                            order
                        )
                    );

                }else{

                    const purchase =
                        item.data;


                    const status =
                        String(
                            purchase.status || ""
                        )
                        .toLowerCase()
                        .trim();


                    /*
                       Only completed normal
                       purchases count as spending.
                    */

                    if(
                        status === "completed"
                    ){

                        totalSpent +=
                            Number(
                                purchase.amount || 0
                            );

                    }


                    container.appendChild(
                        createNormalPurchaseCard(
                            purchase
                        )
                    );

                }

            }
        );


        totalBox.textContent =
            "₦" +
            formatMoney(
                totalSpent
            );


    }catch(error){

        console.error(
            "Unexpected purchase page error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ Something went wrong
                while loading purchases.

                <br><br>

                ${esc(
                    error.message
                )}

            </div>

        `;


        totalBox.textContent =
            "₦0.00";

    }

}


// =====================================================
// START
// =====================================================

loadPurchases();

</script>

</body>
</html>
