// =====================================================
// AUTOMATIC PROVIDER REFUND MARKERS
// These orders are hidden from My Purchases.
// Genuine customer cancellations remain visible.
// =====================================================

const AUTOMATIC_REFUND_MARKERS = [
    "provider_insufficient_funds_refunded",
    "virtualsms_insufficient_funds_refunded"
];


function isAutomaticProviderRefund(order){

    const providerState =
        String(order.provider_state || "")
            .trim()
            .toLowerCase();

    return AUTOMATIC_REFUND_MARKERS.some(
        marker => providerState.includes(marker)
    );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


// =====================================================
// FORMAT MONEY
// =====================================================

function formatMoney(value){

    return Number(value || 0)
        .toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


// =====================================================
// FORMAT DATE
// =====================================================

function formatDate(value){

    if(!value){
        return "";
    }

    try{

        return new Date(value).toLocaleString(
            "en-NG",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }catch{

        return "";

    }

}


// =====================================================
// CLICKABLE URL CONTENT
// =====================================================

function formatContent(value){

    const text =
        String(value ?? "");

    const escaped =
        esc(text);

    return escaped.replace(
        /(https?:\/\/[^\s<]+)/gi,
        function(url){

            return `
                <a
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >${url}</a>
            `;

        }
    );

}


// =====================================================
// COPY CONTENT
// =====================================================

async function copyContent(
    button,
    content
){

    try{

        await navigator.clipboard.writeText(
            String(content ?? "")
        );

        const oldText =
            button.textContent;

        button.textContent =
            "✅ Copied";

        setTimeout(()=>{

            button.textContent =
                oldText;

        },1500);

    }catch(error){

        console.error(
            "Copy failed:",
            error
        );

        alert(
            "❌ Could not copy. Please select the text manually."
        );

    }

}


// =====================================================

function cleanVirtualCustomerText(value){
    return String(value ?? "").replace(/\b(?:varsha\s*sms|varsha|text\s*verified|textverified|text\s*provider|virtual\s*sms|virtualsms|bashua\s*sms|bashua|grizzly\s*sms|grizzlysms|grizzly|smsbower|5sim)\b/gi, "").replace(/\s{2,}/g, " ").trim();
}
function extractVirtualOtp(value){
    const text = cleanVirtualCustomerText(value).replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n))).replace(/&#39;|&apos;/gi, "'");
    const patterns = [/(?:verification|security|sms|login|whatsapp)?\s*(?:code|otp|pin)\s*(?:is|:|=|-)?\s*["']?(\d{3,4}(?:[\s-]\d{3,4})?)/i, /(?:code|otp|pin)[^\d]{0,28}(\d{3,4}(?:[\s-]\d{3,4})?)/i];
    for(const pattern of patterns){const match=text.match(pattern);const digits=String(match?.[1]||"").replace(/\D/g,"");if(/^\d{4,8}$/.test(digits))return digits;}
    return "";
}
function cleanVirtualSms(value){
    const raw=String(value||"").trim(); if(!raw)return "";
    try{const parsed=JSON.parse(raw);const hasLink=Array.isArray(parsed)?parsed.some(x=>x&&typeof x==="object"&&(x.href||x.url)):parsed&&typeof parsed==="object"&&(parsed.href||parsed.url);if(hasLink)return "";
        if(Array.isArray(parsed))return parsed.map(x=>cleanVirtualSms(x?.content||x?.text||x?.body||x?.message||"")).filter(Boolean).join("\n");
        if(parsed&&typeof parsed==="object")return cleanVirtualSms(parsed.content||parsed.text||parsed.body||parsed.message||"");
    }catch{}
    return String(raw).replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/&#39;|&apos;/gi,"'");
}
function virtualStatusBadge(status){

    const value =
        String(status || "")
        .toLowerCase()
        .trim();


    if(value === "waiting"){

        return `
            <span class="badge badge-waiting">
                ⏳ Waiting for OTP
            </span>
        `;

    }


    if(value === "received"){

        return `
            <span class="badge badge-received">
                ✅ Verification Successful
            </span>
        `;

    }


    if(["cancelled","canceled","refunded","expired","failed","failed_refunded","rejected","declined"].includes(value)){

        return `
            <span class="badge badge-cancelled">
                ❌ Cancelled / Refunded
            </span>
        `;

    }


    return `
        <span class="badge badge-unknown">
            ${esc(status || "Unknown")}
        </span>
    `;

}

 });

 }));

function serviceDeliveryText(value){
    if(value===null||value===undefined||value==="")return "";
    if(typeof value==="string"){
        const raw=value.trim();if(!raw)return "";
        try{return serviceDeliveryText(JSON.parse(raw))}catch{return raw}
    }
    if(Array.isArray(value))return value.map(serviceDeliveryText).filter(Boolean).join("\n\n");
    if(typeof value!=="object")return String(value);
    const priority=["credentials","credential","delivery_info","delivery","content","result","data","account","details","items","logs","log"];
    for(const key of priority){
        if(value[key]!==undefined&&value[key]!==null&&value[key]!==""){
            const extracted=serviceDeliveryText(value[key]);
            if(extracted)return extracted;
        }
    }
    const hidden=new Set(["id","_id","order_id","provider_order_id","reference","wallet_reference","transaction_id","created_at","updated_at","status","success","provider","provider_name","provider_status","provider_order","provider_reference","source","vendor","service_provider","provider_label","provider_code","api_provider","raw_response","raw"]);
    const rows=Object.entries(value).filter(([key,val])=>!hidden.has(key.toLowerCase())&&val!==null&&val!=="").map(([key,val])=>{
        const label=key.replace(/_/g," ").replace(/\b\w/g,ch=>ch.toUpperCase());
        const content=typeof val==="object"?serviceDeliveryText(val):String(val);
        return content?label+": "+content:"";
    }).filter(Boolean);
    return rows.join("\n");
}

        const visibleVirtualData =

            (items||[]).forEach(item=>counts[purchaseBucket(item)]++);
            el.innerHTML=[
                {key:"completed",label:"Completed orders",count:counts.completed},
                {key:"pending",label:"Pending orders",count:counts.pending},
                {key:"cancelled",label:"Cancelled orders",count:counts.cancelled}
            ].map(s=>'<button type="button" class="purchase-stat" data-filter="'+s.key+'"><span>'+s.label+'</span><strong>'+s.count+'</strong></button>').join("");
            const apply=filter=>{
                el.querySelectorAll(".purchase-stat").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter));
                document.querySelectorAll("#allPurchases [data-purchase-status]").forEach(card=>card.style.display=filter==="all"||card.dataset.purchaseStatus===filter?"":"none");
            };
            const all=document.createElement("button");all.type="button";all.className="purchase-stat active";all.dataset.filter="all";all.innerHTML="<span>All orders</span><strong>"+(items||[]).length+"</strong>";el.prepend(all);
            el.querySelectorAll(".purchase-stat").forEach(b=>b.addEventListener("click",()=>apply(b.dataset.filter)));
        }

        // =================================================
        // EMPTY
        // =================================================

        renderPurchaseStats(combined);

        if(combined.length === 0){

            container.innerHTML = `

                <div class="empty">

                    You haven't purchased
                    anything yet.

                </div>

            `;

            totalBox.textContent =
                "₦0.00";

            return;

        }


        // =================================================
        // TOTAL SPENT
        // =================================================

        let totalSpent = 0;


        // =================================================
        // RENDER IN ONE SHARED LIST
        // =================================================

        container.innerHTML = "";


        combined.forEach(
            item => {

                if(
                    item.type === "virtual"
                ){

                    const order =
                        item.data;


                    const status =
                        String(
                            order.status || ""
                        )
                        .toLowerCase()
                        .trim();


                    /*
                       Only completed virtual
                       numbers count as spending.

                       Cancelled/refunded numbers
                       do NOT count.
                    */

                    if(
                        status === "received"
                    ){

                        totalSpent +=
                            Number(
                                order.customer_price_ngn || 0
                            );

                    }


                    const virtualCard=createVirtualNumberCard(order);
                    virtualCard.dataset.purchaseStatus=purchaseBucket(item);
                    container.appendChild(virtualCard);

                }else{

                    const purchase =
                        item.data;


                    const status =
                        String(
                            purchase.status || ""
                        )
                        .toLowerCase()
                        .trim();


                    /*
                       Only completed normal
                       purchases count as spending.
                    */

                    if(
                        status === "completed"
                    ){

                        totalSpent +=
                            Number(
                                purchase.amount || 0
                            );

                    }


                    const normalCard=createNormalPurchaseCard(purchase);
                    normalCard.dataset.purchaseStatus=purchaseBucket(item);
                    container.appendChild(normalCard);

                }

            }
        );


        totalBox.textContent =
            "₦" +
            formatMoney(
                totalSpent
            );


    }catch(error){

        console.error(
            "Unexpected purchase page error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ Something went wrong
                while loading purchases.

                <br><br>

                ${esc(
                    error.message
                )}

            </div>

        `;


        totalBox.textContent =
            "₦0.00";

    }

}


// =====================================================
// START
// =====================================================

loadPurchases();

</script>
