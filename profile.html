<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Profile - Delight Vendor Logs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 0 30px;
      background: #f3f6ff;
      color: #10152b;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       PROFILE HEADER
    ========================= */

    .profile-header {
      margin: 20px 28px 28px;
      padding: 20px 18px;
      min-height: 145px;
      border-radius: 28px;
      background:
        radial-gradient(
          circle at 85% 10%,
          rgba(255,255,255,.08),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #1028b8,
          #061a88
        );
      display: flex;
      align-items: center;
      gap: 18px;
      color: white;
      overflow: hidden;
      position: relative;
    }

    .profile-header::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
      right: -90px;
      top: -100px;
    }

    .dv-logo {
      width: 72px;
      height: 72px;
      min-width: 72px;
      border-radius: 22px;
      background: rgba(255,255,255,.12);
      border: 2px solid rgba(255,255,255,.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      position: relative;
      z-index: 2;
    }

    .header-text {
      position: relative;
      z-index: 2;
    }

    .header-text h1 {
      margin: 0 0 7px;
      font-size: 24px;
      line-height: 1.15;
    }

    .header-text p {
      margin: 0;
      color: rgba(255,255,255,.58);
      font-size: 16px;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      margin: 0 28px 25px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 11px;
      color: #909bb9;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .section-title::after {
      content: "";
      height: 1px;
      background: #dce2ef;
      flex: 1;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      background: white;
      border: 1px solid #e0e5f0;
      border-radius: 24px;
      overflow: hidden;
    }

    .profile-row {
      min-height: 102px;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid #e8ebf2;
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    .icon-box {
      width: 64px;
      height: 64px;
      min-width: 64px;
      border-radius: 18px;
      background: #edf2ff;
      border: 1px solid #d5def6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
    }

    .row-info {
      flex: 1;
      min-width: 0;
    }

    .row-label {
      margin-bottom: 4px;
      color: #9aa4bd;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .row-value {
      color: #10152b;
      font-size: 19px;
      font-weight: 700;
      word-break: break-word;
    }

    /* =========================
       WALLET
    ========================= */

    .wallet-card {
      padding: 20px 22px;
      border-radius: 24px;
      background: linear-gradient(
        135deg,
        #1230d0,
        #073eea
      );
      color: white;
    }

    .wallet-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .wallet-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: rgba(255,255,255,.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .wallet-label {
      font-size: 13px;
      color: rgba(255,255,255,.65);
      font-weight: 700;
      text-transform: uppercase;
    }

    .wallet-balance {
      margin-top: 5px;
      font-size: 25px;
      font-weight: 800;
    }

    .fund-wallet {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: 0;
      border-radius: 13px;
      background: white;
      color: #063edc;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    /* =========================
       CLICKABLE ROW
    ========================= */

    .clickable {
      cursor: pointer;
    }

    .arrow {
      color: #9aa5bd;
      font-size: 28px;
      line-height: 1;
    }

    /* =========================
       BUTTONS
    ========================= */

    .logout {
      display: block;
      width: calc(100% - 56px);
      margin: 5px 28px 13px;
      padding: 17px;
      border: 0;
      border-radius: 20px;
      background: linear-gradient(
        135deg,
        #1645ee,
        #0639e8
      );
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .back-dashboard {
      display: block;
      width: calc(100% - 56px);
      margin: 0 28px 20px;
      padding: 16px;
      border: 2px solid #d7dff0;
      border-radius: 20px;
      background: transparent;
      color: #0844db;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    /* =========================
       FOOTER
    ========================= */

    .support-text {
      text-align: center;
      color: #8d99b8;
      font-size: 14px;
      margin: 0 20px 12px;
    }

    .member-badge {
      width: fit-content;
      max-width: calc(100% - 56px);
      margin: 0 auto 20px;
      padding: 8px 15px;
      border-radius: 25px;
      border: 1px solid #d9e1f4;
      color: #2c5fd4;
      background: #f7f9ff;
      font-size: 13px;
      font-weight: 700;
    }

    #message {
      text-align: center;
      margin: 10px 20px;
      color: #d22;
    }

  </style>

</head>


<body>


<!-- =========================
     PROFILE HEADER
========================= -->

<div class="profile-header">

  <div class="dv-logo">
    DV
  </div>

  <div class="header-text">

    <h1>
      Delight Vendor Logs
    </h1>

    <p id="memberSince">
      Member since...
    </p>

  </div>

</div>


<!-- =========================
     ACCOUNT INFORMATION
========================= -->

<section class="section">

  <div class="section-title">
    Account Information
  </div>

  <div class="card">

    <div class="profile-row">

      <div class="icon-box">
        👤
      </div>

      <div class="row-info">

        <div class="row-label">
          Full Name
        </div>

        <div
          class="row-value"
          id="userName"
        >
          Loading...
        </div>

      </div>

    </div>


    <div class="profile-row">

      <div class="icon-box">
        ✉️
      </div>

      <div class="row-info">

        <div class="row-label">
          Email
        </div>

        <div
          class="row-value"
          id="userEmail"
        >
          Loading...
        </div>

      </div>

    </div>

  </div>

</section>


<!-- =========================
     WALLET
========================= -->

<section class="section">

  <div class="section-title">
    Wallet
  </div>

  <div class="wallet-card">

    <div class="wallet-title">

      <div class="wallet-icon">
        💳
      </div>

      <div>

        <div class="wallet-label">
          Available Wallet
        </div>

        <div
          class="wallet-balance"
          id="walletBalance"
        >
          ₦0.00
        </div>

      </div>

    </div>

    <button
      class="fund-wallet"
      type="button"
      onclick="window.location.href='wallet.html'"
    >
      + Fund Wallet
    </button>

  </div>

</section>


<!-- =========================
     SUPPORT
========================= -->

<section class="section">

  <div class="section-title">
    Support
  </div>

  <div class="card">

    <div
      class="profile-row clickable"
      onclick="openWhatsApp()"
    >

      <div class="icon-box">
        🎧
      </div>

      <div class="row-info">

        <div class="row-value">
          Help &amp; Support
        </div>

      </div>

      <div class="arrow">
        ›
      </div>

    </div>

  </div>

</section>


<!-- =========================
     LOG OUT
========================= -->

<button
  class="logout"
  type="button"
  onclick="logout()"
>
  ⇥ &nbsp; Log Out
</button>


<!-- =========================
     BACK TO DASHBOARD
========================= -->

<button
  class="back-dashboard"
  type="button"
  onclick="window.location.href='dashboard.html'"
>
  ← &nbsp; Back to Dashboard
</button>


<div class="support-text">
  Need help? Contact us on WhatsApp 💬
</div>


<div
  class="member-badge"
  id="memberBadge"
>
  DV Member since...
</div>


<p id="message"></p>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   WHATSAPP
========================= */

function openWhatsApp() {

  window.open(
    "https://wa.me/2347015908401",
    "_blank"
  );

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

  const {
    data: {
      user
    },
    error
  } =
    await supabaseClient.auth.getUser();


  if (error || !user) {

    window.location.href =
      "login.html";

    return;

  }


  /* =========================
     NAME
  ========================= */

  let name =
    user.user_metadata?.name;


  if (!name) {

    const firstName =
      user.user_metadata?.first_name || "";

    const lastName =
      user.user_metadata?.last_name || "";

    name =
      (
        firstName +
        " " +
        lastName
      ).trim();

  }


  document
    .getElementById("userName")
    .textContent =
      name || "Not set";


  /* =========================
     EMAIL
  ========================= */

  document
    .getElementById("userEmail")
    .textContent =
      user.email || "Not available";


  /* =========================
     MEMBER SINCE
     FETCHED FROM SUPABASE
  ========================= */

  if (user.created_at) {

    const joinedDate =
      new Date(user.created_at);


    const memberSince =
      joinedDate.toLocaleDateString(
        "en-US",
        {
          month: "long",
          year: "numeric"
        }
      );


    document
      .getElementById("memberSince")
      .textContent =
        "Member since " +
        memberSince;


    document
      .getElementById("memberBadge")
      .textContent =
        "DV Member since " +
        memberSince;

  }


  /* =========================
     WALLET
  ========================= */

  const {
    data: balance,
    error: walletError
  } =
    await supabaseClient.rpc(
      "get_my_wallet"
    );


  if (walletError) {

    console.error(
      "Wallet error:",
      walletError
    );

    document
      .getElementById("walletBalance")
      .textContent =
        "Unable to load";

    return;

  }


  document
    .getElementById("walletBalance")
    .textContent =
      "₦" +
      Number(balance || 0)
        .toLocaleString(
          "en-NG",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );

}


/* =========================
   LOG OUT
========================= */

async function logout() {

  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if (error) {

    document
      .getElementById("message")
      .textContent =
        error.message;

    return;

  }


  window.location.href =
    "login.html";

}


/* =========================
   START
========================= */

loadProfile();

</script>


</body>

</html>
