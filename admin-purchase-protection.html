<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Purchase Protection Admin — Delight Vendor Logs</title><link rel="icon" href="assets/dv-logo.png"><style>
:root{--gold:#d4af37;--muted:#b8ad8d;--line:#453719}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f0df;font:14px Arial,sans-serif}.top{padding:15px;border-bottom:1px solid #302817;display:flex;gap:10px;align-items:center}.top img{width:34px;height:34px}.top b{flex:1}.top a{color:var(--gold);text-decoration:none}.wrap{max-width:1050px;margin:24px auto;padding:0 14px 45px}h1{font-size:clamp(24px,5vw,34px)}.muted{color:var(--muted);font-size:12px;line-height:1.6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid #8b6d20;background:#211a0b;color:#f3d77d;border-radius:9px;padding:10px 12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--gold);color:#111}.panel{background:#111;border:1px solid var(--line);border-radius:13px;padding:16px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}textarea,select{background:#080808;color:#fff;border:1px solid #59471e;border-radius:8px;padding:10px;font:inherit}textarea{width:100%;min-height:70px;margin:8px 0}.tag{border:1px solid #5b4920;border-radius:20px;padding:4px 8px;color:#e6c75e;font-size:11px}.hidden{display:none!important}.error{color:#ffaaaa}.good{color:#9ce0ad}
</style></head><body><header class="top"><img src="assets/dv-logo.png" alt=""><b>Delight Vendor Logs · Purchase Protection Admin</b><a href="admin.html">Main Admin</a></header><main class="wrap"><h1>Purchase reports & reviews</h1><p class="muted">Review customer reports and moderate reviews before publication.</p><div id="status" class="muted">Checking administrator access…</div><div id="app" class="hidden"><div class="tabs"><button class="btn primary" data-tab="tickets">Purchase reports</button><button class="btn" data-tab="reviews">Reviews</button></div><section id="tickets"></section><section id="reviews" class="hidden"></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{"use strict";const db=supabase.createClient("https://hkfhehbhmucymusaytoe.supabase.co","sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_");const $=id=>document.getElementById(id);let tab="tickets";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function status(t,bad=false){$("status").textContent=t;$("status").className=bad?"error":"muted"}
async function loadTickets(){const {data,error}=await db.from("purchase_support_tickets").select("id,purchase_id,user_id,issue_type,customer_message,status,admin_response,created_at").order("created_at",{ascending:false}).limit(300);if(error)throw error;const rows=data||[];$("tickets").innerHTML=rows.length?rows.map(x=>'<article class="panel" data-id="'+x.id+'"><div class="row"><b>Purchase #'+x.purchase_id+'</b><span class="tag">'+esc(x.status)+'</span><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span></div><p class="muted">Customer ID: '+esc(x.user_id)+' · '+esc(x.issue_type)+'</p><p>'+esc(x.customer_message)+'</p><textarea class="response" placeholder="Write a response to the customer">'+esc(x.admin_response||"")+'</textarea><div class="row"><select class="ticket-status"><option value="open">Open</option><option value="in_review">In review</option><option value="resolved">Resolved</option><option value="rejected">Rejected</option></select><button class="btn primary save-ticket">Save response</button></div></article>').join(""):'<div class="panel muted">No purchase reports yet.</div>';
$("tickets").querySelectorAll(".panel[data-id]").forEach(el=>{el.querySelector(".ticket-status").value=rows.find(x=>x.id===el.dataset.id).status;el.querySelector(".save-ticket").onclick=async()=>{const b=el.querySelector(".save-ticket");b.disabled=true;try{const {error}=await db.rpc("dv_admin_update_purchase_ticket",{p_ticket_id:el.dataset.id,p_status:el.querySelector(".ticket-status").value,p_admin_response:el.querySelector(".response").value});if(error)throw error;status("Purchase report updated.");await loadTickets()}catch(e){status(e.message,true)}finally{b.disabled=false}}});
}
async function loadReviews(){const {data,error}=await db.from("purchase_reviews").select("id,purchase_id,user_id,rating,review_text,status,admin_note,created_at").order("created_at",{ascending:false}).limit(300);if(error)throw error;const rows=data||[];$("reviews").innerHTML=rows.length?rows.map(x=>'<article class="panel" data-id="'+x.id+'"><div class="row"><b>Purchase #'+x.purchase_id+'</b><span class="tag">'+esc(x.status)+'</span><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span></div><p class="muted">Customer ID: '+esc(x.user_id)+'</p><p class="good">'+("★".repeat(x.rating))+("☆".repeat(5-x.rating))+'</p><p>'+esc(x.review_text)+'</p><textarea class="note" placeholder="Optional admin note">'+esc(x.admin_note||"")+'</textarea><div class="row"><button class="btn primary approve">Approve</button><button class="btn reject">Reject</button></div></article>').join(""):'<div class="panel muted">No reviews submitted yet.</div>';
$("reviews").querySelectorAll(".panel[data-id]").forEach(el=>{for(const [cls,val] of [["approve","approved"],["reject","rejected"]])el.querySelector("."+cls).onclick=async()=>{const b=el.querySelector("."+cls);b.disabled=true;try{const {error}=await db.rpc("dv_admin_moderate_purchase_review",{p_review_id:el.dataset.id,p_status:val,p_admin_note:el.querySelector(".note").value});if(error)throw error;status("Review "+val+".");await loadReviews()}catch(e){status(e.message,true)}finally{b.disabled=false}}});
}
async function show(){ $("tickets").classList.toggle("hidden",tab!=="tickets");$("reviews").classList.toggle("hidden",tab!=="reviews");document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("primary",b.dataset.tab===tab));if(tab==="tickets")await loadTickets();else await loadReviews()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;show().catch(e=>status(e.message,true))});
(async()=>{const {data:{user},error}=await db.auth.getUser();if(error||!user){location.href="login.html?redirect="+encodeURIComponent("admin-purchase-protection.html");return}const a=await db.rpc("is_admin");if(a.error||a.data!==true){status("Administrator access required.",true);return}$("app").classList.remove("hidden");status("Administrator access verified.");await show()})().catch(e=>status(e.message,true));
})();
</script></body></html>
