<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fund Wallet - Delight Vendor Logs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#111;font-family:Arial,sans-serif}
header{background:#111;color:#fff;padding:20px;text-align:center}
header h1{margin:0;font-size:25px}
main{width:100%;max-width:500px;margin:auto;padding:25px 20px 40px}
h2{margin:25px 0 12px}
.card{background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#walletBalance{margin:0;font-size:30px;font-weight:bold}
#amount{width:100%;padding:16px;border:1px solid #ccc;border-radius:10px;font-size:18px;outline:none}
#amount:focus{border-color:#111}
.btn{width:100%;border:0;background:#111;color:#fff;padding:16px;margin-top:15px;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer}
.btn:disabled{opacity:.6;cursor:not-allowed}
#message{min-height:25px;margin-top:18px;font-weight:bold;line-height:1.5}
.back-btn{width:100%;background:#333;color:#fff;padding:16px;margin-top:15px;border-radius:10px;text-align:center;font-size:17px;font-weight:bold;cursor:pointer}
</style>
</head>

<body>

<header>
<h1>Fund Wallet</h1>
</header>

<main>

<h2>Your Balance</h2>

<div class="card">
<p id="walletBalance">Loading...</p>
</div>

<h2>Add Money</h2>

<div class="card">
<input
id="amount"
type="number"
min="100"
step="1"
placeholder="Enter amount"
>

<button id="continueButton" class="btn" onclick="continuePayment()">
Continue
</button>

<p id="message"></p>
</div>

<div class="back-btn" onclick="window.location.href='dashboard.html'">
🏠 Back to Dashboard
</div>

</main>

<script>
const SUPABASE_URL="https://hkfhehbhmucymusaytoe.supabase.co";
const SUPABASE_KEY="sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const MONNIFY_FUNCTION=
`${SUPABASE_URL}/functions/v1/monnify_init_payment`;

function showMessage(text,color="#111"){
  const message=document.getElementById("message");
  message.style.color=color;
  message.textContent=text;
}

async function loadWallet(){
  try{
    const {data:{user},error:userError}=
      await supabaseClient.auth.getUser();

    if(userError||!user){
      window.location.href="login.html";
      return;
    }

    const {data:wallet,error}=
      await supabaseClient.rpc("ensure_my_wallet");

    if(error){
      console.error("Wallet error:",error);
      document.getElementById("walletBalance").textContent=
        "Unable to load wallet";
      return;
    }

    const balance=wallet?.balance??0;

    document.getElementById("walletBalance").textContent=
      "₦"+Number(balance).toLocaleString("en-NG",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      });

  }catch(error){
    console.error("Load wallet error:",error);
    document.getElementById("walletBalance").textContent=
      "Unable to load wallet";
  }
}

async function getSession(){
  const {data:{session}}=
    await supabaseClient.auth.getSession();

  if(!session){
    throw new Error("Your login session has expired.");
  }

  return session;
}

async function continuePayment(){

  const amount=Number(
    document.getElementById("amount").value
  );

  const button=document.getElementById("continueButton");

  if(!Number.isFinite(amount)||amount<100){
    showMessage(
      "Please enter at least ₦100.",
      "red"
    );
    return;
  }

  try{

    const session=await getSession();

    button.disabled=true;
    button.textContent="Preparing payment...";

    showMessage(
      "Preparing your payment...",
      "#111"
    );

    const response=await fetch(
      MONNIFY_FUNCTION,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":
            `Bearer ${session.access_token}`
        },
        body:JSON.stringify({
          amount:amount
        })
      }
    );

    const result=await response.json();

    console.log(
      "Monnify initialize:",
      result
    );

    if(!response.ok||!result.success){
      throw new Error(
        result?.error||
        "Unable to start payment."
      );
    }

    if(!result.checkoutUrl){
      throw new Error(
        "Monnify did not return a checkout URL."
      );
    }

    localStorage.setItem(
      "pending_monnify_payment",
      JSON.stringify({
        reference:
          result.paymentReference,
        amount:amount
      })
    );

    showMessage(
      "Opening payment...",
      "#111"
    );

    window.location.href=
      result.checkoutUrl;

  }catch(error){

    console.error(
      "Payment error:",
      error
    );

    showMessage(
      error.message||
      "Unable to start payment.",
      "red"
    );

    button.disabled=false;
    button.textContent="Continue";
  }
}

function checkPaymentReturn(){

  const params=
    new URLSearchParams(
      window.location.search
    );

  const reference=
    params.get("paymentReference")||
    params.get("paymentReferenceId")||
    params.get("reference");

  if(reference){

    showMessage(
      "Payment completed. Your wallet is being updated...",
      "#111"
    );

    localStorage.removeItem(
      "pending_monnify_payment"
    );

    setTimeout(()=>{
      loadWallet();
      showMessage(
        "Payment received. Your wallet balance will update shortly.",
        "green"
      );

      window.history.replaceState(
        {},
        document.title,
        "wallet.html"
      );
    },2000);
  }
}

loadWallet();
checkPaymentReturn();
</script>

</body>
</html>
