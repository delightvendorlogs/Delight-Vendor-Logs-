<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fund Wallet</title>
<script src="https://js.paystack.co/v2/inline.js"></script>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5;padding:20px}
.box{max-width:450px;margin:40px auto;background:white;padding:25px;border-radius:15px}
h2{margin-top:0}
input,button{width:100%;padding:15px;margin-top:12px;box-sizing:border-box;border-radius:8px}
input{border:1px solid #ddd}
button{border:0;background:#111;color:white;font-size:16px}
#msg{margin-top:15px}
</style>
</head>
<body>

<div class="box">
<h2>Fund Wallet</h2>
<p>Enter amount to add to your wallet.</p>

<input id="amount" type="number" min="100" placeholder="Enter amount">

<button onclick="pay()">Fund Wallet</button>

<div id="msg"></div>
</div>

<script>
const PAYSTACK_PUBLIC_KEY="pk_live_404fd9834a0f367328c2fb55a2256e406ed6b43f";

async function pay(){
  const amount=Number(document.getElementById("amount").value);
  const msg=document.getElementById("msg");

  if(!amount||amount<100){
    msg.textContent="Enter at least ₦100";
    return;
  }

  const email=prompt("Enter your email:");
  if(!email)return;

  const reference="WALLET-"+Date.now();

  const popup=new PaystackPop();

  popup.newTransaction({
    key:PAYSTACK_PUBLIC_KEY,
    email:email,
    amount:amount*100,
    reference:reference,

    onSuccess:function(transaction){
      msg.textContent="Payment received. Confirming...";
      window.location.href="wallet.html?payment=success&reference="+transaction.reference;
    },

    onCancel:function(){
      msg.textContent="Payment cancelled.";
    }
  });
}
</script>

</body>
</html>
