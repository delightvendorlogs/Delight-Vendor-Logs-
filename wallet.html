<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fund Wallet - Delight Vendor Logs</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ZevPay Inline Checkout -->
  <script src="https://js.zevpaycheckout.com/v1/inline.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    h2 {
      margin-top: 25px;
    }

    .profile-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    #walletBalance {
      font-size: 28px;
      font-weight: bold;
      margin: 0;
    }

    #amount {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-top: 10px;
    }

    .payment-option {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .payment-option input {
      margin-right: 10px;
    }

    .btn {
      display: inline-block;
      border: none;
      background: #111;
      color: white;
      padding: 15px 30px;
      margin: 10px 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      font-weight: bold;
      margin-top: 15px;
      line-height: 1.5;
    }

    .back-btn {
      display: inline-block;
      background: #333;
      color: white;
      padding: 15px 25px;
      margin-top: 15px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>


<body>

<header>
  <h1>Fund Wallet</h1>
</header>


<main>

  <h2>Your Balance</h2>

  <div class="profile-card">
    <p id="walletBalance">
      Loading...
    </p>
  </div>


  <h2>Add Money</h2>

  <input
    id="amount"
    type="number"
    min="100"
    step="1"
    placeholder="Enter amount"
  >


  <h2>Select Payment Method</h2>

  <div class="payment-option">
    <label>
      <input
        type="radio"
        name="payment"
        value="bank"
      >
      Bank Transfer
    </label>
  </div>

  <div class="payment-option">
    <label>
      <input
        type="radio"
        name="payment"
        value="card"
      >
      Card
    </label>
  </div>


  <button
    id="continueButton"
    class="btn"
    onclick="continuePayment()"
  >
    Continue
  </button>


  <p id="message"></p>


  <div
    class="back-btn"
    onclick="window.location.href='dashboard.html'"
  >
    🏠 Back to Dashboard
  </div>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ZEVPAY PUBLIC KEY
===================================================== */

const ZEVPAY_PUBLIC_KEY =
  "pk_live_d27da0360c991aab38fd0d8b3e84a9742c65b36391f1fe7e";


/* =====================================================
   LOAD WALLET
===================================================== */

async function loadWallet() {

  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  /* USER NOT LOGGED IN */

  if (userError || !user) {

    window.location.href =
      "login.html";

    return;
  }


  console.log(
    "Logged in user:",
    user.id
  );


  /* GET / CREATE WALLET */

  const {
    data: wallet,
    error
  } =
    await supabaseClient.rpc(
      "ensure_my_wallet"
    );


  if (error) {

    console.error(
      "WALLET ERROR:",
      error
    );

    document.getElementById(
      "walletBalance"
    ).textContent =
      "Wallet error: " +
      error.message;

    return;
  }


  console.log(
    "WALLET DATA:",
    wallet
  );


  const balance =
    wallet?.balance ?? 0;


  document.getElementById(
    "walletBalance"
  ).textContent =
    "₦" +
    Number(balance).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );
}


/* =====================================================
   GENERATE PAYMENT REFERENCE
===================================================== */

function generateReference() {

  return (
    "WALLET-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase()
  );
}


/* =====================================================
   CONTINUE PAYMENT
===================================================== */

async function continuePayment() {

  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );


  const payment =
    document.querySelector(
      'input[name="payment"]:checked'
    );


  const message =
    document.getElementById(
      "message"
    );


  const button =
    document.getElementById(
      "continueButton"
    );


  /* AMOUNT CHECK */

  if (
    !Number.isFinite(amount) ||
    amount < 100
  ) {

    message.style.color = "red";

    message.textContent =
      "Please enter at least ₦100.";

    return;
  }


  /* PAYMENT METHOD CHECK */

  if (!payment) {

    message.style.color = "red";

    message.textContent =
      "Please select a payment method.";

    return;
  }


  /* CHECK ZEVPAY SDK */

  if (
    !window.ZevPay ||
    !window.ZevPay.ZevPayCheckout
  ) {

    message.style.color = "red";

    message.textContent =
      "ZevPay checkout failed to load. Please refresh the page.";

    console.error(
      "ZevPay SDK is not available."
    );

    return;
  }


  /* GET USER */

  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if (userError || !user) {

    message.style.color = "red";

    message.textContent =
      "Your session has expired. Please log in again.";

    window.location.href =
      "login.html";

    return;
  }


  /* AMOUNT IN KOBO */

  const amountKobo =
    Math.round(amount * 100);


  /* UNIQUE REFERENCE */

  const reference =
    generateReference();


  console.log(
    "Starting ZevPay payment:",
    {
      amountNaira: amount,
      amountKobo,
      reference,
      userId: user.id
    }
  );


  /* DISABLE BUTTON */

  button.disabled = true;

  button.textContent =
    "Opening payment...";


  message.style.color =
    "#111";

  message.textContent =
    "Opening ZevPay checkout...";


  try {

    const zp =
      new ZevPay.ZevPayCheckout();


    zp.checkout({

      apiKey:
        ZEVPAY_PUBLIC_KEY,

      email:
        user.email,

      amount:
        amountKobo,

      reference:
        reference,

      metadata: {

        user_id:
          user.id,

        purpose:
          "wallet_funding",

        amount_naira:
          amount

      },


      /* PAYMENT SUCCESS */

      onSuccess:
        async function(ref) {

          console.log(
            "ZevPay payment successful:",
            ref
          );


          message.style.color =
            "green";

          message.textContent =
            "Payment successful! Your wallet is being updated...";


          /*
            IMPORTANT:

            We DO NOT directly add money
            to the wallet here.

            The ZevPay webhook does that
            securely on the server.
          */


          button.textContent =
            "Payment Successful";


          /*
            Give the webhook a moment,
            then reload the wallet balance.
          */

          setTimeout(
            async function() {

              await loadWallet();

              message.textContent =
                "Payment confirmed. Your wallet balance has been updated.";

              button.disabled =
                false;

              button.textContent =
                "Continue";

            },
            3000
          );

        },


      /* PAYMENT CANCELLED */

      onCancel:
        function() {

          console.log(
            "ZevPay payment cancelled."
          );


          message.style.color =
            "red";

          message.textContent =
            "Payment cancelled.";


          button.disabled =
            false;

          button.textContent =
            "Continue";

        }

    });


  } catch (error) {

    console.error(
      "ZevPay checkout error:",
      error
    );


    message.style.color =
      "red";

    message.textContent =
      "Unable to open payment checkout. Please try again.";


    button.disabled =
      false;

    button.textContent =
      "Continue";
  }

}


/* =====================================================
   START
===================================================== */

loadWallet();

</script>


</body>

  </html>
