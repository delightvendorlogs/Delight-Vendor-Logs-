<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fund Wallet - Delight Vendor Logs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.zevpaycheckout.com/v1/inline.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    main {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 25px 20px 40px;
    }

    h2 {
      margin-top: 25px;
      margin-bottom: 12px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    #walletBalance {
      margin: 0;
      font-size: 30px;
      font-weight: bold;
    }

    #amount {
      width: 100%;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 18px;
      outline: none;
    }

    .payment-option {
      background: white;
      border: 1px solid #ddd;
      padding: 17px;
      margin-bottom: 12px;
      border-radius: 10px;
      font-size: 17px;
    }

    .payment-option input {
      margin-right: 10px;
    }

    .btn {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 16px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      min-height: 25px;
      margin-top: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    .back-btn {
      width: 100%;
      background: #333;
      color: white;
      padding: 16px;
      margin-top: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>Fund Wallet</h1>
</header>

<main>

  <h2>Your Balance</h2>

  <div class="card">
    <p id="walletBalance">Loading...</p>
  </div>

  <h2>Add Money</h2>

  <input
    id="amount"
    type="number"
    min="100"
    step="1"
    placeholder="Enter amount"
  >

  <h2>Select Payment Method</h2>

  <div class="payment-option">
    <label>
      <input
        type="radio"
        name="payment"
        value="bank"
      >
      Bank Transfer
    </label>
  </div>

  <div class="payment-option">
    <label>
      <input
        type="radio"
        name="payment"
        value="payid"
      >
      ZevPay ID
    </label>
  </div>

  <button
    id="continueButton"
    class="btn"
    onclick="continuePayment()"
  >
    Continue
  </button>

  <p id="message"></p>

  <div
    class="back-btn"
    onclick="window.location.href='dashboard.html'"
  >
    🏠 Back to Dashboard
  </div>

</main>

<script>

const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/*
  IMPORTANT:
  Put your NEW ZevPay public key here.
  This is the pk_live key you regenerated.
*/
const ZEVPAY_PUBLIC_KEY =
  "pk_live_44ba87722fc7b872d0338b516253b8ac6cfce03e8a909e78";


/*
  This must be the SAME Supabase Edge Function
  where you saved the ZevPay function.
*/
const VERIFY_FUNCTION =
  "zevpay_webhook";


async function getCurrentUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();

  if (error || !data.user) {
    return null;
  }

  return data.user;
}


/* ==========================================
   LOAD WALLET
========================================== */

async function loadWallet() {

  const balanceElement =
    document.getElementById(
      "walletBalance"
    );

  try {

    const user =
      await getCurrentUser();

    if (!user) {

      window.location.href =
        "login.html";

      return;
    }


    const {
      data: wallet,
      error
    } =
      await supabaseClient.rpc(
        "ensure_my_wallet"
      );


    if (error) {

      console.error(
        "Wallet error:",
        error
      );

      balanceElement.textContent =
        "Wallet error";

      return;
    }


    const balance =
      wallet?.balance ?? 0;


    balanceElement.textContent =
      "₦" +
      Number(balance).toLocaleString(
        "en-NG",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

  } catch (error) {

    console.error(
      "Wallet loading error:",
      error
    );

    balanceElement.textContent =
      "Unable to load wallet";
  }
}


/* ==========================================
   CREATE PENDING TRANSACTION
========================================== */

async function createPendingTransaction(
  user,
  amount
) {

  /*
    We cannot know the ZevPay reference until
    checkout gives it to us.

    So this function is only used to keep
    the payment amount/user context ready.
  */

  console.log(
    "Starting payment:",
    {
      userId: user.id,
      email: user.email,
      amount
    }
  );

}


/* ==========================================
   VERIFY PAYMENT
========================================== */

async function verifyPayment(
  reference
) {

  const {
    data: sessionData
  } =
    await supabaseClient.auth.getSession();


  const accessToken =
    sessionData?.session?.access_token;


  if (!accessToken) {

    throw new Error(
      "Your login session expired."
    );
  }


  const response =
    await fetch(
      `${SUPABASE_URL}/functions/v1/${VERIFY_FUNCTION}`,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          "Authorization":
            `Bearer ${accessToken}`
        },

        body: JSON.stringify({
          action:
            "verify_payment",

          reference:
            reference
        })
      }
    );


  const result =
    await response.json();


  console.log(
    "Payment verification:",
    result
  );


  if (!response.ok) {

    throw new Error(
      result?.error ||
      "Payment verification failed"
    );
  }


  return result;
}


/* ==========================================
   PAYMENT
========================================== */

async function continuePayment() {

  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );


  const payment =
    document.querySelector(
      'input[name="payment"]:checked'
    );


  const message =
    document.getElementById(
      "message"
    );


  const button =
    document.getElementById(
      "continueButton"
    );


  if (
    !Number.isFinite(amount) ||
    amount < 100
  ) {

    message.style.color =
      "red";

    message.textContent =
      "Please enter at least ₦100.";

    return;
  }


  if (!payment) {

    message.style.color =
      "red";

    message.textContent =
      "Please select a payment method.";

    return;
  }


  const user =
    await getCurrentUser();


  if (!user) {

    message.style.color =
      "red";

    message.textContent =
      "Please log in again.";

    window.location.href =
      "login.html";

    return;
  }


  if (
    !window.ZevPay ||
    !window.ZevPay.ZevPayCheckout
  ) {

    message.style.color =
      "red";

    message.textContent =
      "ZevPay checkout failed to load. Refresh the page.";

    return;
  }


  const amountKobo =
    Math.round(
      amount * 100
    );


  button.disabled =
    true;

  button.textContent =
    "Opening checkout...";


  message.style.color =
    "#111";

  message.textContent =
    "Opening ZevPay checkout...";


  try {

    const checkout =
      new ZevPay.ZevPayCheckout();


    checkout.checkout({

      apiKey:
        ZEVPAY_PUBLIC_KEY,

      email:
        user.email,

      amount:
        amountKobo,

      /*
        Match your dashboard payment methods.
      */
      paymentMethods:
        payment.value === "bank"
          ? ["bank"]
          : ["payid"],


      onSuccess:
        async (reference) => {

          console.log(
            "ZevPay SUCCESS:",
            reference
          );


          message.style.color =
            "#111";

          message.textContent =
            "Payment successful. Confirming payment...";


          try {

            /*
              Server verifies the payment
              before touching the wallet.
            */

            const result =
              await verifyPayment(
                reference
              );


            if (
              result.success &&
              result.credited
            ) {

              message.style.color =
                "green";

              message.textContent =
                "₦" +
                Number(amount).toLocaleString(
                  "en-NG"
                ) +
                " added to your wallet successfully!";


              await loadWallet();


            } else {

              message.style.color =
                "#111";

              message.textContent =
                result.message ||
                "Payment received. Your wallet is being updated...";
            }


          } catch (error) {

            console.error(
              "Verification error:",
              error
            );


            message.style.color =
              "red";

            message.textContent =
              "Payment was received, but wallet confirmation is still processing. Please refresh shortly.";
          }


          button.disabled =
            false;

          button.textContent =
            "Continue";
        }

    });


  } catch (error) {

    console.error(
      "ZevPay checkout error:",
      error
    );


    message.style.color =
      "red";

    message.textContent =
      "Unable to open ZevPay checkout. Please try again.";


    button.disabled =
      false;

    button.textContent =
      "Continue";
  }

}


/* ==========================================
   START
========================================== */

loadWallet();

</script>

</body>
  </html>
