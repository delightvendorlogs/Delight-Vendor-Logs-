header{

main{

}

/* CARDS */

.card{
    background:
        linear-gradient(145deg,rgba(25,25,25,.98),rgba(9,9,9,.98));
    border:1px solid rgba(212,175,55,.18);
    padding:22px;
    border-radius:20px;
    box-shadow:
        0 15px 40px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.025);
    margin-bottom:18px;
}

/* BALANCE */

.balance-card{
    position:relative;
    overflow:hidden;
    padding:24px;
    background:
        radial-gradient(circle at 90% 10%,rgba(212,175,55,.16),transparent 35%),
        linear-gradient(145deg,#17130a,#090909);
}

.balance-card::after{
    content:"";
    position:absolute;
    width:130px;
    height:130px;
    right:-55px;
    bottom:-65px;
    border-radius:50%;
    border:1px solid rgba(212,175,55,.16);
}

.balance-top{

}

.balance-label{

    font-weight:600;
}

.balance-icon{
    width:38px;
    height:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(212,175,55,.1);
    border:1px solid rgba(212,175,55,.25);
    color:#f0cf68;
    font-size:18px;
}

#walletBalance{
    margin:0;
    font-size:31px;
    font-weight:800;
    color:#f0cf68;
    letter-spacing:.3px;
}

/* ADD MONEY */

.card h2{
    margin:0 0 17px;
    color:#fff;
    font-size:20px;
}

#amount{
    width:100%;
    padding:17px 16px;
    border:1px solid #303030;
    background:#080808;
    color:#fff;
    border-radius:13px;
    font-size:18px;
    outline:none;
    transition:.2s;
}

#amount::placeholder{
    color:#777;
}

#amount:focus{
    border-color:#d4af37;
    box-shadow:0 0 0 3px rgba(212,175,55,.08);
}

/* QUICK SELECT */

.quick-select{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:9px;
    margin-top:13px;
}

.quick-amount{
    width:100%;
    border:1px solid #303030;
    background:#0d0d0d;
    color:#f0cf68;
    padding:13px 15px;
    border-radius:11px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    text-align:center;
    transition:.2s;
}

.quick-amount:hover{
    background:#151208;
    border-color:#d4af37;
}

.quick-amount:active{
    transform:scale(.99);
}

/* BUTTON */

.btn{
    width:100%;
    border:0;
    background:linear-gradient(135deg,#f0cf68,#c49a24);
    color:#080808;
    padding:16px;
    margin-top:15px;
    border-radius:13px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(212,175,55,.14);
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 24px rgba(212,175,55,.2);
}

.btn:active{
    transform:translateY(0);
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

/* MESSAGE */

#message{
    min-height:25px;
    margin-top:17px;
    font-weight:bold;
    line-height:1.5;
}

/* BACK */

.back{
    width:100%;
    background:#0d0d0d;
    color:#f0cf68;
    padding:16px;
    margin-top:5px;
    border-radius:14px;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
    border:1px solid rgba(212,175,55,.2);
    transition:.2s;
}

.back:hover{
    background:#151208;
    border-color:rgba(212,175,55,.4);
}

/* MOBILE */

@media(max-width:420px){
    main{
        padding:20px 15px 30px;
    }

    header{

    }

    .card{
        padding:20px;
        border-radius:18px;
    }

    #walletBalance{
        font-size:28px;
    }
}
</style>

<main>

<script>
const SUPABASE_URL="https://hkfhehbhmucymusaytoe.supabase.co";
const SUPABASE_KEY="sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function message(text,color="#111"){
const el=document.getElementById("message");
el.textContent=text;
el.style.color=color;
}

function selectAmount(amount){
document.getElementById("amount").value=amount;
document.getElementById("amount").focus();
}

async function getWalletBalance(){
const {data:{user}}=await supabaseClient.auth.getUser();

if(!user){
location.href="login.html";
return null;
}

const {data,error}=await supabaseClient.rpc("ensure_my_wallet");

if(error){
console.error(error);
document.getElementById("walletBalance").textContent="Unable to load balance";
return null;
}

return Number(data?.balance||0);
}

let walletBalanceValue=null;
let walletBalanceVisible=true;
function renderWalletBalance(){
const el=document.getElementById("walletBalance");
if(walletBalanceValue===null){el.textContent="Loading...";return;}
el.textContent=walletBalanceVisible?"₦"+walletBalanceValue.toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2}):"₦ ••••••";
document.getElementById("balanceToggle").setAttribute("aria-label",walletBalanceVisible?"Hide balance":"Show balance");
document.getElementById("balanceEyeIcon").innerHTML=walletBalanceVisible?'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>':'<path d="m3 3 18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.2 4.1M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/>';
}
function toggleWalletBalance(){walletBalanceVisible=!walletBalanceVisible;renderWalletBalance();}
async function loadWallet(){
const balance=await getWalletBalance();

if(balance===null)return null;

walletBalanceValue=balance;
renderWalletBalance();
return balance;
}

async function continuePayment(){
const amount=Number(document.getElementById("amount").value);
const button=document.getElementById("continueButton");

if(!Number.isSafeInteger(amount)||amount<100||amount>1000000){
message("Please enter a whole amount of at least ₦100 and no more than ₦1,000,000.","red");
return;
}

const {data:{user},error}=await supabaseClient.auth.getUser();

if(error||!user){
location.href="login.html";
return;
}

button.disabled=true;
button.textContent="Preparing payment...";
message("Securely preparing your Paystack checkout...");

try{
const {data,error}=await supabaseClient.functions.invoke("paystack_init_payment",{
body:{amount}
});

if(error){
console.error("Paystack initialization failed:",error);
throw new Error(data?.error||"Could not start payment. Please try again.");
}

if(!data?.success||typeof data.authorization_url!=="string"||!data.authorization_url.startsWith("https://")){
throw new Error(data?.error||"Paystack did not return a valid checkout link.");
}

message("Opening secure Paystack checkout...","#cc9900");
location.assign(data.authorization_url);
}catch(error){
console.error(error);
message(error?.message||"Unable to open Paystack payment.","red");
button.disabled=false;
button.textContent="Continue";
}
}

async function checkReturnedPayment(){
const params=new URLSearchParams(location.search);
const reference=params.get("reference")||params.get("trxref");
if(!reference)return;

const {data:{user},error}=await supabaseClient.auth.getUser();
if(error||!user)return;

message("Payment received. Verifying directly with Paystack...","#cc9900");

try{
const {data:verification,error:verificationError}=await supabaseClient.functions.invoke("verify_logs_paystack_payment",{
body:{reference}
});

if(verificationError){
console.error("Direct Paystack verification failed:",verificationError);
}else if(verification?.success){
await loadWallet();
message("Payment confirmed! Your wallet has been credited.","green");
const url=new URL(location.href);
url.searchParams.delete("reference");
url.searchParams.delete("trxref");
history.replaceState({},document.title,url.toString());
return;
}else if(verification?.error){
console.error("Paystack verification response:",verification.error);
}
}catch(error){
console.error("Payment verification error:",error);
}

for(let attempt=0;attempt<10;attempt++){
const {data,error:txError}=await supabaseClient
.from("transactions")
.select("status,reference")
.eq("user_id",user.id)
.eq("reference",reference)
.eq("type","wallet_funding")
.maybeSingle();

if(txError){
console.error("Wallet payment status check failed:",txError);
break;
}
if(data?.status==="completed"){
await loadWallet();
message("Payment confirmed! Your wallet has been credited.","green");
const url=new URL(location.href);
url.searchParams.delete("reference");
url.searchParams.delete("trxref");
history.replaceState({},document.title,url.toString());
return;
}
await new Promise(resolve=>setTimeout(resolve,2000));
}

message("We have not received final confirmation yet. Please do not pay again. Your payment reference is saved in this page; contact support if your balance does not update shortly.","#cc9900");
}

loadWallet().then(checkReturnedPayment);
</script>
