<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Fund Wallet - Delight Vendor Logs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
background:#f5f5f5;
color:#111;
font-family:Arial,sans-serif
}

header{
background:#111;
color:white;
padding:20px;
text-align:center
}

header h1{
margin:0;
font-size:25px
}

main{
width:100%;
max-width:500px;
margin:auto;
padding:25px 20px 40px
}

h2{
margin-top:25px;
margin-bottom:12px
}

.profile-card{
background:white;
padding:22px;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.08)
}

#walletBalance{
margin:0;
font-size:30px;
font-weight:bold
}

#amount{
width:100%;
padding:16px;
border:1px solid #ccc;
border-radius:10px;
font-size:18px;
outline:none
}

#amount:focus{
border-color:#111
}

.payment-option{
background:white;
border:1px solid #ddd;
padding:17px;
margin-bottom:12px;
border-radius:10px;
font-size:17px
}

.payment-option input{
margin-right:10px
}

.btn{
width:100%;
border:none;
background:#111;
color:white;
padding:16px;
margin-top:10px;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer
}

.btn:disabled{
opacity:.6;
cursor:not-allowed
}

#message{
min-height:25px;
margin-top:18px;
font-weight:bold;
line-height:1.5
}

.back-btn{
width:100%;
background:#333;
color:white;
padding:16px;
margin-top:15px;
border-radius:10px;
text-align:center;
font-size:17px;
font-weight:bold;
cursor:pointer
}

</style>
</head>

<body>

<header>
<h1>Fund Wallet</h1>
</header>

<main>

<h2>Your Balance</h2>

<div class="profile-card">
<p id="walletBalance">Loading...</p>
</div>

<h2>Add Money</h2>

<input
id="amount"
type="number"
min="100"
step="1"
placeholder="Enter amount"
>

<h2>Select Payment Method</h2>

<div class="payment-option">
<label>

<input
type="radio"
name="payment"
value="bank_transfer"
checked
>

Bank Transfer

</label>
</div>

<div class="payment-option">
<label>

<input
type="radio"
name="payment"
value="payid"
>

ZevPay ID

</label>
</div>

<button
id="continueButton"
class="btn"
onclick="continuePayment()"
>
Continue
</button>

<p id="message"></p>

<div
class="back-btn"
onclick="window.location.href='dashboard.html'"
>
🏠 Back to Dashboard
</div>

</main>

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSF_";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true,
storage:window.localStorage
}
}
);


/* =====================================================
   ZEVPAY FUNCTION
===================================================== */

const ZEVPAY_FUNCTION =
`${SUPABASE_URL}/functions/v1/zevpay_webhook`;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
color="#111"
){

const message =
document.getElementById("message");

message.style.color =
color;

message.textContent =
text;

}


/* =====================================================
   GET CURRENT SESSION
===================================================== */

async function getValidSession(){

try{

/*
First ask Supabase for the existing
session.
*/

const {
data,
error
} =
await supabaseClient.auth.getSession();

if(error){

console.error(
"getSession error:",
error
);

}


/*
If the session exists, use it.
*/

if(
data &&
data.session
){

return data.session;

}


/*
If Supabase has not restored it yet,
wait briefly and try again.
*/

await new Promise(
resolve =>
setTimeout(
resolve,
1000
)
);


const second =
await supabaseClient.auth.getSession();


if(
second.data &&
second.data.session
){

return second.data.session;

}


/*
Last attempt: refresh the session.
*/

const refreshed =
await supabaseClient.auth.refreshSession();


if(
refreshed.data &&
refreshed.data.session
){

return refreshed.data.session;

}

}catch(error){

console.error(
"Session restore error:",
error
);

}

return null;

}


/* =====================================================
   LOAD WALLET
===================================================== */

async function loadWallet(){

const balanceElement =
document.getElementById(
"walletBalance"
);

balanceElement.textContent =
"Loading...";


try{

const session =
await getValidSession();


/*
IMPORTANT:

Do NOT redirect to login.html here.

If the session is unavailable,
show the problem instead.
*/

if(!session){

balanceElement.textContent =
"Not logged in";

showMessage(
"Your login session could not be restored. Please log in again.",
"red"
);

return;

}


/*
Use the same wallet RPC that was
already being used by your project.
*/

const {
data:wallet,
error
} =
await supabaseClient.rpc(
"ensure_my_wallet"
);


if(error){

console.error(
"Wallet RPC error:",
error
);


/*
Show the actual database error
instead of hiding it.
*/

balanceElement.textContent =
"Wallet error";

showMessage(
"Wallet error: " +
(
error.message ||
"Unknown Supabase error"
),
"red"
);

return;

}


const balance =
wallet?.balance ?? 0;


balanceElement.textContent =
"₦" +
Number(balance).toLocaleString(
"en-NG",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);


}catch(error){

console.error(
"Load wallet error:",
error
);

balanceElement.textContent =
"Wallet error";

showMessage(
"Wallet error: " +
(
error.message ||
"Unable to load wallet."
),
"red"
);

}

}


/* =====================================================
   GET SESSION FOR PAYMENT
===================================================== */

async function getSession(){

const session =
await getValidSession();


if(!session){

throw new Error(
"Your login session has expired. Please log in again."
);

}


return session;

}


/* =====================================================
   CREATE ZEVPAY PAYMENT
===================================================== */

async function createPayment(
amount
){

const session =
await getSession();


const response =
await fetch(
ZEVPAY_FUNCTION,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
`Bearer ${session.access_token}`
},

body:JSON.stringify({

action:
"create_payment",

amount:
amount

})
}
);


const result =
await response.json();


console.log(
"Create payment:",
result
);


if(
!response.ok ||
!result.success
){

throw new Error(
result?.error ||
"Could not create payment."
);

}


if(
!result.reference ||
!result.session_id ||
!result.checkout_url
){

throw new Error(
"ZevPay did not return complete payment information."
);

}


return result;

}


/* =====================================================
   VERIFY PAYMENT
===================================================== */

async function verifyPayment(){

try{

const session =
await getSession();


const saved =
localStorage.getItem(
"pending_zevpay_payment"
);


if(!saved){

console.log(
"No pending ZevPay payment."
);

return false;

}


let payment;

try{

payment =
JSON.parse(saved);

}catch(error){

console.error(
"Invalid saved payment:",
error
);

localStorage.removeItem(
"pending_zevpay_payment"
);

return false;

}


const reference =
String(
payment.reference || ""
);

const sessionId =
String(
payment.session_id || ""
);


if(
!reference ||
!sessionId
){

console.log(
"Pending payment is missing reference/session."
);

return false;

}


const response =
await fetch(
ZEVPAY_FUNCTION,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
`Bearer ${session.access_token}`
},

body:JSON.stringify({

action:
"verify_payment",

reference:
reference,

session_id:
sessionId

})
}
);


const result =
await response.json();


console.log(
"Verify payment:",
result
);


/*
SUCCESS
*/

if(
result.success &&
(
result.credited ||
result.already_processed
)
){

localStorage.removeItem(
"pending_zevpay_payment"
);

await loadWallet();

showMessage(
"Payment confirmed! Your wallet has been credited.",
"green"
);

return true;

}


/*
Payment record may not have been
available yet.

DO NOT display an error.
Just retry.
*/

if(
result.message ===
"Payment record not found."
){

console.log(
"Payment record not found yet. Retrying..."
);

return false;

}


if(
result.error ===
"Payment record not found."
){

console.log(
"Payment record not found yet. Retrying..."
);

return false;

}


/*
Payment is still pending.
*/

console.log(
"Payment still pending:",
result
);

return false;


}catch(error){

console.error(
"Verify payment error:",
error
);

return false;

}

}


/* =====================================================
   WAIT FOR PAYMENT
===================================================== */

async function waitForPayment(){

let attempts =
0;

const maxAttempts =
60;

const button =
document.getElementById(
"continueButton"
);


button.disabled =
true;

button.textContent =
"Checking payment...";


const timer =
setInterval(
async function(){

attempts++;


console.log(
"Payment verification attempt:",
attempts
);


const done =
await verifyPayment();


if(done){

clearInterval(
timer
);

button.disabled =
false;

button.textContent =
"Continue";

return;

}


if(
attempts >=
maxAttempts
){

clearInterval(
timer
);

button.disabled =
false;

button.textContent =
"Continue";

showMessage(
"Payment verification is taking longer than expected. If you already transferred the money, refresh your wallet shortly.",
"#cc6600"
);

}

},
5000
);

}


/* =====================================================
   CONTINUE BUTTON
===================================================== */

async function continuePayment(){

const amount =
Number(
document.getElementById(
"amount"
).value
);


const payment =
document.querySelector(
'input[name="payment"]:checked'
);


const button =
document.getElementById(
"continueButton"
);


if(
!Number.isFinite(amount) ||
amount < 100
){

showMessage(
"Please enter at least ₦100.",
"red"
);

return;

}


if(!payment){

showMessage(
"Please select a payment method.",
"red"
);

return;

}


try{

/*
Make sure the user is logged in.
*/

const session =
await getSession();


if(!session){

showMessage(
"Please log in again.",
"red"
);

return;

}


button.disabled =
true;

button.textContent =
"Preparing payment...";


showMessage(
"Preparing your payment...",
"#111"
);


/*
Create the exact ZevPay session.
*/

const paymentData =
await createPayment(
amount
);


/*
Save the exact session before
leaving this page.
*/

const pendingPayment = {

reference:
paymentData.reference,

session_id:
paymentData.session_id,

amount:
paymentData.amount,

created_at:
Date.now()

};


localStorage.setItem(
"pending_zevpay_payment",
JSON.stringify(
pendingPayment
)
);


console.log(
"Saved pending ZevPay payment:",
pendingPayment
);


showMessage(
"Opening ZevPay checkout...",
"#111"
);


/*
Keep ZevPay's normal checkout.

Do NOT replace this with a custom
payment-method page.
*/

window.location.href =
paymentData.checkout_url;


}catch(error){

console.error(
"Payment creation error:",
error
);

showMessage(
error.message ||
"Unable to start payment.",
"red"
);


button.disabled =
false;

button.textContent =
"Continue";

}

}


/* =====================================================
   HANDLE RETURN FROM ZEVPAY
===================================================== */

async function checkReturnedPayment(){

const params =
new URLSearchParams(
window.location.search
);


const urlReference =
params.get(
"reference"
);

const urlSession =
params.get(
"session_id"
);


/*
THIS IS THE IMPORTANT FIX.

If there is NO reference in the URL,
DO NOTHING.

Opening wallet.html normally must
NOT start payment verification.
*/

if(!urlReference){

console.log(
"Normal wallet page opened. No ZevPay return detected."
);

return;

}


console.log(
"ZevPay returned with reference:",
urlReference
);


let saved = {};

try{

saved =
JSON.parse(
localStorage.getItem(
"pending_zevpay_payment"
) || "{}"
);

}catch{

saved = {};

}


/*
Use the reference ZevPay actually
returned.
*/

saved.reference =
urlReference;


if(urlSession){

saved.session_id =
urlSession;

}


localStorage.setItem(
"pending_zevpay_payment",
JSON.stringify(saved)
);


/*
Remove the query parameters from
the address bar.
*/

window.history.replaceState(
{},
document.title,
"wallet.html"
);


/*
Now it is correct to begin checking.
*/

showMessage(
"Checking your payment...",
"#111"
);


const credited =
await verifyPayment();


if(credited){

return;

}


/*
Still pending — continue checking.
*/

const stillPending =
localStorage.getItem(
"pending_zevpay_payment"
);


if(stillPending){

await waitForPayment();

}

}


/* =====================================================
   AUTH LISTENER
===================================================== */

supabaseClient.auth.onAuthStateChange(
function(
event,
session
){

console.log(
"Supabase auth event:",
event,
"Session:",
!!session
);

}
);


/* =====================================================
   START
===================================================== */

async function initializeWallet(){

/*
Give Supabase a moment to restore
the persisted login session.
*/

await new Promise(
resolve =>
setTimeout(
resolve,
500
)
);


/*
Load wallet.

This DOES NOT redirect to login.
*/

await loadWallet();


/*
Only checks ZevPay if the URL
actually contains a returned
reference.
*/

await checkReturnedPayment();

}


initializeWallet();

</script>

</body>
</html>
