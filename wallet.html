<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fund Wallet - Delight Vendor Logs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f5f5f5;
color:#111;
font-family:Arial,sans-serif
}

header{
background:#111;
color:white;
padding:20px;
text-align:center
}

header h1{
margin:0;
font-size:25px
}

main{
width:100%;
max-width:500px;
margin:auto;
padding:25px 20px 40px
}

h2{
margin-top:25px;
margin-bottom:12px
}

.profile-card{
background:white;
padding:22px;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.08)
}

#walletBalance{
margin:0;
font-size:30px;
font-weight:bold
}

#amount{
width:100%;
padding:16px;
border:1px solid #ccc;
border-radius:10px;
font-size:18px;
outline:none
}

#amount:focus{
border-color:#111
}

.payment-option{
background:white;
border:1px solid #ddd;
padding:17px;
margin-bottom:12px;
border-radius:10px;
font-size:17px
}

.payment-option input{
margin-right:10px
}

.btn{
width:100%;
border:none;
background:#111;
color:white;
padding:16px;
margin-top:10px;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer
}

.btn:disabled{
opacity:.6;
cursor:not-allowed
}

#message{
min-height:25px;
margin-top:18px;
font-weight:bold;
line-height:1.5
}

.back-btn{
width:100%;
background:#333;
color:white;
padding:16px;
margin-top:15px;
border-radius:10px;
text-align:center;
font-size:17px;
font-weight:bold;
cursor:pointer
}
</style>
</head>

<body>

<header>
<h1>Fund Wallet</h1>
</header>

<main>

<h2>Your Balance</h2>

<div class="profile-card">
<p id="walletBalance">Loading...</p>
</div>

<h2>Add Money</h2>

<input
id="amount"
type="number"
min="100"
step="1"
placeholder="Enter amount"
>

<h2>Select Payment Method</h2>

<div class="payment-option">
<label>
<input
type="radio"
name="payment"
value="bank_transfer"
checked
>
Bank Transfer
</label>
</div>

<div class="payment-option">
<label>
<input
type="radio"
name="payment"
value="payid"
>
ZevPay ID
</label>
</div>

<button
id="continueButton"
class="btn"
onclick="continuePayment()"
>
Continue
</button>

<p id="message"></p>

<div
class="back-btn"
onclick="window.location.href='dashboard.html'"
>
🏠 Back to Dashboard
</div>

</main>

<script>

const SUPABASE_URL =
"https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ZEVPAY_FUNCTION =
`${SUPABASE_URL}/functions/v1/zevpay_webhook`;

function showMessage(
text,
color="#111"
){

const message =
document.getElementById(
"message"
);

message.style.color =
color;

message.textContent =
text;
}

async function loadWallet(){

try{

const {
data:{
user
},
error:userError
} =
await supabaseClient.auth.getUser();

if(
userError ||
!user
){

window.location.href =
"login.html";

return;
}

const {
data:wallet,
error
} =
await supabaseClient.rpc(
"ensure_my_wallet"
);

if(error){

console.error(
"Wallet error:",
error
);

document.getElementById(
"walletBalance"
).textContent =
"Wallet error";

return;
}

const balance =
wallet?.balance ?? 0;

document.getElementById(
"walletBalance"
).textContent =
"₦" +
Number(balance).toLocaleString(
"en-NG",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}catch(error){

console.error(
"Load wallet error:",
error
);

document.getElementById(
"walletBalance"
).textContent =
"Unable to load wallet";

}

}

async function getSession(){

const {
data:{
session
}
} =
await supabaseClient.auth.getSession();

if(!session){

throw new Error(
"Your login session has expired."
);

}

return session;

}

async function createPayment(
amount
){

const session =
await getSession();

const response =
await fetch(
ZEVPAY_FUNCTION,
{
method:"POST",
headers:{
"Content-Type":
"application/json",
"Authorization":
`Bearer ${session.access_token}`
},
body:JSON.stringify({
action:
"create_payment",
amount:
amount
})
}
);

const result =
await response.json();

console.log(
"Create payment:",
result
);

if(
!response.ok ||
!result.success
){

throw new Error(
result?.error ||
"Could not create payment."
);

}

if(
!result.reference ||
!result.session_id ||
!result.checkout_url
){

throw new Error(
"ZevPay did not return complete payment information."
);

}

return result;

}

async function verifyPayment(){

try{

const session =
await getSession();

const saved =
localStorage.getItem(
"pending_zevpay_payment"
);

if(!saved){

return false;
}

let payment;

try{

payment =
JSON.parse(saved);

}catch{

localStorage.removeItem(
"pending_zevpay_payment"
);

return false;

}

const reference =
String(
payment.reference || ""
);

const sessionId =
String(
payment.session_id || ""
);

if(!reference){

return false;
}

const response =
await fetch(
ZEVPAY_FUNCTION,
{
method:"POST",
headers:{
"Content-Type":
"application/json",
"Authorization":
`Bearer ${session.access_token}`
},
body:JSON.stringify({
action:
"verify_payment",
reference:
reference,
session_id:
sessionId
})
}
);

const result =
await response.json();

console.log(
"Verify payment:",
result
);

if(
result.success &&
(
result.credited ||
result.already_processed
)
){

localStorage.removeItem(
"pending_zevpay_payment"
);

await loadWallet();

showMessage(
"Payment confirmed! Your wallet has been credited.",
"green"
);

return true;

}

if(
result.error ===
"Payment record not found."
){

showMessage(
"Payment record is still being prepared. Checking again...",
"#cc6600"
);

return false;

}

return false;

}catch(error){

console.error(
"Verify error:",
error
);

return false;

}

}

async function waitForPayment(){

let attempts = 0;

const maxAttempts = 60;

const button =
document.getElementById(
"continueButton"
);

button.disabled = true;

button.textContent =
"Checking payment...";

const timer =
setInterval(
async()=>{

attempts++;

const done =
await verifyPayment();

if(done){

clearInterval(timer);

button.disabled =
false;

button.textContent =
"Continue";

return;

}

if(
attempts >=
maxAttempts
){

clearInterval(timer);

button.disabled =
false;

button.textContent =
"Continue";

showMessage(
"Payment is taking longer than expected. If you already transferred the money, wait a little and refresh this page.",
"#cc6600"
);

}

},
5000
);

}

async function continuePayment(){

const amount =
Number(
document.getElementById(
"amount"
).value
);

const payment =
document.querySelector(
'input[name="payment"]:checked'
);

const button =
document.getElementById(
"continueButton"
);

if(
!Number.isFinite(amount) ||
amount < 100
){

showMessage(
"Please enter at least ₦100.",
"red"
);

return;

}

if(!payment){

showMessage(
"Please select a payment method.",
"red"
);

return;

}

try{

const {
data:{
user
},
error:userError
} =
await supabaseClient.auth.getUser();

if(
userError ||
!user
){

showMessage(
"Please log in again.",
"red"
);

window.location.href =
"login.html";

return;

}

button.disabled = true;

button.textContent =
"Preparing payment...";

showMessage(
"Preparing your payment...",
"#111"
);

const paymentData =
await createPayment(
amount
);

const pendingPayment = {

reference:
paymentData.reference,

session_id:
paymentData.session_id,

amount:
paymentData.amount,

created_at:
Date.now()

};

localStorage.setItem(
"pending_zevpay_payment",
JSON.stringify(
pendingPayment
)
);

console.log(
"Payment saved locally:",
pendingPayment
);

showMessage(
"Opening ZevPay checkout...",
"#111"
);

window.location.href =
paymentData.checkout_url;

}catch(error){

console.error(
"Payment error:",
error
);

showMessage(
error.message ||
"Unable to start payment.",
"red"
);

button.disabled =
false;

button.textContent =
"Continue";

}

}

async function checkReturnedPayment(){

const params =
new URLSearchParams(
window.location.search
);

const urlReference =
params.get(
"reference"
);

const urlSession =
params.get(
"session_id"
);

if(
urlReference
){

let saved = {};

try{

saved =
JSON.parse(
localStorage.getItem(
"pending_zevpay_payment"
) || "{}"
);

}catch{}

saved.reference =
urlReference;

if(urlSession){

saved.session_id =
urlSession;

}

localStorage.setItem(
"pending_zevpay_payment",
JSON.stringify(saved)
);

window.history.replaceState(
{},
document.title,
"wallet.html"
);

}

const pending =
localStorage.getItem(
"pending_zevpay_payment"
);

if(!pending){

return;
}

showMessage(
"Checking your payment...",
"#111"
);

await verifyPayment();

const saved =
JSON.parse(
localStorage.getItem(
"pending_zevpay_payment"
) || "{}"
);

if(saved.reference){

await waitForPayment();

}

}

loadWallet();

checkReturnedPayment();

</script>

</body>
  </html>
