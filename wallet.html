<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fund Wallet - Delight Vendor Logs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<header>

  <h1>Fund Wallet</h1>

</header>


<main>


  <h2>Your Balance</h2>


  <div class="profile-card">

    <p id="walletBalance">
      Loading...
    </p>

  </div>


  <h2>Add Money</h2>


  <input
    id="amount"
    type="number"
    min="100"
    placeholder="Enter amount"
  >


  <h2>Select Payment Method</h2>


  <div>

    <label>

      <input
        type="radio"
        name="payment"
        value="bank"
      >

      Bank Transfer

    </label>


    <br><br>


    <label>

      <input
        type="radio"
        name="payment"
        value="card"
      >

      Card

    </label>

  </div>


  <br>


  <!-- CONTINUE -->

  <div
    onclick="continuePayment()"
    style="
      display:inline-block;
      background:#111;
      color:#fff;
      padding:15px 30px;
      margin:10px;
      border-radius:10px;
      font-family:Arial,sans-serif;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    "
  >
    Continue
  </div>


  <p id="message"></p>


  <br>
