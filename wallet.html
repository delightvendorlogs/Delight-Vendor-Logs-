const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



async function loadWallet() {


  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if (userError || !user) {

    window.location.href =
      "login.html";

    return;

  }


  const {
    data: wallet,
    error
  } =
    await supabaseClient.rpc(
      "ensure_my_wallet"
    );


  if (error) {

    console.error(error);

    document.getElementById(
      "walletBalance"
    ).textContent =
      "Unable to load balance.";

    return;

  }


  const balance =
    wallet?.balance ?? 0;


  document.getElementById(
    "walletBalance"
  ).textContent =
    "₦" +
    Number(balance).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}



function continuePayment() {


  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );


  const payment =
    document.querySelector(
      'input[name="payment"]:checked'
    );


  const message =
    document.getElementById(
      "message"
    );


  if (
    !amount ||
    amount < 100
  ) {

    message.textContent =
      "Please enter at least ₦100.";

    return;

  }


  if (!payment) {

    message.textContent =
      "Please select a payment method.";

    return;

  }


  message.textContent =
    "Payment system will be connected next.";

}



loadWallet();


</script></body></html>
