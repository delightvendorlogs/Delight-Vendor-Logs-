<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fund Wallet - Delight Vendor Logs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.paystack.co/v2/inline.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
}

body{
    background:
        radial-gradient(circle at top,#211b0b 0%,#0a0a0a 38%,#050505 75%);
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

/* HEADER */

header{
    background:rgba(5,5,5,.94);
    border-bottom:1px solid rgba(212,175,55,.18);
    padding:20px;
    text-align:center;
    position:relative;
}

header h1{
    margin:0;
    font-size:24px;
    font-weight:800;
    color:#f0cf68;
    letter-spacing:.2px;
}

/* MAIN */

main{
    max-width:500px;
    margin:auto;
    padding:24px 18px 35px;
}

/* CARDS */

.card{
    background:
        linear-gradient(145deg,rgba(25,25,25,.98),rgba(9,9,9,.98));
    border:1px solid rgba(212,175,55,.18);
    padding:22px;
    border-radius:20px;
    box-shadow:
        0 15px 40px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.025);
    margin-bottom:18px;
}

/* BALANCE */

.balance-card{
    position:relative;
    overflow:hidden;
    padding:24px;
    background:
        radial-gradient(circle at 90% 10%,rgba(212,175,55,.16),transparent 35%),
        linear-gradient(145deg,#17130a,#090909);
}

.balance-card::after{
    content:"";
    position:absolute;
    width:130px;
    height:130px;
    right:-55px;
    bottom:-65px;
    border-radius:50%;
    border:1px solid rgba(212,175,55,.16);
}

.balance-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.balance-label{
    margin:0;
    color:#a9a9a9;
    font-size:14px;
    font-weight:600;
}

.balance-icon{
    width:38px;
    height:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(212,175,55,.1);
    border:1px solid rgba(212,175,55,.25);
    color:#f0cf68;
    font-size:18px;
}

#walletBalance{
    margin:0;
    font-size:31px;
    font-weight:800;
    color:#f0cf68;
    letter-spacing:.3px;
}

/* ADD MONEY */

.card h2{
    margin:0 0 17px;
    color:#fff;
    font-size:20px;
}

#amount{
    width:100%;
    padding:17px 16px;
    border:1px solid #303030;
    background:#080808;
    color:#fff;
    border-radius:13px;
    font-size:18px;
    outline:none;
    transition:.2s;
}

#amount::placeholder{
    color:#777;
}

#amount:focus{
    border-color:#d4af37;
    box-shadow:0 0 0 3px rgba(212,175,55,.08);
}

/* QUICK SELECT */

.quick-select{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-top:13px;
}

.quick-amount{
    width:100%;
    border:1px solid #303030;
    background:#0d0d0d;
    color:#f0cf68;
    padding:13px 15px;
    border-radius:11px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    text-align:center;
    transition:.2s;
}

.quick-amount:hover{
    background:#151208;
    border-color:#d4af37;
}

.quick-amount:active{
    transform:scale(.99);
}

/* BUTTON */

.btn{
    width:100%;
    border:0;
    background:linear-gradient(135deg,#f0cf68,#c49a24);
    color:#080808;
    padding:16px;
    margin-top:15px;
    border-radius:13px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(212,175,55,.14);
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 24px rgba(212,175,55,.2);
}

.btn:active{
    transform:translateY(0);
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

/* MESSAGE */

#message{
    min-height:25px;
    margin-top:17px;
    font-weight:bold;
    line-height:1.5;
}

/* BACK */

.back{
    width:100%;
    background:#0d0d0d;
    color:#f0cf68;
    padding:16px;
    margin-top:5px;
    border-radius:14px;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
    border:1px solid rgba(212,175,55,.2);
    transition:.2s;
}

.back:hover{
    background:#151208;
    border-color:rgba(212,175,55,.4);
}

/* MOBILE */

@media(max-width:420px){
    main{
        padding:20px 15px 30px;
    }

    header{
        padding:18px;
    }

    header h1{
        font-size:22px;
    }

    .card{
        padding:20px;
        border-radius:18px;
    }

    #walletBalance{
        font-size:28px;
    }
}
</style>
</head>

<body>

<header>
<h1>Fund Wallet</h1>
</header>

<main>

<div class="card balance-card">

    <div class="balance-top">
        <p class="balance-label">Your Balance</p>

        <div class="balance-icon">
            ₦
        </div>
    </div>

    <p id="walletBalance">Loading...</p>

</div>

<div class="card">

    <h2>Add Money</h2>

    <input
        id="amount"
        type="number"
        min="100"
        step="1"
        placeholder="Enter amount"
    >

    <div class="quick-select">

        <button
            type="button"
            class="quick-amount"
            onclick="selectAmount(100)"
        >
            ₦100
        </button>

        <button
            type="button"
            class="quick-amount"
            onclick="selectAmount(200)"
        >
            ₦200
        </button>

        <button
            type="button"
            class="quick-amount"
            onclick="selectAmount(500)"
        >
            ₦500
        </button>

        <button
            type="button"
            class="quick-amount"
            onclick="selectAmount(1000)"
        >
            ₦1,000
        </button>

        <button
            type="button"
            class="quick-amount"
            onclick="selectAmount(2000)"
        >
            ₦2,000
        </button>

        <button
            type="button"
            class="quick-amount"
            onclick="selectAmount(5000)"
        >
            ₦5,000
        </button>

        <button
            type="button"
            class="quick-amount"
            onclick="selectAmount(10000)"
        >
            ₦10,000
        </button>

        <button
            type="button"
            class="quick-amount"
            onclick="selectAmount(20000)"
        >
            ₦20,000
        </button>

    </div>

    <button
        id="continueButton"
        class="btn"
        onclick="continuePayment()"
    >
        Continue
    </button>

    <p id="message"></p>

</div>

<div
    class="back"
    onclick="location.href='dashboard.html'"
>
    🏠 Back to Dashboard
</div>

</main>

<script>
const SUPABASE_URL="https://hkfhehbhmucymusaytoe.supabase.co";
const SUPABASE_KEY="sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";
const PAYSTACK_PUBLIC_KEY="pk_live_404fd9834a0f367328c2fb55a2256e406ed6b43f";

const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function message(text,color="#111"){
const el=document.getElementById("message");
el.textContent=text;
el.style.color=color;
}

function selectAmount(amount){
document.getElementById("amount").value=amount;
document.getElementById("amount").focus();
}

async function getWalletBalance(){
const {data:{user}}=await supabaseClient.auth.getUser();

if(!user){
location.href="login.html";
return null;
}

const {data,error}=await supabaseClient.rpc("ensure_my_wallet");

if(error){
console.error(error);
document.getElementById("walletBalance").textContent="Unable to load balance";
return null;
}

return Number(data?.balance||0);
}

async function loadWallet(){
const balance=await getWalletBalance();

if(balance===null)return null;

document.getElementById("walletBalance").textContent=
"₦"+balance.toLocaleString("en-NG",{
minimumFractionDigits:2,
maximumFractionDigits:2
});

return balance;
}

async function continuePayment(){
const amount=Number(document.getElementById("amount").value);
const button=document.getElementById("continueButton");

if(!Number.isFinite(amount)||amount<100){
message("Please enter at least ₦100.","red");
return;
}

const {data:{user},error}=await supabaseClient.auth.getUser();

if(error||!user){
location.href="login.html";
return;
}

if(!user.email){
message("Your account has no email address.","red");
return;
}

button.disabled=true;
button.textContent="Opening payment...";
message("Opening Paystack...");

try{
const oldBalance=await getWalletBalance();

if(oldBalance===null){
button.disabled=false;
button.textContent="Continue";
return;
}

const paystack=new PaystackPop();

paystack.newTransaction({
key:PAYSTACK_PUBLIC_KEY,
email:user.email,
amount:Math.round(amount*100),
currency:"NGN",
metadata:{
user_id:user.id,
purpose:"wallet_funding"
},

onSuccess:async(transaction)=>{
message("Payment successful. Waiting for wallet confirmation...","green");
button.textContent="Confirming...";

for(let i=0;i<10;i++){
await new Promise(resolve=>setTimeout(resolve,3000));

const newBalance=await loadWallet();

if(newBalance!==null&&newBalance>oldBalance){
message("Payment successful! Wallet balance updated.","green");
document.getElementById("amount").value="";
button.disabled=false;
button.textContent="Continue";
return;
}
}

message("Payment was successful, but wallet balance has not updated yet. Please wait and refresh.","#cc6600");
button.disabled=false;
button.textContent="Continue";
},

onCancel:()=>{
message("Payment cancelled.","#cc6600");
button.disabled=false;
button.textContent="Continue";
},

onError:(error)=>{
console.error(error);
message(error?.message||"Payment failed.","red");
button.disabled=false;
button.textContent="Continue";
}
});

}catch(error){
console.error(error);
message("Unable to open Paystack payment.","red");
button.disabled=false;
button.textContent="Continue";
}
}

loadWallet();
</script>

</body>
</html>
