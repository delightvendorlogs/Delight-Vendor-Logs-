<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Transactions - Delight Vendor Logs</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

</head>


<body>


<header>

  <h1>
    Transactions
  </h1>

</header>


<main>

  <h2>
    Transaction History
  </h2>


  <div id="transactions">

    <p>
      Checking your account...
    </p>

  </div>


  <br>


  <button
    type="button"
    onclick="window.location.href='wallet.html'"
  >
    💰 Fund Wallet
  </button>


  <br><br>


  <button
    type="button"
    onclick="window.location.href='dashboard.html'"
  >
    🏠 Back to Dashboard
  </button>


</main>


<script>


/* ========================================
   SUPABASE CONNECTION
======================================== */


const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* ========================================
   LOAD TRANSACTIONS
======================================== */


async function loadTransactions() {


  const container =
    document.getElementById(
      "transactions"
    );


  container.innerHTML =
    "<p>Checking your login...</p>";


  /* ======================================
     GET CURRENT USER
  ====================================== */


  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  console.log(
    "CURRENT USER:",
    user
  );


  console.log(
    "USER ERROR:",
    userError
  );


  /* ======================================
     CHECK LOGIN
  ====================================== */


  if (
    userError ||
    !user
  ) {


    console.log(
      "No Supabase session found."
    );


    container.innerHTML = `

      <div
        style="
          background:white;
          padding:20px;
          border-radius:12px;
          text-align:center;
        "
      >

        <h3>
          Login Session Not Found
        </h3>

        <p>
          Your login session was not detected on this page.
        </p>

        <button
          type="button"
          onclick="window.location.href='login.html'"
        >
          🔐 Login Again
        </button>

      </div>

    `;


    return;

  }


  /* ======================================
     LOAD TRANSACTIONS
  ====================================== */


  const {
    data: transactions,
    error
  } =
    await supabaseClient

      .from("transactions")

      .select(
        "id, user_id, type, amount, status, description, created_at"
      )

      .eq(
        "user_id",
        user.id
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  /* ======================================
     DATABASE ERROR
  ====================================== */


  if (error) {


    console.error(
      "TRANSACTIONS ERROR:",
      error
    );


    container.innerHTML = `

      <div
        style="
          background:white;
          padding:20px;
          border-radius:12px;
          text-align:center;
        "
      >

        <h3>
          Unable to load transactions
        </h3>

        <p>
          ${escapeHTML(
            error.message ||
            "Unknown database error"
          )}
        </p>

      </div>

    `;


    return;

  }


  /* ======================================
     NO TRANSACTIONS
  ====================================== */


  if (
    !transactions ||
    transactions.length === 0
  ) {


    container.innerHTML = `

      <div
        style="
          background:white;
          padding:20px;
          border-radius:12px;
          text-align:center;
        "
      >

        <h3>
          No Transactions Yet
        </h3>

        <p>
          Your wallet transactions will appear here.
        </p>

      </div>

    `;


    return;

  }


  /* ======================================
     CLEAR LOADING
  ====================================== */


  container.innerHTML =
    "";


  /* ======================================
     DISPLAY TRANSACTIONS
  ====================================== */


  transactions.forEach(
    function(transaction) {


      const box =
        document.createElement(
          "div"
        );


      box.style.background =
        "white";


      box.style.padding =
        "18px";


      box.style.margin =
        "12px 0";


      box.style.borderRadius =
        "12px";


      box.style.textAlign =
        "left";


      box.style.boxShadow =
        "0 2px 8px rgba(0,0,0,0.08)";


      /* ==================================
         AMOUNT
      ================================== */


      const amount =
        Number(
          transaction.amount || 0
        ).toLocaleString(
          "en-NG",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );


      /* ==================================
         DATE
      ================================== */


      const date =
        transaction.created_at
          ? new Date(
              transaction.created_at
            ).toLocaleString(
              "en-NG"
            )
          : "Date unavailable";


      /* ==================================
         TYPE
      ================================== */


      const type =
        transaction.type ||
        "Transaction";


      /* ==================================
         STATUS
      ================================== */


      const status =
        transaction.status ||
        "Pending";


      /* ==================================
         DESCRIPTION
      ================================== */


      const description =
        transaction.description ||
        "";


      /* ==================================
         CARD
      ================================== */


      box.innerHTML = `

        <h3>
          ${escapeHTML(type)}
        </h3>


        <p>
          Amount:
          <strong>
            ₦${amount}
          </strong>
        </p>


        <p>
          Status:
          <strong>
            ${escapeHTML(status)}
          </strong>
        </p>


        ${
          description
            ? `
              <p>
                ${escapeHTML(
                  description
                )}
              </p>
            `
            : ""
        }


        <small>
          ${escapeHTML(date)}
        </small>

      `;


      container.appendChild(
        box
      );


    }
  );


}


/* ========================================
   ESCAPE HTML
======================================== */


function escapeHTML(
  value
) {


  return String(
    value ?? ""
  )


    .replace(
      /&/g,
      "&amp;"
    )


    .replace(
      /</g,
      "&lt;"
    )


    .replace(
      />/g,
      "&gt;"
    )


    .replace(
      /"/g,
      "&quot;"
    )


    .replace(
      /'/g,
      "&#039;"
    );

}


/* ========================================
   START
======================================== */


loadTransactions();


</script>


</body>

</html>
