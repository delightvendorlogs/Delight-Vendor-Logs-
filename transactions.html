<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Transactions - Delight Vendor Logs</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
<h1>Transactions</h1>
</header>

<main>
<h2>Transaction History</h2>

<div id="transactions">
<p>Checking your account...</p>
</div>

<br>

<button type="button" onclick="window.location.href='wallet.html'">
💰 Fund Wallet
</button>

<br><br>

<button type="button" onclick="window.location.href='dashboard.html'">
🏠 Back to Dashboard
</button>

</main>

<script>
const SUPABASE_URL="https://hkfhehbhmucymusaytoe.supabase.co";
const SUPABASE_KEY="sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);

function escapeHTML(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

async function loadTransactions(){

const container=document.getElementById("transactions");

container.innerHTML="<p>Loading transactions...</p>";

const {data:{user},error:userError}=await supabaseClient.auth.getUser();

if(userError||!user){
container.innerHTML=`
<div style="background:white;padding:20px;border-radius:12px;text-align:center">
<h3>Login Session Not Found</h3>
<p>Please log in again to view your transactions.</p>
<button type="button" onclick="window.location.href='login.html'">
🔐 Login Again
</button>
</div>`;
return;
}

const {data:transactions,error}=await supabaseClient
.from("transactions")
.select("id,user_id,type,amount,status,description,reference,created_at")
.eq("user_id",user.id)
.order("created_at",{ascending:false});

if(error){
console.error("TRANSACTIONS ERROR:",error);

container.innerHTML=`
<div style="background:white;padding:20px;border-radius:12px;text-align:center">
<h3>Unable to load transactions</h3>
<p>${escapeHTML(error.message)}</p>
</div>`;
return;
}

if(!transactions||transactions.length===0){
container.innerHTML=`
<div style="background:white;padding:20px;border-radius:12px;text-align:center">
<h3>No Transactions Yet</h3>
<p>Your wallet transactions will appear here.</p>
</div>`;
return;
}

container.innerHTML="";

transactions.forEach(transaction=>{

const box=document.createElement("div");

box.style.background="white";
box.style.padding="18px";
box.style.margin="12px 0";
box.style.borderRadius="12px";
box.style.textAlign="left";
box.style.boxShadow="0 2px 8px rgba(0,0,0,0.08)";

const amount=Number(transaction.amount||0).toLocaleString(
"en-NG",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

const date=transaction.created_at
?new Date(transaction.created_at).toLocaleString("en-NG")
:"Date unavailable";

const type=transaction.type||"Transaction";
const status=transaction.status||"Pending";
const description=transaction.description||"";
const reference=transaction.reference||"";

box.innerHTML=`
<h3>${escapeHTML(type)}</h3>

<p>
Amount:
<strong>₦${amount}</strong>
</p>

<p>
Status:
<strong>${escapeHTML(status)}</strong>
</p>

${description?`
<p>${escapeHTML(description)}</p>
`:""}

${reference?`
<p>
Reference:
<small>${escapeHTML(reference)}</small>
</p>
`:""}

<small>${escapeHTML(date)}</small>
`;

container.appendChild(box);

});

}

loadTransactions();

document.addEventListener("visibilitychange",()=>{
if(!document.hidden)loadTransactions();
});
</script>

</body>
</html>
