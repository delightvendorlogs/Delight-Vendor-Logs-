<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Transactions - Delight Vendor Logs</title>  <link rel="stylesheet" href="style.css">  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>  <header>
    <h1>Transactions</h1>
  </header>  <main><h2>Transaction History</h2>

<div id="transactions">

  <p>Loading transactions...</p>

</div>

<br>

<button onclick="window.location.href='wallet.html'">
  💰 Fund Wallet
</button>

<br>

<button onclick="window.location.href='dashboard.html'">
  🏠 Back to Dashboard
</button>

  </main>  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://hkfhehbhmucymusaytoe.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       LOAD TRANSACTIONS
    ========================= */

    async function loadTransactions() {

      const container =
        document.getElementById("transactions");


      const {
        data: {
          user
        },
        error
      } = await supabaseClient.auth.getUser();


      if (error || !user) {

        window.location.href = "login.html";

        return;
      }


      /*
        We will connect this to the
        actual Transactions table.

        The table should eventually contain:

        user_id
        type
        amount
        status
        description
        created_at
      */


      const {
        data,
        error: transactionError
      } = await supabaseClient
        .from("Transaction")
        .select("*")
        .eq("user_id", user.id)
        .order("created_at", {
          ascending: false
        });


      if (transactionError) {

        console.error(transactionError);

        container.innerHTML =
          "<p>Unable to load transactions.</p>";

        return;
      }


      if (!data || data.length === 0) {

        container.innerHTML =
          "<p>No transactions yet.</p>";

        return;
      }


      container.innerHTML = "";


      data.forEach(function(transaction) {

        const box =
          document.createElement("div");


        const amount =
          Number(
            transaction.amount || 0
          ).toLocaleString(
            "en-NG",
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          );


        const date =
          transaction.created_at
            ? new Date(
                transaction.created_at
              ).toLocaleString()
            : "Date unavailable";


        box.style.background = "white";
        box.style.padding = "18px";
        box.style.margin = "12px 0";
        box.style.borderRadius = "12px";
        box.style.textAlign = "left";


        box.innerHTML = `

          <h3>
            ${transaction.type || "Transaction"}
          </h3>

          <p>
            Amount: ₦${amount}
          </p>

          <p>
            Status:
            ${transaction.status || "Pending"}
          </p>

          <p>
            ${transaction.description || ""}
          </p>

          <small>
            ${date}
          </small>

        `;


        container.appendChild(box);

      });

    }


    /* =========================
       START
    ========================= */

    loadTransactions();

  </script></body></html>
