<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions - Delight Vendor Logs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 25px 20px 40px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px #00000014;
      margin-bottom: 18px;
    }

    .balance-label {
      margin: 0 0 6px;
      color: #666;
    }

    #walletBalance {
      margin: 0;
      font-size: 30px;
      font-weight: bold;
    }

    #transactions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transaction {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 16px;
      background: #fff;
    }

    .transaction-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .transaction-type {
      font-weight: bold;
      font-size: 16px;
    }

    .amount {
      font-size: 18px;
      font-weight: bold;
    }

    .positive {
      color: green;
    }

    .status {
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .description {
      margin-top: 6px;
      color: #666;
      font-size: 14px;
    }

    .date {
      margin-top: 8px;
      color: #888;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    .error {
      color: red;
      text-align: center;
      padding: 20px 10px;
    }

    .back {
      width: 100%;
      background: #333;
      color: #fff;
      padding: 16px;
      margin-top: 20px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }

    .refresh {
      width: 100%;
      border: 0;
      background: #111;
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>

<header>
  <h1>Transaction History</h1>
</header>

<main>

  <div class="card">
    <p class="balance-label">Your Balance</p>
    <p id="walletBalance">Loading...</p>
  </div>

  <button class="refresh" onclick="loadTransactions()">
    Refresh Transactions
  </button>

  <div class="card">
    <div id="transactions">
      <div class="empty">Loading transactions...</div>
    </div>
  </div>

  <div class="back" onclick="location.href='dashboard.html'">
    🏠 Back to Dashboard
  </div>

</main>

<script>
  const SUPABASE_URL =
    "https://hkfhehbhmucymusaytoe.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


  async function getCurrentUser() {
    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {
      location.href = "login.html";
      return null;
    }

    return user;
  }


  async function loadWalletBalance(userId) {

    const { data, error } =
      await supabaseClient.rpc("ensure_my_wallet");

    if (error) {
      console.error("Balance error:", error);
      document.getElementById("walletBalance").textContent =
        "Unable to load balance";
      return;
    }

    const balance = Number(data?.balance || 0);

    document.getElementById("walletBalance").textContent =
      "₦" +
      balance.toLocaleString("en-NG", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
  }


  async function loadTransactions() {

    const container =
      document.getElementById("transactions");

    container.innerHTML =
      '<div class="empty">Loading transactions...</div>';

    const user = await getCurrentUser();

    if (!user) return;


    await loadWalletBalance(user.id);


    const {
      data,
      error
    } = await supabaseClient
      .from("transactions")
      .select(
        "id, user_id, type, amount, status, description, created_at"
      )
      .eq("user_id", user.id)
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error("Transaction error:", error);

      container.innerHTML =
        '<div class="error">Unable to load transactions.</div>';

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        '<div class="empty">No transactions yet.</div>';

      return;
    }


    container.innerHTML = "";


    data.forEach(transaction => {

      const amount =
        Number(transaction.amount || 0);

      const date =
        transaction.created_at
          ? new Date(transaction.created_at)
              .toLocaleString("en-NG", {
                dateStyle: "medium",
                timeStyle: "short"
              })
          : "";


      const item =
        document.createElement("div");

      item.className = "transaction";


      item.innerHTML = `
        <div class="transaction-top">

          <div class="transaction-type">
            ${escapeHTML(
              transaction.type || "Transaction"
            )}
          </div>

          <div class="amount positive">
            +₦${amount.toLocaleString("en-NG", {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            })}
          </div>

        </div>

        <div class="status">
          ${escapeHTML(
            transaction.status || "completed"
          )}
        </div>

        <div class="description">
          ${escapeHTML(
            transaction.description || ""
          )}
        </div>

        <div class="date">
          ${escapeHTML(date)}
        </div>
      `;


      container.appendChild(item);
    });
  }


  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  loadTransactions();
</script>

</body>
  </html>
