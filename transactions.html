<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 


  <title>Transactions - Delight Vendor Logs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #0a0a0a;
      color: #f0cf68;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(212,175,55,.18);
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 25px 20px 40px;
    }

    .card {
      background: #0d0d0d;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
      margin-bottom: 18px;
      border: 1px solid rgba(212,175,55,.14);
    }

    .balance-label {
      margin: 0 0 6px;
      color: #999;
    }

    #walletBalance {
      margin: 0;
      font-size: 30px;
      font-weight: bold;
      color: #f0cf68;
    }

    #transactions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transaction {
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px;
      background: #090909;
    }

    .transaction-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .transaction-type {
      font-weight: bold;
      font-size: 16px;
      color: #fff;
    }

    .amount {
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }

    .positive {
      color: #4ade80;
    }

    .negative {
      color: #f87171;
    }

    .status {
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #f0cf68;
    }

    .description {
      margin-top: 6px;
      color: #999;
      font-size: 14px;
    }

    .date {
      margin-top: 8px;
      color: #707070;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    .error {
      color: #f87171;
      text-align: center;
      padding: 20px 10px;
    }

    .back {
      width: 100%;
      background: #111;
      color: #f0cf68;
      padding: 16px;
      margin-top: 20px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid rgba(212,175,55,.2);
    }

    .refresh {
      width: 100%;
      border: 0;
      background: linear-gradient(135deg,#f0cf68,#c49a24);
      color: #080808;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 18px;
      cursor: pointer;
    }
  .top-dashboard-back-wrap{max-width:1120px;margin:0 auto;padding:14px 20px 0}.top-dashboard-back{display:inline-flex;align-items:center;padding:10px 14px;border:1px solid #493b1c;border-radius:12px;background:#121212;color:#d4af37;text-decoration:none;font-weight:700}@media(max-width:600px){.top-dashboard-back-wrap{padding:12px 14px 0}}

.transaction-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.transaction-stat{min-width:0;text-align:left;padding:14px 12px;border:1px solid #493b1c;border-radius:14px;background:linear-gradient(145deg,#17140b,#101010);color:#f5f0df;cursor:pointer}.transaction-stat strong{display:block;font-size:24px;color:#d4af37;margin-top:7px}.transaction-stat span{font-size:12px;color:#b8ad8d}.transaction-stat.active{border-color:#d4af37;box-shadow:0 0 0 1px #d4af3740 inset}.transaction-stat:focus-visible{outline:2px solid #d4af37;outline-offset:2px}@media(max-width:420px){.transaction-stats{gap:6px}.transaction-stat{padding:11px 8px}.transaction-stat strong{font-size:20px}.transaction-stat span{font-size:11px}}
</style>
<link rel="icon" type="image/png" href="assets/dv-logo.png"><link rel="apple-touch-icon" href="assets/dv-logo.png"><link rel="stylesheet" href="site-theme.css"></head>

<body>

<header>
  <h1>Transaction History</h1>
</header>

<main>
<div class="top-dashboard-back-wrap"><a class="top-dashboard-back" href="dashboard.html">← Back to Dashboard</a></div>


  <div class="card">
    <p class="balance-label">Your Balance</p>
    <p id="walletBalance">Loading...</p>
  </div>

  <div id="transactionStats" class="transaction-stats" aria-label="Transaction status filters"></div>

  <button class="refresh" onclick="loadTransactions()">
    Refresh Transactions
  </button>

  <div class="card">
    <div id="transactions">
      <div class="empty">Loading transactions...</div>
    </div>
  </div>

  

</main>

<script>

  const SUPABASE_URL =
    "https://hkfhehbhmucymusaytoe.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  async function getCurrentUser() {

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

      location.href = "login.html";

      return null;
    }

    return user;
  }


  async function loadWalletBalance(userId) {

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "ensure_my_wallet"
    );

    if (error) {

      console.error(
        "Balance error:",
        error
      );

      document.getElementById(
        "walletBalance"
      ).textContent =
        "Unable to load balance";

      return;
    }

    const balance =
      Number(data?.balance || 0);

    document.getElementById(
      "walletBalance"
    ).textContent =
      "₦" +
      balance.toLocaleString(
        "en-NG",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );
  }


  async function loadTransactions() {

    const container =
      document.getElementById(
        "transactions"
      );

    container.innerHTML =
      '<div class="empty">Loading transactions...</div>';


    const user =
      await getCurrentUser();

    if (!user) return;


    await loadWalletBalance(
      user.id
    );


    const {
      data,
      error
    } =
      await supabaseClient
        .from("transactions")
        .select(
          "id, user_id, type, amount, status, description, created_at"
        )
        .eq(
          "user_id",
          user.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "Transaction error:",
        error
      );

      container.innerHTML =
        '<div class="error">Unable to load transactions.</div>';

      return;
    }


    const bucketFor = tx => {
      const s=String(tx.status||"completed").toLowerCase().trim();
      if(["completed","complete","success","successful","approved","received"].includes(s))return "completed";
      if(["pending","processing","in_progress","in progress","queued"].includes(s))return "pending";
      if(["rejected","failed","cancelled","canceled","declined"].includes(s))return "rejected";
      return "other";
    };
    const txStats=document.getElementById("transactionStats");
    const counts={completed:0,pending:0,rejected:0};
    (data||[]).forEach(tx=>{const b=bucketFor(tx);if(counts[b]!==undefined)counts[b]++});
    let activeTransactionFilter="all";
    function applyTransactionFilter(){
      document.querySelectorAll("#transactions .transaction").forEach(el=>{
        el.style.display=activeTransactionFilter==="all"||el.dataset.bucket===activeTransactionFilter?"":"none";
      });
      txStats.querySelectorAll(".transaction-stat").forEach(el=>el.classList.toggle("active",el.dataset.filter===activeTransactionFilter));
    }
    txStats.innerHTML=[
      {key:"completed",label:"Completed",count:counts.completed},
      {key:"pending",label:"Pending",count:counts.pending},
      {key:"rejected",label:"Cancelled / Failed",count:counts.rejected}
    ].map(s=>'<button type="button" class="transaction-stat" data-filter="'+s.key+'"><span>'+s.label+'</span><strong>'+s.count+'</strong></button>').join("");
    txStats.querySelectorAll(".transaction-stat").forEach(el=>el.addEventListener("click",()=>{activeTransactionFilter=el.dataset.filter;applyTransactionFilter()}));
    if (
      !data ||
      data.length === 0
    ) {

      container.innerHTML =
        '<div class="empty">No transactions yet.</div>';

      return;
    }


    container.innerHTML = "";


    data.forEach(
      transaction => {

        const amount =
          Number(
            transaction.amount || 0
          );


        const date =
          transaction.created_at
            ? new Date(
                transaction.created_at
              ).toLocaleString(
                "en-NG",
                {
                  dateStyle: "medium",
                  timeStyle: "short"
                }
              )
            : "";


        const type =
          String(
            transaction.type || ""
          ).toLowerCase().trim();


        const description =
          String(
            transaction.description || ""
          ).toLowerCase().trim();


        /*
         * ONLY MONEY ADDED TO THE WALLET
         * IS GREEN / POSITIVE.
         *
         * Everything else is treated as
         * money leaving the wallet.
         *
         * This also fixes OLD transactions
         * whose old type names were different.
         */

        const isCredit =
          type.includes("fund") ||
          type.includes("deposit") ||
          type.includes("credit") ||
          type.includes("topup") ||
          type.includes("top up") ||
          type.includes("wallet_funding") ||
          type.includes("wallet funding") ||
          type.includes("funding") ||
          description.includes("wallet funding") ||
          description.includes("fund wallet") ||
          description.includes("wallet funded") ||
          description.includes("wallet top up") ||
          description.includes("wallet topup") ||
          description.includes("deposit") ||
          description.includes("top up") ||
          description.includes("topup") ||
          description.includes("funded wallet");


        let amountClass;
        let amountSign;


        if (isCredit) {

          amountClass = "positive";
          amountSign = "+";

        } else {

          amountClass = "negative";
          amountSign = "−";

        }


        const item =
          document.createElement(
            "div"
          );

        item.className =
          "transaction";
        item.dataset.bucket = bucketFor(transaction);


        item.innerHTML = `

          <div class="transaction-top">

            <div class="transaction-type">
              ${escapeHTML(
                removeProviderNames(
                  transaction.type ||
                  "Transaction"
                )
              )}
            </div>

            <div class="amount ${amountClass}">
              ${amountSign}₦${amount.toLocaleString(
                "en-NG",
                {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2
                }
              )}
            </div>

          </div>


          <div class="status">
            ${escapeHTML(
              transaction.status ||
              "completed"
            )}
          </div>


          <div class="description">
            ${escapeHTML(
              removeProviderNames(
                transaction.description || ""
              )
            )}
          </div>


          <div class="date">
            ${escapeHTML(date)}
          </div>

        `;


        container.appendChild(
          item
        );
        applyTransactionFilter();

      }
    );

  }


  /*
   * DISPLAY-ONLY CHANGE:
   * Remove provider names from transaction
   * titles and descriptions.
   *
   * No status, cancellation, refund, amount,
   * or database logic is changed here.
   */

  function removeProviderNames(value) {

    return String(value)

      .replace(
        /\bgrizzly\s*sms\b/gi,
        ""
      )

      .replace(
        /\bgrizzlysms\b/gi,
        ""
      )

      .replace(
        /\bgrizzly\b/gi,
        ""
      )

      .replace(
        /\bsmsbower\b/gi,
        ""
      )

      .replace(
        /\b5sim\b/gi,
        ""
      )

      .replace(
        /\s*\([^)]*(?:grizz|smsbower|5sim)[^)]*\)?/gi,
        ""
      )

      .replace(
        /\(\s*\)/g,
        ""
      )

      .replace(
        /\s*[-–—|:]\s*(?=$)/g,
        ""
      )

      .replace(
        /^\s*[-–—|:]\s*/,
        ""
      )

      .replace(
        /\s{2,}/g,
        " "
      )

      .trim();

  }


  function escapeHTML(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  loadTransactions();

</script>

<script src="assets/site-announcement.js" defer></script>
</body>
</html>
