<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Central Notifications — Delight</title><link rel="icon" href="assets/dv-logo.png"><style>
:root{--gold:#d4af37;--muted:#b8ad8d;--line:#453719}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f0df;font:14px Arial,sans-serif}.top{padding:12px 15px;border-bottom:1px solid #302817;display:flex;align-items:center;gap:10px}.top img{width:34px;height:34px}.top b{flex:1}.top a{color:var(--gold);text-decoration:none}.wrap{max-width:1000px;margin:22px auto;padding:0 14px 45px}h1{font-size:clamp(24px,5vw,34px)}.muted{color:var(--muted);font-size:12px;line-height:1.6}.switch{display:flex;gap:8px;margin:16px 0}.switch button{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:#111;color:var(--muted);font-weight:800}.switch button.active{background:#2a210e;color:#f0d77a;border-color:var(--gold)}.item{border:1px solid var(--line);background:#111;border-radius:12px;padding:14px;margin:10px 0}.item h3{margin:0 0 7px;color:#f0d77a;font-size:15px}.item p{white-space:pre-wrap;line-height:1.55}.meta{color:var(--muted);font-size:11px;line-height:1.6}.tag{display:inline-block;border:1px solid #604d20;border-radius:20px;padding:4px 8px;color:#f0d77a;font-size:10px}.btn{border:1px solid #806521;border-radius:9px;padding:10px 13px;background:#211a0b;color:#f3d77d;font-weight:800}.empty{padding:25px;text-align:center;border:1px dashed #443719;border-radius:12px;color:var(--muted)}.status{padding:10px 0;color:var(--muted)}
</style></head><body><header class="top"><img src="assets/dv-logo.png" alt=""><b>DELIGHT · CENTRAL NOTIFICATIONS</b><a href="central-admin.html">Command Centre</a></header><main class="wrap"><h1>Notifications from both websites</h1><p class="muted">View customer and admin notification activity without mixing the two platforms' records.</p><div id="status" class="status">Checking administrator access…</div><div class="switch"><button class="active" data-platform="dv">Delight Vendor Logs</button><button data-platform="dve">DelightVendorEdit</button></div><div class="muted" id="count"></div><section id="items"><div class="empty">Loading notifications…</div></section><div style="margin-top:14px"><button class="btn" id="refresh">↻ Refresh</button></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{"use strict";const dv=supabase.createClient("https://hkfhehbhmucymusaytoe.supabase.co","sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_",{auth:{persistSession:true,storageKey:"delight-central-dv"}});const dve=supabase.createClient("https://genlmqzkjouinofkitqt.supabase.co","sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv",{auth:{persistSession:true,storageKey:"delight-central-dve"}});const $=id=>document.getElementById(id);let platform="dv",data={dv:[],dve:[]};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function say(t){$("status").textContent=t}
async function verify(db){const {data:{user},error}=await db.auth.getUser();if(error||!user)throw new Error("Sign in through the Central Command first.");const a=await db.rpc("is_admin");if(a.error||a.data!==true)throw new Error("Administrator access is required on both websites.")}
async function loadDV(){const {data:d,error}=await dv.functions.invoke("delight-notifications",{body:{action:"history"}});if(error)throw error;if(d?.error)throw new Error(d.error);data.dv=(d.notifications||[]).map(n=>({title:n.title,message:n.message,category:n.category||"general",created_at:n.created_at,recipientCount:(n.notification_recipients||[]).length,readCount:(n.notification_recipients||[]).filter(x=>x.read_at).length,platform:"DV"}))}
async function loadDVE(){const {data:d,error}=await dve.from("notifications").select("id,title,message,category,created_at,is_read,recipient_user_id").order("created_at",{ascending:false}).limit(200);if(error)throw error;data.dve=(d||[]).map(n=>({title:n.title,message:n.message,category:n.category,created_at:n.created_at,recipientCount:1,readCount:n.is_read?1:0,recipient:n.recipient_user_id,platform:"DVE"}))}
function render(){const rows=data[platform];$("count").textContent=rows.length+" recent notification record(s)";$("items").innerHTML=rows.length?rows.map(n=>'<article class="item"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3>'+esc(n.title)+'</h3><span class="tag">'+esc(n.category||"general")+'</span></div><p>'+esc(n.message)+'</p><div class="meta">'+esc(new Date(n.created_at).toLocaleString())+(platform==="dv"?" · "+n.recipientCount+" recipients · "+n.readCount+" read · "+(n.recipientCount-n.readCount)+" unread":" · Recipient: "+esc(n.recipient||"not specified")+" · "+(n.readCount?"Read":"Unread"))+'</div></article>').join(""):'<div class="empty">No notification records found.</div>'}
async function refresh(){say("Loading both notification systems…");try{await Promise.all([loadDV(),loadDVE()]);render();say("Both notification systems loaded.")}catch(e){say("Could not load both systems: "+(e.message||"Check admin sign-in."))}}
document.querySelectorAll("[data-platform]").forEach(b=>b.onclick=()=>{platform=b.dataset.platform;document.querySelectorAll("[data-platform]").forEach(x=>x.classList.toggle("active",x===b));render()});$("refresh").onclick=refresh;(async()=>{try{await Promise.all([verify(dv),verify(dve)]);say("Administrator access verified on both platforms.");await refresh()}catch(e){say(e.message)}})();
})();
</script></body></html>
