<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080808"><title>Central Support Inbox — Delight</title><link rel="icon" href="assets/dv-logo.png"><style>
:root{--gold:#d4af37;--muted:#b8ad8d;--line:#453719}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f0df;font:14px Arial,sans-serif}.top{padding:12px 15px;border-bottom:1px solid #302817;display:flex;align-items:center;gap:10px}.top img{width:34px;height:34px}.top b{flex:1}.top a{color:var(--gold);text-decoration:none}.wrap{max-width:1150px;margin:18px auto;padding:0 12px 35px}.switch{display:flex;gap:8px;margin:15px 0}.switch button{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;background:#111;color:var(--muted);font-weight:800}.switch button.active{background:#2a210e;color:#f0d77a;border-color:var(--gold)}.layout{display:grid;grid-template-columns:minmax(230px,340px) 1fr;gap:12px;min-height:65vh}.panel{background:#101010;border:1px solid var(--line);border-radius:13px;overflow:hidden}.panel h2{font-size:15px;padding:14px;margin:0;border-bottom:1px solid #302817}.list{max-height:65vh;overflow:auto}.conversation{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;border-bottom:1px solid #272217;padding:13px;cursor:pointer}.conversation.active{background:#241d0d}.conversation b{display:block;color:#f0d77a}.conversation small{display:block;color:var(--muted);margin-top:5px;line-height:1.4}.messages{height:calc(65vh - 135px);min-height:300px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:85%;padding:10px 12px;border-radius:12px;background:#1c1c1c;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.admin{align-self:flex-end;background:#30250d;border:1px solid #6b5420}.bubble.bot{align-self:flex-start;background:#172019;border:1px solid #304b36}.bubble small{display:block;margin-top:6px;color:#b8ad8d;font-size:10px}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid #302817}.compose textarea{flex:1;min-height:46px;max-height:120px;resize:vertical;background:#080808;color:#fff;border:1px solid #59471e;border-radius:9px;padding:10px;font:inherit}.btn{border:1px solid #806521;border-radius:9px;padding:10px 13px;background:var(--gold);color:#111;font-weight:800}.muted{color:var(--muted);font-size:12px;line-height:1.6}.status{padding:10px 12px;color:#b8ad8d}.hidden{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr}.list{max-height:230px}.messages{height:45vh;min-height:250px}.compose{position:sticky;bottom:0;background:#101010}.switch button{font-size:12px}}
</style></head><body><header class="top"><img src="assets/dv-logo.png" alt=""><b>DELIGHT · CENTRAL SUPPORT</b><a href="central-admin.html">Command Centre</a></header><main class="wrap"><div class="muted">One inbox for customer conversations from both websites. Select a platform, open a conversation and reply without switching admin dashboards.</div><div id="status" class="status">Checking administrator access…</div><section id="app" class="hidden"><div class="switch"><button class="active" data-platform="dv">Delight Vendor Logs</button><button data-platform="dve">DelightVendorEdit</button></div><div class="layout"><section class="panel"><h2>Conversations <span id="conversationCount"></span></h2><div id="conversationList" class="list"></div></section><section class="panel"><h2 id="chatTitle">Choose a conversation</h2><div id="messages" class="messages"><div class="muted">Select a conversation from the list.</div></div><form id="compose" class="compose"><textarea id="message" maxlength="4000" placeholder="Write a reply…" disabled></textarea><button id="send" class="btn" disabled>Send</button></form></section></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{"use strict";
const dv=supabase.createClient("https://hkfhehbhmucymusaytoe.supabase.co","sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_",{auth:{persistSession:true,storageKey:"delight-central-dv"}});
const dve=supabase.createClient("https://genlmqzkjouinofkitqt.supabase.co","sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv",{auth:{persistSession:true,storageKey:"delight-central-dve"}});
const $=id=>document.getElementById(id);let platform="dv",selected=null,rows=[],clients={},users={},channels=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function say(t){$("status").textContent=t}
function db(){return platform==="dv"?dv:dve}
function me(){return users[platform]}
function formatDate(v){return v?new Date(v).toLocaleString():""}
async function authOne(client){const {data:{user},error}=await client.auth.getUser();if(error||!user)throw new Error("Please sign in to both admin accounts first.");const a=await client.rpc("is_admin");if(a.error||a.data!==true)throw new Error("Administrator access is required on both websites.");return user}
async function presence(client){try{await client.from("support_chat_settings").update({admin_last_seen_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq("id",true)}catch(e){console.warn("Presence update failed",e)}}
async function loadConversations(){const client=db();const {data,error}=await client.from("support_chat_conversations").select("id,customer_user_id,created_at,last_message_at,last_message_preview").order("last_message_at",{ascending:false,nullsFirst:false}).limit(200);if(error)throw error;rows=data||[];const ids=[...new Set(rows.map(x=>x.customer_user_id).filter(Boolean))];const table=platform==="dv"?"full_name":"display_name";if(ids.length){const p=await client.from("profiles").select("id,"+table+",email").in("id",ids);if(!p.error)for(const x of p.data||[])users[platform+":"+x.id]=x}renderList();if(selected&&!rows.some(x=>x.id===selected.id))selected=null;if(selected)await loadMessages()}
function renderList(){$("conversationCount").textContent="("+rows.length+")";$("conversationList").innerHTML=rows.length?rows.map(x=>{const u=users[platform+":"+x.customer_user_id]||{};const name=u.full_name||u.display_name||(u.email?u.email.split("@")[0]:"Customer "+String(x.customer_user_id||"").slice(0,7));return '<button class="conversation '+(selected&&selected.id===x.id?"active":"")+'" data-id="'+x.id+'"><b>'+esc(name)+'</b><small>'+esc(x.last_message_preview||"No messages yet")+'<br>'+esc(formatDate(x.last_message_at||x.created_at))+'</small></button>'}).join(""):'<div class="status">No conversations yet.</div>';$("conversationList").querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{selected=rows.find(x=>x.id===b.dataset.id);renderList();await loadMessages()})}
async function loadMessages(){if(!selected)return;const {data,error}=await db().from("support_chat_messages").select("id,sender_role,message_text,created_at,image_path").eq("conversation_id",selected.id).order("created_at",{ascending:true}).limit(300);if(error)throw error;$("chatTitle").textContent="Conversation · "+selected.id.slice(0,8);$("messages").innerHTML=(data||[]).map(x=>'<div class="bubble '+(x.sender_role==="admin"?"admin":x.sender_role==="bot"?"bot":"")+'">'+esc(x.message_text|| (x.image_path?"Image attachment":""))+'<small>'+esc(x.sender_role)+" · "+esc(formatDate(x.created_at))+'</small></div>').join("")||'<div class="muted">No messages in this conversation yet.</div>';$("messages").scrollTop=$("messages").scrollHeight;$("message").disabled=false;$("send").disabled=false}
async function refresh(){await presence(db());await loadConversations()}
$("compose").addEventListener("submit",async e=>{e.preventDefault();const text=$("message").value.trim();if(!text||!selected)return;const b=$("send");b.disabled=true;try{const {error}=await db().from("support_chat_messages").insert({conversation_id:selected.id,sender_user_id:me().id,sender_role:"admin",message_text:text});if(error)throw error;$("message").value="";await loadMessages();await loadConversations();say("Reply sent.")}catch(e){say("Could not send reply: "+(e.message||"Unknown error"))}finally{b.disabled=false}});
document.querySelectorAll("[data-platform]").forEach(b=>b.onclick=async()=>{platform=b.dataset.platform;selected=null;document.querySelectorAll("[data-platform]").forEach(x=>x.classList.toggle("active",x===b));$("messages").innerHTML='<div class="muted">Select a conversation from the list.</div>';$("message").disabled=true;$("send").disabled=true;try{await refresh()}catch(e){say(e.message)}});
(async()=>{try{const [a,b]=await Promise.all([authOne(dv),authOne(dve)]);users.dv=a;users.dve=b;$("app").classList.remove("hidden");say("Administrator access verified on both websites.");await refresh();for(const [key,client] of [["dv",dv],["dve",dve]]){const channel=client.channel("central-support-"+key).on("postgres_changes",{event:"*",schema:"public",table:"support_chat_messages"},()=>{if(platform===key){loadConversations().catch(e=>say(e.message))}}).subscribe();channels.push(channel)}setInterval(()=>{presence(dv);presence(dve)},30000)}catch(e){say(e.message||"Could not verify admin access. Please sign in again.")}})();
})();
</script></body></html>
