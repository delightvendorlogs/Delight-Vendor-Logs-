<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Delight Vendor Logs</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

/* HEADER */

header{
  background:#111;
  color:#fff;
  padding:18px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.header-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#fff;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:bold;
  flex-shrink:0;
}

.header-text{
  min-width:0;
}

.header-welcome{
  margin:0 0 3px;
  font-size:12px;
  color:#ccc;
}

header h1{
  margin:0;
  font-size:18px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

header button{
  width:44px;
  height:44px;
  background:#fff;
  color:#111;
  border:none;
  border-radius:12px;
  font-size:22px;
  cursor:pointer;
  flex-shrink:0;
}

/* MAIN */

main{
  padding:15px;
  max-width:800px;
  margin:auto;
}

/* WATERMARK */

.watermark{
  display:none;
  background:#fff;
  margin:0 0 15px;
  padding:11px 13px;
  border-radius:10px;
  color:#555;
  font-size:13px;
  line-height:1.5;
  border-left:3px solid #111;
}

/* WALLET */

.wallet-card{
  background:#111;
  color:#fff;
  padding:20px;
  margin-bottom:18px;
  border-radius:18px;
  box-shadow:0 3px 12px #00000018;
}

.wallet-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.wallet-label{
  margin:0;
  color:#ccc;
  font-size:14px;
  font-weight:bold;
}

.eye-button{
  border:0;
  background:#292929;
  color:#fff;
  width:38px;
  height:38px;
  border-radius:10px;
  cursor:pointer;
  font-size:17px;
}

#walletBalance{
  margin:12px 0 18px;
  font-size:29px;
  font-weight:bold;
  letter-spacing:.2px;
}

.wallet-actions{
  display:flex;
  gap:10px;
}

.main-button{
  border:none;
  background:#fff;
  color:#111;
  padding:12px 17px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}

.secondary-button{
  border:1px solid #444;
  background:#222;
  color:#fff;
  padding:12px 17px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}

/* CATEGORY TITLE */

.section-heading{
  margin:5px 0 13px;
}

.section-heading h2{
  margin:0;
  font-size:20px;
}

.section-heading p{
  margin:5px 0 0;
  color:#777;
  font-size:13px;
}

/* CATEGORY GRID */

.category-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:22px;
}

.category-item{
  border:0;
  background:#fff;
  border-radius:15px;
  padding:14px 7px;
  min-height:105px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  cursor:pointer;
  box-shadow:0 2px 9px #0000000d;
  transition:transform .12s ease;
}

.category-item:active{
  transform:scale(.96);
}

.category-icon{
  width:47px;
  height:47px;
  border-radius:14px;
  background:#f0f0f0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.category-name{
  font-size:11px;
  font-weight:bold;
  text-align:center;
  line-height:1.25;
}

/* SEARCH */

.search-box{
  width:100%;
  margin:0 0 15px;
  padding:14px 15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  outline:none;
  background:#fff;
}

/* SERVICES */

.services-section{
  margin-top:5px;
}

.products-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.product-card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  box-shadow:0 2px 9px #00000012;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
  display:block;
}

.no-image{
  width:100%;
  height:190px;
  border-radius:10px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}

.product-card h3{
  margin:13px 0 7px;
  font-size:18px;
}

.product-description{
  color:#666;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
}

.product-price{
  font-size:19px;
  font-weight:bold;
  margin:12px 0;
}

.product-category{
  display:inline-block;
  background:#eee;
  padding:6px 9px;
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
}

.stock-text{
  font-size:13px;
  color:#555;
  margin:8px 0;
}

.buy-button{
  width:100%;
  border:none;
  background:#111;
  color:#fff;
  padding:13px;
  border-radius:9px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  margin-top:8px;
}

.buy-button:disabled{
  background:#999;
  cursor:not-allowed;
}

/* MENU */

#menu{
  position:fixed;
  top:0;
  right:0;
  width:280px;
  max-width:85%;
  height:100vh;
  background:#fff;
  z-index:100;
  box-shadow:-3px 0 15px #0003;
  padding:22px;
  overflow-y:auto;
}

.menu-item{
  padding:14px 5px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  font-weight:bold;
}

.menu-close{
  color:#b00020;
}

/* WHATSAPP */

.whatsapp-float{
  position:fixed;
  right:18px;
  bottom:18px;
  width:54px;
  height:54px;
  border-radius:50%;
  background:#25d366;
  color:#fff;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  box-shadow:0 3px 12px #0003;
  z-index:90;
}

/* MOBILE */

@media(max-width:520px){

  .category-grid{
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  }

  .category-item{
    min-height:95px;
    padding:10px 4px;
  }

  .category-icon{
    width:42px;
    height:42px;
    font-size:20px;
  }

  .category-name{
    font-size:10px;
  }

  .wallet-actions{
    flex-wrap:wrap;
  }

}

@media(min-width:600px){

  .products-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

/* LOADING */

.loading-box{
  background:#fff;
  border-radius:14px;
  padding:25px;
  text-align:center;
  color:#777;
}

.error-box{
  background:#ffe5e5;
  color:#9b0000;
  padding:15px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>

  <div class="header-left">

    <div id="headerAvatar" class="header-avatar">
      👤
    </div>

    <div class="header-text">
      <p class="header-welcome">Welcome back</p>
      <h1 id="userName">Delight Vendor Logs</h1>
    </div>

  </div>

  <button type="button" onclick="openMenu()">☰</button>

</header>


<main>

  <!-- WATERMARK — KEPT -->

  <div id="watermark" class="watermark"></div>


  <!-- WALLET -->

  <section class="wallet-card">

    <div class="wallet-top">

      <p class="wallet-label">
        Wallet Balance
      </p>

      <button
        type="button"
        id="eyeButton"
        class="eye-button"
        onclick="toggleBalance()"
        aria-label="Show balance"
      >
        👁️
      </button>

    </div>

    <p id="walletBalance">
      ••••••••
    </p>

    <div class="wallet-actions">

      <button
        type="button"
        class="main-button"
        onclick="location.href='wallet.html'"
      >
        💰 Fund Wallet
      </button>

      <button
        type="button"
        class="secondary-button"
        onclick="location.href='transactions.html'"
      >
        📜 Transactions
      </button>

    </div>

  </section>


  <!-- CATEGORIES -->

  <section>

    <div class="section-heading">
      <h2>Our Services</h2>
      <p>Choose a category to continue</p>
    </div>


    <div class="category-grid">

      <button
        class="category-item"
        onclick="openCategory('All Social Logs')"
      >
        <div class="category-icon">📱</div>
        <div class="category-name">Social Logs</div>
      </button>


      <button
        class="category-item"
        onclick="openCategory('Working Pictures')"
      >
        <div class="category-icon">🖼️</div>
        <div class="category-name">Working Pictures</div>
      </button>


      <button
        class="category-item"
        onclick="openCategory('Formats')"
      >
        <div class="category-icon">📄</div>
        <div class="category-name">Formats</div>
      </button>


      <button
        class="category-item"
        onclick="openCategory('Working Links')"
      >

        <div class="category-name">Working Links</div>
      </button>


      <button
        class="category-item"
        onclick="openCategory('Voice Cloner/Fake Video Call')"
      >
        <div class="category-icon">🎙️</div>
        <div class="category-name">Voice / Video Call</div>

      <button
        class="category-item"
        onclick="location.href='virtualnumber.html'"
      >
        <div class="category-icon">📞</div>

      </button>


      <button

        onclick="openCategory('Streaming & More')"
      >

      </button>


      <button
        class="category-item"

      >

      <button

        onclick="openCategory('VPN')"
      >

      </button>


      <button
        class="category-item"
        onclick="openCategory('Other Services')"
      >
        <div class="category-icon">➕</div>
        <div class="category-name">Other Services</div>
      </button>

    </div>

  </section>


  <!-- SERVICE SEARCH / LIST -->

  <section class="services-section">

    <div class="section-heading">
      <h2>Latest Services</h2>
      <p>Browse available services</p>
    </div>

    <input
      id="serviceSearch"

      oninput="filterServices()"

    >

    <div id="products" class="products-grid">
      <div class="loading-box">
        Loading services...
      </div>
    </div>

  </section>

</main>


<!-- WHATSAPP — KEPT -->

<a
  class="whatsapp-float"
  href="https://wa.me/2347015908401"
  target="_blank"
  aria-label="WhatsApp"
>
  💬
</a>


<!-- MENU — KEPT -->

<div id="menu" style="display:none;">

  <h3>Menu</h3>

  <div
    class="menu-item"
    onclick="location.href='profile.html'"
  >
    👤 Profile
  </div>

  <div
    class="menu-item"
    onclick="location.href='wallet.html'"
  >
    💰 Fund Wallet

    </a>

  </div>

  <div

    ✖ Close
  </div>

</div>


<script>

const SUPABASE_URL =
"https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let allServices = [];
let balanceVisible = false;
let actualBalance = 0;


/* MENU */

function openMenu(){
  document.getElementById("menu").style.display="block";
}

function closeMenu(){
  document.getElementById("menu").style.display="none";
}


/* ESCAPE HTML */

function escapeHTML(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* BALANCE */

function formatBalance(value){

  return "₦" +
    Number(value || 0).toLocaleString("en-NG",{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });

}


function renderBalance(){

  const box =
    document.getElementById("walletBalance");

  const eye =
    document.getElementById("eyeButton");

  if(balanceVisible){

    box.textContent =
      formatBalance(actualBalance);

    eye.textContent="🙈";
    eye.setAttribute(
      "aria-label",
      "Hide balance"
    );

  }else{

    box.textContent="••••••••";

    eye.textContent="👁️";
    eye.setAttribute(
      "aria-label",
      "Show balance"
    );

  }

}


function toggleBalance(){

  balanceVisible =
    !balanceVisible;

  renderBalance();

}


/* USER */

async function loadUser(){

  const {
    data:{user},
    error
  } =
  await supabaseClient.auth.getUser();


  if(error || !user){

    location.href="login.html";
    return null;

  }


  const metadata =
    user.user_metadata || {};


  const firstName =
    metadata.first_name ||
    metadata.firstname ||
    metadata.firstName ||
    metadata.name ||
    "";


  const lastName =
    metadata.last_name ||
    metadata.lastname ||
    metadata.lastName ||
    "";


  let fullName =
    [firstName,lastName]
      .filter(Boolean)
      .join(" ")
      .trim();


  if(!fullName){

    fullName =
      metadata.full_name ||
      metadata.fullName ||
      "";

  }


  if(!fullName){

    fullName =
      user.email
        ? user.email.split("@")[0]
        : "Customer";

  }


  document.getElementById(
    "userName"
  ).textContent =
    fullName;


  const avatar =
    document.getElementById(
      "headerAvatar"
    );


  const initial =
    fullName
      .trim()
      .charAt(0)
      .toUpperCase();


  if(initial){

    avatar.textContent =
      initial;

  }


  return user;

}


/* WALLET */

async function loadWallet(){

  const {
    data,
    error
  } =
  await supabaseClient.rpc(
    "ensure_my_wallet"
  );


  if(error){

    console.error(
      "Wallet error:",
      error
    );

    actualBalance=0;

    document.getElementById(
      "walletBalance"
    ).textContent=
      "Unable to load balance.";

    return;

  }


  actualBalance =
    Number(data?.balance ?? 0);


  renderBalance();

}


/* WATERMARK — KEPT */

async function loadWatermark(){

  const box =
    document.getElementById(
      "watermark"
    );


  if(!box)return;


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("site_settings")
      .select("value")
      .eq("key","watermark")
      .maybeSingle();


    if(error){

      console.error(
        "Watermark error:",
        error
      );

      box.textContent="";
      box.style.display="none";

      return;

    }


    const text =
      String(
        data?.value || ""
      ).trim();


    if(text){

      box.textContent=text;
      box.style.display="block";

    }else{

      box.textContent="";
      box.style.display="none";

    }

  }catch(error){

    console.error(
      "Watermark loading error:",
      error
    );

    box.textContent="";
    box.style.display="none";

  }

}


/* CATEGORY NAVIGATION */

function openCategory(category){

  /*
    Navigate immediately.
    No waiting for products,
    wallet, or category data.
  */

  const url =
    "products.html?category=" +
    encodeURIComponent(category);

  location.href=url;

}


/* PRODUCTS */

async function loadProducts(){

  const container =
    document.getElementById(
      "products"
    );


  const {
    data,
    error
  } =
  await supabaseClient
    .from("Product")
    .select("*")
    .eq("is_active",true)
    .order("id",{ascending:false});


  if(error){

    console.error(
      "Product loading error:",
      error
    );

    container.innerHTML =
      '<div class="error-box">' +
      '❌ Unable to load services.' +
      '</div>';

    return;

  }


  allServices =
    data || [];


  renderServices();

}


/* SEARCH */

function filterServices(){

  renderServices();

}


/* RENDER */

function renderServices(){

  const container =
    document.getElementById(
      "products"
    );


  const input =
    document.getElementById(
      "serviceSearch"
    );


  const search =
    input.value
      .trim()
      .toLowerCase();


  let services =
    [...allServices];


  if(search){

    services =
      services.filter(product =>

        String(
          product.name || ""
        )
        .toLowerCase()
        .includes(search)

        ||

        String(
          product.description || ""
        )
        .toLowerCase()
        .includes(search)

        ||

        String(
          product.category || ""
        )
        .toLowerCase()
        .includes(search)

      );

  }


  if(!services.length){

    container.innerHTML =
      '<div class="loading-box">' +
      '🔍<br><br>' +
      '<strong>No services found</strong>' +
      '<p>Try another search.</p>' +
      '</div>';

    return;

  }


  container.innerHTML="";


  services.forEach(product => {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "product-card";


    const price =
      Number(
        product.price || 0
      ).toLocaleString(
        "en-NG",
        {
          minimumFractionDigits:0,
          maximumFractionDigits:2
        }
      );


    const stock =
      Number(
        product.stock || 0
      );


    const track =
      product.track_stock !== false;


    const status =
      String(
        product.status ||
        "Available"
      )
      .toLowerCase()
      .trim();


    const soldOut =

      (
        track &&
        (
          stock <= 0 ||
          status === "sold" ||
          status === "sold out" ||
          status === "unavailable"
        )
      )

      ||

      (
        !track &&
        status === "unavailable"
      );


    let image;


    if(
      product.image_url &&
      String(
        product.image_url
      ).trim()
    ){

      image =
        '<img class="product-image" src="' +
        escapeHTML(
          product.image_url
        ) +
        '" onerror="' +
        'this.style.display=\'none\';' +
        'this.nextElementSibling.style.display=\'flex\'' +
        '">' +

        '<div class="no-image" ' +
        'style="display:none">' +
        '🛍️' +
        '</div>';

    }else{

      image =
        '<div class="no-image">' +
        '🛍️' +
        '</div>';

    }


    card.innerHTML =

      image +

      '<h3>' +
      escapeHTML(
        product.name ||
        "Unnamed Service"
      ) +
      '</h3>' +

      '<span class="product-category">' +
      escapeHTML(
        product.category ||
        "Service"
      ) +
      '</span>' +

      '<p class="product-description">' +
      escapeHTML(
        product.description ||
        ""
      ) +
      '</p>' +

      '<p class="product-price">' +
      '₦' +
      price +
      '</p>' +

      '<p class="stock-text">' +

      (
        soldOut
        ? "❌ Sold Out / Unavailable"
        : "✅ Available"
      ) +

      '</p>' +

      '<button ' +
      'class="buy-button" ' +
      (soldOut
        ? "disabled"
        : "") +
      ' onclick="buyProduct(' +
      Number(product.id) +
      ')">' +

      (
        soldOut
        ? "Sold Out"
        : "Buy Now"
      ) +

      '</button>';


    container.appendChild(
      card
    );

  });

}


/* BUY */

function buyProduct(id){

  location.href =
    "products.html?id=" +
    encodeURIComponent(id);

}


/*
  IMPORTANT:
  These are deliberately started
  independently.

  The dashboard does NOT wait for
  wallet/watermark/products before
  the user can click navigation.
*/

async function startDashboard(){

  loadUser();
  loadWallet();
  loadWatermark();
  loadProducts();

}


startDashboard();

</script>

</body>
