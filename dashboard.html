/* =========================

========================= */


const SUPABASE_URL =

const supabaseClient =
  window.supabase.createClient(

/* =========================

========================= */


function openMenu() {

  document.getElementById(

  ).style.display = "block";

function closeMenu() {

  document.getElementById(
    "menu"
  ).style.display = "none";

/* =========================
   LOAD WALLET
========================= */


async function loadWallet() {


  const {
    data: {
      user
    },
    error
  } =
    await supabaseClient.auth.getUser();


  if (error || !user) {

    window.location.href =
      "login.html";

    return;

  }


  const {
    data: wallet,
    error: walletError
  } =
    await supabaseClient

      .from("Wallet")

      .select("balance")

      .eq(
        "user_id",
        user.id
      )

      .maybeSingle();


  if (walletError) {

    console.error(
      walletError
    );

    document.getElementById(
      "walletBalance"
    ).textContent =
      "Unable to load balance.";

    return;

  }


  const balance =
    wallet?.balance || 0;


  document.getElementById(
    "walletBalance"
  ).textContent =

    "₦" +

    Number(balance)
      .toLocaleString(
        "en-NG",
        {
          minimumFractionDigits: 2,

          maximumFractionDigits: 2
        }
      );

}



/* =========================
   LOAD SERVICES
========================= */


async function loadProducts() {


  const container =
    document.getElementById(
      "products"
    );


  const {
    data,
    error
  } =
    await supabaseClient

      .from("Product")

      .select("*")

      .order(
        "id",
        {
          ascending: false
        }
      )

      .limit(2);


  if (error) {

    console.error(
      error
    );

    container.innerHTML =
      "<p>Unable to load services.</p>";

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML =
      "<p>No services available yet.</p>";

    return;

  }


  container.innerHTML = "";


  data.forEach(
    function(product) {


      const box =
        document.createElement(
          "div"
        );


      box.innerHTML = `

        <h3>
          ${product.name}
        </h3>

        <p>
          Price:
          ₦${Number(
            product.price || 0
          ).toLocaleString()}
        </p>

        <p>
          ${
            product.description || ""
          }
        </p>

        <button
          onclick="buyProduct(${product.id})"
        >
          Buy Now
        </button>

      `;


      container.appendChild(
        box
      );

    }
  );

}
