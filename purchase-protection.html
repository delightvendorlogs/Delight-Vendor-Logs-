<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="robots" content="noindex,nofollow"><title>Purchase Protection & Reviews — Delight Vendor Logs</title><link rel="icon" href="assets/dv-logo.png"><style>
:root{--gold:#d4af37;--muted:#b8ad8d;--line:#453719}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f0df;font:14px Arial,sans-serif}.top{padding:15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #302817}.top img{width:36px;height:36px;object-fit:contain}.top b{flex:1}.top a{color:var(--gold);text-decoration:none}.wrap{max-width:850px;margin:24px auto;padding:0 14px 50px}.hero,.card{border:1px solid var(--line);background:#111;border-radius:15px;padding:18px;margin-bottom:14px}.hero{background:radial-gradient(ellipse at top right,#2a210d,#111 60%)}h1{font-size:clamp(24px,5vw,34px);margin:8px 0}.muted{color:var(--muted);font-size:12px;line-height:1.6}.gold{color:var(--gold)}.btn{border:1px solid #8b6d20;background:#211a0b;color:#f3d77d;border-radius:9px;padding:11px 13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--gold);color:#111}.btn:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.purchase{border:1px solid #332a17;background:#0c0c0c;padding:15px;border-radius:12px;margin:10px 0}.purchase h3{margin:0 0 6px}.status{font-size:12px;color:#b7dcb9}.status.warn{color:#f1cf73}.status.bad{color:#ffaaaa}textarea,select{width:100%;background:#080808;color:#fff;border:1px solid #59471e;border-radius:9px;padding:12px;margin:8px 0;font:inherit}textarea{min-height:100px;resize:vertical}.stars{display:flex;gap:5px;margin:8px 0}.stars button{font-size:26px;padding:3px 7px;background:none;border:0;color:#64552d}.stars button.active{color:#f0c94d}.panel{padding:12px;border:1px solid #382d17;border-radius:10px;margin-top:10px}.hidden{display:none!important}.tag{display:inline-block;border:1px solid #5b4920;color:#e6c75e;border-radius:20px;padding:4px 8px;font-size:11px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.modal>div{width:min(100%,520px);background:#111;border:1px solid var(--gold);border-radius:16px;padding:20px;max-height:90vh;overflow:auto}
</style></head><body>
<header class="top"><img src="assets/dv-logo.png" alt=""><b>Delight Vendor Logs</b><a href="purchases.html">My Purchases</a></header>
<main class="wrap"><section class="hero"><div class="gold" style="font-size:10px;font-weight:800;letter-spacing:.16em">CUSTOMER CARE</div><h1>Purchase Protection & Reviews</h1><p class="muted">Report a problem with a completed purchase, track your report, or leave a rating. Reviews are checked by our admin before they appear publicly.</p><div id="notice" class="muted">Loading your purchases…</div></section><div id="list"></div></main>
<div id="reviewModal" class="modal"><div><h2 style="margin-top:0">Rate your purchase</h2><div id="reviewProduct" class="muted"></div><div id="stars" class="stars"></div><textarea id="reviewText" maxlength="1200" placeholder="Share your experience (3–1,200 characters)"></textarea><div class="row"><button id="submitReview" class="btn primary">Submit review</button><button id="snoozeReview" class="btn">Remind me in 3 days</button><button id="closeReview" class="btn">Close</button></div><div id="reviewMsg" class="muted"></div></div></div>
<div id="ticketModal" class="modal"><div><h2 style="margin-top:0">Report a purchase problem</h2><div id="ticketProduct" class="muted"></div><select id="issueType"><option value="not_received">I haven't received my purchase</option><option value="wrong_item">I received the wrong item</option><option value="invalid_content">The delivered content doesn't work</option><option value="other">Other problem</option></select><textarea id="ticketText" maxlength="2000" placeholder="Explain what happened (10–2,000 characters)"></textarea><div class="row"><button id="submitTicket" class="btn primary">Send report</button><button id="closeTicket" class="btn">Close</button></div><div id="ticketMsg" class="muted"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{"use strict";
const URL="https://hkfhehbhmucymusaytoe.supabase.co",KEY="sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";
const db=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);let purchases=[],reviews=[],reminders=[],tickets=[],current=null,rating=5;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function msg(id,t,bad=false){$(id).textContent=t;$(id).style.color=bad?"#ffaaaa":"#b8ad8d"}
function open(id){$(id).classList.add("open")}function close(id){$(id).classList.remove("open")}
function reviewOpen(p){current=p;rating=5;$("reviewProduct").textContent=p.product_name+" · Purchase #"+p.id;drawStars();$("reviewText").value="";msg("reviewMsg","");open("reviewModal")}
function drawStars(){$("stars").innerHTML=[1,2,3,4,5].map(n=>'<button type="button" data-star="'+n+'" class="'+(n<=rating?"active":"")+'" aria-label="'+n+' stars">★</button>').join("");$("stars").querySelectorAll("button").forEach(b=>b.onclick=()=>{rating=Number(b.dataset.star);drawStars()})}
function ticketOpen(p){current=p;$("ticketProduct").textContent=p.product_name+" · Purchase #"+p.id;$("ticketText").value="";msg("ticketMsg","");open("ticketModal")}
function render(){
 const root=$("list");if(!purchases.length){root.innerHTML='<section class="card muted">No completed purchases are available for review or protection yet.</section>';return}
 root.innerHTML=purchases.map(p=>{
 const r=reviews.find(x=>String(x.purchase_id)===String(p.id)),rem=reminders.find(x=>String(x.purchase_id)===String(p.id)),ticket=tickets.find(x=>String(x.purchase_id)===String(p.id));
 let actions="";
 if(r)actions='<div class="panel"><span class="tag">Review '+esc(r.status)+'</span><p class="muted">Your rating: '+r.rating+'/5 · '+esc(r.review_text)+'</p></div>';
 else if(rem&&new Date(rem.remind_after)>new Date())actions='<p class="status warn">Review reminder snoozed until '+new Date(rem.remind_after).toLocaleString()+'</p>';
 else actions='<div class="row"><button class="btn primary" data-review="'+p.id+'">Rate this purchase</button>'+(rem?'<span class="tag">Reminder due</span>':'')+'</div>';
 if(ticket)actions+='<div class="panel"><span class="tag">Report '+esc(ticket.status)+'</span><p class="muted">'+esc(ticket.customer_message)+'</p>'+(ticket.admin_response?'<p><b>Support response:</b> '+esc(ticket.admin_response)+'</p>':'<p class="muted">Our team is reviewing your report.</p>')+'</div>';
 else actions+='<div style="margin-top:10px"><button class="btn" data-ticket="'+p.id+'">Report a problem</button></div>';
 return '<article class="purchase" id="purchase-'+esc(p.id)+'"><h3>'+esc(p.product_name)+'</h3><div class="muted">Purchase #'+p.id+' · ₦'+Number(p.amount).toLocaleString("en-NG",{minimumFractionDigits:2})+' · '+new Date(p.created_at).toLocaleDateString()+'</div>'+actions+'</article>'
 }).join("");
 root.querySelectorAll("[data-review]").forEach(b=>b.onclick=()=>reviewOpen(purchases.find(p=>String(p.id)===b.dataset.review)));
 root.querySelectorAll("[data-ticket]").forEach(b=>b.onclick=()=>ticketOpen(purchases.find(p=>String(p.id)===b.dataset.ticket)));
}
async function load(){const {data:{user},error}=await db.auth.getUser();if(error||!user){location.href="login.html?redirect="+encodeURIComponent("purchase-protection.html");return}
 const [p,r,m,t]=await Promise.all([
 db.from("purchases").select("id,user_id,product_name,amount,status,created_at").eq("user_id",user.id).eq("status","completed").order("created_at",{ascending:false}).limit(200),
 db.from("purchase_reviews").select("id,purchase_id,rating,review_text,status,created_at").eq("user_id",user.id),
 db.from("purchase_review_reminders").select("purchase_id,remind_after,snooze_count").eq("user_id",user.id),
 db.from("purchase_support_tickets").select("id,purchase_id,issue_type,customer_message,status,admin_response,created_at").eq("user_id",user.id)
 ]);
 const errorFound=[p.error,r.error,m.error,t.error].find(Boolean);if(errorFound)throw errorFound;
 purchases=p.data||[];reviews=r.data||[];reminders=m.data||[];tickets=t.data||[];render();$("notice").textContent=purchases.length+" completed purchase(s) found.";
 const requested=new URLSearchParams(location.search).get("purchase");const requestedPurchase=purchases.find(x=>String(x.id)===requested);if(requestedPurchase){const target=document.getElementById("purchase-"+requestedPurchase.id);if(target)target.scrollIntoView({behavior:"smooth",block:"center"});}const due=(requestedPurchase&&!reviews.some(y=>String(y.purchase_id)===String(requestedPurchase.id))&&(!reminders.some(y=>String(y.purchase_id)===String(requestedPurchase.id))||new Date(reminders.find(y=>String(y.purchase_id)===String(requestedPurchase.id)).remind_after)<=new Date()))?requestedPurchase:purchases.find(x=>!reviews.some(y=>String(y.purchase_id)===String(x.id))&&(!reminders.some(y=>String(y.purchase_id)===String(x.id))||new Date(reminders.find(y=>String(y.purchase_id)===String(x.id)).remind_after)<=new Date()));
 if(due)setTimeout(()=>reviewOpen(due),450);
}
$("submitReview").onclick=async()=>{if(!current)return;const b=$("submitReview");b.disabled=true;try{const {data,error}=await db.rpc("dv_submit_purchase_review",{p_purchase_id:current.id,p_rating:rating,p_review_text:$("reviewText").value});if(error)throw error;if(!data?.ok)throw new Error("Review could not be submitted.");msg("reviewMsg","Review submitted. It will appear after admin approval.");close("reviewModal");await load()}catch(e){msg("reviewMsg",e.message||"Could not submit review.",true)}finally{b.disabled=false}};
$("snoozeReview").onclick=async()=>{if(!current)return;const b=$("snoozeReview");b.disabled=true;try{const {data,error}=await db.rpc("dv_snooze_purchase_review",{p_purchase_id:current.id});if(error)throw error;if(!data?.ok)throw new Error("This purchase has already been reviewed.");close("reviewModal");await load()}catch(e){msg("reviewMsg",e.message,true)}finally{b.disabled=false}};
$("submitTicket").onclick=async()=>{if(!current)return;const b=$("submitTicket");b.disabled=true;try{const {data,error}=await db.rpc("dv_create_purchase_support_ticket",{p_purchase_id:current.id,p_issue_type:$("issueType").value,p_customer_message:$("ticketText").value});if(error)throw error;if(!data?.ok)throw new Error("Report could not be created.");close("ticketModal");await load()}catch(e){msg("ticketMsg",e.message||"Could not send report.",true)}finally{b.disabled=false}};
$("closeReview").onclick=()=>close("reviewModal");$("closeTicket").onclick=()=>close("ticketModal");
load().catch(e=>{$("notice").textContent=e.message||"Could not load purchase protection.";});
})();
</script></body></html>
