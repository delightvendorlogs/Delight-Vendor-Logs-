<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Customer Reviews — Delight Vendor Logs</title><link rel="icon" href="assets/dv-logo.png"><style>
:root{--gold:#d4af37;--line:#453719;--muted:#b8ad8d}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f0df;font:14px Arial,sans-serif}.top{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #302817}.top img{width:36px;height:36px}.top b{flex:1}.top a{color:var(--gold);text-decoration:none}.wrap{max-width:900px;margin:25px auto;padding:0 14px 45px}.hero,.review{border:1px solid var(--line);background:#111;border-radius:15px;padding:18px;margin:12px 0}.hero{background:radial-gradient(ellipse at top right,#2a210d,#111 60%)}h1{font-size:clamp(26px,5vw,36px);margin:8px 0}.muted{color:var(--muted);font-size:12px;line-height:1.6}.stars{color:#f0cf68;font-size:19px;letter-spacing:2px}.review h3{margin:8px 0}.review p{white-space:pre-wrap;line-height:1.6}.tag{display:inline-block;border:1px solid #604d20;color:#f0d77a;border-radius:20px;padding:4px 8px;font-size:10px}.empty{padding:25px;text-align:center;border:1px dashed #493b1c;border-radius:12px;color:var(--muted)}
</style></head><body><header class="top"><img src="assets/dv-logo.png" alt=""><b>Delight Vendor Logs</b><a href="dashboard.html">Dashboard</a></header><main class="wrap"><section class="hero"><div class="muted">CUSTOMER FEEDBACK</div><h1>What customers are saying</h1><p class="muted">Only reviews approved by our administration are shown here.</p></section><div id="status" class="muted">Loading approved reviews…</div><section id="reviews"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const db=supabase.createClient("https://hkfhehbhmucymusaytoe.supabase.co","sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_");const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));try{const {data,error}=await db.rpc("get_public_purchase_reviews");if(error)throw error;const rows=Array.isArray(data)?data:[];document.getElementById("status").textContent=rows.length+" approved review(s)";document.getElementById("reviews").innerHTML=rows.length?rows.map(r=>'<article class="review"><div class="stars">'+("★".repeat(Number(r.rating)||0))+("☆".repeat(5-(Number(r.rating)||0)))+'</div><h3>'+esc(r.product_name||"Purchase")+'</h3><p>'+esc(r.review_text)+'</p><div class="muted">'+esc(r.display_name||"Customer")+' · '+esc(new Date(r.created_at).toLocaleDateString())+'</div></article>').join(""):'<div class="empty">No approved reviews have been published yet.</div>'}catch(e){document.getElementById("status").textContent="Could not load reviews: "+(e.message||"Please try again.")}})();
