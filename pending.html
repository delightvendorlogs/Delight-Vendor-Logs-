<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png"
href="https://raw.githubusercontent.com/delightvendorlogs/Delight-Vendor-Logs-/main/assets/dv-logo.png">

<link rel="apple-touch-icon"
href="https://raw.githubusercontent.com/delightvendorlogs/Delight-Vendor-Logs-/main/assets/dv-logo.png">
    <title>Pending Orders - Delight Vendor Logs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif
}

header{
    background:#0a0a0a;
    color:#f0cf68;
    padding:20px;
    text-align:center;
    border-bottom:1px solid rgba(212,175,55,.18)
}

header h1{
    margin:0;
    font-size:25px
}

main{
    max-width:600px;
    margin:auto;
    padding:25px 20px 40px
}

.card{
    background:#0d0d0d;
    padding:20px;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    margin-bottom:18px;
    border:1px solid rgba(212,175,55,.14)
}

.order{
    border:1px solid #292929;
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
    background:#090909
}

.top{
    display:flex;
    justify-content:space-between;
    gap:10px
}

.name{
    font-weight:bold;
    font-size:17px;
    color:#fff
}

.amount{
    font-weight:bold;
    color:#f0cf68
}

.status{
    margin-top:10px;
    font-weight:bold;
    color:#f0cf68
}

.date{
    margin-top:8px;
    color:#707070;
    font-size:13px
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px
}

.error{
    text-align:center;
    color:#f87171;
    padding:20px
}

.back{
    background:#111;
    color:#f0cf68;
    padding:16px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
    border:1px solid rgba(212,175,55,.2)
}
</style>
</head>

<body>

<header>
<h1>Pending Orders</h1>
</header>

<main>

<div class="card">
<div id="orders">
<div class="empty">Loading orders...</div>
</div>
</div>

<div class="back" onclick="location.href='dashboard.html'">
🏠 Back to Dashboard
</div>

</main>

<script>
const SUPABASE_URL="https://hkfhehbhmucymusaytoe.supabase.co";
const SUPABASE_KEY="sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;")
}

async function loadOrders(){

const box=document.getElementById("orders");

const {data:{user},error:authError}=await supabaseClient.auth.getUser();

if(authError||!user){
location.href="login.html";
return
}

const {data,error}=await supabaseClient
.from("pending_orders")
.select("id,product_id,product_name,amount,status,created_at")
.eq("user_id",user.id)
.order("created_at",{ascending:false});

if(error){
console.error(error);
box.innerHTML='<div class="error">Unable to load pending orders.</div>';
return
}

if(!data||data.length===0){
box.innerHTML='<div class="empty">You have no pending orders.</div>';
return
}

box.innerHTML="";

data.forEach(o=>{

const d=o.created_at
?new Date(o.created_at).toLocaleString("en-NG",{
dateStyle:"medium",
timeStyle:"short"
})
:"";

box.innerHTML+=`
<div class="order">

<div class="top">

<div class="name">
${esc(o.product_name)}
</div>

<div class="amount">
₦${Number(o.amount||0).toLocaleString("en-NG",{
minimumFractionDigits:2,
maximumFractionDigits:2
})}
</div>

</div>

<div class="status">
${esc(o.status||"pending")}
</div>

<div class="date">
${esc(d)}
</div>

</div>
`;

});

}

loadOrders();
</script>

</body>
</html>
