<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pending Orders - Delight Vendor Logs</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

</head>


<body>


<header>

  <h1>
    ⏳ Pending Orders
  </h1>

</header>


<main>

  <h2>
    Orders Waiting
  </h2>


  <div id="pendingOrders">

    <p>
      Loading pending orders...
    </p>

  </div>


  <br>


  <button
    type="button"
    onclick="window.location.href='dashboard.html'"
  >

    🏠 Back to Dashboard

  </button>


</main>


<script>


/* ========================================
   SUPABASE CONNECTION
======================================== */


const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ========================================
   LOAD PENDING ORDERS
======================================== */


async function loadPendingOrders() {


  const container =
    document.getElementById(
      "pendingOrders"
    );


  container.innerHTML = `
    <p>
      Loading pending orders...
    </p>
  `;


  /* ======================================
     CHECK LOGIN
  ====================================== */


  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if (
    userError ||
    !user
  ) {

    container.innerHTML = `

      <div style="
        background:white;
        padding:20px;
        border-radius:15px;
        text-align:center;
      ">

        <h3>
          🔐 Login Required
        </h3>

        <p>
          Please login to view your pending orders.
        </p>

        <button
          type="button"
          onclick="window.location.href='login.html'"
        >
          Login
        </button>

      </div>

    `;

    return;

  }


  /* ======================================
     TRY ORDERS TABLE
  ====================================== */


  let data = null;
  let orderError = null;


  /*
    First try:

    orders

    This is the most common
    Supabase table name.
  */


  let result =
    await supabaseClient
      .from("orders")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .eq(
        "status",
        "pending"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  data =
    result.data;

  orderError =
    result.error;


  /* ======================================
     IF orders DOES NOT EXIST,
     TRY Order
  ====================================== */


  if (orderError) {


    console.log(
      "orders table failed. Trying Order..."
    );


    result =
      await supabaseClient
        .from("Order")
        .select("*")
        .eq(
          "user_id",
          user.id
        )
        .eq(
          "status",
          "pending"
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    data =
      result.data;

    orderError =
      result.error;

  }


  /* ======================================
     DATABASE ERROR
  ====================================== */


  if (orderError) {


    console.error(
      "PENDING ORDERS ERROR:",
      orderError
    );


    container.innerHTML = `

      <div style="
        background:white;
        padding:20px;
        border-radius:15px;
        text-align:center;
        box-shadow:0 3px 12px rgba(0,0,0,0.08);
      ">

        <h3>
          ⚠️ Unable to load pending orders
        </h3>

        <p>
          ${escapeHTML(
            orderError.message ||
            "Unknown database error"
          )}
        </p>

        <small>
          Check the browser console for more details.
        </small>

      </div>

    `;


    return;

  }


  /* ======================================
     NO PENDING ORDERS
  ====================================== */


  if (
    !data ||
    data.length === 0
  ) {


    container.innerHTML = `

      <div style="
        background:white;
        padding:25px;
        border-radius:15px;
        text-align:center;
        box-shadow:0 3px 12px rgba(0,0,0,0.08);
      ">

        <h3>
          ✅ No Pending Orders
        </h3>

        <p>
          You currently have no orders waiting for delivery.
        </p>

      </div>

    `;


    return;

  }


  /* ======================================
     CLEAR LOADING
  ====================================== */


  container.innerHTML =
    "";


  /* ======================================
     CREATE ORDER CARDS
  ====================================== */


  data.forEach(
    function(order) {


      const box =
        document.createElement(
          "div"
        );


      box.style.background =
        "white";


      box.style.padding =
        "20px";


      box.style.margin =
        "15px 0";


      box.style.borderRadius =
        "16px";


      box.style.textAlign =
        "left";


      box.style.boxShadow =
        "0 3px 12px rgba(0,0,0,0.08)";


      /* ==================================
         PRODUCT NAME
      ================================== */


      const productName =
        order.product_name ||
        order.name ||
        order.service_name ||
        "Pending Order";


      /* ==================================
         AMOUNT
      ================================== */


      const amount =
        Number(
          order.amount ||
          order.price ||
          0
        ).toLocaleString(
          "en-NG",
          {
            minimumFractionDigits:0,
            maximumFractionDigits:2
          }
        );


      /* ==================================
         STATUS
      ================================== */


      const orderStatus =
        order.status ||
        "pending";


      /* ==================================
         DATE
      ================================== */


      let date =
        "Date unavailable";


      if (
        order.created_at
      ) {

        date =
          new Date(
            order.created_at
          ).toLocaleString(
            "en-NG"
          );

      }


      /* ==================================
         ORDER ID
      ================================== */


      const orderId =
        order.id ||
        "N/A";


      /* ==================================
         CARD
      ================================== */


      box.innerHTML = `

        <h3>

          ${escapeHTML(
            productName
          )}

        </h3>


        <p>

          <strong>
            Order ID:
          </strong>

          ${escapeHTML(
            String(orderId)
          )}

        </p>


        <p>

          <strong>
            Amount:
          </strong>

          ₦${amount}

        </p>


        <p>

          <strong>
            Status:
          </strong>

          ${escapeHTML(
            String(orderStatus)
          )}

        </p>


        <p>

          <strong>
            Date:
          </strong>

          ${escapeHTML(
            date
          )}

        </p>


        <p style="
          margin-top:15px;
          font-weight:bold;
        ">

          ⏳ Your order is waiting
          for delivery.

        </p>

      `;


      container.appendChild(
        box
      );


    }
  );


}


/* ========================================
   ESCAPE HTML
======================================== */


function escapeHTML(
  value
) {


  return String(
    value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ========================================
   START
======================================== */


loadPendingOrders();


</script>


</body>

</html>
