<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Pending Orders - Delight Vendor Logs</title>  <link rel="stylesheet" href="style.css">  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>  <header>
    <h1>Pending Orders</h1>
  </header>  <main><h2>Orders Waiting</h2>

<div id="pendingOrders">

  <p>Loading pending orders...</p>

</div>

<br>

<button onclick="window.location.href='dashboard.html'">
  🏠 Back to Dashboard
</button>

  </main>  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://hkfhehbhmucymusaytoe.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       LOAD PENDING ORDERS
    ========================= */

    async function loadPendingOrders() {

      const container =
        document.getElementById(
          "pendingOrders"
        );


      const {
        data: {
          user
        },
        error
      } = await supabaseClient.auth.getUser();


      if (error || !user) {

        window.location.href =
          "login.html";

        return;
      }


      /*
        We will connect this to the
        real order table after we
        confirm the Supabase database
        structure.
      */


      const {
        data,
        error: orderError
      } = await supabaseClient
        .from("Order")
        .select("*")
        .eq("user_id", user.id)
        .eq("status", "pending")
        .order("created_at", {
          ascending: false
        });


      if (orderError) {

        console.error(orderError);

        container.innerHTML =
          "<p>Unable to load pending orders.</p>";

        return;
      }


      if (!data || data.length === 0) {

        container.innerHTML =
          "<p>You have no pending orders.</p>";

        return;
      }


      container.innerHTML = "";


      data.forEach(function(order) {

        const box =
          document.createElement("div");


        const amount =
          Number(
            order.amount || 0
          ).toLocaleString(
            "en-NG",
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          );


        const date =
          order.created_at
            ? new Date(
                order.created_at
              ).toLocaleString()
            : "Date unavailable";


        box.style.background =
          "white";

        box.style.padding =
          "18px";

        box.style.margin =
          "12px 0";

        box.style.borderRadius =
          "12px";

        box.style.textAlign =
          "left";


        box.innerHTML = `

          <h3>
            ${order.product_name || "Order"}
          </h3>

          <p>
            Amount: ₦${amount}
          </p>

          <p>
            Status:
            ${order.status || "Pending"}
          </p>

          <small>
            ${date}
          </small>

        `;


        container.appendChild(box);

      });

    }


    /* =========================
       START
    ========================= */

    loadPendingOrders();

  </script></body></html>
