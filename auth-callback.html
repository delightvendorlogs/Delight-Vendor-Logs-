<!DOCTYPE html>
<html lang="en">
<head>

  <title>Confirming Account...</title>
</head>
<body>
  <h2>Confirming your account...</h2>
  <p>Please wait...</p>

  <script>
    const hash = window.location.hash;

    if (hash) {
      window.location.href =
        "index.html" + hash;
    } else {
      window.location.href = "index.html";
    }
  </script>
</body>
