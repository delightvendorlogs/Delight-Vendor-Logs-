button {

  box-shadow: 0 8px 22px rgba(212,175,55,.12);
  transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
  -webkit-tap-highlight-color: transparent;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(1.06);
  box-shadow: 0 12px 28px rgba(212,175,55,.22);

button:active:not(:disabled) {
  transform: translateY(0);
}

button:focus-visible {
  outline: 2px solid var(--dv-gold-light);

}

button:disabled {

  cursor: not-allowed;
  opacity: .9;

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;

    transition: none;

<body class="dv-product-page">
<header class="dv-page-header">
  <a class="dv-back-link" href="dashboard.html" aria-label="Back to service list">← Back to services</a>
  <div class="dv-page-heading"><span>DELIGHT VENDOR LOGS</span><h1 id="productName">Loading...</h1><p>Review the service details before you continue.</p></div>
  <span class="dv-header-mark">DV</span>
</header>
<main class="dv-product-main">
  <section class="dv-product-layout">
    <div class="dv-product-media"><div class="dv-media-label">SERVICE PREVIEW</div><img id="productImage" src="" alt="Service image" style="display:none;"></div>
    <div class="dv-product-details">
      <div class="dv-detail-eyebrow">SERVICE DETAILS</div>
      <p id="productDescription">Loading product...</p>
      <div class="dv-price-panel"><span>PRICE</span><h2 id="productPrice">₦0.00</h2></div>
      <div class="dv-stock-row"><span>Availability</span><strong id="productStatus">Loading...</strong></div>
      <button id="buyButton" type="button" onclick="buyProduct()">Buy Now <span aria-hidden="true">→</span></button>
      <p id="message" aria-live="polite"></p>
      <a class="dv-secondary-link" href="dashboard.html">Continue browsing services</a>
    </div>
  </section>
</main>
<script>
const SUPABASE_URL="https://hkfhehbhmucymusaytoe.supabase.co";
const SUPABASE_KEY="sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const productId=new URLSearchParams(window.location.search).get("id");
const requestedReturnUrl=new URLSearchParams(window.location.search).get("return");
const safeReturnUrl=requestedReturnUrl&&/^dashboard\.html\?category=/.test(requestedReturnUrl)
  ? requestedReturnUrl
  : "dashboard.html";
document.querySelectorAll(".dv-back-link,.dv-secondary-link").forEach(link=>{
  link.href=safeReturnUrl;
});


async function loadProduct(){
const name=document.getElementById("productName");
const description=document.getElementById("productDescription");
const price=document.getElementById("productPrice");
const status=document.getElementById("productStatus");
const button=document.getElementById("buyButton");
const image=document.getElementById("productImage");
if(!productId){
name.textContent="Product not found";
description.textContent="No product ID was provided.";
status.textContent="Unavailable";
button.disabled=true;
return;
}
const {data:product,error}=await supabaseClient.from("Product").select("*").eq("id",productId).single();
if(error||!product){
console.error("Product loading error:",error);
name.textContent="Product not found";
description.textContent="Unable to load this product.";
price.textContent="₦0.00";
status.textContent="Unavailable";
button.disabled=true;
return;
}
name.textContent=product.name||"Unnamed Service";
description.textContent=product.description||"No description available.";
price.textContent="₦"+Number(product.price||0).toLocaleString("en-NG",{minimumFractionDigits:0,maximumFractionDigits:2});
const productStatus=String(product.status||"Unavailable");
status.textContent=productStatus;
if(product.image_url&&String(product.image_url).trim()!==""){
image.src=product.image_url;
image.alt=product.name||"Service";
image.style.display="block";
image.onerror=()=>image.style.display="none";
}else image.style.display="none";
if(productStatus.toLowerCase().trim()!=="available"){
button.disabled=true;
button.textContent="Unavailable";
}else{
button.disabled=false;
button.textContent="Buy Now";
}
}

async function buyProduct(){
const button=document.getElementById("buyButton");
const message=document.getElementById("message");
if(!productId){
message.textContent="Product ID is missing.";
return;
}
button.disabled=true;
button.textContent="Processing...";
message.textContent="Checking your wallet...";
const {data:{user},error:userError}=await supabaseClient.auth.getUser();
if(userError||!user){
message.textContent="Please login first.";
button.disabled=false;
button.textContent="Buy Now";
return;
}
const {data:order,error}=await supabaseClient.rpc("buy_product",{p_product_id:Number(productId)});
if(error){
console.error("Purchase error:",error);
let errorMessage=error.message||"Purchase failed.";
if(errorMessage.toLowerCase().includes("insufficient")) errorMessage="Insufficient wallet balance. Please fund your wallet.";
if(errorMessage.toLowerCase().includes("not authenticated")) errorMessage="Please login first.";
if(errorMessage.toLowerCase().includes("not available")) errorMessage="Service is currently unavailable. Please choose another service.";
message.textContent=errorMessage;
button.disabled=false;
button.textContent="Buy Now";
return;
}
console.log("Purchase result:",order);
if(order&&order.status==="completed"){
message.textContent="✅ Purchase successful!";
button.textContent="Purchase Complete";
setTimeout(()=>window.location.href="purchases.html?review=1",1200);
return;
}
if(order&&order.status==="pending"){
message.textContent="⏳ Payment successful. Your order is pending.";
button.textContent="Order Pending";
setTimeout(()=>window.location.href="pending.html",1200);
return;
}
message.textContent=order?.message||"Purchase processed successfully.";
button.disabled=false;
button.textContent="Buy Now";
}

loadProduct();
</script>
