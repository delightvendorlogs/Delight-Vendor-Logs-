<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Product - Delight Vendor Logs</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <h1 id="productName">Loading...</h1>
</header>

<main>

  <div class="profile-card">

    <p id="productDescription">
      Loading product...
    </p>

    <h2 id="productPrice">
      ₦0.00
    </h2>

    <p>
      Status:
      <strong id="productStatus">
        Loading...
      </strong>
    </p>

    <button
      id="buyButton"
      type="button"
      onclick="buyProduct()"
    >
      Buy Now
    </button>

    <p id="message"></p>

  </div>

  <br>

  <button
    type="button"
    onclick="window.location.href='dashboard.html'"
  >
    🏠 Back to Dashboard
  </button>

</main>


<script>

/* ========================================
   SUPABASE
======================================== */

const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ========================================
   GET PRODUCT ID
======================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const productId =
  params.get("id");


/* ========================================
   LOAD PRODUCT
======================================== */

async function loadProduct() {

  const name =
    document.getElementById(
      "productName"
    );

  const description =
    document.getElementById(
      "productDescription"
    );

  const price =
    document.getElementById(
      "productPrice"
    );

  const status =
    document.getElementById(
      "productStatus"
    );

  const button =
    document.getElementById(
      "buyButton"
    );

  const message =
    document.getElementById(
      "message"
    );


  /* CHECK PRODUCT ID */

  if (!productId) {

    name.textContent =
      "Product not found";

    description.textContent =
      "No product ID was provided.";

    status.textContent =
      "Unavailable";

    button.disabled =
      true;

    return;
  }


  /* LOAD PRODUCT */

  const {
    data: product,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq(
        "id",
        productId
      )
      .single();


  if (error || !product) {

    console.error(
      "Product error:",
      error
    );

    name.textContent =
      "Product not found";

    description.textContent =
      "Unable to load this product.";

    status.textContent =
      "Unavailable";

    button.disabled =
      true;

    return;
  }


  /* PRODUCT NAME */

  name.textContent =
    product.name ||
    "Product";


  /* DESCRIPTION */

  description.textContent =
    product.description ||
    "No description available.";


  /* PRICE */

  price.textContent =
    "₦" +
    Number(
      product.price || 0
    ).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );


  /* STATUS */

  status.textContent =
    product.status ||
    "Unavailable";


  /* CHECK AVAILABILITY */

  if (
    String(
      product.status
    ).toLowerCase() !==
    "available"
  ) {

    button.disabled =
      true;

    button.textContent =
      "Unavailable";

  } else {

    button.disabled =
      false;

    button.textContent =
      "Buy Now";

  }

}


/* ========================================
   BUY PRODUCT
======================================== */

async function buyProduct() {

  const button =
    document.getElementById(
      "buyButton"
    );

  const message =
    document.getElementById(
      "message"
    );


  /* CHECK PRODUCT ID */

  if (!productId) {

    message.textContent =
      "Product ID is missing.";

    return;
  }


  /* DISABLE BUTTON */

  button.disabled =
    true;

  button.textContent =
    "Processing...";

  message.textContent =
    "Checking your wallet...";


  /* ======================================
     CHECK LOGIN
  ====================================== */

  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if (
    userError ||
    !user
  ) {

    message.textContent =
      "Please login first.";

    button.disabled =
      false;

    button.textContent =
      "Buy Now";

    return;
  }


  /* ======================================
     CALL BUY FUNCTION
  ====================================== */

  const {
    data: order,
    error
  } =
    await supabaseClient.rpc(
      "buy_product",
      {
        p_product_id:
          Number(productId)
      }
    );


  /* ======================================
     PURCHASE ERROR
  ====================================== */

  if (error) {

    console.error(
      "Purchase error:",
      error
    );


    let errorMessage =
      error.message ||
      "Purchase failed.";


    /* FRIENDLIER MESSAGES */

    if (
      errorMessage
        .toLowerCase()
        .includes(
          "insufficient"
        )
    ) {

      errorMessage =
        "Insufficient wallet balance. Please fund your wallet.";

    }


    if (
      errorMessage
        .toLowerCase()
        .includes(
          "not authenticated"
        )
    ) {

      errorMessage =
        "Please login first.";

    }


    if (
      errorMessage
        .toLowerCase()
        .includes(
          "not available"
        )
    ) {

      errorMessage =
        "Service is currently unavailable. Please choose another service.";

    }


    message.textContent =
      errorMessage;


    button.disabled =
      false;

    button.textContent =
      "Buy Now";

    return;
  }


  /* ======================================
     PURCHASE SUCCESS
  ====================================== */

  message.textContent =
    "✅ Purchase successful. Your order is now pending.";


  button.textContent =
    "Order Pending";


  /*
     NO CANCEL BUTTON HERE.

     The order remains pending until
     delivery/admin processing.
  */


  setTimeout(
    function() {

      window.location.href =
        "purchase.html";

    },
    1200
  );

}


/* ========================================
   START
======================================== */

loadProduct();

</script>

</body>

</html>
