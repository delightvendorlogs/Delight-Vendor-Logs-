name: Apply site-wide login protection
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-auth-gates.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add background login gate and quiet update checker to every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          repo = Path(".").resolve()
          is_edit = repo.name == "DelightVendorEdit"
          project = "genlmqzkjouinofkitqt" if is_edit else "hkfhehbhmucymusaytoe"
          url = f"https://{project}.supabase.co"
          key = "sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv" if is_edit else "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_"
          old_key = "delightvendoredit-auth" if is_edit else "dv-auth"
          guard = f"""(function(){{'use strict';var root=document.documentElement;root.style.visibility='hidden';var base=new URL('./',location.href);function login(){{var target=location.pathname+location.search+location.hash;location.replace(new URL('login.html?redirect='+encodeURIComponent(target),base).href)}}function sdk(){{if(window.supabase&&window.supabase.createClient)return Promise.resolve();return new Promise(function(ok,no){{var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=no;document.head.appendChild(s)}})}}(async function(){{try{{try{{var k='sb-{project}-auth-token';if(!localStorage.getItem(k)&&localStorage.getItem('{old_key}'))localStorage.setItem(k,localStorage.getItem('{old_key}'))}}catch(_){{}}await sdk();var c=window.supabase.createClient('{url}','{key}',{{auth:{{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}}});var r=await c.auth.getUser();if(r.error||!r.data||!r.data.user){{login();return}}root.style.visibility='';c.auth.onAuthStateChange(function(e,s){{if(e==='SIGNED_OUT'||!s)login()}})}}catch(e){{login()}}}})()}})();"""
          Path("auth-guard.js").write_text(guard, encoding="utf-8")
          Path("site-update-check.js").unlink(missing_ok=True)
          public = {"login.html", "register.html", "forgot-password.html"}
          count = 0
          for p in repo.rglob("*.html"):
              if any(part.startswith(".") for part in p.parts) or p.name.lower() in public:
                  continue
              src = p.read_text(encoding="utf-8")
              cleaned = src.replace('<script src="site-update-check.js"></script>', '')
              if "auth-guard.js" in src:
                  if cleaned != src:
                      p.write_text(cleaned, encoding="utf-8")
                  continue
              src = cleaned
              inject = '<script>document.documentElement.style.visibility="hidden";</script><script src="auth-guard.js"></script><style>.dve-banner-dots,#dvBannerDots{display:none!important}</style>'
              m = re.search(r'<head\b[^>]*>', src, re.I)
              if m:
                  src = src[:m.end()] + '\n' + inject + src[m.end():]
              else:
                  m = re.search(r'<html\b[^>]*>', src, re.I)
                  src = src[:m.end()] + '<head>' + inject + '</head>' + src[m.end():] if m else '<head>'+inject+'</head>'+src
              p.write_text(src, encoding="utf-8")
              count += 1
          print(f"Protected {count} HTML pages in {repo.name}")
          PY
      - name: Commit generated protection files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (git commit -m "Protect every HTML page with background login and update checks" && git push)
