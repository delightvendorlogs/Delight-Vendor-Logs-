<script>


/* =========================
   SUPABASE
========================= */


const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =========================
   LOGIN
========================= */


document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {


      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const message =
        document
          .getElementById("message");


      const button =
        document
          .getElementById("loginButton");


      message.textContent =
        "Logging in...";


      button.disabled = true;


      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        console.error(error);

        message.textContent =
          error.message;

        button.disabled = false;

        return;

      }


      if (!data || !data.user) {

        message.textContent =
          "Login failed. Please try again.";

        button.disabled = false;

        return;

      }


      message.textContent =
        "Login successful. Opening dashboard...";


      window.location.href =
        "dashboard.html";


    }
  );


</script></body></html>
