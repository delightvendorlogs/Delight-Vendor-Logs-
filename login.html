<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Delight Vendor Logs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<h1>Login</h1>


<form id="loginForm">


  <label for="email">
    Email
  </label>

  <br>

  <input
    id="email"
    type="email"
    placeholder="Enter your email"
    required
  >


  <br><br>


  <label for="password">
    Password
  </label>

  <br>

  <input
    id="password"
    type="password"
    placeholder="Enter your password"
    required
  >


  <br><br>


  <!-- LOGIN -->

  <div
    onclick="loginUser()"
    style="
      display:inline-block;
      background:#111;
      color:#fff;
      padding:15px 30px;
      margin:10px;
      border-radius:10px;
      font-family:Arial,sans-serif;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    "
  >
    Login
  </div>


  <br>


  <!-- FORGOT PASSWORD -->

  <div
    onclick="window.location.href='forgot-password.html'"
    style="
      display:inline-block;
      background:#111;
      color:#fff;
      padding:15px 30px;
      margin:10px;
      border-radius:10px;
      font-family:Arial,sans-serif;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    "
  >
    Forgot Password?
  </div>


</form>


<p>
  Don't have an account?
</p>


<!-- CREATE ACCOUNT -->

<div
  onclick="window.location.href='register.html'"
  style="
    display:inline-block;
    background:#111;
    color:#fff;
    padding:15px 30px;
    margin:10px;
    border-radius:10px;
    font-family:Arial,sans-serif;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
  "
>
  Create Account
</div>


<br>


<!-- BACK -->

<div
  onclick="window.location.href='index.html'"
  style="
    display:inline-block;
    background:#111;
    color:#fff;
    padding:15px 30px;
    margin:10px;
    border-radius:10px;
    font-family:Arial,sans-serif;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
  "
>
  Back
</div>


<p id="message"></p>


<script>


const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loginUser() {


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  const message =
    document
      .getElementById("message");


  if (!email || !password) {

    message.textContent =
      "Please enter your email and password.";

    return;

  }


  message.textContent =
    "Logging in...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    console.error(error);

    message.textContent =
      error.message;

    return;

  }


  if (data && data.user) {

    window.location.href =
      "dashboard.html";

  }

}


</script>


</body>

</html>
