<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login - Delight Vendor Logs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#050505;
    color:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:25px 15px;
}

/* MAIN CONTAINER */

.login-wrapper{
    width:100%;
    max-width:430px;
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:30px;
    line-height:1;
}

.logo .delight{
    display:block;
    color:#ffffff;
    font-size:34px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.logo .vendor{
    display:block;
    color:#d4af37;
    font-size:17px;
    font-weight:800;
    letter-spacing:4px;
    margin-top:7px;
}

/* CARD */

.login-card{
    width:100%;
    background:#0d0d0d;
    border:1px solid #252525;
    border-radius:20px;
    padding:32px 25px 28px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.55),
        0 0 35px rgba(212,175,55,0.05);
}

/* HEADER */

.login-header{
    text-align:center;
    margin-bottom:28px;
}

.login-header h1{
    font-size:28px;
    font-weight:800;
    color:#ffffff;
    margin-bottom:9px;
}

.login-header p{
    color:#999999;
    font-size:14px;
    line-height:1.5;
}

/* FORM */

.form-group{
    margin-bottom:19px;
}

.form-group label{
    display:block;
    color:#dddddd;
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
}

.input-wrapper{
    position:relative;
}

.form-group input{
    width:100%;
    height:52px;
    border:1px solid #292929;
    border-radius:11px;
    background:#151515;
    color:#ffffff;
    outline:none;
    padding:0 15px;
    font-size:15px;
    transition:0.2s ease;
}

.form-group input:focus{
    border-color:#d4af37;
    box-shadow:0 0 0 3px rgba(212,175,55,0.08);
}

.form-group input::placeholder{
    color:#666666;
}

/* PASSWORD */

.password-input{
    padding-right:52px !important;
}

.toggle-password{
    position:absolute;
    right:0;
    top:0;
    width:50px;
    height:52px;
    border:0;
    background:transparent;
    color:#888888;
    cursor:pointer;
    font-size:17px;
}

.toggle-password:hover{
    color:#d4af37;
}

/* FORGOT PASSWORD */

.forgot-row{
    display:flex;
    justify-content:flex-end;
    margin-top:-7px;
    margin-bottom:22px;
}

.forgot-row a{
    color:#d4af37;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
}

.forgot-row a:hover{
    text-decoration:underline;
}

/* LOGIN BUTTON */

.login-btn{
    width:100%;
    height:53px;
    border:none;
    border-radius:11px;
    background:linear-gradient(135deg,#d4af37,#f0cf68);
    color:#080808;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    transition:0.2s ease;
}

.login-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 25px rgba(212,175,55,0.18);
}

.login-btn:active{
    transform:translateY(0);
}

.login-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
    transform:none;
}

/* MESSAGE */

.message{
    display:none;
    margin-top:16px;
    padding:12px 13px;
    border-radius:9px;
    font-size:13px;
    line-height:1.45;
    text-align:center;
}

.message.error{
    display:block;
    background:rgba(255,70,70,0.08);
    border:1px solid rgba(255,70,70,0.22);
    color:#ff8b8b;
}

.message.success{
    display:block;
    background:rgba(212,175,55,0.08);
    border:1px solid rgba(212,175,55,0.22);
    color:#e8c95f;
}

/* DIVIDER */

.divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:25px 0;
    color:#666666;
    font-size:12px;
}

.divider::before,
.divider::after{
    content:"";
    height:1px;
    flex:1;
    background:#252525;
}

/* REGISTER */

.register-text{
    text-align:center;
    color:#888888;
    font-size:14px;
}

.register-text a{
    color:#d4af37;
    text-decoration:none;
    font-weight:800;
}

.register-text a:hover{
    text-decoration:underline;
}

/* BACK HOME */

.back-home{
    text-align:center;
    margin-top:23px;
}

.back-home a{
    color:#777777;
    text-decoration:none;
    font-size:13px;
    transition:0.2s ease;
}

.back-home a:hover{
    color:#d4af37;
}

/* FOOTER */

.footer{
    text-align:center;
    margin-top:25px;
    color:#555555;
    font-size:11px;
}

/* MOBILE */

@media(max-width:480px){

    body{
        padding:18px 13px;
    }

    .login-card{
        padding:28px 20px 25px;
        border-radius:17px;
    }

    .logo{
        margin-bottom:25px;
    }

    .logo .delight{
        font-size:31px;
    }

    .login-header h1{
        font-size:25px;
    }

}

</style>

</head>

<body>

<div class="login-wrapper">

    <!-- LOGO -->

    <div class="logo">
        <span class="delight">Delight</span>
        <span class="vendor">VENDOR LOGS</span>
    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">

        <div class="login-header">
            <h1>Welcome back 👋</h1>

            <p>
                Sign in to your Delight Vendor Logs account
            </p>
        </div>


        <form id="loginForm" onsubmit="loginUser(event)">

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        onclick="togglePasswordVisibility()"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="forgot-row">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Continue
            </button>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>

        </form>


        <!-- DIVIDER -->

        <div class="divider">
            or
        </div>


        <!-- REGISTER -->

        <div class="register-text">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>


    <!-- BACK HOME -->

    <div class="back-home">

        <a href="index.html">
            ← Back to Home
        </a>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 Delight Vendor Logs. All rights reserved.

    </div>

</div>


<script>

/* ================================
   SUPABASE CONFIGURATION
================================ */

const SUPABASE_URL =
    "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ================================
   MESSAGE
================================ */

function showMessage(message, type){

    const messageBox =
        document.getElementById("message");

    messageBox.textContent = message;

    messageBox.className =
        "message " + type;

}


/* ================================
   PASSWORD TOGGLE
================================ */

function togglePasswordVisibility(){

    const password =
        document.getElementById("password");

    const toggle =
        document.getElementById("togglePassword");


    if(!password || !toggle){
        return;
    }


    if(password.type === "password"){

        password.type = "text";

        toggle.textContent = "🙈";

        toggle.setAttribute(
            "aria-label",
            "Hide password"
        );

    }else{

        password.type = "password";

        toggle.textContent = "👁";

        toggle.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}


/* ================================
   LOGIN
================================ */

async function loginUser(event){

    event.preventDefault();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const loginButton =
        document.getElementById("loginButton");


    /* Clear previous message */

    document.getElementById("message").className =
        "message";


    /* Validate */

    if(!email){

        showMessage(
            "Please enter your email address.",
            "error"
        );

        return;

    }


    if(!password){

        showMessage(
            "Please enter your password.",
            "error"
        );

        return;

    }


    /* Disable button */

    loginButton.disabled = true;

    loginButton.textContent = "Signing In...";


    try{

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if(error){

            console.error("Login error:", error);

            let errorMessage =
                error.message ||
                "Unable to sign in. Please try again.";


            /*
             * Make common Supabase errors
             * easier for customers to understand.
             */

            if(
                error.message &&
                error.message.toLowerCase()
                    .includes("invalid login credentials")
            ){

                errorMessage =
                    "Incorrect email or password. Please check your details and try again.";

            }


            showMessage(
                errorMessage,
                "error"
            );

            loginButton.disabled = false;

            loginButton.textContent = "Continue";

            return;

        }


        /* Successful login */

        if(data && data.session){

            showMessage(
                "Login successful. Redirecting...",
                "success"
            );


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            }, 500);

        }else{

            showMessage(
                "Login completed, but no active session was found. Please try again.",
                "error"
            );

            loginButton.disabled = false;

            loginButton.textContent = "Continue";

        }

    }catch(error){

        console.error(
            "Unexpected login error:",
            error
        );

        showMessage(
            "Something went wrong. Please check your internet connection and try again.",
            "error"
        );

        loginButton.disabled = false;

        loginButton.textContent = "Continue";

    }

}


/* ================================
   ENTER KEY / FORM
================================ */

document
    .getElementById("email")
    .addEventListener("keydown", function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            document
                .getElementById("password")
                .focus();

        }

    });

</script>

</body>
</html>
