<p id="message"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>


const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const message =
        document
          .getElementById("message");


      message.textContent =
        "Logging in...";


      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        console.error(error);

        message.textContent =
          error.message;

        return;

      }


      if (data.user) {

        window.location.href =
          "dashboard.html";

      }

    }
  );


</script></body></html>
